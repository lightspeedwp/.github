name: Metrics Collection

on:
  schedule:
    # Every Monday at 6:00 AM UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      context:
        description: "Metrics context to collect"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - github-control-plane
          - wordpress-plugin
          - wordpress-theme
      dry_run:
        description: "Perform dry run (no actual collection)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

env:
  METRICS_DIR: .github/metrics
  REPORTS_DIR: .github/reports/metrics

jobs:
  collect:
    name: Collect metrics
    runs-on: ubuntu-latest
    outputs:
      collection_timestamp: ${{ steps.collect.outputs.collection_timestamp }}
      results_file: ${{ steps.collect.outputs.results_file }}
      successful: ${{ steps.collect.outputs.successful }}
      failed: ${{ steps.collect.outputs.failed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Collect metrics
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CONTEXT="${{ github.event.inputs.context || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          ARGS="--context $CONTEXT"

          if [ "$DRY_RUN" == "true" ]; then
            ARGS="$ARGS --dry"
          fi

          node scripts/workflows/metrics/collect-metrics.js $ARGS --verbose

      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-report-${{ steps.collect.outputs.collection_timestamp }}
          path: ${{ env.REPORTS_DIR }}/
          if-no-files-found: warn

      - name: Commit metrics
        if: success() && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "lightspeed-bot"
          git config user.email "ops@lightspeedwp.agency"
          git add "${{ env.REPORTS_DIR }}"
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): collect metrics report [skip ci]"
            git push origin develop
          else
            echo "No changes to commit"
          fi

      - name: Report metrics collection status
        if: always()
        run: |
          echo "## Metrics Collection Summary"
          echo ""
          echo "- **Status**: ${{ job.status }}"
          echo "- **Context**: ${{ github.event.inputs.context || 'all' }}"
          echo "- **Timestamp**: ${{ steps.collect.outputs.collection_timestamp }}"
          echo "- **Successful**: ${{ steps.collect.outputs.successful }}"
          echo "- **Failed**: ${{ steps.collect.outputs.failed }}"
          echo ""
          echo "Results file: ${{ steps.collect.outputs.results_file }}"
