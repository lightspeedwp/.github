interface:
  display_name: cc-figma-component
  short_description:
    "Generate a Figma component set from a component contract. Use\
    \ when the user wants to build or update a Figma component from a contract definition\
    \ \u2014 e.g. 'build the Button Figma component', 'generate Figma component from\
    \ contract', 'sync the Accordion to Figma', 'create component variants in Figma'.\
    \ PREREQUISITE: the cc-figma-tokens skill must have been run first \u2014 Primitive\
    \ and Semantic variable collections must exist in the target Figma file. Requires\
    \ the figma-use and figma-generate-library skills."
