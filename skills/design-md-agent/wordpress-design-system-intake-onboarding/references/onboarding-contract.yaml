state_backend: memory
memory_state_file: user-defaults.yaml

trigger_when:
  task_requires:
    - "repository-backed WordPress design-system audits or validation"
    - "DESIGN.md, AGENTS.md, theme.json, plugin, or theme implementation review that needs a stable default repo"
  missing_state:
    - "default_repo"

required_state:
  - key: "default_repo"
    ask: "Which repo should I treat as your default source for WordPress design-system audits?"
    store_as: "default_repo"

optional_state:
  - key: "project_scope"
    ask: "Should I assume this work usually targets the package, a theme, a plugin extension, or a mix of those?"
    default: "infer from each request"
    store_as: "project_scope"
  - key: "parent_theme_context"
    ask: "If theme inheritance matters often, what parent theme should I check by default?"
    default: "ask only when inheritance becomes material"
    store_as: "parent_theme_context"
  - key: "design_source_priority"
    ask: "Do you want a non-default source priority for recurring audits, such as repo before Figma or Drive before repo?"
    default: "use the agent's standard source priority"
    store_as: "design_source_priority"

completion_requires:
  - "default_repo"

skip_when:
  - "the current request already contains enough project context to continue safely"
  - "the task is a one-off analysis that does not require durable defaults"
  - "attached files and the current message provide sufficient evidence without a repo default"
