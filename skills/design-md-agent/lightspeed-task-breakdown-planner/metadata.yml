name: lightspeed-task-breakdown-planner
version: v0.1.0
description: Breaks implementation scope into sequenced, testable tasks and milestones.
owners:
  - LightSpeedWP Team
platforms:
  claude:
    supported: true
    mode: first-class
    config: agents/claude.yaml
  copilot:
