interface:
  display_name: figma-implement-design
  short_description:
    Translates Figma designs into production-ready application code
    with 1:1 visual fidelity. Use when implementing UI code from Figma files, when
    user mentions "implement design", "generate code", "implement component", provides
    Figma URLs, or asks to build components matching Figma specs. For Figma canvas
    writes via `use_figma`, use `figma-use`.
