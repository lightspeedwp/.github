name: lightspeed-qodo-pr-agent
version: v0.1.0
description: Run Qodo PR-Agent tools for a PR or diff without publishing, returning a normalised ok/skipped/error result.
owners:
  - LightSpeedWP Team
platforms:
  claude:
    supported: true
    mode: first-class
    config: agents/claude.yaml
  copilot:
    supported: true
    mode: first-class
    config: agents/copilot.yaml
  gemini:
    supported: true
    mode: experimental
    config: agents/gemini.yaml
  codex:
    supported: true
    mode: legacy-compatible
    config: agents/codex.yaml
