interface:
  display_name: generate-project-plan
  short_description:
    "Generate a FigJam project plan board from a PRD plus codebase\
    \ context. Interactive flow: research \u2192 propose sections \u2192 per-section\
    \ deep research \u2192 per-section content + block-shape proposal \u2192 create\
    \ FigJam \u2192 skeleton \u2192 fill \u2192 diagrams \u2192 wrap. Each content\
    \ block (section, nested section, intro callout, table, multi-column text, sticky\
    \ column, diagram section, metadata strip) has its own subskill reference file.\
    \ Use when the user asks for 'project plan in FigJam', 'interactive project plan',\
    \ '/generate-project-plan', or provides a PRD and wants per-section confirmation\
    \ on content + rendering."
