name: wordpress-block-theme-router
version: v0.1.0
description: Routes block theme requests to the right implementation and validation paths.
owners:
  - LightSpeedWP Team
platforms:
  claude:
    supported: true
    mode: first-class
    config: agents/claude.yaml
  copilot:
    supported: true
    mode: first-class
    config: agents/copilot.yaml
  gemini:
    supported: true
    mode: experimental
    config: agents/gemini.yaml
  codex:
    supported: true
    mode: legacy-compatible
    config: agents/codex.yaml
