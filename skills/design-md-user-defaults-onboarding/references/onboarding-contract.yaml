state_backend: memory
memory_state_file: user-defaults.yaml

trigger_when:
  task_requires:
    - "DESIGN.md work that depends on a reusable repo, Figma file, or project context"
  missing_state:
    - "default_repo"

required_state:
  - key: "default_repo"
    ask: "What’s your default GitHub repo for DESIGN.md work? Send it as `owner/name`."
    store_as: "default_repo"

optional_state:
  - key: "default_figma_file"
    ask: "Which Figma file or link should I reuse by default when design evidence is needed?"
    default: "Do not ask during the initial repo-only onboarding step. Ask later only if the resumed task is blocked on missing Figma evidence and no clear file is provided."
    store_as: "default_figma_file"
  - key: "default_project_context"
    ask: "What project context should I reuse by default, such as the project name, active theme, or implementation notes?"
    default: "Do not ask during the initial repo-only onboarding step. Use the current request and attached sources unless the resumed task later proves that saved project context is required."
    store_as: "default_project_context"

completion_requires:
  - "default_repo"

skip_when:
  - "The current request already contains enough repo, Figma, and project context to complete the task without durable defaults."
  - "The task is a one-off question that does not depend on a reusable project baseline."
