mode: report
name: report-only
use_when: user asks for audit, summary, prioritisation, or recommendations without authorising changes
allowed_actions:
  - read plugin findings when available
  - inspect affected content
  - normalise exported findings
  - produce audit report, client summary, or developer handoff
blocked_actions:
  - edit wordpress content
  - change theme, plugin, css, javascript, aria, or database state
  - claim wcag compliance from automated results alone
required_output:
  - scope
  - evidence reviewed
  - prioritised findings
  - manual qa follow-ups
  - limitations
