mode: guarded
name: production-guarded
use_when: work touches a live production site or the environment is uncertain
allowed_actions:
  - report mode by default
  - fix-plan mode for proposed edits
  - small approved content fixes only when exact source and rollback path are clear
blocked_actions:
  - production bulk edits
  - theme/plugin/css/javascript/database changes
  - edits to checkout, legal, policy, consent, or pricing flows without explicit approval
required_safety_notes:
  - backup or rollback assumption
  - exact affected content
  - manual qa still required
