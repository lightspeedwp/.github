# Reviewer Agent v2 Configuration — .github Control-Plane

repo_type: github

# Tool Configuration
tools:
  coderabbit:
    enabled: true
    threshold: 0.8
    timeout_seconds: 30

  code_quality:
    enabled: true
    threshold: 0.7
    timeout_seconds: 20

  copilot:
    enabled: true
    threshold: 0.6
    timeout_seconds: 20

# Blocking Criteria
blocking:
  critical_threshold: 0
  major_threshold: 5
  halt_on_security: true

# Focus Areas (disable tools for non-matching files)
focus_areas:
  - javascript
  - yaml
  - markdown
  - json

# WordPress-Specific Categories (disabled for control-plane)
wordpress_categories:
  enabled: false

# Polling & Timeout Configuration
polling:
  initial_interval_seconds: 10
  max_interval_seconds: 60
  backoff_multiplier: 2.0
  max_retries: 10

# Comment & State Configuration
comments:
  enabled: true
  update_existing: true
  include_progress: true
  include_risk_score: true

state:
  enabled: true
  retention_days: 90
  path: .github/data/reviews

# Token Resolution (environment variables, in order of priority)
tokens:
  coderabbit:
    - CODERABBIT_API_TOKEN # Repository secret
    - ORG_CODERABBIT_API_TOKEN # Organization secret
  copilot:
    - COPILOT_TOKEN # Repository secret
    - ORG_COPILOT_TOKEN # Organization secret
  code_quality: null # GitHub Code Quality uses GitHub token
