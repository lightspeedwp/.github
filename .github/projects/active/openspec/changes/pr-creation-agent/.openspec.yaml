---
name: pr-creation-agent
title: "PR Creation Agent — Portable PR Automation"
description: "Portable agent for automated pull request generation across LightSpeed repositories"
type: agent
agent_type: multi-file
status: phase-2-specification-complete
version: "2.0.0"
last_updated: "2026-08-12T13:30:00Z"

# Phases
phases:
  - name: phase-1-design
    title: "Design & Requirements"
    status: complete
    timeline:
      start: "2026-08-12"
      end: "2026-08-16"
    deliverables:
      - "OPENSPEC specification (2,000+ lines)"
      - "9 design questions with rationale"
      - "Agent tier & skill architecture"
      - "Portability strategy"

  - name: phase-2-specification
    title: "Specification & Planning"
    status: complete
    timeline:
      start: "2026-08-16"
      end: "2026-08-20"
    deliverables:
      - "ARCHITECTURE.md (600 lines, 6 diagrams)"
      - "WORDPRESS_COMPATIBILITY.md (900 lines)"
      - "DEPLOYMENT_PLAN.md (800 lines, 6-wave rollout)"
      - "DOCUMENTATION_PLAN.md (500 lines)"
      - "TEST_STRATEGY.md (800 lines, 95%+ coverage)"

  - name: phase-3-implementation
    title: "Implementation & Validation"
    status: planned
    timeline:
      start: "2026-08-20"
      end: "2026-09-02"
    deliverables:
      - "Agent core (orchestrator, config-loader, state-machine)"
      - "6 skills implementation"
      - "Comprehensive test suite (100+ unit, 30+ integration, 5+ E2E)"
      - "GitHub API integration"
      - "Real repo E2E tests"

  - name: phase-4-ga-rollout
    title: "GA & Rollout"
    status: planned
    timeline:
      start: "2026-09-02"
      end: "2026-09-09"
    deliverables:
      - "12-repository deployment"
      - "Comprehensive documentation"
      - "Team training"
      - "Production monitoring setup"

# Architecture
architecture:
  type: multi-file-agent
  location: agents/pr-creation-agent/
  core_modules:
    - pr-orchestrator.js
    - config-loader.js
    - state-machine.js

  skills:
    new:
      - validate-branch-name
      - route-pr-template
      - validate-and-apply-labels
      - enforce-issue-linking
      - draft-pr-description
      - create-pr
    reused:
      - code-review
      - commit-push-pr
      - commit
      - figma

# Configuration
configuration:
  model: config-driven
  location: .claude/pr-agent.config.yml
  schema: schemas/pr-agent-config.schema.json
  defaults: agents/pr-creation-agent/config/defaults.yml
  custom_hooks: .claude/pr-agent-hooks.js (optional)

# Portability
portability:
  single_codebase: true
  configuration_per_repo: true
  target_repos: 12
  repo_types:
    - github-control-plane: 1
    - wordpress-plugin: 4
    - wordpress-theme: 4
    - internal-tools: 3

# Skills
skills:
  - name: validate-branch-name
    type: validation
    input: branch name, config
    output: validation result, parsed branch
    test_coverage: 95%+

  - name: route-pr-template
    type: routing
    input: branch type, config
    output: template path, metadata
    test_coverage: 95%+

  - name: validate-and-apply-labels
    type: validation
    input: files, user labels, config
    output: validated labels, inferred labels
    test_coverage: 95%+

  - name: enforce-issue-linking
    type: validation
    input: linked issues, config, GitHub client
    output: valid issues, errors
    test_coverage: 95%+

  - name: draft-pr-description
    type: composition
    input: template, metadata, config
    output: PR body, metadata
    test_coverage: 95%+

  - name: create-pr
    type: action
    input: PR data, GitHub client
    output: created PR details
    test_coverage: 95%+

# Testing
testing:
  unit_tests:
    target_count: 100+
    coverage_target: 95%+
    location: agents/pr-creation-agent/__tests__/

  integration_tests:
    target_count: 30+
    api_mocking: true
    location: agents/pr-creation-agent/__tests__/integration/

  e2e_tests:
    target_count: 5+
    real_repos: 3
    location: agents/pr-creation-agent/__tests__/e2e/

# Documentation
documentation:
  location: docs/pr-agent/
  target_lines: 5200+
  components:
    - README.md (master index)
    - GETTING_STARTED.md (quickstart)
    - API_REFERENCE.md (full API)
    - CONFIGURATION.md (config guide)
    - INSTALLING.md (per-repo guide)
    - TROUBLESHOOTING.md (FAQ)
    - by-repo-type/ (3 guides)
    - examples/ (3 recipe guides)

