name: Allocate PR/Issue to Current Milestone

on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (no changes)"
        required: false
        default: "false"
        type: boolean
      days:
        description: "Look back N days"
        required: false
        default: "7"
        type: string

permissions:
  pull-requests: write
  issues: write

jobs:
  allocate-to-milestone:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issues' && github.event.issue.state == 'closed')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Allocate PR to milestone
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: |
          node scripts/automation/allocate-to-milestone.js \
            --days 1 \
            ${{ github.event_name == 'workflow_dispatch' && format('--dry-run={0} --days={1}', inputs.dry_run, inputs.days) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Allocate issue to milestone
        if: github.event_name == 'issues' && github.event.issue.state == 'closed'
        run: |
          node scripts/automation/allocate-to-milestone.js \
            --days 1 \
            ${{ github.event_name == 'workflow_dispatch' && format('--dry-run={0} --days={1}', inputs.dry_run, inputs.days) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Manual allocation (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/automation/allocate-to-milestone.js \
            --days ${{ inputs.days }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Comment on PR if allocation occurred
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ This PR has been automatically allocated to the current active milestone.'
            });

      - name: Comment on issue if allocation occurred
        if: |
          github.event_name == 'issues' &&
          github.event.issue.state == 'closed' &&
          always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ This issue has been automatically allocated to the current active milestone.'
            });
