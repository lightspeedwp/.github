---
name: Frontmatter Validation

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
    paths:
      - '**.md'
      - 'schemas/frontmatter/**'
      - '.github/workflows/frontmatter-validation.yml'
  pull_request:
    paths:
      - '**.md'
      - 'schemas/frontmatter/**'
      - '.github/workflows/frontmatter-validation.yml'
  workflow_dispatch:

jobs:
  validate-schema:
    name: Validate Frontmatter Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: schemas/frontmatter/package-lock.json

      - name: Install dependencies
        working-directory: schemas/frontmatter
        run: npm ci

      - name: Validate schema structure
        working-directory: schemas/frontmatter
        run: npm run validate:schema

      - name: Run schema tests
        working-directory: schemas/frontmatter
        run: npm test

  validate-frontmatter:
    name: Validate All Frontmatter
    runs-on: ubuntu-latest
    needs: validate-schema

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: schemas/frontmatter/package-lock.json

      - name: Install dependencies
        working-directory: schemas/frontmatter
        run: npm ci

      - name: Validate all frontmatter files
        working-directory: schemas/frontmatter
        run: npm run validate

      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-errors
          path: schemas/frontmatter/validation-errors.log
          retention-days: 7

  frontmatter-changed-files:
    name: Validate Changed Files Only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: schemas/frontmatter/package-lock.json

      - name: Install dependencies
        working-directory: schemas/frontmatter
        run: npm ci

      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **.md

      - name: Validate changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        working-directory: schemas/frontmatter
        run: |
          echo "Validating changed files:"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "  - $file"
            node validate.js "../../$file" || exit 1
          done

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Frontmatter validation failed**\n\nPlease check the workflow logs for details and ensure all frontmatter follows the schema at `schemas/frontmatter.schema.json`.\n\nSee [Frontmatter Documentation](https://github.com/lightspeedwp/.github/blob/develop/schemas/frontmatter/README.md) for guidance.'
            })
