---
name: Label Sync • Organization-wide Label Management

# This workflow syncs labels from the canonical labels.yml to repositories
# and detects orphan labels that don't match the organization standard.

on:
  # Run on push to labels.yml
  push:
    branches: [develop, main]
    paths:
      - '.github/automation/labels.yml'
      - '.github/workflows/label-sync.yml'

  # Run on schedule (weekly on Monday)
  schedule:
    - cron: '0 9 * * 1' # 9 AM UTC every Monday

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (preview changes without applying)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      target_repo:
        description: 'Target repository (org/repo) or "all" for all repos'
        required: false
        default: 'all'
        type: string

  # Reusable workflow for child repositories
  workflow_call:
    inputs:
      labels_source_repo:
        description: 'Repository containing canonical labels.yml'
        required: false
        default: 'lightspeedwp/.github'
        type: string
      labels_source_path:
        description: 'Path to labels.yml in source repository'
        required: false
        default: '.github/automation/labels.yml'
        type: string
      dry_run:
        description: 'Dry run mode (preview only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  LABELS_SOURCE_REPO: ${{ inputs.labels_source_repo || 'lightspeedwp/.github' }}
  LABELS_SOURCE_PATH: ${{ inputs.labels_source_path || '.github/automation/labels.yml' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  sync-labels:
    name: Sync Labels from Canonical Source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --no-save js-yaml @actions/core @actions/github

      - name: Fetch canonical labels
        id: fetch-labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const yaml = require('js-yaml');
            const fs = require('fs');

            // Fetch canonical labels.yml from source repository
            const sourceRepo = process.env.LABELS_SOURCE_REPO.split('/');
            const sourcePath = process.env.LABELS_SOURCE_PATH;

            let canonicalLabels;

            try {
              // If running in the .github repo itself, read from local file
              if (context.repo.owner === sourceRepo[0] && context.repo.repo === sourceRepo[1]) {
                core.info('Running in source repository, reading local labels.yml');
                canonicalLabels = yaml.load(fs.readFileSync(sourcePath, 'utf8'));
              } else {
                // Fetch from remote repository
                core.info(`Fetching canonical labels from ${process.env.LABELS_SOURCE_REPO}/${sourcePath}`);
                const { data } = await github.rest.repos.getContent({
                  owner: sourceRepo[0],
                  repo: sourceRepo[1],
                  path: sourcePath,
                  ref: 'develop'
                });

                const content = Buffer.from(data.content, 'base64').toString('utf8');
                canonicalLabels = yaml.load(content);
              }

              core.info(`Loaded ${canonicalLabels.length} canonical labels`);
              core.setOutput('canonical_labels', JSON.stringify(canonicalLabels));

              return canonicalLabels;
            } catch (error) {
              core.setFailed(`Failed to fetch canonical labels: ${error.message}`);
              throw error;
            }

      - name: Get current repository labels
        id: current-labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            core.info(`Found ${labels.length} existing labels in repository`);
            core.setOutput('current_labels', JSON.stringify(labels));

            return labels;

      - name: Sync labels to repository
        id: sync
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ env.DRY_RUN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const canonicalLabels = JSON.parse('${{ steps.fetch-labels.outputs.canonical_labels }}');
            const currentLabels = JSON.parse('${{ steps.current-labels.outputs.current_labels }}');
            const dryRun = process.env.DRY_RUN === 'true';

            const changes = {
              added: [],
              updated: [],
              deleted: [],
              orphaned: []
            };

            // Create map of current labels for quick lookup
            const currentLabelMap = new Map(
              currentLabels.map(l => [l.name.toLowerCase(), l])
            );

            // Create map of canonical labels
            const canonicalLabelMap = new Map(
              canonicalLabels.map(l => [l.name.toLowerCase(), l])
            );

            // Sync canonical labels (add or update)
            for (const label of canonicalLabels) {
              const current = currentLabelMap.get(label.name.toLowerCase());

              if (!current) {
                // Label doesn't exist, create it
                changes.added.push(label.name);

                if (!dryRun) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description || ''
                  });
                  core.info(`✅ Created label: ${label.name}`);
                } else {
                  core.info(`[DRY RUN] Would create label: ${label.name}`);
                }
              } else if (
                current.color.toLowerCase() !== label.color.toLowerCase() ||
                (current.description || '') !== (label.description || '')
              ) {
                // Label exists but needs update
                changes.updated.push(label.name);

                if (!dryRun) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description || ''
                  });
                  core.info(`🔄 Updated label: ${label.name}`);
                } else {
                  core.info(`[DRY RUN] Would update label: ${label.name}`);
                }
              }
            }

            // Detect orphan labels (exist in repo but not in canonical)
            for (const current of currentLabels) {
              if (!canonicalLabelMap.has(current.name.toLowerCase())) {
                changes.orphaned.push({
                  name: current.name,
                  color: current.color,
                  description: current.description || '',
                  usage_count: 0 // TODO: Could fetch usage count
                });
                core.warning(`⚠️  Orphan label detected: ${current.name}`);
              }
            }

            // Output summary
            core.summary
              .addHeading('Label Sync Summary')
              .addHeading(`Mode: ${dryRun ? '🔍 DRY RUN (Preview Only)' : '✅ Live Sync'}`, 3)
              .addTable([
                [
                  { data: 'Action', header: true },
                  { data: 'Count', header: true }
                ],
                ['Added', changes.added.length.toString()],
                ['Updated', changes.updated.length.toString()],
                ['Orphaned', changes.orphaned.length.toString()]
              ]);

            if (changes.added.length > 0) {
              core.summary.addHeading('Added Labels', 3);
              core.summary.addList(changes.added);
            }

            if (changes.updated.length > 0) {
              core.summary.addHeading('Updated Labels', 3);
              core.summary.addList(changes.updated);
            }

            if (changes.orphaned.length > 0) {
              core.summary.addHeading('Orphaned Labels (Not in Canonical Set)', 3);
              core.summary.addRaw(
                'The following labels exist in this repository but are not defined in the canonical labels.yml. ' +
                'Consider either adding them to labels.yml or removing them if they are no longer needed.'
              );
              core.summary.addList(changes.orphaned.map(l =>
                `**${l.name}** - ${l.description || 'No description'}`
              ));
            }

            await core.summary.write();

            core.setOutput('changes', JSON.stringify(changes));
            core.setOutput('orphaned_count', changes.orphaned.length);

            return changes;

      - name: Create orphan labels issue
        if: steps.sync.outputs.orphaned_count > 0 && env.DRY_RUN == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changes = JSON.parse('${{ steps.sync.outputs.changes }}');

            if (changes.orphaned.length === 0) {
              return;
            }

            // Check if there's already an open issue about orphan labels
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'type:automation,area:labels',
              per_page: 100
            });

            const orphanIssue = existingIssues.data.find(issue =>
              issue.title.includes('Orphan Labels Detected')
            );

            const orphanList = changes.orphaned.map(l =>
              `- \`${l.name}\` - ${l.description || '_No description_'}`
            ).join('\n');

            const issueBody = `## Orphan Labels Detected

            The label sync workflow has detected ${changes.orphaned.length} label(s) that exist in this repository but are not defined in the canonical [labels.yml](https://github.com/lightspeedwp/.github/blob/develop/.github/automation/labels.yml).

            ### Orphaned Labels

            ${orphanList}

            ### Recommended Actions

            1. **Add to canonical labels.yml** - If these labels should be organization-wide, add them to [lightspeedwp/.github](https://github.com/lightspeedwp/.github/blob/develop/.github/automation/labels.yml)
            2. **Remove from this repository** - If these labels are no longer needed, remove them
            3. **Repository-specific labels** - If these are repository-specific, document them in this repository's README

            ### How to Add to Canonical Labels

            \`\`\`yaml
            # Add to .github/automation/labels.yml in lightspeedwp/.github repository
            ${changes.orphaned.map(l => `
            - name: ${l.name}
              color: ${l.color}
              description: "${l.description || 'TODO: Add description'}"
            `).join('')}
            \`\`\`

            ---

            **Detected by:** [Label Sync Workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/label-sync.yml)
            **Last Run:** ${new Date().toISOString()}
            `;

            if (orphanIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: orphanIssue.number,
                body: issueBody
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: orphanIssue.number,
                body: `🔄 Updated orphan labels list. ${changes.orphaned.length} orphan label(s) currently detected.`
              });

              core.info(`Updated existing orphan labels issue #${orphanIssue.number}`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🏷️ Orphan Labels Detected (${changes.orphaned.length})`,
                body: issueBody,
                labels: ['type:automation', 'area:labels', 'status:needs-triage']
              });

              core.info(`Created new orphan labels issue #${newIssue.data.number}`);
            }

      - name: Summary
        if: always()
        run: |
          echo "### Label Sync Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the workflow summary above for details on added, updated, and orphaned labels." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** \`${{ env.LABELS_SOURCE_REPO }}/${{ env.LABELS_SOURCE_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** \`${{ env.DRY_RUN == 'true' && 'DRY RUN' || 'LIVE SYNC' }}\`" >> $GITHUB_STEP_SUMMARY
