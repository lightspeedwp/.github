name: changelog-validate

on:
  pull_request:
    branches: [develop]
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        labeled,
        unlabeled,
      ]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require changelog update or skip label
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -q "^CHANGELOG.md$"; then
            echo "CHANGELOG.md updated in PR diff."
            exit 0
          fi

          if echo "${PR_LABELS}" | grep -q '"meta:no-changelog"'; then
            echo "Skipping changelog requirement due to meta:no-changelog label."
            exit 0
          fi

          echo "::error::PR requires a CHANGELOG.md update or the meta:no-changelog label."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate changelog schema
        run: |
          node scripts/agents/includes/changelogUtils.cjs --validate CHANGELOG.md
          node scripts/validation/validate-changelog.cjs CHANGELOG.md
