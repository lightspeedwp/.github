name: gitleaks version updater

# Weekly check for a newer stable gitleaks release. Updates the pinned version
# and its official checksum together, then opens a pull request. Never merges.
#
# Note: PRs opened by this workflow must comply with the PR merge governance
# validation hook (hooks/pr-merge-governance-validator.sh), which requires:
# 1. Correct PR template for the branch prefix (chore/ → pr_chore.md)
# 2. Linked issues in the PR body (Fixes #XXX or Relates to #XXX)

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-update
  cancel-in-progress: false

jobs:
  update:
    name: Check for a newer gitleaks release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Mint a short-lived App token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          client-id: ${{ vars.DEP_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEP_MERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github
          # Least privilege, each justified against what this job actually does:
          #   contents      : push the deps/gitleaks-* branch
          #   pull-requests : open the update pull request
          #   workflows     : the diff edits .github/workflows/gitleaks-reusable.yml,
          #                   and a push touching a workflow file is rejected without
          #                   this scope. GITHUB_TOKEN cannot be used for the same
          #                   reason, which is why an App token is required here.
          # metadata is granted implicitly and is read-only.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Resolve the latest stable release and its checksum
        id: rel
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WORKFLOW: .github/workflows/gitleaks-reusable.yml
        run: |
          set -euo pipefail
          latest="$(gh api repos/gitleaks/gitleaks/releases \
            --jq '[.[] | select(.draft==false and .prerelease==false)][0].tag_name')"
          version="${latest#v}"
          current="$(grep -oP 'GITLEAKS_VERSION: "\K[^"]+' "${WORKFLOW}")"
          {
            echo "current=${current}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          if [ "${version}" = "${current}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on ${current}."
            exit 0
          fi
          sums_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          sha="$(curl --fail --silent --show-error --location "${sums_url}" \
            | awk -v f="gitleaks_${version}_linux_x64.tar.gz" '$2 == f { print $1 }')"
          if [ -z "${sha}" ]; then
            echo "No linux_x64 checksum published for v${version}" >&2
            exit 1
          fi
          {
            echo "sha=${sha}"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Apply the new version and checksum
        if: steps.rel.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.rel.outputs.version }}
          NEW_SHA: ${{ steps.rel.outputs.sha }}
          WORKFLOW: .github/workflows/gitleaks-reusable.yml
        run: |
          set -euo pipefail
          sed -i "s|GITLEAKS_VERSION: \".*\"|GITLEAKS_VERSION: \"${NEW_VERSION}\"|" "${WORKFLOW}"
          sed -i "s|GITLEAKS_SHA256: \".*\"|GITLEAKS_SHA256: \"${NEW_SHA}\"|" "${WORKFLOW}"
          git diff --stat

      - name: Verify the new pin downloads, verifies and runs
        if: steps.rel.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.rel.outputs.version }}
          NEW_SHA: ${{ steps.rel.outputs.sha }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          tarball="gitleaks_${NEW_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            -o "${tmp}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${NEW_VERSION}/${tarball}"
          echo "${NEW_SHA}  ${tmp}/${tarball}" | sha256sum --check --status
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" gitleaks
          "${tmp}/gitleaks" version
          "${tmp}/gitleaks" dir . --config .gitleaks.toml --redact --verbose

      - name: Open the update pull request
        if: steps.rel.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NEW_VERSION: ${{ steps.rel.outputs.version }}
          CURRENT: ${{ steps.rel.outputs.current }}
        run: |
          set -euo pipefail
          branch="deps/gitleaks-${NEW_VERSION}"
          git config user.name "lightspeed-dependency-bot[bot]"
          git config user.email "lightspeed-dependency-bot[bot]@users.noreply.github.com"

          # Idempotent across repeated scheduled runs. Four states are possible:
          # no branch and no PR; an open PR for this version; a branch with no PR;
          # and a stale branch whose content differs. All converge on "branch
          # matches the current pin, exactly one open PR".
          git checkout -B "${branch}"
          git add .github/workflows/gitleaks-reusable.yml
          if git diff --cached --quiet; then
            echo "Working tree already matches the target pin; nothing to commit."
          else
            git commit -m "build(deps): bump gitleaks from ${CURRENT} to ${NEW_VERSION}"
          fi
          # force-with-lease so a stale remote branch is refreshed, but a branch
          # someone else advanced is never silently discarded.
          if ! git push --force-with-lease -u origin "${branch}"; then
            echo "Remote branch ${branch} moved unexpectedly; refusing to overwrite." >&2
            exit 1
          fi
          body="$(mktemp)"
          {
            echo "Automated gitleaks pin update."
            echo
            echo "Version ${CURRENT} to ${NEW_VERSION}, with the matching official checksum"
            echo "from gitleaks_${NEW_VERSION}_checksums.txt. The archive was verified against"
            echo "that checksum and the binary was run against this repository before this"
            echo "pull request was opened."
            echo
            echo "Release notes: https://github.com/gitleaks/gitleaks/releases/tag/v${NEW_VERSION}"
          } > "${body}"
          existing="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "PR #${existing} is already open for ${branch}; head refreshed in place."
          else
            gh pr create --base develop --head "${branch}" \
              --title "build(deps): bump gitleaks from ${CURRENT} to ${NEW_VERSION}" \
              --body-file "${body}"
          fi
          rm -f "${body}"
