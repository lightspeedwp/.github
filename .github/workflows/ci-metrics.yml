name: Collect CI Metrics
on:
  schedule:
    - cron: "0 0 * * 1"  # every Monday at 00:00 UTC (weekly)
  workflow_dispatch: {}  # allow manual triggering

jobs:
  gather-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'  # use same Node version as project:contentReference[oaicite:26]{index=26}
      - name: Install deps
        run: npm ci
      - name: Run metrics script
        run: node scripts/gather-metrics.js
      - name: Save metrics output
        run: echo "Metrics run on $(date)" >> metrics/metrics.log
      # (In a real setup, above would be replaced with steps to upload results or create an issue comment.)
