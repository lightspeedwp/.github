name: Metrics
on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc' }
      - run: npm ci
      - run: node scripts/gather-metrics.js
