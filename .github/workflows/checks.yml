name: CI • Unified Checks (Lint, Test, Validate)

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run lint:all
      - run: npm run validate:skill-manifests
      - run: npm run validate:plugins

  test:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run test

  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run validate:json
      - run: npm run validate:frontmatter:changed -- --base ${{ github.event.pull_request.base.sha || github.event.before }} --head ${{ github.event.pull_request.head.sha || github.sha }}

  # Composite status check: ensures all checks pass before merge
  all-checks:
    name: All Checks Passed
    needs: [lint, test, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate check results
        run: test "${{ needs.lint.result }}" != "failure" -a "${{ needs.test.result }}" != "failure" -a "${{ needs.validate.result }}" != "failure" && echo "✅ All checks passed" || (echo "❌ One or more checks failed" && exit 1)
