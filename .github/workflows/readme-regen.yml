name: readme-regen

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.md"
      - ".github/workflows/**"
      - ".github/agents/**"
      - ".github/instructions/**"
      - "docs/**"
      - "scripts/**"
  push:
    branches: [develop]
    paths:
      - "**/*.md"
      - ".github/workflows/**"
      - ".github/agents/**"
      - ".github/instructions/**"
      - "docs/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: readme-regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Resolve impacted README files
        id: readmes
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="HEAD~1"
            HEAD_SHA="${{ github.sha }}"
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ -z "$CHANGED" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TMP=$(mktemp)
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            dir=$(dirname "$file")
            if [ -f "$dir/README.md" ]; then
              echo "$dir/README.md" >> "$TMP"
            fi
            if [ "$dir" != "." ] && [ -f "README.md" ]; then
              echo "README.md" >> "$TMP"
            fi
          done <<EOF
          $CHANGED
          EOF

          FILES=$(sort -u "$TMP" | tr '\n' ',' | sed 's/,$//')
          rm -f "$TMP"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run README regeneration
        if: steps.readmes.outputs.files != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            node scripts/agents/meta.agent.js --dry-run --files "${{ steps.readmes.outputs.files }}"
          else
            node scripts/agents/meta.agent.js --files "${{ steps.readmes.outputs.files }}"
          fi

      - name: Commit README updates
        if: github.event_name != 'pull_request' && steps.readmes.outputs.files != ''
        run: |
          git config user.name "lightspeed-bot"
          git config user.email "ops@lightspeedwp.agency"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(readme): regenerate impacted README files [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
