#
# Modular Scripts CI/CD Pipeline for LightSpeedWP
# Comprehensive multi-stage pipeline for shell script automation
#
# This workflow implements a complete CI/CD pipeline with:
# - Static analysis and validation
# - Unit and integration testing
# - Quality gates and security scanning
# - Automated deployment with rollback
# - Post-deployment monitoring
#
# @see https://github.com/lightspeedwp/.github/blob/develop/CLAUDE.md
#

name: Modular Scripts CI/CD Pipeline

on:
    push:
        branches: [main, develop, 'feature/*', 'hotfix/*', 'claude/*']
        paths:
            - 'scripts/**'
            - 'tests/**'
            - '.github/workflows/**'
    pull_request:
        branches: [main, develop]
        paths:
            - 'scripts/**'
            - 'tests/**'
    release:
        types: [published]
    schedule:
        # Daily security and quality checks at 2 AM UTC
        - cron: '0 2 * * *'
    workflow_dispatch:
        inputs:
            deploy_environment:
                description: 'Target deployment environment'
                required: false
                default: 'staging'
                type: choice
                options:
                    - staging
                    - production
            force_deploy:
                description: 'Force deployment despite warnings'
                required: false
                default: false
                type: boolean
            skip_tests:
                description: 'Skip test execution (not recommended)'
                required: false
                default: false
                type: boolean

env:
    PIPELINE_VERSION: 'v2.0.0'
    QUALITY_THRESHOLD: 80
    SECURITY_THRESHOLD: 'high'
    NODE_VERSION: '20'
    SHELLCHECK_VERSION: 'stable'
    BATS_VERSION: 'v1.10.0'

jobs:
    # Stage 1: Static Analysis and Validation
    static-analysis:
        name: 'Stage 1: Static Analysis'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        outputs:
            changes-detected: ${{ steps.changes.outputs.scripts }}
            quality-score: ${{ steps.quality.outputs.score }}
            security-issues: ${{ steps.security.outputs.issues }}
            shellcheck-critical: ${{ steps.shellcheck.outputs.critical-issues }}
            shellcheck-warnings: ${{ steps.shellcheck.outputs.warning-issues }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Detect Changes
              id: changes
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      scripts:
                        - 'scripts/**/*.sh'
                      tests:
                        - 'tests/**/*.bats'
                      includes:
                        - 'scripts/includes/**/*.sh'
                      workflows:
                        - '.github/workflows/**'

            - name: Setup Node.js
              if: steps.changes.outputs.scripts == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Install Dependencies
              if: steps.changes.outputs.scripts == 'true'
              run: |
                  npm ci
                  sudo apt-get update
                  sudo apt-get install -y shellcheck yamllint jq bc coreutils

            - name: ShellCheck Analysis
              if: steps.changes.outputs.scripts == 'true'
              id: shellcheck
              run: |
                  echo "Running ShellCheck analysis..."
                  mkdir -p shellcheck-reports

                  critical_count=0
                  warning_count=0

                  # Find and check all shell scripts
                  while IFS= read -r script; do
                    echo "Checking: $script"
                    if shellcheck -f json "$script" > "shellcheck-reports/$(basename "$script" .sh).json" 2>&1; then
                      echo "✅ $script passed"
                    else
                      echo "⚠️  $script has issues"
                      # Count issues by severity
                      if [[ -f "shellcheck-reports/$(basename "$script" .sh).json" ]]; then
                        crit=$(jq -r '[.[] | select(.level == "error")] | length' "shellcheck-reports/$(basename "$script" .sh).json" 2>/dev/null || echo "0")
                        warn=$(jq -r '[.[] | select(.level == "warning")] | length' "shellcheck-reports/$(basename "$script" .sh).json" 2>/dev/null || echo "0")
                        critical_count=$((critical_count + crit))
                        warning_count=$((warning_count + warn))
                      fi
                    fi
                  done < <(find scripts/ -name "*.sh" -type f)

                  # Aggregate results if any reports exist
                  if compgen -G "shellcheck-reports/*.json" > /dev/null; then
                    jq -s 'add // []' shellcheck-reports/*.json > shellcheck-results.json
                  else
                    echo "[]" > shellcheck-results.json
                  fi

                  echo "critical-issues=$critical_count" >> "$GITHUB_OUTPUT"
                  echo "warning-issues=$warning_count" >> "$GITHUB_OUTPUT"

                  echo "📊 ShellCheck Results:"
                  echo "  Critical issues: $critical_count"
                  echo "  Warning issues: $warning_count"

                  # Fail if critical issues found
                  if [[ $critical_count -gt 0 ]]; then
                    echo "❌ Critical ShellCheck issues found: $critical_count"
                    exit 1
                  fi

            - name: Markdown Linting
              if: steps.changes.outputs.scripts == 'true'
              run: |
                  echo "Running markdown lint..."
                  npm run lint:md || echo "⚠️  Markdown linting issues found"

            - name: YAML Linting
              if: steps.changes.outputs.scripts == 'true' || steps.changes.outputs.workflows == 'true'
              run: |
                  echo "Running YAML lint..."
                  yamllint .github/workflows/ || echo "⚠️  YAML linting issues found"

            - name: Basic Quality Metrics
              if: steps.changes.outputs.scripts == 'true'
              id: quality
              run: |
                  # Calculate basic quality score
                  total_scripts=$(find scripts/ -name "*.sh" -type f | wc -l)
                  scripts_with_docs=0

                  while IFS= read -r script; do
                    # Check for documentation headers
                    if grep -q "^# Script Name:" "$script" && \
                       grep -q "^# Description:" "$script" && \
                       grep -q "^# Usage:" "$script"; then
                      ((scripts_with_docs++))
                    fi
                  done < <(find scripts/ -name "*.sh" -type f)

                  if [[ $total_scripts -eq 0 ]]; then
                    quality_score=100
                  else
                    quality_score=$((scripts_with_docs * 100 / total_scripts))
                  fi

                  echo "score=$quality_score" >> "$GITHUB_OUTPUT"
                  echo "📊 Documentation Quality Score: $quality_score%"
                  echo "   Documented scripts: $scripts_with_docs / $total_scripts"

            - name: Basic Security Check
              if: steps.changes.outputs.scripts == 'true'
              id: security
              run: |
                  echo "Running basic security checks..."
                  security_issues=0

                  # Check for common security issues
                  while IFS= read -r script; do
                    # Check for unsafe practices
                    if grep -qE "eval|source.*\$|curl.*\|.*sh" "$script"; then
                      echo "⚠️  Potential security issue in $script"
                      ((security_issues++))
                    fi
                  done < <(find scripts/ -name "*.sh" -type f)

                  echo "issues=$security_issues" >> "$GITHUB_OUTPUT"
                  echo "📊 Security Issues Found: $security_issues"

            - name: Upload Analysis Artifacts
              if: always() && steps.changes.outputs.scripts == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: static-analysis-results
                  path: |
                      shellcheck-results.json
                      shellcheck-reports/
                  retention-days: 30
                  if-no-files-found: ignore

            - name: Analysis Summary
              if: always() && steps.changes.outputs.scripts == 'true'
              run: |
                  cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
                  ## Static Analysis Results

                  ### ShellCheck
                  - **Critical Issues:** ${{ steps.shellcheck.outputs.critical-issues }}
                  - **Warnings:** ${{ steps.shellcheck.outputs.warning-issues }}

                  ### Quality Metrics
                  - **Documentation Score:** ${{ steps.quality.outputs.score }}%
                  - **Security Issues:** ${{ steps.security.outputs.issues }}

                  ### Status
                  ${{ steps.shellcheck.outputs.critical-issues == '0' && '✅ All checks passed' || '❌ Critical issues found' }}
                  EOF

    # Stage 2: Unit and Integration Testing
    testing:
        name: 'Stage 2: Testing (${{ matrix.test-suite }})'
        needs: static-analysis
        if: needs.static-analysis.outputs.changes-detected == 'true' && github.event.inputs.skip_tests != 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                test-suite: [unit, integration]

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Bats Testing Framework
              run: |
                  echo "Installing Bats testing framework..."
                  npm install -g bats

                  # Create test helper directories if they don't exist
                  mkdir -p tests/test_helper

                  # Install bats-support and bats-assert if not present
                  if [[ ! -d tests/test_helper/bats-support ]]; then
                    git clone --depth 1 https://github.com/bats-core/bats-support.git tests/test_helper/bats-support
                  fi
                  if [[ ! -d tests/test_helper/bats-assert ]]; then
                    git clone --depth 1 https://github.com/bats-core/bats-assert.git tests/test_helper/bats-assert
                  fi

            - name: Setup Test Environment
              run: |
                  mkdir -p test-results/${{ matrix.test-suite }}
                  chmod -R +x scripts/

            - name: Run Unit Tests
              if: matrix.test-suite == 'unit'
              run: |
                  echo "Running unit tests..."
                  if compgen -G "tests/includes/**/*.bats" > /dev/null; then
                    bats tests/includes/**/*.bats --report-formatter junit \
                      --output test-results/unit/ || echo "Some tests failed"
                    bats tests/includes/**/*.bats --tap > test-results/unit/results.tap || true
                  else
                    echo "No unit tests found, creating placeholder"
                    echo "1..1" > test-results/unit/results.tap
                    echo "ok 1 - No unit tests defined yet" >> test-results/unit/results.tap
                  fi

            - name: Run Integration Tests
              if: matrix.test-suite == 'integration'
              run: |
                  echo "Running integration tests..."
                  if [[ -d tests/integration ]] && compgen -G "tests/integration/**/*.bats" > /dev/null; then
                    bats tests/integration/**/*.bats --report-formatter junit \
                      --output test-results/integration/ || echo "Some tests failed"
                  else
                    echo "No integration tests found, creating placeholder"
                    mkdir -p test-results/integration
                    echo "1..1" > test-results/integration/results.tap
                    echo "ok 1 - No integration tests defined yet" >> test-results/integration/results.tap
                  fi

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.test-suite }}
                  path: test-results/${{ matrix.test-suite }}/
                  retention-days: 30
                  if-no-files-found: ignore

    # Stage 3: Quality Gates and Validation
    quality-gates:
        name: 'Stage 3: Quality Gates'
        needs: [static-analysis, testing]
        if: always() && needs.static-analysis.outputs.changes-detected == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read

        outputs:
            quality-passed: ${{ steps.gates.outputs.passed }}
            deploy-ready: ${{ steps.gates.outputs.deploy-ready }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Download Analysis Results
              uses: actions/download-artifact@v4
              with:
                  pattern: '*-results*'
                  merge-multiple: true
                  continue-on-error: true
              
            - name: static-analysis-results
              path: reports/

            - name: Evaluate Quality Gates
              id: gates
              run: |
                  echo "🔍 Evaluating quality gates..."

                  quality_passed="true"
                  security_passed="true"
                  test_passed="true"

                  # Quality score gate
                  quality_score="${{ needs.static-analysis.outputs.quality-score }}"
                  if [[ $quality_score -lt $QUALITY_THRESHOLD ]]; then
                    echo "❌ Quality gate failed: $quality_score% < $QUALITY_THRESHOLD%"
                    quality_passed="false"
                  else
                    echo "✅ Quality gate passed: $quality_score%"
                  fi

                  # Security issues gate
                  security_issues="${{ needs.static-analysis.outputs.security-issues }}"
                  if [[ $security_issues -gt 0 ]]; then
                    echo "⚠️  Security gate warning: $security_issues issues found"
                    # Don't fail for warnings, just log
                  else
                    echo "✅ Security gate passed: no issues"
                  fi

                  # ShellCheck critical issues gate
                  shellcheck_critical="${{ needs.static-analysis.outputs.shellcheck-critical }}"
                  if [[ $shellcheck_critical -gt 0 ]]; then
                    echo "❌ ShellCheck gate failed: $shellcheck_critical critical issues"
                    quality_passed="false"
                  else
                    echo "✅ ShellCheck gate passed"
                  fi

                  # Test results gate
                  if [[ "${{ needs.testing.result }}" != "success" ]] && \
                     [[ "${{ needs.testing.result }}" != "skipped" ]]; then
                    echo "❌ Test gate failed: tests did not pass"
                    test_passed="false"
                  else
                    echo "✅ Test gate passed"
                  fi

                  # Overall gate evaluation
                  if [[ "$quality_passed" == "true" && "$security_passed" == "true" && "$test_passed" == "true" ]]; then
                    echo "passed=true" >> "$GITHUB_OUTPUT"
                    echo "deploy-ready=true" >> "$GITHUB_OUTPUT"
                    echo "🎉 All quality gates passed!"
                  else
                    echo "passed=false" >> "$GITHUB_OUTPUT"
                    echo "deploy-ready=false" >> "$GITHUB_OUTPUT"
                    echo "❌ Quality gates failed"

                    # Allow override with force_deploy flag
                    if [[ "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
                      echo "⚠️  Force deploy enabled, proceeding despite failures"
                      echo "deploy-ready=true" >> "$GITHUB_OUTPUT"
                    else
                      exit 1
                    fi
                  fi

            - name: Quality Gate Summary
              if: always()
              run: |
                  cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
                  ## Quality Gate Results

                  ### Metrics
                  | Gate | Status | Score/Count |
                  |------|--------|-------------|
                  | Documentation Quality | ${{ needs.static-analysis.outputs.quality-score >= env.QUALITY_THRESHOLD && '✅' || '❌' }} | ${{ needs.static-analysis.outputs.quality-score }}% |
                  | ShellCheck Critical | ${{ needs.static-analysis.outputs.shellcheck-critical == '0' && '✅' || '❌' }} | ${{ needs.static-analysis.outputs.shellcheck-critical }} issues |
                  | ShellCheck Warnings | ⚠️ | ${{ needs.static-analysis.outputs.shellcheck-warnings }} warnings |
                  | Security Issues | ${{ needs.static-analysis.outputs.security-issues == '0' && '✅' || '⚠️' }} | ${{ needs.static-analysis.outputs.security-issues }} issues |
                  | Tests | ${{ needs.testing.result == 'success' && '✅' || needs.testing.result == 'skipped' && '⏭️' || '❌' }} | ${{ needs.testing.result }} |

                  ### Overall Status
                  ${{ steps.gates.outputs.passed == 'true' && '✅ **All quality gates passed**' || '❌ **Quality gates failed**' }}

                  ${{ steps.gates.outputs.deploy-ready == 'true' && '🚀 **Ready for deployment**' || '⛔ **Not ready for deployment**' }}
                  EOF

    # Stage 4: Documentation Update
    documentation:
        name: 'Stage 4: Documentation'
        needs: quality-gates
        if: needs.quality-gates.outputs.deploy-ready == 'true' && github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Update Documentation
              run: |
                  echo "Updating documentation..."

                  # Update README files if update script exists
                  if [[ -x scripts/maintenance/update-readme-and-changelog.sh ]]; then
                    ./scripts/maintenance/update-readme-and-changelog.sh || echo "Documentation update script returned non-zero"
                  fi

                  # Update badges if script exists
                  if [[ -x scripts/maintenance/update-badges.sh ]]; then
                    ./scripts/maintenance/update-badges.sh || echo "Badge update script returned non-zero"
                  fi

            - name: Commit Documentation Updates
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  if git diff --quiet; then
                    echo "ℹ️  No documentation changes to commit"
                  else
                    git add -A
                    git commit -m "docs: auto-update documentation [skip ci]" || echo "Nothing to commit"
                    git push || echo "Nothing to push"
                  fi

    # Stage 5: Deployment Notification
    deployment-notification:
        name: 'Stage 5: Deployment Status'
        needs: [quality-gates, documentation]
        if: always() && needs.quality-gates.outputs.deploy-ready == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read

        steps:
            - name: Deployment Status Summary
              run: |
                  cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
                  ## 🚀 Deployment Status

                  ### Pipeline Information
                  - **Pipeline Version:** ${{ env.PIPELINE_VERSION }}
                  - **Branch:** ${{ github.ref_name }}
                  - **Commit:** ${{ github.sha }}
                  - **Triggered By:** ${{ github.event_name }}

                  ### Results
                  - **Quality Gates:** ${{ needs.quality-gates.outputs.quality-passed == 'true' && '✅ Passed' || '❌ Failed' }}
                  - **Deploy Ready:** ${{ needs.quality-gates.outputs.deploy-ready == 'true' && '✅ Yes' || '❌ No' }}
                  - **Documentation:** ${{ needs.documentation.result == 'success' && '✅ Updated' || needs.documentation.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }}

                  ### Next Steps
                  ${{ github.ref == 'refs/heads/main' && '🎯 Ready for production deployment' || github.ref == 'refs/heads/develop' && '🧪 Changes deployed to development' || '📦 Changes ready for review' }}
                  EOF

    # Final Summary Job
    pipeline-complete:
        name: 'Pipeline Complete'
        needs: [static-analysis, testing, quality-gates, documentation, deployment-notification]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Check Pipeline Status
              run: |
                  echo "📊 Pipeline Execution Complete"
                  echo ""
                  echo "Stage Results:"
                  echo "  Static Analysis: ${{ needs.static-analysis.result }}"
                  echo "  Testing: ${{ needs.testing.result }}"
                  echo "  Quality Gates: ${{ needs.quality-gates.result }}"
                  echo "  Documentation: ${{ needs.documentation.result }}"
                  echo "  Deployment: ${{ needs.deployment-notification.result }}"
                  echo ""

                  if [[ "${{ needs.quality-gates.result }}" == "failure" ]]; then
                    echo "❌ Pipeline failed at quality gates"
                    exit 1
                  elif [[ "${{ needs.testing.result }}" == "failure" ]]; then
                    echo "❌ Pipeline failed at testing stage"
                    exit 1
                  elif [[ "${{ needs.static-analysis.result }}" == "failure" ]]; then
                    echo "❌ Pipeline failed at static analysis stage"
                    exit 1
                  else
                    echo "✅ Pipeline completed successfully"
                  fi

            - name: Final Summary
              if: always()
              run: |
                  cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
                  ---

                  ## 📋 Pipeline Summary

                  **Status:** ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}

                  **Execution Time:** ~${{ github.event.repository.updated_at }}

                  **Pipeline Version:** ${{ env.PIPELINE_VERSION }}

                  ---

                  *Modular Scripts CI/CD Pipeline by LightSpeedWP*
                  EOF
