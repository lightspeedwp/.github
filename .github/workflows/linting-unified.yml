name: Linting Unified • Code Quality

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope of linting to run'
        required: false
        type: choice
        options:
          - 'all'
          - 'js-only'
          - 'md-only'
        default: 'all'

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: linting-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Linting context job - determine which linting to run
  # ============================================================================

  lint-context:
    name: Determine Lint Context
    runs-on: ubuntu-latest
    outputs:
      run-js: ${{ steps.context.outputs.run-js }}
      run-md: ${{ steps.context.outputs.run-md }}
    steps:
      - name: Determine linting context
        id: context
        shell: bash
        run: |
          # Default: run all linting
          RUN_JS="true"
          RUN_MD="true"

          # workflow_dispatch override
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SCOPE="${{ inputs.scope }}"
            if [[ "$SCOPE" != "all" ]]; then
              RUN_JS=$([[ "$SCOPE" == "js-only" ]] && echo "true" || echo "false")
              RUN_MD=$([[ "$SCOPE" == "md-only" ]] && echo "true" || echo "false")
            fi
          fi

          echo "run-js=$RUN_JS" >> $GITHUB_OUTPUT
          echo "run-md=$RUN_MD" >> $GITHUB_OUTPUT

          echo "Linting context:"
          echo "  run-js: $RUN_JS"
          echo "  run-md: $RUN_MD"

  # ============================================================================
  # JavaScript/TypeScript linting job
  # ============================================================================

  lint-js:
    name: Lint JavaScript/TypeScript
    runs-on: ubuntu-latest
    needs: [lint-context]
    if: needs.lint-context.outputs.run-js == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        shell: bash
        run: |
          echo "🔍 Running ESLint on JavaScript/TypeScript files..."

          # Run ESLint with JSON format for parsing
          mkdir -p linting-results
          npm run lint:js -- --format json --output-file linting-results/eslint-report.json 2>&1 || true

          # Parse and display results
          if [ -f linting-results/eslint-report.json ]; then
            ERRORS=$(grep -o '"severity":2' linting-results/eslint-report.json | wc -l)
            WARNINGS=$(grep -o '"severity":1' linting-results/eslint-report.json | wc -l)

            echo "ESLint Results:"
            echo "  Errors: $ERRORS"
            echo "  Warnings: $WARNINGS"

            if [ "$ERRORS" -gt 0 ]; then
              echo ""
              echo "❌ ESLint found errors"
              cat linting-results/eslint-report.json | head -50
              exit 1
            elif [ "$WARNINGS" -gt 0 ]; then
              echo ""
              echo "⚠️  ESLint found warnings"
            else
              echo ""
              echo "✅ ESLint passed - no errors or warnings"
            fi
          else
            echo "✅ ESLint completed"
          fi
        continue-on-error: true

      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linting-js-results
          path: linting-results/
          retention-days: 7

      - name: Post ESLint failures to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'linting-results/eslint-report.json';

            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              let comment = '## ❌ ESLint Failures\n\n';
              comment += '| File | Line | Rule | Message |\n';
              comment += '|------|------|------|----------|\n';

              report.forEach(file => {
                file.messages.forEach(msg => {
                  if (msg.severity === 2) {
                    const line = file.filePath.split('/').pop();
                    comment += `| ${file.filePath} | ${msg.line} | ${msg.ruleId} | ${msg.message} |\n`;
                  }
                });
              });

              comment += '\n**Remediation:** Run `npm run lint:js` locally to auto-fix issues.\n';

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ============================================================================
  # Markdown linting job
  # ============================================================================

  lint-md:
    name: Lint Markdown
    runs-on: ubuntu-latest
    needs: [lint-context]
    if: needs.lint-context.outputs.run-md == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        shell: bash
        run: |
          echo "🔍 Running markdownlint on Markdown files..."

          # Create output directory
          mkdir -p linting-results

          # Run markdownlint
          npm run lint:md -- '**/*.{md,mdx}' '!node_modules' 2>&1 | tee linting-results/markdownlint.log || true

          # Check for failures
          if grep -q "Error:" linting-results/markdownlint.log; then
            echo ""
            echo "❌ markdownlint found issues"
            exit 1
          else
            echo ""
            echo "✅ markdownlint passed"
          fi
        continue-on-error: true

      - name: Upload markdownlint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linting-md-results
          path: linting-results/
          retention-days: 7

      - name: Post markdownlint failures to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logPath = 'linting-results/markdownlint.log';

            if (fs.existsSync(logPath)) {
              const log = fs.readFileSync(logPath, 'utf8');
              let comment = '## ⚠️ Markdown Linting Issues\n\n';
              comment += '```\n' + log.substring(0, 2000) + '\n```\n';
              comment += '\n**Remediation:** Run `npm run lint:md:fix` locally to auto-fix issues.\n';

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # ============================================================================
  # Linting metrics job
  # ============================================================================

  linting-metrics:
    name: Linting Metrics Collection
    runs-on: ubuntu-latest
    needs: [lint-js, lint-md]
    if: always()
    steps:
      - name: Collect linting workflow metrics
        id: metrics
        uses: ./.github/actions/collect-metrics
        with:
          workflow_name: 'linting-unified'
          workflow_run_id: 'current'
          metric_type: 'all'
          output_format: 'json'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report linting check results
        uses: ./.github/actions/validate-check
        if: github.event_name == 'pull_request'
        with:
          check_name: 'linting-unified'
          status: ${{ (needs.lint-js.result == 'success' && needs.lint-md.result == 'success') && 'success' || 'failure' }}
          title: 'Code Quality Linting'
          summary: |
            **JavaScript/TypeScript Linting:** ${{ needs.lint-js.result }}
            **Markdown Linting:** ${{ needs.lint-md.result }}

            **Metrics:**
            - Minutes Used: ${{ steps.metrics.outputs.minutes_used }}
            - Duration: ${{ steps.metrics.outputs.duration_seconds }} seconds
          post_comment: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Summary job
  # ============================================================================

  linting-summary:
    name: Linting Summary
    runs-on: ubuntu-latest
    needs: [lint-js, lint-md, linting-metrics]
    if: always()
    steps:
      - name: Report linting results
        shell: bash
        run: |
          echo "Linting workflow completed"
          echo "JavaScript/TypeScript linting: ${{ needs.lint-js.result }}"
          echo "Markdown linting: ${{ needs.lint-md.result }}"
          echo "Metrics collection: ${{ needs.linting-metrics.result }}"

          # Fail if any critical linting failed
          if [[ "${{ needs.lint-js.result }}" == "failure" ]] || [[ "${{ needs.lint-md.result }}" == "failure" ]]; then
            echo "❌ Linting workflow failed"
            exit 1
          fi

          echo "✅ Linting workflow completed"
