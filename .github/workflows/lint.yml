name: Lint

# Authoritative lint, type-check, and format checks. These back required
# status checks, so there is no paths filter on pull_request: a filtered-out
# run never reports, leaving the check at "Expected" forever.

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (JS/YAML/package.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # validate:workflow-npm-scripts diffs this range; without it the base
      # ref cannot be resolved from a shallow checkout and the guard would
      # silently report nothing to check. fetch-depth: 0 supplies the history.
      BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Lint JS, YAML and package.json
        # lint:ci is the uncached variant: a fresh checkout has no warm
        # .eslintcache, so caching here only costs write time.
        run: npm run lint:ci

      # Catches the failure mode this repository has hit repeatedly: a changed
      # workflow step invoking an npm script package.json does not declare,
      # which then fails every run with "Missing script" until noticed.
      - name: Validate workflow npm script references
        run: npm run validate:workflow-npm-scripts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
