name: Jest Test Coverage Audit

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  audit-jest-tests:
    name: Audit for Missing or Outdated Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for missing test files
        shell: bash
        run: |
          missing=0

          # Audit utility scripts
          find scripts/utility -maxdepth 1 -name "*.js" | while read file; do
            testfile="scripts/utility/__tests__/$(basename "${file%.js}.test.js")"
            if [ ! -f "$testfile" ]; then
              echo "::error file=$file::Missing test: $testfile"
              missing=1
            fi
          done

          # Audit agent scripts
          find .github/agents -maxdepth 1 -name "*.js" | while read file; do
            agentname=$(basename "${file%.js}")
            testfile=".github/agents/__tests__/${agentname}.test.js"
            if [ ! -f "$testfile" ]; then
              echo "::error file=$file::Missing test: $testfile"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "❌ One or more source files are missing Jest tests. See above for details."
            exit 1
          else
            echo "✅ All source files have a corresponding test."
          fi