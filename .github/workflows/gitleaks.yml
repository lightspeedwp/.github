name: gitleaks
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      full-history:
        type: boolean
        default: false
jobs:
  scan:
    uses: lightspeedwp/.github/.github/workflows/gitleaks-reusable.yml@develop
    with:
      full-history: ${{ github.event_name == 'workflow_dispatch' && inputs.full-history || false }}
