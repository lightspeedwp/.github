name: "Header & Footer Automation"
on:
  push:
    paths:
      - ".github/agents/header-footer.agent.js"
      - "scripts/includes/header-footer*"
      - "schemas/header-footer-agent/header.schema.json"
      - "schemas/header-footer-agent/footer.schema.json"
      - "scripts/includes/header-content.json"
      - "scripts/includes/footer-content.json"
      - "README.md"
  workflow_dispatch:

jobs:
  header-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run header-footer agent
        run: node .github/agents/header-footer.agent.js