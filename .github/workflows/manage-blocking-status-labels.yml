name: Manage Blocking Status Labels

on:
  issues:
    types: [opened, reopened, edited]
  schedule:
    # Run every morning at 09:00 UTC
    - cron: "0 9 * * *"

permissions:
  contents: read
  issues: write

jobs:
  update-blocking-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Update blocking status labels for open issues
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch all open issues
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              },
              (response) => response.data,
            );

            for (const issue of issues) {
              // Skip pull requests
              if (issue.pull_request) continue;

              const body = issue.body || '';

              // Extract blocked-by references (safely: only numbers)
              const blockedByRefs = [];
              const blockedByPattern = /^-\s+Blocked by:\s+(.+)$/m;
              const blockedByMatch = body.match(blockedByPattern);

              if (blockedByMatch) {
                const refMatches = blockedByMatch[1].matchAll(/#(\d+)/g);
                for (const match of refMatches) {
                  const issueNum = Number(match[1]);
                  if (Number.isInteger(issueNum) && issueNum > 0) {
                    blockedByRefs.push(issueNum);
                  }
                }
              }

              // Check if issue has the status:blocked label
              const hasBlockedLabel = issue.labels.some(
                (label) => label.name === 'status:blocked',
              );

              // If no blockers, remove status:blocked label
              if (blockedByRefs.length === 0) {
                if (hasBlockedLabel) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'status:blocked',
                  });
                  core.info(
                    `Removed status:blocked from #${issue.number}: no blockers`,
                  );
                }
                continue;
              }

              // Check if any blockers are still open
              const openBlockers = [];

              for (const blockerNum of blockedByRefs) {
                try {
                  const { data: blocker } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: blockerNum,
                  });

                  if (blocker.state === 'open') {
                    openBlockers.push(blockerNum);
                  }
                } catch (error) {
                  core.warning(
                    `Could not check status of blocker #${blockerNum}: ${error.message}`,
                  );
                }
              }

              // If all blockers are closed, remove status:blocked label
              if (openBlockers.length === 0) {
                if (hasBlockedLabel) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'status:blocked',
                  });
                  core.info(
                    `Removed status:blocked from #${issue.number}: all blockers resolved`,
                  );
                }
              } else {
                // If issue has open blockers, ensure status:blocked label is present
                if (!hasBlockedLabel) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: ['status:blocked'],
                  });
                  core.info(
                    `Added status:blocked to #${issue.number}: blockers ${openBlockers.join(', ')}`,
                  );
                }
              }
            }
