name: Branch Validation Metrics Aggregator

on:
  workflow_run:
    workflows: [Branch Name Validation]
    types: [completed]
  schedule:
    # Daily off-hour run (UTC). The workflow_run trigger above already keeps
    # the fixed-branch PR fresh on validation activity; the schedule is only
    # a backstop, so hourly would just burn minutes and PR-update noise.
    - cron: '17 3 * * *'

permissions:
  contents: write
  actions: read
  pull-requests: write

# Serialise runs: concurrent aggregations would race the metrics commit.
# NOTE: GitHub added `concurrency.queue: max` (May 2026) for deeper queues,
# but actionlint's schema does not recognise it yet — re-add once tooling
# catches up.
concurrency:
  group: branch-validation-metrics
  cancel-in-progress: false

jobs:
  aggregate-metrics:
    name: Aggregate validation metrics
    # Never react to a validation of this workflow's own output branch: that
    # push-validate-aggregate cycle looped ~450 times a day (#3474).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch != 'chore/branch-validation-metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required so the metrics commit can rebase
          # onto the latest develop when the push races another writer.
          fetch-depth: 0

      # Artifacts live on the triggering run, not this one: download-artifact
      # only searches the current run unless run-id is given.
      # See https://github.com/actions/download-artifact#download-artifacts-from-other-workflow-runs-or-repositories
      - name: Download recent metrics artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: metrics-artifacts
          pattern: branch-validation-metrics
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate metrics
        id: aggregate
        shell: bash
        run: |
          mkdir -p .github/reports/branch-validation

          # Single jq pass over every metric file; empty input yields zeros.
          summary=$(
            find metrics-artifacts -name '*.json' -print0 2>/dev/null \
              | xargs -0 -r jq -s '{
                  total: length,
                  valid: map(select(.valid == true)) | length,
                  forbidden: map(select((.errors // "" | tostring) | contains("forbidden_prefix"))) | length,
                  invalid: map(select((.errors // "" | tostring) | contains("invalid_type"))) | length,
                  malformed: map(select((.errors // "" | tostring) | contains("malformed"))) | length
                }' 2>/dev/null \
              || echo '{"total":0,"valid":0,"forbidden":0,"invalid":0,"malformed":0}'
          )

          # xargs -r runs nothing on empty input, leaving $summary unset.
          if [ -z "$summary" ]; then
            summary='{"total":0,"valid":0,"forbidden":0,"invalid":0,"malformed":0}'
          fi

          total=$(echo "$summary" | jq -r '.total')
          valid=$(echo "$summary" | jq -r '.valid')
          failed=$((total - valid))
          forbidden=$(echo "$summary" | jq -r '.forbidden')
          invalid=$(echo "$summary" | jq -r '.invalid')
          malformed=$(echo "$summary" | jq -r '.malformed')
          pass_rate=$(awk -v total="$total" -v valid="$valid" 'BEGIN {if (total == 0) print "0.0"; else printf "%.1f", (valid / total) * 100}')

          jq -n \
            --arg ts "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson total "$total" \
            --argjson valid "$valid" \
            --argjson failed "$failed" \
            --argjson pass_rate "$pass_rate" \
            --argjson forbidden "$forbidden" \
            --argjson invalid "$invalid" \
            --argjson malformed "$malformed" \
            '{
              timestamp: $ts,
              total_validations: $total,
              valid_count: $valid,
              failed_validations: $failed,
              pass_rate_percent: $pass_rate,
              error_breakdown: {
                forbidden_prefix: $forbidden,
                invalid_type: $invalid,
                malformed_format: $malformed
              }
            }' > .github/reports/branch-validation/metrics-summary.json

          echo "📊 Branch Validation Metrics"
          echo "============================"
          echo "Total Validations: $total"
          echo "Valid Branches: $valid"
          echo "Failed Validations: $failed"
          echo "Pass Rate: $pass_rate%"
          echo "Error Breakdown:"
          echo "  - Forbidden Prefix: $forbidden"
          echo "  - Invalid Type: $invalid"
          echo "  - Malformed Format: $malformed"

          echo "total=$total" >> "$GITHUB_OUTPUT"

      # Bound the committed artifact history: without pruning, every run adds
      # another metrics-artifacts/*.json file and create-pull-request commits
      # them all, growing the fixed branch (and develop after merge) forever.
      # Keep the 30 most recent files; the aggregate above already ran, so
      # deletions only affect future runs' input window, not this summary.
      - name: Prune old metrics artifacts
        shell: bash
        run: |
          keep=30
          # Newest first by mtime, NUL-delimited so any filename is safe.
          mapfile -d '' -t stale < <(
            find metrics-artifacts -maxdepth 1 -name '*.json' -printf '%T@\t%p\0' 2>/dev/null \
              | sort -z -rn | tail -z -n +$((keep + 1)) | cut -z -f2- || true
          )
          if [ "${#stale[@]}" -gt 0 ]; then
            rm -f -- "${stale[@]}"
            echo "Pruned ${#stale[@]} artifact(s), kept latest $keep."
          else
            echo "Nothing to prune (≤ $keep artifacts present)."
          fi

      - name: Generate GitHub App token
        # App token (not GITHUB_TOKEN) so the metrics PR triggers CI and
        # can satisfy develop's required checks. Requires repo/org secrets:
        # BOT_PR_APP_CLIENT_ID and BOT_PR_APP_PRIVATE_KEY.
        id: app-token
        if: steps.aggregate.outputs.total != '0'
        # NOTE: actionlint 1.7.12 (latest) bundles a stale v2-era input set
        # for this action (expects app-id, rejects client-id). Upstream v3
        # renamed app-id to client-id; the two messages are filtered via
        # documented -ignore flags in workflow-lint.yml.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PR_APP_PRIVATE_KEY }}

      - name: Create or update metrics PR
        if: steps.aggregate.outputs.total != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/branch-validation-metrics
          base: develop
          commit-message: 'chore: Update branch validation metrics'
          title: 'chore: Update branch validation metrics'
          body: |
            Automated metrics update, Dependabot-style.

            - Updates `.github/reports/branch-validation/metrics-summary.json`
            - Fixed branch; subsequent runs update this same PR until merged.
          labels: |
            type:chore
            area:ci

      - name: Upload aggregated metrics
        if: steps.aggregate.outputs.total != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-validation-metrics-summary
          path: .github/reports/branch-validation/metrics-summary.json
          retention-days: 90
