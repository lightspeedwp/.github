name: AIOps — Index Drift

on:
  pull_request:
    paths:
      - ".github/prompts/**"
      - ".github/chatmodes/**"
      - ".github/collections/**"
      - ".github/instructions/**"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plural indexes include all leaves
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check_dir() {
            local dir="$1"; local index="$2"; local pattern="$3"
            leaves=$(find "$dir" -maxdepth 1 -type f -name "$pattern" -exec basename {} \; | sort)
            [[ -f "$index" ]] || { echo "::error file=$index::missing index file"; fail=1; return; }
            for f in $leaves; do
              grep -q "$f" "$index" || { echo "::error file=$index::missing entry for $f"; fail=1; }
            done
          }
          check_dir ".github/prompts" ".github/prompts/prompts.md" "*.prompt.md"
          check_dir ".github/chatmodes" ".github/chatmodes/chatmodes.md" "*.chatmode.md"
          check_dir ".github/collections" ".github/collections/collections.md" "*.md"
          check_dir ".github/instructions" ".github/instructions/instructions.md" "*.md"
          exit $fail
