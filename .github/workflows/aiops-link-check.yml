name: AIOps — Link Check

on:
  pull_request:
    paths:
      - ".github/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "docs/**"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --exclude-mail --max-concurrency 8 --retry-wait-time 2 --accept 200,206 .
