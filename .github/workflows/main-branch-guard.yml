name: Main Branch Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-branch-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-branch:
    name: validate-release-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Validate release branch name
        run: node scripts/workflows/branch-policy/validate-main-branch-pr.cjs
