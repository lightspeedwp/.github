name: Cleanup Branches

on:
  schedule:
    - cron: "0 3 * * 0" # 3 AM Sunday UTC
  workflow_dispatch:
    inputs:
      inactiveDays:
        description: "Days of inactivity threshold"
        required: false
        default: "30"
      deleteLocal:
        description: "Delete local branches"
        required: false
        default: "false"
      dryRun:
        description: "Dry run only (no deletions)"
        required: false
        default: "true"
      excludePatterns:
        description: "Pipe-separated branch exclude regex patterns"
        required: false
        default: ""
      preserveAuthors:
        description: "Pipe-separated author patterns to preserve"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Run weekly cleanup (scheduled)
        if: github.event_name == 'schedule'
        run: |
          npm run cleanup-branches -- \
            --dryRun=false \
            --inactiveDays=30 \
            --deleteLocal=false \
            --reportFormat=markdown

      - name: Run manual cleanup (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run cleanup-branches -- \
            --dryRun=${{ github.event.inputs.dryRun }} \
            --inactiveDays=${{ github.event.inputs.inactiveDays }} \
            --deleteLocal=${{ github.event.inputs.deleteLocal }} \
            --excludePatterns="${{ github.event.inputs.excludePatterns }}" \
            --preserveAuthors="${{ github.event.inputs.preserveAuthors }}" \
            --reportFormat=markdown

      - name: Upload cleanup report artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-report-${{ github.run_number }}
          path: |
            .githu./.githu./.github/reports/branch-cleanup-*.md
            .githu./.githu./.github/reports/branch-cleanup-*.json
          if-no-files-found: warn
