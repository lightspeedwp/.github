name: Labeling • Issues & PRs (Unified)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, transferred]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: labeling-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: false

env:
  LABELS_CONFIG: .github/labels.yml
  ISSUE_TYPES_CONFIG: .github/issue-types.yml
  LABELER_RULES: .github/labeler.yml

jobs:
  labeling:
    name: Unified Labeling, Status, and Type Assignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Apply file/branch-based labels using labeler.yml (for PRs)
      - name: File/branch labeler (actions/labeler)
        if: github.event_name == 'pull_request'
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ${{ env.LABELER_RULES }}
          sync-labels: true

      # Run unified labeling agent for issues and PRs
      - name: Run labeling agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Load YAML configs for labels and issue types
            const fs = require('fs');
            const yaml = require('js-yaml');
            const labelsConfig = yaml.load(fs.readFileSync(process.env.LABELS_CONFIG, 'utf8'));
            const issueTypesConfig = yaml.load(fs.readFileSync(process.env.ISSUE_TYPES_CONFIG, 'utf8'));
            const labelerRules = yaml.load(fs.readFileSync(process.env.LABELER_RULES, 'utf8'));

            const isIssue = !!context.payload.issue;
            const isPR = !!context.payload.pull_request;
            const number = isIssue ? context.payload.issue.number : (isPR ? context.payload.pull_request.number : null);

            // Helper: Add label if not present
            async function addLabel(label) {
              const currentLabels = isIssue
                ? context.payload.issue.labels.map(l => l.name)
                : context.payload.pull_request.labels.map(l => l.name);
              if (!currentLabels.includes(label)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  labels: [label]
                });
                core.info(`Added label: ${label}`);
              }
            }

            // 1. Status & Priority (one-hot enforcement)
            if (isIssue || isPR) {
              // Enforce exactly one status:*
              const currentLabels = isIssue
                ? context.payload.issue.labels.map(l => l.name)
                : context.payload.pull_request.labels.map(l => l.name);
              const statusLabels = currentLabels.filter(l => l.startsWith('status:'));
              if (statusLabels.length === 0) {
                const defaultStatus = isPR ? 'status:needs-review' : 'status:needs-triage';
                await addLabel(defaultStatus);
              } else if (statusLabels.length > 1) {
                // Remove all but the first
                for (const label of statusLabels.slice(1)) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: number,
                    name: label
                  });
                }
              }
              // Default priority for issues
              if (isIssue && !currentLabels.some(l => l.startsWith('priority:'))) {
                await addLabel('priority:normal');
              }
            }

            // 2. Issue Type Assignment (based on issue-types.yml)
            if (isIssue && context.event.action === 'opened') {
              const title = context.payload.issue.title.toLowerCase();
              let typeLabel = null;
              // Match prefix e.g. "bug:", "feature:", etc.
              const prefixMatch = title.match(/^(bug|feature|task|chore|refactor|design|documentation|improvement|performance|qa|test|epic|story|integration|security|research|release):/);
              if (prefixMatch) {
                const prefix = prefixMatch[1];
                // Find label in issueTypesConfig
                const found = (issueTypesConfig.issue_types || []).find(t =>
                  t.name.toLowerCase() === prefix || (t.label && t.label.toLowerCase().endsWith(prefix))
                );
                if (found && found.label) typeLabel = found.label;
              }
              // Fallback: try to guess from keywords in title/body
              if (!typeLabel) {
                const keywords = [
                  { key: 'bug', label: 'type:bug' },
                  { key: 'feature', label: 'type:feature' },
                  { key: 'task', label: 'type:task' },
                  { key: 'doc', label: 'type:documentation' },
                  { key: 'refactor', label: 'type:refactor' }
                  // Add more as needed
                ];
                for (const { key, label } of keywords) {
                  if (title.includes(key) || (context.payload.issue.body || '').toLowerCase().includes(key)) {
                    typeLabel = label;
                    break;
                  }
                }
              }
              if (typeLabel) {
                await addLabel(typeLabel);
              }
            }

            // 3. PR heuristics (front matter, file heuristics)
            if (isPR) {
              const pr = context.payload.pull_request;
              const body = pr.body || "";
              // Front matter: --- labels: [...] ---
              const fmMatch = body.match(/^---\n([\s\S]*?)\n---/);
              if (fmMatch) {
                const fm = fmMatch[1];
                const arr = fm.match(/labels\s*:\s*\[(.*?)\]/);
                let labels = [];
                if (arr && arr[1]) {
                  labels = arr[1].split(',').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
                } else {
                  const lines = fm.split(/\n/);
                  let inBlock = false;
                  for (const line of lines) {
                    if (/^labels\s*:\s*$/.test(line)) { inBlock = true; continue; }
                    if (inBlock) {
                      const m = line.match(/^\s*-\s*(.+?)\s*$/);
                      if (m) labels.push(m[1].replace(/^["']|["']$/g, ''));
                      else if (line.trim() === "") continue;
                      else if (!line.startsWith(" ")) break;
                    }
                  }
                }
                for (const label of labels) {
                  await addLabel(label);
                }
              }
              // File heuristics: see labeler.yml for more rules (already applied above)
              // Additional custom rules can be added here
            }

            // 4. Changelog label nudge for PRs
            if (isPR) {
              const prLabels = context.payload.pull_request.labels.map(l => l.name);
              const changelogLabels = ['no-changelog', 'changelog:added', 'changelog:changed', 'changelog:fixed', 'changelog:security', 'changelog:deprecated', 'changelog:removed'];
              if (!prLabels.some(l => changelogLabels.includes(l))) {
                await addLabel('meta:needs-changelog');
              }
            }

            // 5. Logging
            core.info('Unified labeling agent complete. All required labels are present and conflicts resolved.');
