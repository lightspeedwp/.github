name: "Badges Automation"
on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/update-badges.sh"
      - ".github/agents/badges.agent.js"
      - "README.md"
  workflow_dispatch:

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run badges agent
        run: node .github/agents/badges.agent.js