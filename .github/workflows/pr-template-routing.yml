name: PR Template & Label Routing

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

# A newer push or body edit supersedes the in-flight routing run.
concurrency:
  group: pr-template-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route-pr-template-and-labels:
    name: Route PR template and apply labels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The router needs only scripts/, the PR templates and the root
      # package files (included by cone-mode sparse checkout), and no git
      # history.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The router runs PR-supplied scripts; never leave the token in
          # .git/config for them. github-script uses its own token input.
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts
            .github/PULL_REQUEST_TEMPLATE

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # --ignore-scripts skips the husky/git-hook install, which CI never uses.
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Route PR template and labels
        id: route
        # Branch name via env: it is attacker-controlled on fork PRs and
        # must not be expanded inline into the shell command line.
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -x  # Enable debug output

          echo "DEBUG: BRANCH_NAME='$BRANCH_NAME'"

          if [ -z "$BRANCH_NAME" ]; then
            echo "ERROR: BRANCH_NAME is empty"
            exit 1
          fi

          # Check if script exists
          if [ ! -f "scripts/pr-template-router.js" ]; then
            echo "ERROR: Script not found at scripts/pr-template-router.js"
            exit 1
          fi

          echo "DEBUG: Running routing script..."
          # Run routing script with both stdout and stderr visible first for debugging
          ROUTING_JSON=$(node scripts/pr-template-router.js "$BRANCH_NAME" 2>&1)
          EXIT_CODE=$?

          echo "DEBUG: Script exit code: $EXIT_CODE"
          echo "DEBUG: Script output length: ${#ROUTING_JSON}"
          echo "DEBUG: Script output: $ROUTING_JSON"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: Script exited with code $EXIT_CODE"
            exit 1
          fi

          # Validate JSON
          echo "DEBUG: Validating JSON..."
          if ! echo "$ROUTING_JSON" | jq empty 2>&1; then
            echo "ERROR: Invalid JSON from script"
            exit 1
          fi

          echo "DEBUG: JSON is valid"
          echo "$ROUTING_JSON" | jq '.'

          # Parse JSON and set outputs
          echo "DEBUG: Parsing JSON fields..."
          BRANCH_TYPE=$(echo "$ROUTING_JSON" | jq -r '.branch_type' 2>&1)
          TEMPLATE=$(echo "$ROUTING_JSON" | jq -r '.template' 2>&1)
          ALL_LABELS=$(echo "$ROUTING_JSON" | jq -r '.all_labels | join(",")' 2>&1)
          SCOPE=$(echo "$ROUTING_JSON" | jq -r '.scope' 2>&1)

          echo "DEBUG: Parsed values:"
          echo "DEBUG:   branch_type='$BRANCH_TYPE'"
          echo "DEBUG:   template='$TEMPLATE'"
          echo "DEBUG:   labels='$ALL_LABELS'"
          echo "DEBUG:   scope='$SCOPE'"

          echo "branch_type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
          echo "template=$TEMPLATE" >> $GITHUB_OUTPUT
          echo "labels=$ALL_LABELS" >> $GITHUB_OUTPUT
          echo "scope=$SCOPE" >> $GITHUB_OUTPUT

          echo "DEBUG: Outputs written successfully"

      # Router outputs are derived from the branch name, which a fork PR
      # controls: pass them through env, never inline them into shell.
      - name: Verify template exists
        id: verify-template
        env:
          ROUTE_TEMPLATE: ${{ steps.route.outputs.template }}
        run: |
          TEMPLATE_FILE=".github/PULL_REQUEST_TEMPLATE/${ROUTE_TEMPLATE}.md"
          if [ -f "$TEMPLATE_FILE" ]; then
            echo "✓ Template found: $TEMPLATE_FILE"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠ Template not found: $TEMPLATE_FILE"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify PR body matches template
        if: steps.verify-template.outputs.exists == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROUTE_TEMPLATE: ${{ steps.route.outputs.template }}
        with:
          script: |
            // Automated update PRs have generated bodies that never follow a
            // human template; requiring the sections made every Dependabot PR
            // fail this required check (#3476). Explicit allowlist, so other
            // app-authored PRs (for example AI agents) still need the template.
            const exemptAuthors = ['dependabot[bot]', 'lightspeed-docs-bot[bot]'];
            const author = context.payload.pull_request?.user?.login || '';
            if (exemptAuthors.includes(author)) {
              core.info(`Skipping template body check for automated PR author ${author}.`);
              return;
            }

            const fs = require('node:fs');
            const templateName = process.env.ROUTE_TEMPLATE;
            const templateFile = `.github/PULL_REQUEST_TEMPLATE/${templateName}.md`;
            const template = fs.readFileSync(templateFile, 'utf8');
            const required = [...template.matchAll(/^## (.+)$/gm)].map((m) => m[1].trim());
            // Fetch the live PR body: the event payload snapshot goes stale
            // (job reruns reuse the original payload, so body edits made
            // after the run started are invisible). Fall back to the payload
            // if the API call fails.
            let rawBody = context.payload.pull_request?.body || '';
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request?.number,
              });
              rawBody = pr.body || '';
            } catch (error) {
              core.warning(`Live PR body fetch failed, using event payload: ${error.message}`);
            }
            const body = rawBody.toLowerCase();

            // 1. Every template section heading must be present.
            const missing = required.filter((h) => !body.includes(`## ${h.toLowerCase()}`));
            if (missing.length > 0) {
              core.setFailed(
                `PR body is missing ${missing.length} section(s) from ${templateName}.md: ` +
                missing.map((h) => `"## ${h}"`).join(', ') +
                `. Copy the template sections into the PR body (see ${templateFile}).`
              );
              return;
            }

            // 2. Every section must contain real content: HTML comments
            // (the templates ship with instructional placeholders) and
            // whitespace do not count, and neither does an unchanged copy
            // of the template's own default text. Write `N/A` where a
            // section genuinely does not apply.
            const splitSections = (text) => {
              const sections = {};
              let current = null;
              for (const line of text.split('\n')) {
                const match = line.match(/^## (.+)$/);
                if (match) {
                  current = match[1].trim().toLowerCase();
                  sections[current] = [];
                } else if (current) {
                  sections[current].push(line);
                }
              }
              return sections;
            };
            const normalize = (text) => text.replace(/<!--[\s\S]*?-->/g, '').replace(/\s+/g, ' ').trim();
            const bodySections = splitSections(rawBody);
            const templateSections = splitSections(template);
            const empty = required.filter((h) => {
              const key = h.toLowerCase();
              const submitted = normalize((bodySections[key] || []).join('\n'));
              const templateDefault = normalize((templateSections[key] || []).join('\n'));
              return submitted.length === 0 || submitted === templateDefault;
            });
            if (empty.length > 0) {
              core.setFailed(
                `PR body has ${empty.length} empty or unmodified section(s) from ${templateName}.md: ` +
                empty.map((h) => `"## ${h}"`).join(', ') +
                `. Fill each section with PR-specific content (or write N/A); an unchanged copy of the template text does not count.`
              );
            } else {
              core.info(`PR body contains all ${required.length} sections from ${templateName}.md with content.`);
            }

      - name: Apply labels to PR
        if: steps.verify-template.outputs.exists == 'true' && steps.route.outputs.labels != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROUTE_LABELS: ${{ steps.route.outputs.labels }}
        with:
          script: |
            const labels = (process.env.ROUTE_LABELS || '').split(',').map(l => l.trim()).filter(l => l);

            if (labels.length > 0) {
              console.log(`Adding labels: ${labels.join(', ')}`);

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: labels
                });
                console.log('Labels applied successfully');
              } catch (error) {
                console.warn(`Warning: Could not apply labels: ${error.message}`);
              }
            } else {
              console.log('No labels to apply');
            }

      - name: Add PR comment with routing info
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROUTE_BRANCH_TYPE: ${{ steps.route.outputs.branch_type }}
          ROUTE_TEMPLATE: ${{ steps.route.outputs.template }}
          ROUTE_LABELS: ${{ steps.route.outputs.labels }}
          ROUTE_SCOPE: ${{ steps.route.outputs.scope }}
        with:
          script: |
            const branchType = process.env.ROUTE_BRANCH_TYPE;
            const template = process.env.ROUTE_TEMPLATE;
            const labels = process.env.ROUTE_LABELS || 'none';
            const scope = process.env.ROUTE_SCOPE;

            const labelDisplay = labels === 'none' ? '_none_' : labels;
            const lines = [
              '## PR Template Routing',
              '',
              `**Branch Type:** \`${branchType}\``,
              `**Scope:** \`${scope}\``,
              `**Template:** \`${template}.md\``,
              `**Labels Applied:** ${labelDisplay}`,
              '',
              'This PR was automatically routed based on the branch naming strategy.'
            ];

            const comment = lines.join('\n');

            try {
              // Update the existing routing comment instead of posting a
              // duplicate on every synchronize event.
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(c =>
                c.user.type === 'Bot' && c.body.includes('## PR Template Routing')
              );

              if (existingComment) {
                if (existingComment.body.trim() === comment.trim()) {
                  console.log('Routing comment already up to date; skipping.');
                  return;
                }
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: comment
                });
                console.log('Routing comment updated.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
                console.log('Routing comment created.');
              }
            } catch (error) {
              console.warn(`Could not post comment: ${error.message}`);
            }

      - name: Report routing status
        if: always()
        env:
          ROUTE_BRANCH_TYPE: ${{ steps.route.outputs.branch_type }}
          ROUTE_SCOPE: ${{ steps.route.outputs.scope }}
          ROUTE_TEMPLATE: ${{ steps.route.outputs.template }}
          ROUTE_LABELS: ${{ steps.route.outputs.labels }}
          TEMPLATE_EXISTS: ${{ steps.verify-template.outputs.exists }}
        run: |
          echo "=== PR Template Routing Summary ==="
          echo "Branch Type: $ROUTE_BRANCH_TYPE"
          echo "Scope: $ROUTE_SCOPE"
          echo "PR Template: $ROUTE_TEMPLATE"
          echo "Labels: $ROUTE_LABELS"
          echo "Template Exists: $TEMPLATE_EXISTS"
