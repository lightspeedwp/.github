name: planner

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Planner
        run: node agents/planner.agent.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
