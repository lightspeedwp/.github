name: planner

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Planner
        run: node scripts/agents/planner.agent.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
