name: Label drift check

# Weekly drift check for spec 008 (task T072; FR-017, FR-018).
# Compares every lightspeedwp repository's labels and the Linear workspace
# labels against .github/labels.yml, then creates or updates the single
# "Label drift report" issue. Read-only: it never creates, edits or deletes
# labels. GitHub authentication uses the organisation-wide App (manual step
# T071a); Linear reads use the read-only LINEAR_API_KEY repository secret.

on:
  schedule:
    # Sundays at 02:00 UTC, after the label inventory jobs.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render the report without creating or updating the issue'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  drift-check:
    name: Check label drift
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    # Serialise runs without cancelling: a scheduled run and a manual
    # dispatch must never overlap, or their separate search-then-create
    # sequences could create duplicate report issues. Queued runs wait.
    concurrency:
      group: label-drift-check
      cancel-in-progress: false
    # The environment restricts deployments to `develop`, so a
    # workflow_dispatch from another branch cannot run this job. It holds no
    # secrets: the credentials are repository level, so this is branch gating
    # only, not secret isolation (see APP-CREDENTIAL-VARIANCE).
    environment: label-drift-check
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Never run branch code with secrets: workflow_dispatch can target
          # any branch, so always execute the reviewed integration ref. The
          # approved label set lives on develop (FR-016) and develop is the
          # default branch, so scheduled runs are unaffected.
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Mint read App token
        # Uses the project-automation App (vars.LS_APP_ID, secret
        # LS_APP_PRIVATE_KEY), which is already installed on every
        # lightspeedwp repository with Issues and Metadata access. The
        # BOT_PR_APP App is not used here: its installation is limited to
        # selected repositories and has no Issues permission, so this mint
        # failed with "permissions requested are not granted" (T071a).
        # The token is downscoped below, so FR-018's narrow set holds per
        # token. Read-only and organisation-wide: inventory, search and
        # report lookup only.
        id: app-token-read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.LS_APP_ID }}
          private-key: ${{ secrets.LS_APP_PRIVATE_KEY }}
          owner: lightspeedwp
          permission-issues: read
          permission-metadata: read

      - name: Mint report-write App token
        # Write-scoped to the report repository only: a compromised
        # token-bearing step cannot modify issues anywhere else, even where
        # the App is installed.
        id: app-token-write
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.LS_APP_ID }}
          private-key: ${{ secrets.LS_APP_PRIVATE_KEY }}
          owner: lightspeedwp
          repositories: .github
          permission-issues: write

      - name: Resolve the private report repository
        # Optional. The variable PRIVATE_REPORT_REPO (owner/name) names a PRIVATE
        # repository that receives the detail for private repositories. This
        # public repository never names a private one, so with the variable unset
        # that detail is withheld.
        id: private-report
        env:
          PRIVATE_REPORT_REPO: ${{ vars.PRIVATE_REPORT_REPO }}
        run: |
          if [ -z "$PRIVATE_REPORT_REPO" ]; then
            exit 0
          fi
          # The App is installed on lightspeedwp only, so a repository under any
          # other owner could never be reached; stop here with a clear message
          # instead of failing later at the mint step or the first write.
          if ! [[ "$PRIVATE_REPORT_REPO" =~ ^([A-Za-z0-9-]+)/([A-Za-z0-9._-]+)$ ]]; then
            echo "::error::PRIVATE_REPORT_REPO must be owner/repository"
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "lightspeedwp" ]; then
            echo "::error::PRIVATE_REPORT_REPO must be a lightspeedwp repository"
            exit 1
          fi
          {
            echo "owner=${BASH_REMATCH[1]}"
            echo "name=${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint private report App token
        # Write-scoped to the private report repository only, using the same
        # installed App as the tokens above, so no extra secret is stored.
        if: steps.private-report.outputs.name != ''
        id: app-token-private
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.LS_APP_ID }}
          private-key: ${{ secrets.LS_APP_PRIVATE_KEY }}
          owner: ${{ steps.private-report.outputs.owner }}
          repositories: ${{ steps.private-report.outputs.name }}
          permission-issues: write

      - name: Run label drift check
        env:
          GITHUB_TOKEN: ${{ steps.app-token-read.outputs.token }}
          GITHUB_WRITE_TOKEN: ${{ steps.app-token-write.outputs.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # Private repository detail is written only to this private repository,
          # and only after the script confirms it is private.
          PRIVATE_REPORT_REPO: ${{ vars.PRIVATE_REPORT_REPO }}
          PRIVATE_REPORT_TOKEN: ${{ steps.app-token-private.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry-run"; fi
          npm run labels:drift-check -- $args

      - name: Upload drift report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-drift-report-${{ github.run_id }}
          path: .github/reports/audits/2026-09-14-label-audit/evidence/linear-drift-report.json
          retention-days: 30
