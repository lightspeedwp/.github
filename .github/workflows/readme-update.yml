name: README & Mermaid Updates [DEPRECATED]

on:
  # DISABLED: Consolidated into docs-maintenance.yml
  # This workflow is deprecated and will be removed after Phase 2.3
  # See: .github/projects/active/workflows-consolidation-2026-q3/PHASE_2_2_TEST_RESULTS.md
  workflow_run:
    workflows: []
  workflow_dispatch:
    inputs:
      scope:
        description: "Update scope (all/mermaid/staleness)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mermaid
          - staleness
      dry_run:
        description: "Preview changes without committing"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  workflow_call:
    inputs:
      scope:
        description: "Update scope (all/mermaid/staleness)"
        required: false
        default: "all"
        type: string
      dry_run:
        description: "Preview changes without committing"
        required: false
        default: "false"
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  DRY_RUN: ${{ inputs.dry_run || 'false' }}
  UPDATE_SCOPE: ${{ inputs.scope || 'all' }}

jobs:
  readme-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Create audit directory
        run: mkdir -p .github/reports/mermaid-audit

      - name: Run Mermaid diagram fixes
        if: ${{ env.UPDATE_SCOPE == 'all' || env.UPDATE_SCOPE == 'mermaid' }}
        run: node scripts/fix-mermaid-diagrams.js
        continue-on-error: true

      - name: Validate Mermaid colour contrast
        if: ${{ env.UPDATE_SCOPE == 'all' || env.UPDATE_SCOPE == 'mermaid' }}
        run: npm run validate:mermaid-contrast
        continue-on-error: true

      - name: Run staleness updates
        if: ${{ env.UPDATE_SCOPE == 'all' || env.UPDATE_SCOPE == 'staleness' }}
        run: node scripts/fix-staleness-dates.js
        continue-on-error: true

      - name: Generate update report
        if: success()
        run: |
          cat > .github/reports/mermaid-audit/update-report.md <<'EOF'
          # README & Mermaid Update Report

          **Date**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Scope**: ${{ env.UPDATE_SCOPE }}
          **Dry Run**: ${{ env.DRY_RUN }}

          ## Changes Summary

          - Mermaid diagrams: Updated accessibility attributes and colour-contrast-safe palette values
          - Staleness updates: Refreshed `last_updated` dates for files exceeding 6-month threshold

          ## Processing Mode

          - **Dry Run**: ${{ env.DRY_RUN == 'true' && 'Yes (preview only)' || 'No (changes applied)' }}
          - **Scope**: ${{ env.UPDATE_SCOPE }}

          ## Next Steps

          If changes were applied:
          1. Review the changes in this run's artifacts
          2. Create a pull request with the updates
          3. Have maintainers review and merge

          EOF
          cat .github/reports/mermaid-audit/update-report.md

      - name: Check for changes
        id: changes
        run: test "$(git status --porcelain | wc -l)" -gt 0 && echo "has_changes=true" >> "$GITHUB_OUTPUT" || echo "has_changes=false" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: ${{ steps.changes.outputs.has_changes == 'true' && env.DRY_RUN == 'false' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "docs: update READMEs with Mermaid accessibility and staleness fixes

          - Update Mermaid diagrams with accTitle, accDescr, and approved palette values
          - Refresh last_updated dates for stale files (6+ months)
          - Scope: ${{ env.UPDATE_SCOPE }}
          - Generated by: readme-update.yml workflow"

      - name: Push changes
        if: ${{ steps.changes.outputs.has_changes == 'true' && env.DRY_RUN == 'false' }}
        run: |
          git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-update-report
          path: .github/reports/mermaid-audit/update-report.md

      - name: Summary
        run: |
          echo "## README & Mermaid Update Workflow"
          echo ""
          echo "**Status**: ${{ job.status }}"
          echo "**Scope**: ${{ env.UPDATE_SCOPE }}"
          echo "**Dry Run**: ${{ env.DRY_RUN }}"
          echo "**Changes Made**: ${{ steps.changes.outputs.has_changes }}"
          echo ""
          echo "📋 [Report](./.github/reports/mermaid-audit/update-report.md)"
