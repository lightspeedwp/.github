# Qodo PR-Agent • Pilot
#
# Pilot caller for lightspeedwp/.github. Other repositories copy this file and
# change the `uses:` line to
#   lightspeedwp/.github/.github/workflows/qodo-pr-agent-reusable.yml@<ref>
# (see docs/QODO_PR_AGENT.md → "Enable in another repository").
#
# Automatic: summary comment and improvement suggestions on non-draft PRs when
# they are opened, reopened or marked ready for review. No re-run on every push.
# On demand: maintainer comments such as `/ask`, `/review`, `/update_changelog`.
name: Qodo PR-Agent • Pilot

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  qodo:
    name: Qodo PR-Agent
    uses: ./.github/workflows/qodo-pr-agent-reusable.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # lets the run job request a GitHub OIDC token for keyless auth
    # Credential: the dedicated key secret, or keyless Workload Identity Federation
    # configured through Actions variables (see docs/QODO_PR_AGENT.md → Credential and spend).
    # A stored key takes precedence when both are set.
    with:
      federation_rule_id: ${{ vars.QODO_PR_AGENT_FEDERATION_RULE_ID }}
      organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      service_account_id: ${{ vars.QODO_PR_AGENT_SERVICE_ACCOUNT_ID }}
      workspace_id: ${{ vars.QODO_PR_AGENT_WORKSPACE_ID }}
    secrets:
      model_credential: ${{ secrets.ANTHROPIC_API_KEY_QODO_PR_AGENT }}
