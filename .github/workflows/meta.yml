---
name: Meta Agent

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - "**/*.md"
      - ".github/labels.yml"
      - ".github/labeler.yml"
      - ".github/issue-types.yml"
      - ".github/agents/**"
  push:
    branches: [develop]
    paths:
      - "**/*.md"
      - ".github/labels.yml"
      - ".github/labeler.yml"
      - ".github/issue-types.yml"
      - ".github/agents/**"
  schedule:
    - cron: "0 3 * * 1" # weekly metrics roll-up (Mon 03:00 UTC)

concurrency:
  group: "meta-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  front-matter-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Validate frontmatter freshness
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
          else
            BASE_REF="HEAD~1"
            HEAD_REF="${{ github.sha }}"
          fi
          npm run validate:frontmatter:changed -- --base "$BASE_REF" --head "$HEAD_REF"

  lint-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Lint changed Markdown
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate-markdown-lint.js

      - name: Collect Link Targets
        id: link_targets
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/collect-link-targets.js >> "$GITHUB_OUTPUT"

      - name: Check Links
        if: steps.link_targets.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        env:
          # Unauthenticated requests to github.com hit GitHub's anonymous rate
          # limit almost immediately once a Markdown file references more than
          # a handful of issues/PRs, and lychee reports the resulting
          # rate-limit response as a plain 404 rather than 429 — indistinguishable
          # from a genuinely deleted issue without checking the API directly.
          # Authenticating raises the limit enough for CHANGELOG.md's issue links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-progress --verbose --config lychee.toml ${{ steps.link_targets.outputs.files }}

  apply-meta:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [front-matter-validate, lint-and-links]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Run Meta Agent
        env:
          META_SKIP_README: "true"
        run: |
          node scripts/agents/meta.agent.js

      - name: Update Metrics Snapshot
        run: |
          mkdir -p .github/metrics
          # Read metrics from meta agent output (meta-metrics.json)
          if [ -f .github/metrics/meta-metrics.json ]; then
            node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('.github/metrics/meta-metrics.json', 'utf8'));
              m.ts = new Date().toISOString();
              fs.writeFileSync('.github/metrics/meta.json', JSON.stringify(m, null, 2));
              const logLine = \`| \${m.ts} | coverage:\${m.coverage} | changes:\${m.changes} | errors:\${m.errors} | optouts:\${m.optouts} |\n\`;
              fs.appendFileSync('.github/metrics/meta-log.md', logLine);
            "
          else
            echo "Warning: .github/metrics/meta-metrics.json not found. Writing zeroed metrics."
            node -e "
              const fs = require('fs');
              let m = { ts: new Date().toISOString(), coverage: 0, changes: 0, errors: 0, optouts: 0 };
              fs.writeFileSync('.github/metrics/meta.json', JSON.stringify(m, null, 2));
              const logLine = \`| \${m.ts} | coverage:0 | changes:0 | errors:0 | optouts:0 |\n\`;
              fs.appendFileSync('.github/metrics/meta-log.md', logLine);
            "
          fi

      # develop requires the "Validate PR Template" status check, which only
      # runs for pull_request events — a direct `git push` to develop can
      # never satisfy it (see lightspeedwp/.github#1070). Route the change
      # through a PR instead, with auto-merge so this stays hands-off.
      - name: Open or update automation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/handle-meta-agent-pr.js
