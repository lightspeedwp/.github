name: Template Enforcement

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-issue-template:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue body against required template sections
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- template-enforcement -->';
            const issue = context.payload.issue;
            const body = (issue.body || '').trim();

            const required = [
              { name: 'Definition of Ready (DoR)', regex: /definition of ready \(dor\)/i },
              { name: 'Definition of Done (DoD)', regex: /definition of done \(dod\)/i }
            ];

            const missing = required
              .filter((entry) => !entry.regex.test(body))
              .map((entry) => entry.name);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });

            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (missing.length === 0) {
              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body: `${marker}\n✅ Template check passed after update. Thanks for fixing the issue body.`
                });
              }

              return;
            }

            const message = [
              marker,
              '🚫 This issue does not follow a required issue template.',
              '',
              `Missing required section(s): ${missing.join(', ')}`,
              '',
              'Please update the issue body using one of the official templates:',
              '- https://github.com/lightspeedwp/.github/issues/new/choose',
              '',
              'If this was opened by automation, update the automation to preserve the template sections.'
            ].join('\n');

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message
              });
            }

            core.setFailed(`Issue #${issue.number} is missing required template sections: ${missing.join(', ')}`);

  validate-pr-template:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request body against required template sections
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- template-enforcement -->';
            const pr = context.payload.pull_request;
            const author = pr.user?.login || '';
            const isDependabot = author === 'dependabot[bot]' || author === 'app/dependabot';

            if (isDependabot) {
              core.info(`Skipping PR template validation for Dependabot author ${author}.`);
              return;
            }

            const body = (pr.body || '').trim();

            const required = [
              { name: 'Linked issues', regex: /^##\s+Linked issues/im },
              { name: 'Changelog', regex: /^##\s+Changelog/im },
              { name: 'Global DoD checklist', regex: /^###\s+Checklist\s+\(Global DoD\s*\/\s*PR\)/im }
            ];

            const missing = required
              .filter((entry) => !entry.regex.test(body))
              .map((entry) => entry.name);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });

            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (missing.length === 0) {
              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body: `${marker}\n✅ Template check passed after update. Thanks for fixing the PR description.`
                });
              }

              return;
            }

            const message = [
              marker,
              '🚫 This PR description is missing required template sections.',
              '',
              `Missing required section(s): ${missing.join(', ')}`,
              '',
              'Please update the PR body using one of the repository PR templates:',
              '- https://github.com/lightspeedwp/.github/blob/develop/.github/pull_request_template.md',
              '- https://github.com/lightspeedwp/.github/tree/develop/.github/PULL_REQUEST_TEMPLATE',
              '',
              'This check must pass before merge.'
            ].join('\n');

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message
              });
            }

            core.setFailed(`PR #${pr.number} is missing required template sections: ${missing.join(', ')}`);
