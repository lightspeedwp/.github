name: Template Enforcement

on:
  issues:
    types: [opened, edited, reopened]
  push:
    branches: [develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-issue-template:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue body against required template sections
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- template-enforcement -->';
            const issue = context.payload.issue;
            const body = (issue.body || '').trim();
            const author = issue.user?.login || '';
            const isGithubActions = author === 'github-actions[bot]';

            const required = [
              { name: 'Definition of Ready (DoR)', regex: /definition of ready \(dor\)/i },
              { name: 'Definition of Done (DoD)', regex: /definition of done \(dod\)/i }
            ];

            const missing = required
              .filter((entry) => !entry.regex.test(body))
              .map((entry) => entry.name);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });

            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (missing.length === 0) {
              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body: `${marker}\n✅ Template check passed after update. Thanks for fixing the issue body.`
                });
              }

              return;
            }

            const message = isGithubActions
              ? [
                  marker,
                  '🚫 This issue was opened by automation without the required template sections.',
                  '',
                  `Missing required section(s): ${missing.join(', ')}`,
                  '',
                  'Update the automation to render the canonical template before creating the issue.',
                  '- Recommended workflow: `.github/workflows/issue-create-from-template.yml`',
                ].join('\n')
              : [
                  marker,
                  '🚫 This issue does not follow a required issue template and has been closed automatically.',
                  '',
                  `Missing required section(s): ${missing.join(', ')}`,
                  '',
                  'Please reopen with one of the official templates:',
                  '- https://github.com/lightspeedwp/.github/issues/new/choose',
                  '',
                  'If this was opened by automation, update the automation to preserve the template sections before creating the issue.',
                ].join('\n');

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message
              });
            }

            if (isGithubActions) {
              core.setFailed(
                `Issue #${issue.number} was opened by github-actions[bot] and is missing required template sections: ${missing.join(', ')}`,
              );
              return;
            }

            if (issue.state !== 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }

            core.setFailed(`Issue #${issue.number} is missing required template sections: ${missing.join(', ')}`);

  validate-push-guardrail:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Validate merged PR body on push to develop
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- template-enforcement -->';
            const commitSha = context.payload.after;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              per_page: 100
            });

            const mergedPr = prs.find((pr) => pr.merged_at && pr.base?.ref === 'develop');
            if (!mergedPr) {
              core.info(`No merged pull request associated with ${commitSha}; nothing to validate.`);
              return;
            }

            const validation = validatePullRequestBody(
              mergedPr.body || '',
              mergedPr.labels || [],
              mergedPr.head?.ref || ''
            );
            const author = mergedPr.user?.login || '';
            const isDependabot = author === 'dependabot[bot]' || author === 'app/dependabot';

            if (isDependabot) {
              core.info(`Skipping template enforcement for Dependabot merged PR #${mergedPr.number}.`);
              return;
            }

            if (validation.missing.length === 0) {
              core.info(`Merged PR #${mergedPr.number} satisfies template enforcement.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: mergedPr.number,
              per_page: 100
            });

            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            const message = [
              marker,
              '⚠️ A merged PR reached develop without passing the template content guardrail.',
              '',
              `Missing required section(s): ${validation.missing.join(', ')}`,
              '',
              'This is a post-merge backstop for admin bypasses. Please review branch protection for develop.'
            ].join('\n');

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mergedPr.number,
                body: message
              });
            }

            core.setFailed(
              `Merged PR #${mergedPr.number} on develop is missing required template content: ${validation.missing.join(', ')}`
            );
            // Keep these helpers in sync with .github/workflows/validate-pr-template.yml
            // until they are extracted into a shared script.
            function stripHtmlComments(text) {
              return (text || '').replace(/<!--[\s\S]*?-->/g, '');
            }

            function sectionBody(body, headingRegex) {
              const text = (body || '').replace(/\r\n/g, '\n');
              const match = text.match(headingRegex);
              if (!match || match.index === undefined) {
                return '';
              }

              const start = match.index + match[0].length;
              const remainder = text.slice(start);
              const nextHeading = remainder.match(/^##\s+.+$/m);
              const end = nextHeading ? start + nextHeading.index : text.length;
              return text.slice(start, end).trim();
            }

            function hasIssueReference(sectionText) {
              const cleaned = stripHtmlComments(sectionText);
              return /(?:^|\n)\s*(?:[-*]\s*)?(?:(?:closes|fixes|resolves|relates to)\s+)?#\d+\b/i.test(cleaned);
            }

            function hasChangelogEntry(sectionText) {
              const cleaned = stripHtmlComments(sectionText);
              return /(?:^|\n)\s*[-*]\s+(?!\[?\s*placeholder\s*\]?)(?:.+\S)/im.test(cleaned);
            }

            function hasCompletedChecklist(sectionText) {
              const cleaned = stripHtmlComments(sectionText);
              const hasUnchecked = /(?:^|\n)\s*-\s*\[\s\]\s*/.test(cleaned);
              const hasChecked = /(?:^|\n)\s*-\s*\[[xX]\]\s*/.test(cleaned);
              return hasChecked && !hasUnchecked;
            }

            function validatePullRequestBody(body, labels, headRef) {
              const labelNames = new Set((labels || []).map((label) => label.name));
              const missing = [];
              const isReleaseBranch = /^release\//i.test(String(headRef || ''));

              const linkedIssues = sectionBody(
                body,
                isReleaseBranch
                  ? /^##\s+Linked issues\s*&\s*merged PRs\s*$/im
                  : /^##\s+Linked issues\s*$/im
              );
              if (!hasIssueReference(linkedIssues)) {
                missing.push(isReleaseBranch ? 'Linked issues & merged PRs' : 'Linked issues');
              }

              const changelog = sectionBody(body, /^##\s+Changelog\s*$/im);
              if (!labelNames.has('meta:no-changelog') && !hasChangelogEntry(changelog)) {
                missing.push('Changelog');
              }

              const checklist = sectionBody(
                body,
                /^###\s+Checklist\s+\(Global DoD\s*\/\s*PR\)\s*$/im
              );
              if (!hasCompletedChecklist(checklist)) {
                missing.push('Global DoD checklist');
              }

              return { missing };
            }
