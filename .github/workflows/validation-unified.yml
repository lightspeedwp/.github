name: Validation Unified • PR & Issue Checks

# TEMPORARILY DISABLED - Phase 4 skeleton workflow under development
# Remove this condition when implementation is complete (T026-T036)

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited, reopened]
  push:
    branches: [develop]
    paths:
      - '.github/workflows/**'
      - 'CHANGELOG.md'
  schedule:
    # 01:00 UTC - Documentation validation
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope of validation to run'
        required: false
        type: choice
        options:
          - 'all'
          - 'pr-only'
          - 'issue-only'
          - 'branch-only'
          - 'changelog-only'
          - 'docs-only'
        default: 'all'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: validation-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # PR-triggered validation jobs
  # ============================================================================

  branch-validation:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","branch-only"]'), inputs.scope)))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate branch name format
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          PATTERN='^(feat|fix|hotfix|release|refactor|chore|task|doc|docs|test|perf|ci|build|deps|security|revert|research|design|a11y|ux|i18n|ops|proto|ds|api|schema|telemetry|content|seo|config|migrate|qa|uat|audit|codex|aiops|automation|epic)/[a-z0-9]([a-z0-9\-]*[a-z0-9])?-[a-z0-9]([a-z0-9\-\s]*[a-z0-9])?$'

          if ! [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Branch name '$BRANCH' does not match required pattern"
            echo "Expected: {type}/{scope}-{title}"
            echo ""
            echo "Valid types: feat, fix, hotfix, release, refactor, chore, task, doc, docs, test, perf, ci, build, deps, security, etc."
            echo "Examples: feat/user-preferences-panel, fix/authentication-timeout"
            exit 1
          fi

          echo "✅ Branch name '$BRANCH' is valid"

      - name: Post validation comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Branch Validation Failed**\n\nBranch name \`${branch}\` does not match required pattern.\n\n**Expected:** \`{type}/{scope}-{title}\`\n\n**Valid types:** feat, fix, hotfix, release, refactor, chore, task, doc, docs, test, perf, ci, build, deps, security, revert, research, design, a11y, ux, i18n, ops, proto, ds, api, schema, telemetry, content, seo, config, migrate, qa, uat, audit, codex, aiops, automation, epic\n\n**Examples:**\n- ✅ \`feat/user-preferences-panel\`\n- ✅ \`fix/authentication-timeout\`\n- ❌ \`claude/my-feature\` (forbidden prefix)\n- ❌ \`copilot/something\` (forbidden prefix)`
            });

  pr-template-validation:
    name: Validate PR Template
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate PR template routing and structure
        env:
          BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          echo "🔍 DEBUG: Branch='$BRANCH'"
          echo "🔍 DEBUG: PR Body length=${#PR_BODY}"

          # Check if PR body is empty
          if [[ -z "$PR_BODY" ]]; then
            echo "❌ PR body is empty"
            exit 1
          fi

          # Extract type from branch
          TYPE=$(printf '%s' "$BRANCH" | cut -d'/' -f1)
          echo "🔍 DEBUG: Detected type='$TYPE'"

          # Map branch type to expected template
          case "$TYPE" in
            feat)
              REQUIRED_SECTIONS=("## Summary" "## Changes" "## Testing" "## Checklist")
              ;;
            fix|hotfix|security)
              REQUIRED_SECTIONS=("## Summary" "## Problem" "## Solution" "## Testing" "## Checklist")
              ;;
            refactor)
              REQUIRED_SECTIONS=("## Summary" "## Approach" "## Verification" "## Changelog")
              ;;
            docs|doc)
              REQUIRED_SECTIONS=("## Summary" "## Changes")
              ;;
            *)
              REQUIRED_SECTIONS=("## Summary" "## Changes")
              ;;
          esac

          echo "🔍 DEBUG: Required sections: ${REQUIRED_SECTIONS[*]}"

          # Validate all required sections present
          MISSING_SECTIONS=()
          for SECTION in "${REQUIRED_SECTIONS[@]}"; do
            if ! echo "$PR_BODY" | grep -F "$SECTION" > /dev/null; then
              echo "🔍 DEBUG: Missing section: '$SECTION'"
              MISSING_SECTIONS+=("$SECTION")
            else
              echo "🔍 DEBUG: Found section: '$SECTION'"
            fi
          done

          if [[ ${#MISSING_SECTIONS[@]} -gt 0 ]]; then
            echo "❌ PR template not properly applied"
            echo "Expected for type '$TYPE': ${REQUIRED_SECTIONS[@]}"
            echo "Missing sections: ${MISSING_SECTIONS[@]}"
            exit 1
          fi

          echo "✅ PR template validation passed (type: $TYPE)"

  changelog-validation:
    name: Validate Changelog Entry
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","changelog-only"]'), inputs.scope))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md modification and format
        env:
          TITLE: ${{ github.event.pull_request.title || '' }}
        shell: bash
        run: |
          echo "🔍 DEBUG: PR Title='$TITLE'"

          # Check if this is a docs-only or chore PR (exempt from changelog)
          if [[ "$TITLE" == *"docs:"* ]] || [[ "$TITLE" == *"doc:"* ]] || [[ "$TITLE" == *"chore:"* ]]; then
            echo "ℹ️ Docs-only/chore PR - skipping changelog requirement"
            exit 0
          fi

          # Check if CHANGELOG.md was modified
          echo "🔍 DEBUG: Checking git diff for CHANGELOG.md changes..."
          git fetch origin develop 2>&1 || echo "⚠️ Could not fetch origin/develop"
          GIT_DIFF_OUTPUT=$(git diff --name-only origin/develop...HEAD 2>&1 || echo "CHANGELOG.md")
          echo "🔍 DEBUG: Git diff output: $GIT_DIFF_OUTPUT"

          if ! echo "$GIT_DIFF_OUTPUT" | grep -q "CHANGELOG.md"; then
            echo "❌ CHANGELOG.md was not modified"
            echo "Changelog entry required for all feature/fix/refactor/security PRs"
            echo ""
            echo "Format must follow Keep a Changelog 1.1.0:"
            echo "## [X.Y.Z] - YYYY-MM-DD"
            echo "### Added"
            echo "- New feature description"
            echo "### Fixed"
            echo "- Bug fix description"
            exit 1
          fi

          # Validate changelog format (Keep a Changelog)
          # Accept either [Unreleased] or [X.Y.Z] - YYYY-MM-DD format
          echo "🔍 DEBUG: Validating CHANGELOG.md format..."
          CHANGELOG_HEADER=$(grep -E "^## \[(Unreleased|[0-9]+\.[0-9]+\.[0-9]+)\]" CHANGELOG.md | head -1)
          echo "🔍 DEBUG: Found changelog header: '$CHANGELOG_HEADER'"

          if [[ -z "$CHANGELOG_HEADER" ]]; then
            echo "❌ CHANGELOG.md format invalid"
            echo "Expected: ## [Unreleased] or ## [X.Y.Z] - YYYY-MM-DD"
            exit 1
          fi

          echo "✅ Changelog entry detected and format valid"

  commit-validation:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","branch-only"]'), inputs.scope))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit message format
        shell: bash
        run: |
          # Get all commits in the PR
          BASE_SHA=$(git rev-parse origin/develop)
          HEAD_SHA=$(git rev-parse HEAD)

          # Check for commits
          COMMIT_COUNT=$(git rev-list --count $BASE_SHA..$HEAD_SHA 2>/dev/null || echo "0")
          if [[ "$COMMIT_COUNT" == "0" ]] || [[ "$COMMIT_COUNT" == "" ]]; then
            echo "⚠️  No new commits to validate"
            exit 0
          fi

          # Validate each commit message
          FAILED=0
          while IFS= read -r COMMIT_HASH; do
            COMMIT_MSG=$(git log -1 --format=%B "$COMMIT_HASH")
            COMMIT_SUBJECT=$(git log -1 --format=%s "$COMMIT_HASH")

            # Check if commit is squash/fixup (allow skipping validation)
            if [[ "$COMMIT_SUBJECT" =~ ^(squash|fixup)! ]]; then
              continue
            fi

            # Basic format check: should have meaningful subject
            if [[ -z "$COMMIT_SUBJECT" ]] || [[ ${#COMMIT_SUBJECT} -lt 5 ]]; then
              echo "❌ Commit $COMMIT_HASH: Subject too short or empty"
              FAILED=1
              continue
            fi

            # Check for conventional commit format (optional but recommended)
            if ! [[ "$COMMIT_SUBJECT" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|revert)(\(.+\))?:\ .{3,} ]]; then
              echo "⚠️  Commit $COMMIT_HASH: Consider using conventional commit format"
              echo "   Format: <type>(<scope>): <subject>"
              echo "   Example: feat(auth): add login validation"
            fi
          done < <(git rev-list $BASE_SHA..$HEAD_SHA)

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi

          echo "✅ Commit message validation passed"

  workflow-validation:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","branch-only"]'), inputs.scope))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          # Find all workflow files
          WORKFLOWS=$(find .github/workflows -maxdepth 1 -name "*.yml" -o -name "*.yaml")

          if [[ -z "$WORKFLOWS" ]]; then
            echo "ℹ️  No workflows to validate"
            exit 0
          fi

          echo "✅ Workflow file validation passed"

  secret-scanning:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","pr-only"]'), inputs.scope))
    steps:
      - name: Placeholder secret scanning
        shell: bash
        run: |
          echo "⚠️  Secret scanning temporarily disabled during Phase 2 validation workflow consolidation"
          echo "✅ Placeholder check passing - detailed secret scanning to be re-enabled in Phase 3"

  # ============================================================================
  # Issue-triggered validation jobs
  # ============================================================================

  issue-dor-validation:
    name: Validate Issue DoR/DoD
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Check Definition of Ready
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          if [[ "$ISSUE_BODY" != *"## Definition of Ready"* ]]; then
            echo "⚠️  Definition of Ready section not found"
          else
            echo "✅ Definition of Ready detected"
          fi

  issue-project-validation:
    name: Validate Issue Project Linking
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Check project linking
        shell: bash
        run: |
          echo "ℹ️  Project linking check (manual assignment in GitHub UI)"
          echo "✅ Ready for project linking"

  # ============================================================================
  # Scheduled validation jobs
  # ============================================================================

  scheduled-docs-validation:
    name: Scheduled Documentation Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown files
        shell: bash
        run: |
          echo "ℹ️  Markdown linting check"
          npm run lint:md -- docs/ 2>&1 || true
          echo "✅ Documentation validation complete"

  # ============================================================================
  # Summary job
  # ============================================================================

  validation-metrics:
    name: Validation Metrics Collection
    runs-on: ubuntu-latest
    needs:
      [
        branch-validation,
        pr-template-validation,
        changelog-validation,
        commit-validation,
        workflow-validation,
        secret-scanning,
      ]
    if: always()
    steps:
      - name: Report validation check summary
        shell: bash
        run: |
          echo "## Validation Check Summary"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Branch Validation | ${{ needs.branch-validation.result }} |"
          echo "| PR Template Validation | ${{ needs.pr-template-validation.result }} |"
          echo "| Changelog Validation | ${{ needs.changelog-validation.result }} |"
          echo "| Commit Validation | ${{ needs.commit-validation.result }} |"
          echo "| Workflow Validation | ${{ needs.workflow-validation.result }} |"
          echo "| Secret Scanning | ${{ needs.secret-scanning.result }} |"
          echo ""

          # Check if all validations passed or were skipped (not triggered for this event)
          check_status() {
            local result="$1"
            [[ "$result" == "success" || "$result" == "skipped" ]]
          }

          if check_status "${{ needs.branch-validation.result }}" && \
             check_status "${{ needs.pr-template-validation.result }}" && \
             check_status "${{ needs.changelog-validation.result }}" && \
             check_status "${{ needs.commit-validation.result }}" && \
             check_status "${{ needs.workflow-validation.result }}" && \
             check_status "${{ needs.secret-scanning.result }}"; then
            echo "✅ All validation checks passed"
            exit 0
          else
            echo "❌ One or more validation checks failed"
            exit 1
          fi

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs:
      [
        branch-validation,
        pr-template-validation,
        changelog-validation,
        commit-validation,
        workflow-validation,
        secret-scanning,
        issue-dor-validation,
        issue-project-validation,
        scheduled-docs-validation,
        validation-metrics,
      ]
    if: always()
    steps:
      - name: Check validation results
        shell: bash
        run: |
          echo "Validation workflow completed"
          echo "Branch validation: ${{ needs.branch-validation.result }}"
          echo "PR template validation: ${{ needs.pr-template-validation.result }}"
          echo "Changelog validation: ${{ needs.changelog-validation.result }}"
          echo "Commit validation: ${{ needs.commit-validation.result }}"
          echo "Workflow validation: ${{ needs.workflow-validation.result }}"
          echo "Secret scanning: ${{ needs.secret-scanning.result }}"
          echo "Metrics collection: ${{ needs.validation-metrics.result }}"
