name: Meta Agent Validation

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".github/agents/meta-agent/**"
      - ".github/workflows/meta-agent-validation.yml"
      - "agents/meta-agent/**"
      - "hooks/meta-agent-validate.sh"
  push:
    branches:
      - develop
    paths:
      - "agents/meta-agent/**"

concurrency:
  group: meta-agent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Meta Agent Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Meta Agent tests
        run: npm test -- agents/meta-agent --testPathPattern="meta-agent" --coverage
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Generate coverage report
        run: npm test -- agents/meta-agent --coverage --collectCoverageFrom="agents/meta-agent/skills/**/*.js" --coveragePathIgnorePatterns="test|spec"
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: meta-agent
          name: meta-agent-coverage
        if: always()

  validation:
    name: Frontmatter & Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get changed Markdown files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.md

      - name: Validate frontmatter on changed files
        run: |
          files="${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Validating frontmatter on changed files..."
          for file in $files; do
            if [ -f "$file" ] && [[ "$file" == *.md ]]; then
              echo "Checking: $file"
              node -e "
                const { validateFrontmatter } = require('./agents/meta-agent/skills/frontmatter-validation.js');
                const fs = require('fs');
                const path = require('path');

                // Detect repo type
                const { detectRepoType } = require('./agents/meta-agent/skills/repo-type-detection.js');
                const repoType = detectRepoType('.');

                // Get schema for repo type
                const schemaPath = \`./schemas/\${repoType}.frontmatter.schema.json\`;
                const schema = fs.existsSync(schemaPath)
                  ? JSON.parse(fs.readFileSync(schemaPath, 'utf8'))
                  : {};

                const result = validateFrontmatter('$file', schema);
                if (!result.valid) {
                  console.error(\`❌ \${result.errors.join('\\n')}\`);
                  process.exit(1);
                }
                console.log('✓ Valid: $file');
              "
            fi
          done
        continue-on-error: true

      - name: Report validation results
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Frontmatter Validation Failed**\n\nSome markdown files have invalid frontmatter. Please check the logs above and fix the issues.'
            })

  status-check:
    name: Meta Agent Status Check
    runs-on: ubuntu-latest
    needs: [test, validation]
    if: always()

    steps:
      - name: Check test results
        if: needs.test.result == 'failure'
        run: |
          echo "❌ Meta Agent tests failed"
          exit 1

      - name: Check validation results
        if: needs.validation.result == 'failure'
        run: |
          echo "❌ Frontmatter validation failed"
          exit 1

      - name: All checks passed
        run: |
          echo "✅ All Meta Agent checks passed"
          echo "Tests: PASS"
          echo "Validation: PASS"
          echo "Coverage: Generated"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Meta Agent Validation Passed**\n\n- All 96+ tests passing\n- Frontmatter validation successful\n- Code coverage generated\n\nReady to merge!'
            })
