name: Projects • Auto-archive completed projects

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without archiving"
        required: false
        default: "true"
        type: boolean
      project_name:
        description: "Optional: archive specific project by name (leave empty for all)"
        required: false
        type: string

  schedule:
    # Weekly check: Sunday 02:00 UTC
    - cron: "0 2 * * 0"

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  ACTIVE_PROJECTS_DIR: .github/projects/active
  ARCHIVED_PROJECTS_DIR: .github/projects/archived

jobs:
  scan-projects:
    name: Scan for completed projects
    runs-on: ubuntu-latest
    outputs:
      projects_json: ${{ steps.scan.outputs.projects_json }}
      has_completed: ${{ steps.scan.outputs.has_completed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan active projects for completion
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_FILTER: ${{ inputs.project_name || '' }}
        run: |
          set -euo pipefail
          node scripts/workflows/projects/scan-completion.cjs

  archive-projects:
    name: Archive completed projects
    needs: scan-projects
    if: needs.scan-projects.outputs.has_completed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Archive projects
        id: archive
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PROJECTS_JSON: ${{ needs.scan-projects.outputs.projects_json }}
        run: |
          set -euo pipefail
          node scripts/workflows/projects/archive-projects.cjs

      - name: Commit archival
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "lightspeed-bot"
          git config user.email "ops@lightspeedwp.agency"
          git add "${{ env.ACTIVE_PROJECTS_DIR }}" "${{ env.ARCHIVED_PROJECTS_DIR }}"
          if ! git diff --cached --quiet; then
            git commit -m "chore(projects): archive completed projects [skip ci]"
            git push origin develop
          fi

      - name: Upload archival report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-archival-report-${{ github.run_id }}
          path: |
            .github/reports/projects/archival-report-*.md

      - name: Report summary
        if: always()
        run: test -f ".github/reports/projects/archival-summary.txt" && cat ".github/reports/projects/archival-summary.txt" || true
