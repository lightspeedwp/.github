name: lint
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
jobs:
  lint:
    if: github.actor != 'imgbot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: npm ci
      - run: npm run lint:all
      - run: npm run validate:skill-manifests
      - run: npm run validate:plugins
