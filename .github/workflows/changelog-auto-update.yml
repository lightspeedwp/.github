name: Changelog • Auto-sync on develop merge

on:
  pull_request:
    branches: [develop]
    types: [closed]
    paths:
      - "CHANGELOG.md"

permissions:
  contents: write

env:
  CHANGELOG_PATH: CHANGELOG.md

jobs:
  sync-changelog:
    name: Auto-sync merged changelog entries
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Extract PR changelog entries
        id: extract
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/workflows/changelog/extract-pr-entries.cjs

      - name: Validate extracted entries
        if: steps.extract.outputs.has_entries == 'true'
        run: |
          node scripts/agents/includes/changelogUtils.cjs --validate "${{ env.CHANGELOG_PATH }}"

      - name: Merge changelog entries
        if: steps.extract.outputs.has_entries == 'true'
        env:
          PR_ENTRIES: ${{ steps.extract.outputs.entries_file }}
        run: |
          set -euo pipefail
          node scripts/workflows/changelog/merge-entries.cjs

      - name: Validate final changelog schema
        if: steps.extract.outputs.has_entries == 'true'
        run: |
          node scripts/validation/validate-changelog.cjs "${{ env.CHANGELOG_PATH }}"

      - name: Commit changelog update
        if: steps.extract.outputs.has_entries == 'true'
        run: |
          git config user.name "lightspeed-bot"
          git config user.email "ops@lightspeedwp.agency"
          git add "${{ env.CHANGELOG_PATH }}"
          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): merge entries from PR #${{ github.event.pull_request.number }} [skip ci]"
            git push origin develop
          fi

      - name: Report action
        run: |
          if [ "${{ steps.extract.outputs.has_entries }}" = "true" ]; then
            echo "✅ Changelog entries merged from PR #${{ github.event.pull_request.number }}"
          else
            echo "ℹ️  No changelog entries to merge from PR #${{ github.event.pull_request.number }}"
          fi
