name: manage-readmes
on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - '**/README.md'
jobs:
  readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update readmes/front-matter
        run: node .github/agents/manage-readmes.agent.js --verify
      - name: Validate front-matter schema
        run: |
          # TODO: replace with actual schema check
          node -e "console.log('front-matter schema check placeholder')"
      - name: Link checker
        run: |
          # TODO: replace with your link checker of choice
          npx broken-link-checker -r . || true
