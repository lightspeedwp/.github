name: changelog-validate
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    paths:
      - 'CHANGELOG.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate changelog schema
        run: |
          node .github/agents/includes/changelogUtils.js --validate CHANGELOG.md
