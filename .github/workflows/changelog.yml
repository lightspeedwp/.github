name: changelog-validate
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    paths:
      - 'CHANGELOG.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: This step depends on .github/agents/includes/changelogUtils.js, which is defined in G-2.
      # If the file does not exist, skip validation. Remove this check when G-2 is merged.
      - name: Validate changelog schema (skips if changelogUtils.js missing)
        run: |
          if [ -f .github/agents/includes/changelogUtils.js ]; then
            node .github/agents/includes/changelogUtils.js --validate CHANGELOG.md
          else
            echo "changelogUtils.js not found. Skipping changelog validation. (Depends on G-2)"
          fi
