name: Testing Unified • Unit, Integration & E2E

# TEMPORARILY DISABLED - Phase 4 skeleton workflow under development
# Remove this condition when implementation is complete (T038-T047)

on:
  push:
    branches: [develop, 'release/*']
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]
  schedule:
    # 00:30 UTC - Nightly test run
    - cron: '30 0 * * *'
    # 02:00 UTC Saturday - Extended weekend tests
    - cron: '0 2 * * 6'
    # 10:00 UTC Wednesday - Weekly E2E tests
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which test suite to run'
        required: false
        type: choice
        options:
          - 'all'
          - 'unit'
          - 'integration'
          - 'e2e'
        default: 'all'
      environment:
        description: 'Test environment'
        required: false
        type: choice
        options:
          - 'local'
          - 'staging'
        default: 'local'

permissions:
  contents: read
  checks: write

concurrency:
  group: testing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKFLOW_DISABLED: 'true' # Remove when Phase 4 implementation complete

jobs:
  # ============================================================================
  # Setup job - determine which tests to run
  # ============================================================================

  test-context:
    name: Determine Test Context
    runs-on: ubuntu-latest
    if: env.WORKFLOW_DISABLED != 'true'
    outputs:
      run-unit: ${{ steps.context.outputs.run-unit }}
      run-integration: ${{ steps.context.outputs.run-integration }}
      run-e2e: ${{ steps.context.outputs.run-e2e }}
    steps:
      - name: Determine test context
        id: context
        shell: bash
        run: |
          # Determine which tests to run based on event
          RUN_UNIT="true"
          RUN_INTEGRATION="true"
          RUN_E2E="false"

          # E2E only on release branches or explicit trigger
          if [[ "${{ github.ref }}" == "refs/heads/release/"* ]] || [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 10 * * 3" ]]; then
            RUN_E2E="true"
          fi

          # workflow_dispatch override
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SUITE="${{ inputs.test_suite }}"
            if [[ "$SUITE" != "all" ]]; then
              RUN_UNIT=$([[ "$SUITE" == "unit" ]] && echo "true" || echo "false")
              RUN_INTEGRATION=$([[ "$SUITE" == "integration" ]] && echo "true" || echo "false")
              RUN_E2E=$([[ "$SUITE" == "e2e" ]] && echo "true" || echo "false")
            fi
          fi

          echo "run-unit=$RUN_UNIT" >> $GITHUB_OUTPUT
          echo "run-integration=$RUN_INTEGRATION" >> $GITHUB_OUTPUT
          echo "run-e2e=$RUN_E2E" >> $GITHUB_OUTPUT

          echo "Test context:"
          echo "  run-unit: $RUN_UNIT"
          echo "  run-integration: $RUN_INTEGRATION"
          echo "  run-e2e: $RUN_E2E"

  # ============================================================================
  # Unit tests job
  # ============================================================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [test-context]
    if: needs.test-context.outputs.run-unit == 'true'
    strategy:
      matrix:
        node-version: ['18', '20']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --coverage
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

      - name: Report coverage
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(grep -o '"lines":[^}]*' coverage/coverage-summary.json | grep -o '[0-9.]*' | head -1)
            echo "✅ Unit test coverage: ${COVERAGE}%"
          fi

  # ============================================================================
  # Integration tests job
  # ============================================================================

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-context]
    if: needs.test-context.outputs.run-integration == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        continue-on-error: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7

      - name: Report results
        shell: bash
        run: |
          echo "✅ Integration tests completed"

  # ============================================================================
  # E2E tests job (release branches only)
  # ============================================================================

  e2e-tests:
    name: E2E Tests (Release)
    runs-on: ubuntu-latest
    needs: [test-context]
    if: needs.test-context.outputs.run-e2e == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        shell: bash
        run: |
          echo "ℹ️  E2E tests would run against staging environment"
          echo "Placeholder for E2E test execution"
        continue-on-error: true

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: e2e-results/
          retention-days: 30

  # ============================================================================
  # Coverage aggregation job
  # ============================================================================

  coverage-aggregation:
    name: Coverage Aggregation
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts

      - name: Aggregate coverage reports
        shell: bash
        run: |
          echo "Aggregating coverage reports..."

          # Find all coverage directories
          find coverage-artifacts -name "coverage-summary.json" | while read file; do
            echo "Found coverage: $file"
          done

          echo "✅ Coverage aggregation complete"

      - name: Upload aggregated coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregated-coverage-report
          path: coverage-artifacts/
          retention-days: 7

      - name: Report coverage metrics
        shell: bash
        run: |
          echo "Coverage metrics:"
          echo "  Unit tests: Check artifact for details"
          echo "  Integration tests: Check artifact for details"

  # ============================================================================
  # Artifact cleanup job
  # ============================================================================

  artifact-cleanup:
    name: Artifact Cleanup
    runs-on: ubuntu-latest
    needs: [coverage-aggregation, e2e-tests]
    if: always()
    steps:
      - name: Clean up old test artifacts
        shell: bash
        run: |
          echo "ℹ️  Artifact cleanup would run periodically"
          echo "Placeholder for old artifact cleanup logic"

  # ============================================================================
  # Summary job
  # ============================================================================

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, coverage-aggregation]
    if: always()
    steps:
      - name: Report test results
        shell: bash
        run: |
          echo "Test run summary:"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"
          echo "E2E tests: ${{ needs.e2e-tests.result }}"
          echo "Coverage aggregation: ${{ needs.coverage-aggregation.result }}"

          # Fail if any critical test failed
          if [[ "${{ needs.unit-tests.result }}" == "failure" ]] || [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "❌ Test suite failed"
            exit 1
          fi

          echo "✅ Test suite completed"
