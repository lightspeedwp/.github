name: Metrics • Weekly Summary & Report

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"

  workflow_dispatch:
    inputs:
      report_channel:
        description: "Where to post report"
        required: false
        default: "discussions"
        type: choice
        options:
          - discussions
          - wiki
          - artifact-only

permissions:
  contents: read
  discussions: write

env:
  METRICS_DIR: .github/metrics
  REPORTS_DIR: .github/reports/metrics

jobs:
  aggregate-metrics:
    name: Aggregate metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Aggregate metrics
        id: aggregate
        run: |
          set -euo pipefail
          mkdir -p "${{ env.REPORTS_DIR }}"
          node scripts/workflows/metrics/aggregate.cjs

      - name: Generate summary report
        id: report
        env:
          REPORT_DATE: ${{ steps.aggregate.outputs.report_date }}
          METRICS_JSON: ${{ steps.aggregate.outputs.metrics_json }}
        run: |
          set -euo pipefail
          node scripts/workflows/metrics/generate-report.cjs

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-metrics-report-${{ github.run_id }}
          path: |
            ${{ env.REPORTS_DIR }}/weekly-summary-*.md

      - name: Archive report
        run: |
          set -euo pipefail
          WEEK=$(date +%Y-W%V)
          ARCHIVE_DIR="${{ env.REPORTS_DIR }}/weekly"
          mkdir -p "$ARCHIVE_DIR"
          cp "${{ env.REPORTS_DIR }}/weekly-summary-latest.md" "$ARCHIVE_DIR/weekly-summary-${WEEK}.md"

      - name: Commit archival
        continue-on-error: true
        run: |
          git config user.name "lightspeed-bot"
          git config user.email "ops@lightspeedwp.agency"
          git add "${{ env.REPORTS_DIR }}" "${{ env.METRICS_DIR }}"
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): weekly summary report [skip ci]"
            git push origin develop
          fi

      - name: Output report summary
        if: always()
        run: |
          if [ -f "${{ env.REPORTS_DIR }}/weekly-summary-latest.md" ]; then
            echo "## Weekly Metrics Summary"
            head -30 "${{ env.REPORTS_DIR }}/weekly-summary-latest.md"
            echo ""
            echo "Full report: ${{ env.REPORTS_DIR }}/weekly-summary-latest.md"
          fi

  post-to-discussions:
    name: Post report to discussions
    needs: aggregate-metrics
    if: |
      success() && (
        github.event_name == 'schedule' ||
        github.event.inputs.report_channel == 'discussions'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Read report
        id: read_report
        run: |
          set -euo pipefail
          REPORT_FILE="${{ env.REPORTS_DIR }}/weekly-summary-latest.md"
          if [ -f "$REPORT_FILE" ]; then
            {
              echo "content<<EOF"
              cat "$REPORT_FILE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Report file not found"
            exit 1
          fi

      - name: Post to discussions
        if: steps.read_report.outputs.content != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `Weekly Metrics Summary — ${new Date().toISOString().split('T')[0]}`;
            const body = `${{ steps.read_report.outputs.content }}

---

*Generated by metrics-summary workflow. [View full reports](${{ github.server_url }}/${{ github.repository }}/tree/develop/.github/reports/metrics/)*`;

            try {
              const { data } = await github.rest.discussions.createDiscussion({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                category_id: 'general', // Adjust based on your category ID
              });
              console.log(`Posted discussion: ${data.html_url}`);
            } catch (err) {
              console.warn(`Failed to post discussion: ${err.message}`);
            }
