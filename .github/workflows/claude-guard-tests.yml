name: Claude Guard Tests

# Spec 018 FR-023: run the branch guard, SessionStart and spec 018 contract
# tests on every PR, so a change that breaks the guard can't merge with green
# CI. The workflow runs on every PR (a path filter would leave a required check
# pending forever on PRs that don't match) and exits early when nothing
# relevant changed.
on:
  pull_request:
    branches:
      - develop
      - main
  # The documentation tells Owners to add this check to the required status
  # checks, and the rulesets carry a merge-queue rule. A check that only runs on
  # pull_request is never reported for a merge-queue batch, so the requirement
  # would sit unsatisfied and block every queued merge. merge_group fires when a
  # batch enters the queue, which is where the check has to be reported.
  merge_group:
    branches:
      - develop
      - main

# Read-only: the tests only read the checkout and spawn local processes.
permissions:
  contents: read

concurrency:
  # A merge-queue event has no pull_request, so its number is empty. Falling back to
  # the merge_group head SHA gives each batch its own group; without that every
  # queued batch shared `claude-guard-tests-`, and cancel-in-progress meant each new
  # batch cancelled the run of the one before it.
  group: claude-guard-tests-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  guard-tests:
    name: Claude guard contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for guard-related changes
        id: changes
        env:
          # A merge-queue event has no pull_request, so the base falls back to the
          # event's own SHA and the comparison runs against the merge commit's first
          # parent, which is the base the batch was built on.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # The file list is captured before it is matched. Piping git diff
          # straight into grep -q means grep exits at its first match, git diff
          # takes SIGPIPE and exits 141, and `set -o pipefail` turns that into a
          # failed pipeline. The `if` then takes the else branch and the required
          # check reports success having run nothing. That is reachable: any
          # change set larger than the pipe buffer trips it, and this repository
          # has pull requests that change well over a thousand files.
          #
          # A git diff that fails outright — a missing BASE_SHA, say — has to fail
          # the step rather than look like "no relevant changes", so its status is
          # checked explicitly and the step exits non-zero.
          if ! changed="$(git diff --name-only "$BASE_SHA"...HEAD)"; then
            echo "Could not list changed files against $BASE_SHA." >&2
            exit 1
          fi
          if printf '%s\n' "$changed" |
            grep -qE '^(\.claude/|scripts/__tests__/(enforce-branch-name-hook|session-start-hook|setup-node-install)\.test\.js$|scripts/__tests__/helpers/|tests/js/claude-cloud-environment-docs\.test\.js$|\.github/specs/(CATALOG\.md|018-claude-cloud-environment/)|docs/CLAUDE_CLOUD_ENVIRONMENT\.md$|lib/validate-branch-name\.js$|\.github/workflows/claude-guard-tests\.yml$|package\.json$|package-lock\.json$|^\.nvmrc$|^\.jest\.config\.cjs$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No guard-related changes; nothing to test."
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The hooks need git and bash, which ubuntu-latest provides. jq is not required:
    # session-start.sh reads its input without it, and a test runs the hook with no
    # jq on PATH so that stays true.
      - name: Run contract tests
        if: steps.changes.outputs.run == 'true'
        env:
          JEST_COLLECT_COVERAGE: 'false'
        run: >-
          npx jest -c .jest.config.cjs
          scripts/__tests__/enforce-branch-name-hook.test.js
          scripts/__tests__/session-start-hook.test.js
          scripts/__tests__/setup-node-install.test.js
          tests/js/claude-cloud-environment-docs.test.js
