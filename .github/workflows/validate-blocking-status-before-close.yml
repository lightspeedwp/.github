name: Validate Blocking Status Before Close

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  validate-blocking-before-close:
    if: github.event.issue.state_reason != 'not_planned'
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue has unclosed blockers
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- validate-blocking-status -->';
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check for force-close override
            const hasForceClose = (issue.labels || []).some(
              (label) => label.name === 'meta:force-close'
            );

            if (hasForceClose) {
              core.info(`Issue #${issue.number} has meta:force-close label; allowing close despite blocking.`);
              return;
            }

            // Extract blocked-by references from issue body (safely by only extracting numbers)
            const blockedByRefs = [];
            const blockedByPattern = /^-\s+Blocked by:\s+(.+)$/m;
            const blockedByMatch = body.match(blockedByPattern);

            if (!blockedByMatch) {
              core.info(`Issue #${issue.number} is not blocked by any other issues.`);
              return;
            }

            // Parse blocked-by issue numbers using regex (safe: only extracts numbers)
            const blockedByText = blockedByMatch[1];
            const refMatches = blockedByText.matchAll(/#(\d+)/g);

            for (const match of refMatches) {
              const issueNum = Number(match[1]);
              if (Number.isInteger(issueNum) && issueNum > 0) {
                blockedByRefs.push(issueNum);
              }
            }

            if (blockedByRefs.length === 0) {
              core.info(`Issue #${issue.number} has no valid blocked-by references.`);
              return;
            }

            core.info(`Issue #${issue.number} is blocked by: ${blockedByRefs.join(', ')}`);

            // Check if any blockers are still open
            const openBlockers = [];

            for (const blockerNum of blockedByRefs) {
              try {
                const { data: blocker } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: blockerNum,
                });

                if (blocker.state === 'open') {
                  openBlockers.push(blockerNum);
                }
              } catch (error) {
                core.warning(`Could not check status of blocker #${blockerNum}: ${error.message}`);
              }
            }

            if (openBlockers.length === 0) {
              core.info(`Issue #${issue.number} has no open blockers; allowing close.`);
              return;
            }

            // Issue has unclosed blockers; post guidance and label
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker),
            );

            const message = [
              marker,
              '⚠️ This issue was closed but has unclosed blockers.',
              '',
              `**Unclosed blockers found:** ${openBlockers.map((n) => `#${n}`).join(', ')}`,
              '',
              'An issue that is blocked by other issues should not be closed until its blockers are resolved.',
              '',
              '**To close this issue:**',
              '1. Resolve or close the blocking issues listed above',
              '2. Close this issue again',
              '',
              '**To force close this issue despite blockers:**',
              '- Add the `meta:force-close` label',
              '- The system will then allow closure',
              '',
              'For more information on blocking relationships, see the metadata governance documentation.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message,
              });
            }

            // Add status:blocked label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['status:blocked'],
            });

            core.setFailed(
              `Issue #${issue.number} re-opened: Unclosed blockers found (${openBlockers.join(', ')}). Add 'meta:force-close' label to override.`,
            );
