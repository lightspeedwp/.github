name: "Batch Label PRs"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview labels without applying"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      pr_number:
        description: "Label specific PR (leave empty to label all open PRs)"
        required: false
        type: string

jobs:
  batch-label:
    name: Apply labels to open PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || true

      - name: Run batch labeling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ inputs.pr_number }}" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              node scripts/batch-label-prs.js --dry-run
            else
              node scripts/batch-label-prs.js
            fi
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              node scripts/batch-label-prs.js --dry-run --pr=${{ inputs.pr_number }}
            else
              node scripts/batch-label-prs.js --pr=${{ inputs.pr_number }}
            fi
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-label-logs
          path: |
            labeling-report.json
          retention-days: 30
