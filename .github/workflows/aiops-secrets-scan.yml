name: AIOps — Secrets/PII Scan
# Scans for secrets, credentials, and PII in code using Gitleaks
#
# Setup required:
# 1. Add GITLEAKS_LICENSE secret to GitHub (required for organization repos)
#    Get a free license at: https://gitleaks.io
# 2. Ensure GITHUB_TOKEN permissions allow SARIF uploads (automatic)
#
# The workflow will:
# - Scan all commits for secrets/credentials
# - Upload results to GitHub Security tab (SARIF format)
# - Comment on PRs with findings (if any)

on:
  pull_request:
    paths:
      - ".github/**"
      - "docs/**"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
