name: AIOps — Secrets/PII Scan

on:
  pull_request:
    paths:
      - ".github/**"
      - "docs/**"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect -v --source . --report-format sarif --report-path gitleaks.sarif
