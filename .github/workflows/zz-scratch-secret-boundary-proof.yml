# SCRATCH PROBE - temporary, deleted after evidence is captured.
# Nonce: PROOF-7QK2
#
# Purpose: show which workflow DEFINITION GitHub executes for a
# same-repository pull_request run, and whether a repository secret is
# reachable from the secret context of such a run.
#
# This file exists ONLY on the scratch branch. If this job runs, the
# definition GitHub executed came from the pull request branch.
name: ZZ Scratch Secret Boundary Proof

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  proof-pr-controlled-definition-ran:
    name: PROOF-PR-CONTROLLED-DEFINITION-RAN-PROOF-7QK2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report the definition and ref that actually executed
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          HEAD_REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.head.repo.full_name }}
          # Presence only. The value is never printed, hashed or measured.
          SECRET_PRESENT: ${{ secrets.LINEAR_API_KEY != '' }}
        run: |
          {
            echo "### Scratch probe PROOF-7QK2"
            echo
            echo "| key | value |"
            echo "| --- | --- |"
            echo "| event_name | \`$EVENT_NAME\` |"
            echo "| workflow_ref | \`$WORKFLOW_REF\` |"
            echo "| workflow_sha | \`$WORKFLOW_SHA\` |"
            echo "| github.ref (GITHUB_REF) | \`$HEAD_REF\` |"
            echo "| github.sha (GITHUB_SHA) | \`$HEAD_SHA\` |"
            echo "| pr head sha | \`$PR_HEAD_SHA\` |"
            echo "| pr head repo | \`$PR_MERGE_SHA\` |"
            echo "| repository secret LINEAR_API_KEY present in context | \`$SECRET_PRESENT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PROOF-7QK2 event=$EVENT_NAME"
          echo "PROOF-7QK2 workflow_ref=$WORKFLOW_REF"
          echo "PROOF-7QK2 github_ref=$HEAD_REF"
          echo "PROOF-7QK2 repo_secret_present=$SECRET_PRESENT"
