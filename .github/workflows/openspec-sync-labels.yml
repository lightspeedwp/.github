name: OpenSpec Sync Labels
on:
  issues:
    types:
      - labeled
      - unlabeled
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Perform a dry run (no changes)"
        required: false
        default: "true"

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    name: Sync OpenSpec Labels
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync OpenSpec labels
        run: |
          node scripts/automation/handlers/handle-issue-labeled.js \
            --issue=${{ github.event.issue.number }} \
            --label=${{ github.event.label.name }} \
            --dry-run=${{ github.event.inputs.dry_run || 'false' }} \
            --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log sync results
        if: always()
        run: |
          echo "Label sync completed"
          echo "Issue: ${{ github.event.issue.number }}"
          echo "Label: ${{ github.event.label.name }}"
