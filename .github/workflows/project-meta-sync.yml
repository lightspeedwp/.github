name: Projects • Add & Sync meta from labels

on:
  push:
    branches: [develop]
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  pull_request:
    branches: [develop]
    types:
      [
        opened,
        edited,
        labeled,
        unlabeled,
        reopened,
        ready_for_review,
        synchronize,
        closed,
      ]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PROJECT_URL: ${{ vars.LS_PROJECT_URL }}
  SLA_WARN_DAYS: "7"
  SLA_BREACH_DAYS: "14"

jobs:
  add-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight project sync configuration
        id: preflight
        env:
          APP_ID: ${{ vars.LS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.LS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          enabled="true"
          reason=""

          if [ -z "${PROJECT_URL:-}" ]; then
            enabled="false"
            reason="LS_PROJECT_URL is not configured"
          elif [ -z "${APP_ID:-}" ] || [ -z "${APP_PRIVATE_KEY:-}" ]; then
            enabled="false"
            reason="LS_APP_ID and/or LS_APP_PRIVATE_KEY is missing"
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "::notice::$reason; skipping project meta sync."
          fi

      - name: Create GitHub App installation token
        id: app-token
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LS_APP_ID }}
          private-key: ${{ secrets.LS_APP_PRIVATE_KEY }}

      - name: Add item to project (new issues/PRs)
        id: addp
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Derive Status/Priority/Type from labels & branch
        id: derive
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issues" ]; then
            NUMBER=${{ github.event.issue.number }}
            LABELS=$(gh issue view $NUMBER --json labels --jq '.labels[].name')
          else
            NUMBER=${{ github.event.pull_request.number }}
            LABELS=$(gh pr view $NUMBER --json labels --jq '.labels[].name')
          fi

          STATUS=""
          echo "$LABELS" | grep -q '^status:in-progress' && STATUS='In progress'
          echo "$LABELS" | grep -q '^status:needs-review' && STATUS='In review'
          echo "$LABELS" | grep -q '^status:needs-qa' && STATUS='In QA'
          echo "$LABELS" | grep -q '^status:blocked' && STATUS='Blocked'
          echo "$LABELS" | grep -q '^status:ready' && STATUS='Ready'
          if [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.action }}" = "closed" ]; then STATUS='Done'; fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "closed" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then STATUS='Done'; fi
          [ -z "$STATUS" ] && STATUS='Triage'

          PRIORITY=""
          echo "$LABELS" | grep -q '^priority:critical'  && PRIORITY='Critical'
          echo "$LABELS" | grep -q '^priority:important' && PRIORITY='Important'
          echo "$LABELS" | grep -q '^priority:normal'    && PRIORITY='Normal'
          echo "$LABELS" | grep -q '^priority:minor'     && PRIORITY='Minor'

          TYPE=""
          HEAD="$HEAD_REF"
          if [ -n "$HEAD" ]; then
            case "$HEAD" in
              feat/*)           TYPE='Feature'       ;;
              fix/*)            TYPE='Bug'           ;;
              doc/*|docs/*)     TYPE='Documentation' ;;
              chore/*|build/*)  TYPE='Task'          ;;
            esac
          fi

          echo "status=$STATUS"    >> $GITHUB_OUTPUT
          echo "priority=$PRIORITY" >> $GITHUB_OUTPUT
          echo "type=$TYPE"         >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}

      - name: Update project fields
        if: steps.preflight.outputs.enabled == 'true' && steps.addp.outputs.itemId != ''
        uses: titoportas/update-project-fields@v0.1.0
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ steps.app-token.outputs.token }}
          item-id: ${{ steps.addp.outputs.itemId }}
          field-keys: Status,Priority,Type
          field-values: ${{ steps.derive.outputs.status }},${{ steps.derive.outputs.priority }},${{ steps.derive.outputs.type }}

      - name: Add or update aging and SLA annotation
        if: steps.preflight.outputs.enabled == 'true' && github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          SLA_WARN_DAYS: ${{ env.SLA_WARN_DAYS }}
          SLA_BREACH_DAYS: ${{ env.SLA_BREACH_DAYS }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- project-meta-sync:sla -->";
            const isIssue = context.eventName === "issues";
            const number = isIssue ? context.payload.issue.number : context.payload.pull_request.number;
            const createdAt = new Date(
              isIssue ? context.payload.issue.created_at : context.payload.pull_request.created_at,
            );
            const now = new Date();
            const ageDays = Math.floor((now - createdAt) / (1000 * 60 * 60 * 24));
            const warnDays = Number(process.env.SLA_WARN_DAYS || "7");
            const breachDays = Number(process.env.SLA_BREACH_DAYS || "14");

            let slaState = "Within SLA";
            if (ageDays >= breachDays) slaState = "SLA breached";
            else if (ageDays >= warnDays) slaState = "SLA risk";

            const body = `${marker}
            ## ⏱️ Aging and SLA annotation
            - Age: **${ageDays} day(s)**
            - SLA state: **${slaState}**
            - Thresholds: warn at ${warnDays} days, breach at ${breachDays} days
            - Last updated: ${now.toISOString()}

            _Maintained by project-meta-sync workflow._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) =>
                c.user?.type === "Bot" &&
                typeof c.body === "string" &&
                c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated SLA annotation on #${number}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body,
              });
              core.info(`Created SLA annotation on #${number}`);
            }
