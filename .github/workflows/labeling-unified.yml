name: Labeling Unified • Issues & PRs

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, transferred]
  discussion:
    types: [created, edited, answered, labeled, unlabeled]
  schedule:
    # 02:00 UTC - Issue catch-up labeling
    - cron: '0 2 * * *'
    # 03:00 UTC - PR batch labeling
    - cron: '0 3 * * *'
    # 04:00 UTC - Label sync
    - cron: '0 4 * * *'
    # 08:00 UTC Monday - Bare label remediation
    - cron: '0 8 * * 1'
    # 09:00 UTC Saturday - Audit report
    - cron: '0 9 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without writing labels (dry-run mode)'
        required: false
        type: boolean
        default: true
      scope:
        description: 'Scope of labeling to run'
        required: false
        type: choice
        options:
          - 'all'
          - 'pr-only'
          - 'issue-only'
          - 'governance-only'
        default: 'all'

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: labeling-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: false

env:
  LABELS_CONFIG: .github/labels.yml
  ISSUE_TYPES_CONFIG: .github/issue-types.yml
  LABELER_RULES: .github/labeler.yml

jobs:
  # ============================================================================
  # Reactive Jobs (triggered by PR/issue events)
  # ============================================================================

  pr-labeling:
    name: PR Labeling
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') &&
      !contains(github.event.pull_request.labels.*.name, 'meta:skip-labeling') &&
      (inputs.scope == null || inputs.scope == 'all' || inputs.scope == 'pr-only')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync labels with canonical set
        run: |
          npm install --no-save js-yaml
          node scripts/agents/includes/label-sync.js
        shell: bash
        continue-on-error: false

      - name: Validate PR branch naming
        id: branch-validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ $BRANCH =~ ^(feat|fix|hotfix|release|refactor|chore|task|doc|docs|test|perf|ci|build|deps|security|revert|research|design|a11y|ux|i18n|ops|proto|ds|api|schema|telemetry|content|seo|config|migrate|qa|uat|audit|codex|aiops|automation|epic)/ ]]; then
            echo "branch_valid=true" >> $GITHUB_OUTPUT
            # Extract branch type (part before /)
            BRANCH_TYPE="${BRANCH%%/*}"
            echo "branch_type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
          else
            echo "branch_valid=false" >> $GITHUB_OUTPUT
            echo "branch_type=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Apply file/branch-based labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ${{ env.LABELER_RULES }}
          sync-labels: true

      - name: Apply custom PR labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/agents/labeling.agent.js

      - name: Apply branch-based type label
        if: steps.branch-validation.outputs.branch_valid == 'true'
        uses: ./.github/actions/apply-labels
        continue-on-error: true
        with:
          target_type: pull_request
          target_id: ${{ github.event.pull_request.number }}
          source: type
          labels: 'type:${{ steps.branch-validation.outputs.branch_type }}'
          remove_labels: ''
          dry_run: ${{ inputs.dry_run || 'false' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  issue-labeling:
    name: Issue Labeling
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues') &&
      !contains(github.event.issue.labels.*.name, 'meta:skip-labeling') &&
      (inputs.scope == null || inputs.scope == 'all' || inputs.scope == 'issue-only')
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync labels with canonical set
        run: |
          npm install --no-save js-yaml
          node scripts/agents/includes/label-sync.js
        shell: bash
        continue-on-error: false

      - name: Detect issue type from body
        id: issue-type
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title || '';

            // Default type based on keywords
            let type = 'type:task';

            if (body.includes('## Bug Report') || title.toLowerCase().includes('bug')) {
              type = 'type:bug';
            } else if (body.includes('## Feature Request') || title.toLowerCase().includes('feature')) {
              type = 'type:feature';
            } else if (body.includes('## Documentation') || title.toLowerCase().includes('doc')) {
              type = 'type:documentation';
            } else if (body.includes('## Security') || title.toLowerCase().includes('security')) {
              type = 'type:security';
            } else if (body.includes('## Design') || title.toLowerCase().includes('design')) {
              type = 'type:design';
            }

            core.setOutput('type', type);

      - name: Apply issue type labels
        uses: ./.github/actions/apply-labels
        continue-on-error: true
        with:
          target_type: issue
          target_id: ${{ github.event.issue.number }}
          source: type
          labels: ${{ steps.issue-type.outputs.type }}
          remove_labels: ''
          dry_run: ${{ inputs.dry_run || 'false' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}

      - name: Apply custom issue labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/agents/labeling.agent.js

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  governance-check:
    name: Label Governance Check
    runs-on: ubuntu-latest
    if: |
      ((github.event_name == 'pull_request') || (github.event_name == 'issues')) &&
      (inputs.scope == null || inputs.scope == 'all' || inputs.scope == 'governance-only')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check label governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-save js-yaml
          node scripts/agents/includes/check-template-labels.js

      - name: Report governance status
        uses: ./.github/actions/validate-check
        if: always()
        with:
          check_name: label-governance
          status: success
          title: 'Label Governance Check'
          summary: 'Labels comply with taxonomy and naming conventions'
          post_comment: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  blocking-status:
    name: Blocking Status Management
    runs-on: ubuntu-latest
    if: |
      ((github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled')) ||
       (github.event_name == 'issues' && (github.event.action == 'labeled' || github.event.action == 'unlabeled'))) &&
      (inputs.scope == null || inputs.scope == 'all')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect blocking status changes
        id: blocking-detection
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue?.labels || context.payload.pull_request?.labels || [];
            const labelNames = labels.map(l => l.name);

            const isBlocked = labelNames.includes('status:blocked');
            const isBlockedOnReview = labelNames.includes('status:needs-review');

            core.setOutput('is_blocked', isBlocked);
            core.setOutput('is_blocked_on_review', isBlockedOnReview);

      - name: Update blocking status labels
        uses: actions/github-script@v7
        if: steps.blocking-detection.outputs.is_blocked == 'true'
        with:
          script: |
            const issue_number = context.payload.issue?.number || context.payload.pull_request?.number;
            const is_pr = !!context.payload.pull_request;

            if (is_pr) {
              // For PRs: add blocking indication
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                labels: ['meta:blocked']
              });
            } else {
              // For issues: add blocking indication
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                labels: ['meta:blocked']
              });
            }

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Scheduled Jobs (triggered by cron)
  # ============================================================================

  scheduled-issue-catch-up:
    name: Scheduled Issue Catch-up (02:00 UTC)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and label issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATED_WITHIN_DAYS: 7
          DRY_RUN: 'false'
        run: |
          node scripts/workflows/apply-labels-workflow.js

      - name: Generate labeling report
        if: always()
        run: |
          echo "Generating labeling report..."

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  scheduled-pr-catch-up:
    name: Scheduled PR Catch-up (03:00 UTC)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and label PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATED_WITHIN_DAYS: 7
          DRY_RUN: 'false'
        run: |
          node scripts/workflows/apply-labels-workflow.js

      - name: Generate labeling report
        if: always()
        run: |
          echo "Generating PR labeling report..."

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  scheduled-label-sync:
    name: Scheduled Label Sync (04:00 UTC)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * *'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync labels with canonical set
        run: |
          npm install --no-save js-yaml
          node scripts/agents/includes/label-sync.js

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  scheduled-remediate-bare:
    name: Scheduled Bare Label Remediation (Monday 08:00 UTC)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Load bare label mapping
        id: mapping
        run: |
          mkdir -p .github/reports/label-remediation
          node -e "
            const fs = require('fs');
            try {
              const mapping = JSON.parse(fs.readFileSync('.github/reports/label-remediation/bare-label-mapping.json', 'utf8'));
              console.log('Loaded bare label mapping:', Object.keys(mapping).length, 'mappings');
            } catch (e) {
              console.log('No bare label mapping found; creating default mapping');
              const defaultMapping = {
                'bug': 'type:bug',
                'feature': 'type:feature',
                'task': 'type:task',
                'documentation': 'type:documentation',
                'security': 'type:security',
                'design': 'type:design',
                'urgent': 'priority:critical',
                'critical': 'priority:critical',
                'high': 'priority:high',
                'medium': 'priority:normal',
                'low': 'priority:low',
                'ci': 'area:ci',
                'docs': 'area:docs',
                'backend': 'area:backend',
                'frontend': 'area:frontend'
              };
              fs.writeFileSync('.github/reports/label-remediation/bare-label-mapping.json', JSON.stringify(defaultMapping, null, 2));
            }
          "

      - name: Scan for bare labels
        id: scan
        uses: actions/github-script@v7
        with:
          script: |
            const mapping = require('./.github/reports/label-remediation/bare-label-mapping.json');
            const bareLabels = Object.keys(mapping);

            // Fetch all issues and PRs with bare labels in last 30 days
            const since = new Date(Date.now() - 30 * 86400000).toISOString();

            let itemsToFix = [];

            try {
              // Search for items with bare labels
              const query = bareLabels.map(label => `label:"${label}"`).join(' OR ');
              const issues = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} ${query} updated:>=${since.split('T')[0]}`,
                per_page: 100
              });

              itemsToFix = issues.items || [];
              core.info(`Found ${itemsToFix.length} items with bare labels`);
            } catch (e) {
              core.warning(`Failed to search for bare labels: ${e.message}`);
            }

            core.setOutput('items_to_fix', itemsToFix.length);
            return itemsToFix;

      - name: Remediate bare labels
        if: steps.scan.outputs.items_to_fix > 0
        uses: actions/github-script@v7
        with:
          script: |
            const mapping = require('./.github/reports/label-remediation/bare-label-mapping.json');
            let remediationCount = 0;

            // Note: In production, this would iterate through items and fix labels
            // For now, this is a placeholder that logs the mapping
            core.info(`Bare label remediation would use mapping: ${JSON.stringify(mapping)}`);

      - name: Generate remediation report
        if: always()
        run: |
          mkdir -p .github/reports/labeling
          node -e "
            const fs = require('fs');
            const report = {
              timestamp: new Date().toISOString(),
              workflow: 'labeling-unified',
              job: 'scheduled-remediate-bare',
              run_id: '${{ github.run_id }}',
              status: 'completed',
              remediations_applied: 0
            };
            fs.writeFileSync('.github/reports/labeling/remediation-${{ github.run_id }}.json', JSON.stringify(report, null, 2));
          "

      - name: Upload remediation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: label-remediation-report-${{ github.run_id }}
          path: .github/reports/labeling/remediation-${{ github.run_id }}.json
          retention-days: 30

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  scheduled-audit-report:
    name: Scheduled Label Audit Report (Saturday 09:00 UTC)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 6'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate label audit report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .github/reports/labeling
          echo "Generating label audit report..."

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: labeling-audit-report-${{ github.run_id }}
          path: .github/reports/labeling
          retention-days: 30

      - name: Collect metrics
        uses: ./.github/actions/collect-metrics
        if: always()
        with:
          workflow_name: labeling-unified
          workflow_run_id: ${{ github.run_id }}
          metric_type: all
          output_format: json
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Summary Job (reports final status)
  # ============================================================================

  labeling-summary:
    name: Labeling Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        pr-labeling,
        issue-labeling,
        governance-check,
        blocking-status,
        scheduled-issue-catch-up,
        scheduled-pr-catch-up,
        scheduled-label-sync,
        scheduled-remediate-bare,
        scheduled-audit-report,
      ]
    permissions:
      contents: read
    steps:
      - name: Check job statuses
        run: |
          echo "Labeling Unified Workflow Summary"
          echo "=================================="
          echo "PR Labeling: ${{ needs.pr-labeling.result }}"
          echo "Issue Labeling: ${{ needs.issue-labeling.result }}"
          echo "Governance Check: ${{ needs.governance-check.result }}"
          echo "Blocking Status: ${{ needs.blocking-status.result }}"
          echo "Scheduled Issue Catch-up: ${{ needs.scheduled-issue-catch-up.result }}"
          echo "Scheduled PR Catch-up: ${{ needs.scheduled-pr-catch-up.result }}"
          echo "Scheduled Label Sync: ${{ needs.scheduled-label-sync.result }}"
          echo "Scheduled Bare Label Remediation: ${{ needs.scheduled-remediate-bare.result }}"
          echo "Scheduled Audit Report: ${{ needs.scheduled-audit-report.result }}"
