name: Labeling • Unified

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Issues and discussions react to content, not label changes (#3531): a
  # bulk relabel queued ~660 runs, and each re-applied default labels from
  # a stale payload, undoing the manual changes.
  issues:
    types: [opened, edited, reopened]
  discussion:
    types: [created, edited, answered]
  schedule:
    # Staggered off the 02:00/03:00/04:00 cluster cited in the archival manifest.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing labels"
        required: false
        default: "true"

permissions:
  contents: read

# One group per item and action (#3531): github.event.number exists only on
# PR events, so every issue event had its own group. A group holds one
# running and one pending run, and a newer pending run replaces the older
# one, so a burst of edits collapses. The action is part of the key so an
# `edited` run never replaces a pending `opened` run (which applies the
# triage label). Running jobs are never cancelled mid-apply.
concurrency:
  group: labeling-unified-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.discussion.number || github.run_id }}
  cancel-in-progress: false

env:
  LABELS_CONFIG: .github/labels.yml
  LABELER_RULES: .github/labeler.yml

jobs:
  validate:
    name: Validate configs (read-only)
    # Configs change only through PRs; issue and discussion runs skip it.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Validate labeling configs
        run: node scripts/validation/validate-labeling-configs.cjs
      - name: Guardrail — unknown labels in templates
        run: node scripts/validation/validate-labels-before-creation.cjs
        continue-on-error: true

  file-labels:
    name: File/branch labels (PRs)
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'meta:skip-labeling')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ${{ env.LABELER_RULES }}
          sync-labels: true

  issue-labels:
    name: Issue labels by type (T018)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    # Triage label only for new issues, never on later edits (#3531).
    if: >-
      !cancelled() && needs.validate.result != 'failure' &&
      github.event_name == 'issues' && github.event.action == 'opened' &&
      github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Apply status triage label via composite action (T020)
        uses: ./.github/actions/apply-labels
        with:
          labels: "status:needs-triage"
          issue-number: ${{ github.event.issue.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect metrics (T021)
        uses: ./.github/actions/collect-metrics
        with:
          workflow-name: labeling-unified
          job-name: issue-labels
          metrics-file: issue-labels-metrics.json

  scheduled-cleanup:
    name: Scheduled label cleanup (T019)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - run: npm ci --ignore-scripts
      - name: Audit report (read-only, dry-run safe)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "true"
        run: node scripts/agents/run-labeling-agent.js
        continue-on-error: true
      - name: Collect metrics (T021)
        uses: ./.github/actions/collect-metrics
        with:
          workflow-name: labeling-unified
          job-name: scheduled-cleanup
          metrics-file: scheduled-cleanup-metrics.json

  agent-labels:
    name: Labeling agent (issues/PRs)
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: >-
      !cancelled() && needs.validate.result != 'failure' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip labeling]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Run labeling agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/agents/run-labeling-agent.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labeling-report-${{ github.run_id }}
          path: .github/reports/labeling/
          if-no-files-found: ignore
