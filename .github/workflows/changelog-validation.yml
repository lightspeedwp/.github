name: Changelog Quality Validation

on:
  pull_request:
    paths:
      - 'CHANGELOG.yml'
      - 'CHANGELOG.md'
      - 'agents/changelog/**'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-changelog:
    runs-on: ubuntu-latest
    outputs:
      validation-result: ${{ steps.validate.outputs.result }}
      passed: ${{ steps.validate.outputs.passed }}
      failed: ${{ steps.validate.outputs.failed }}
      warnings: ${{ steps.validate.outputs.warnings }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'agents/changelog/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix agents/changelog

      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            CHANGELOG.yml
            CHANGELOG.md

      - name: Validate changelog entries
        id: validate
        run: |
          cd agents/changelog

          if [ "${{ steps.changed-files.outputs.any_changed }}" == "false" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "warnings=0" >> $GITHUB_OUTPUT
            echo "result=No changelog files modified in this PR" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Run validation and capture results
          RESULT=$(npm run validate:changelog -- --json 2>&1 || true)

          # Extract counts
          PASSED=$(echo "$RESULT" | grep -o '"passed": *[0-9]*' | head -1 | grep -o '[0-9]*' || echo "0")
          FAILED=$(echo "$RESULT" | grep -o '"failed": *[0-9]*' | head -1 | grep -o '[0-9]*' || echo "0")
          WARNINGS=$(echo "$RESULT" | grep -o '"warnings": *[0-9]*' | head -1 | grep -o '[0-9]*' || echo "0")

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

          # Determine if validation passed
          if [ "$FAILED" -gt 0 ]; then
            echo "result=FAILED" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "result=PASSED" >> $GITHUB_OUTPUT
            exit 0
          fi
        continue-on-error: true

      - name: Format PR comment
        id: comment
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          PASSED=${{ steps.validate.outputs.passed }}
          FAILED=${{ steps.validate.outputs.failed }}
          WARNINGS=${{ steps.validate.outputs.warnings }}

          # Build comment markdown
          cat > /tmp/comment.md << 'EOF'
          ## 📋 Changelog Quality Validation

          ### Summary

          | Metric | Count |
          |--------|-------|
          | ✅ Passing | $PASSED |
          | ⚠️ Warnings | $WARNINGS |
          | ❌ Failing | $FAILED |

          ### Status

          EOF

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ **Validation FAILED** - Please fix the issues below before merging" >> /tmp/comment.md
            echo "All changelog entries must pass validation to maintain quality standards." >> /tmp/comment.md
          elif [ "$WARNINGS" -gt 0 ]; then
            echo "⚠️ **Validation CONDITIONAL PASS** - $WARNINGS warning(s) detected" >> /tmp/comment.md
            echo "Review the warnings and consider addressing them for better quality." >> /tmp/comment.md
          else
            echo "✅ **Validation PASSED** - All entries meet quality standards" >> /tmp/comment.md
          fi

          echo "" >> /tmp/comment.md
          echo "### How to Fix" >> /tmp/comment.md
          echo "" >> /tmp/comment.md
          echo "Run locally:" >> /tmp/comment.md
          echo "\`\`\`bash" >> /tmp/comment.md
          echo "cd agents/changelog" >> /tmp/comment.md
          echo "npm run validate:changelog" >> /tmp/comment.md
          echo "\`\`\`" >> /tmp/comment.md
          echo "" >> /tmp/comment.md
          echo "See [Changelog Quality Audit](../docs/CHANGELOG_QUALITY_AUDIT.md) for details." >> /tmp/comment.md

          # Save comment content
          COMMENT_BODY=$(cat /tmp/comment.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ steps.comment.outputs.body }}
        with:
          script: |
            const body = process.env.COMMENT_BODY;

            // Find existing validation comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Changelog Quality Validation')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Request reviewer if validation failed
        if: steps.validate.outputs.failed > 0 && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            core.notice('Validation failed - release manager approval required before merge');

      - name: Create audit log entry
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        run: |
          mkdir -p .github/reports/validation-audits

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DATE_STR=$(date +%Y%m%d)
          FILENAME="${DATE_STR}_$(date +%s).json"
          FILEPATH=".github/reports/validation-audits/$FILENAME"

          cat > "$FILEPATH" << 'EOF'
          {
            "timestamp": "$TIMESTAMP",
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "pr_number": ${{ github.event.pull_request.number }},
            "pr_title": "${{ github.event.pull_request.title }}",
            "branch": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "status": "${{ steps.validate.outputs.result || 'unknown' }}",
            "validation": {
              "passed": ${{ steps.validate.outputs.passed || 0 }},
              "failed": ${{ steps.validate.outputs.failed || 0 }},
              "warnings": ${{ steps.validate.outputs.warnings || 0 }}
            },
            "workflow_conclusion": "${{ job.status }}"
          }
          EOF

          echo "✅ Audit log created: $FILEPATH"

      - name: Set status check
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ "${{ steps.validate.outputs.failed }}" -gt 0 ]; then
            echo "❌ Changelog validation failed: ${{ steps.validate.outputs.failed }} errors"
            exit 1
          fi
          echo "✅ Changelog validation passed"
        continue-on-error: true

      - name: Report validation results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = {
              passed: ${{ steps.validate.outputs.passed || 0 }},
              failed: ${{ steps.validate.outputs.failed || 0 }},
              warnings: ${{ steps.validate.outputs.warnings || 0 }},
              status: '${{ steps.validate.outputs.result }}'
            };

            core.notice(`Changelog Validation: ${result.passed} passed, ${result.failed} failed, ${result.warnings} warnings`);
