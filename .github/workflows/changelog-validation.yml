name: Changelog Quality Validation

on:
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - '.github/validation/changelog/**'
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-changelog:
    runs-on: ubuntu-latest
    outputs:
      validation-result: ${{ steps.validate.outputs.result }}
      passed: ${{ steps.validate.outputs.passed }}
      failed: ${{ steps.validate.outputs.failed }}
      warnings: ${{ steps.validate.outputs.warnings }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '.github/validation/changelog/package.json'

      - name: Install dependencies
        run: |
          cd .github/validation/changelog
          npm ci

      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            CHANGELOG.md

      - name: Validate changelog entries
        id: validate
        # Token and PR context via env (not inline) so secrets and
        # untrusted inputs are not expanded into the shell command line.
        env:
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cd .github/validation/changelog

          if [ "${{ steps.changed-files.outputs.any_changed }}" == "false" ]; then
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "warnings=0" >> $GITHUB_OUTPUT
            echo "new_failed=0" >> $GITHUB_OUTPUT
            echo "base_failed=0" >> $GITHUB_OUTPUT
            echo "result=No changelog files modified in this PR" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Run validation and capture results
          node bin/validate.js \
            --changelog-path ../../../CHANGELOG.md \
            --trigger pr_submission \
            --pr-number ${{ github.event.pull_request.number }} \
            --branch "$HEAD_REF" \
            --github-token "$CHANGELOG_GITHUB_TOKEN" \
            --output json --metrics > validation-report.json 2>validation-stderr.log || true

          # Parse report
          if [ -f validation-report.json ]; then
            PASSED=$(jq '.summary.passed // 0' validation-report.json 2>/dev/null || echo "0")
            FAILED=$(jq '.summary.failed // 0' validation-report.json 2>/dev/null || echo "0")
            RESULT=$(jq -r '.recommendation // "UNKNOWN"' validation-report.json 2>/dev/null || echo "UNKNOWN")
            GATE_RESULT=$(jq -r '.ci_gate_result // "UNKNOWN"' validation-report.json 2>/dev/null || echo "UNKNOWN")

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "warnings=0" >> $GITHUB_OUTPUT
            echo "result=$RESULT" >> $GITHUB_OUTPUT
            echo "gate_result=$GATE_RESULT" >> $GITHUB_OUTPUT

            # Save full report for audit
            cp validation-report.json ../../../.github/reports/validation-audits/latest-report.json 2>/dev/null || true
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "warnings=0" >> $GITHUB_OUTPUT
            echo "result=ERROR" >> $GITHUB_OUTPUT
            echo "gate_result=UNKNOWN" >> $GITHUB_OUTPUT
            echo "new_failed=0" >> $GITHUB_OUTPUT
            echo "base_failed=0" >> $GITHUB_OUTPUT
            [ -f validation-stderr.log ] && cat validation-stderr.log
            exit 1
          fi

          # Validate the base-branch CHANGELOG as well, so the gate only
          # fails on failures introduced by this PR. Legacy Unreleased debt
          # is reported for visibility but does not block the PR.
          BASE_FAILED=0
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git show "$BASE_SHA:CHANGELOG.md" > /tmp/base-changelog.md 2>/dev/null; then
            node bin/validate.js \
              --changelog-path /tmp/base-changelog.md \
              --trigger pr_submission \
              --pr-number ${{ github.event.pull_request.number }} \
              --branch "$HEAD_REF" \
              --github-token "$CHANGELOG_GITHUB_TOKEN" \
              --output json > base-validation-report.json 2>/dev/null || true
            if [ -f base-validation-report.json ]; then
              BASE_FAILED=$(jq '.summary.failed // 0' base-validation-report.json 2>/dev/null || echo "0")
            fi
          else
            echo "⚠️ Could not read base CHANGELOG for comparison; gating on total failures"
          fi

          # Guard against non-numeric values before arithmetic
          case "$FAILED" in ''|*[!0-9]*) FAILED=0 ;; esac
          case "$BASE_FAILED" in ''|*[!0-9]*) BASE_FAILED=0 ;; esac

          NEW_FAILED=$((FAILED - BASE_FAILED))
          if [ "$NEW_FAILED" -lt 0 ]; then NEW_FAILED=0; fi

          echo "base_failed=$BASE_FAILED" >> $GITHUB_OUTPUT
          echo "new_failed=$NEW_FAILED" >> $GITHUB_OUTPUT
          echo "PR failures: $FAILED, base failures: $BASE_FAILED, new: $NEW_FAILED"

          # Exit based on gate result
          if [ "$GATE_RESULT" == "pass" ]; then
            exit 0
          elif [ "$GATE_RESULT" == "warning" ]; then
            exit 0
          else
            exit 1
          fi
        continue-on-error: true

      - name: Format PR comment
        id: comment
        if: steps.changed-files.outputs.any_changed == 'true'
        # Branch name via env so the untrusted value is not expanded into
        # the shell command line (script-injection hardening).
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          PASSED=${{ steps.validate.outputs.passed }}
          FAILED=${{ steps.validate.outputs.failed }}
          WARNINGS=${{ steps.validate.outputs.warnings }}
          NEW_FAILED=${{ steps.validate.outputs.new_failed }}
          BASE_FAILED=${{ steps.validate.outputs.base_failed }}

          # Default empty/non-numeric outputs to zero for numeric tests
          case "$NEW_FAILED" in ''|*[!0-9]*) NEW_FAILED=0 ;; esac
          case "$WARNINGS" in ''|*[!0-9]*) WARNINGS=0 ;; esac
          case "$BASE_FAILED" in ''|*[!0-9]*) BASE_FAILED=0 ;; esac

          # Build comment markdown. NOTE: the heredoc delimiter MUST stay
          # unquoted so $PASSED/$WARNINGS/$FAILED expand. A quoted 'EOF'
          # posts the literal variable names to every PR.
          cat > /tmp/comment.md << EOF
          ## 📋 Changelog Quality Validation

          ### Summary

          | Metric | Count |
          |--------|-------|
          | ✅ Passing | $PASSED |
          | ⚠️ Warnings | $WARNINGS |
          | ❌ Failing | $FAILED |
          | 🆕 New failures in this PR | $NEW_FAILED |
          | 📦 Pre-existing failures | $BASE_FAILED |

          ### Status

          EOF

          if [ "$NEW_FAILED" -gt 0 ]; then
            echo "❌ **Validation FAILED** - This PR introduces $NEW_FAILED new changelog failure(s). Please fix them before merging." >> /tmp/comment.md
            echo "Pre-existing failures ($BASE_FAILED) are reported for visibility and do not block this PR." >> /tmp/comment.md
          elif [ "$WARNINGS" -gt 0 ]; then
            echo "⚠️ **Validation CONDITIONAL PASS** - $WARNINGS warning(s) detected" >> /tmp/comment.md
            echo "Review the warnings and consider addressing them for better quality." >> /tmp/comment.md
          else
            echo "✅ **Validation PASSED** - No new failures introduced by this PR." >> /tmp/comment.md
            if [ "$BASE_FAILED" -gt 0 ]; then
              echo "Note: $BASE_FAILED pre-existing failure(s) remain in the Unreleased section." >> /tmp/comment.md
            fi
          fi

          echo "" >> /tmp/comment.md
          if [ "$NEW_FAILED" -gt 0 ]; then
            echo "### How to Fix" >> /tmp/comment.md
            echo "" >> /tmp/comment.md
            echo "Reproduce the exact PR check locally (from the repository root):" >> /tmp/comment.md
            echo "\`\`\`bash" >> /tmp/comment.md
            echo "cd .github/validation/changelog" >> /tmp/comment.md
            echo "node bin/validate.js --changelog-path ../../../CHANGELOG.md --trigger pr_submission --pr-number ${{ github.event.pull_request.number }} --branch $HEAD_REF --output text" >> /tmp/comment.md
            echo "\`\`\`" >> /tmp/comment.md
            echo "" >> /tmp/comment.md
            echo "Only new failures introduced by this PR block merging; pre-existing Unreleased failures do not block. See [Changelog Quality Audit](.github/validation/changelog/docs/DEVELOPER_GUIDE.md) for the rule reference." >> /tmp/comment.md
          else
            echo "No action required." >> /tmp/comment.md
          fi

          # Save comment content
          COMMENT_BODY=$(cat /tmp/comment.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v9
        env:
          COMMENT_BODY: ${{ steps.comment.outputs.body }}
        with:
          script: |
            const body = process.env.COMMENT_BODY;

            // Find existing validation comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Changelog Quality Validation')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Request reviewer if validation failed
        if: steps.validate.outputs.new_failed > 0 && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            core.notice('Validation failed - release manager approval required before merge');

      - name: Create audit log entry
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        # PR title is attacker-controlled: pass via env, never inline.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          mkdir -p .github/reports/validation-audits

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DATE_STR=$(date +%Y%m%d)
          FILENAME="${DATE_STR}_$(date +%s).json"
          FILEPATH=".github/reports/validation-audits/$FILENAME"

          # NOTE: heredoc delimiter stays unquoted so $TIMESTAMP expands
          # (a quoted 'EOF' would log the literal variable name).
          cat > "$FILEPATH" << EOF
          {
            "timestamp": "$TIMESTAMP",
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "pr_number": ${{ github.event.pull_request.number }},
            "pr_title": "$PR_TITLE",
            "branch": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "status": "${{ steps.validate.outputs.result || 'unknown' }}",
            "validation": {
              "passed": ${{ steps.validate.outputs.passed || 0 }},
              "failed": ${{ steps.validate.outputs.failed || 0 }},
              "warnings": ${{ steps.validate.outputs.warnings || 0 }},
              "new_failed": ${{ steps.validate.outputs.new_failed || 0 }},
              "base_failed": ${{ steps.validate.outputs.base_failed || 0 }}
            },
            "workflow_conclusion": "${{ job.status }}"
          }
          EOF

          echo "✅ Audit log created: $FILEPATH"

      - name: Set status check
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          NEW_FAILED="${{ steps.validate.outputs.new_failed }}"
          case "$NEW_FAILED" in ''|*[!0-9]*) NEW_FAILED=0 ;; esac
          if [ "$NEW_FAILED" -gt 0 ]; then
            echo "❌ Changelog validation failed: $NEW_FAILED new error(s) introduced by this PR"
            exit 1
          fi
          echo "✅ Changelog validation passed (no new failures)"
        continue-on-error: true

      - name: Report validation results
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const result = {
              passed: ${{ steps.validate.outputs.passed || 0 }},
              failed: ${{ steps.validate.outputs.failed || 0 }},
              warnings: ${{ steps.validate.outputs.warnings || 0 }},
              new_failed: ${{ steps.validate.outputs.new_failed || 0 }},
              base_failed: ${{ steps.validate.outputs.base_failed || 0 }},
              status: '${{ steps.validate.outputs.result }}'
            };

            core.notice(`Changelog Validation: ${result.passed} passed, ${result.failed} failed, ${result.warnings} warnings, ${result.new_failed} new in PR`);
