name: reviewer

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reviewer
        run: node agents/reviewer.agent.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}