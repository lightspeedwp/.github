name: Labeling • Unified Governance (PRs, Issues, Discussions & Cleanup)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, edited, reopened, closed]
  discussion:
    types: [created, edited, answered, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing labels"
        required: false
        default: "true"
      report_commit:
        description: "Commit report to repo (requires contents: write)"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: labeling-governance-${{ github.event_name }}-${{ github.event.number || github.run_id }}

env:
  LABELS_CONFIG: .github/labels.yml
  ISSUE_TYPES_CONFIG: .github/issue-types.yml
  LABELER_RULES: .github/labeler.yml

jobs:
  # Job 1: Standard PR/Issue/Discussion Labeling (from labeling.yml)
  standard-labeling:
    name: Standard Labeling, Status, and Type Assignment
    runs-on: ubuntu-latest
    if: |
      (github.event.pull_request.draft == false || github.event_name != 'pull_request')
      && !contains(github.event.head_commit.message, '[skip labeling]')
      && github.actor != 'github-actions[bot]'
      && github.event.action != 'closed'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Validate labeling config schema
        run: node scripts/validation/validate-labeling-configs.cjs

      - name: Validate canonical issue fields and docs
        run: node scripts/validation/validate-issue-fields.cjs

      - name: Sync labels with canonical set
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || inputs.dry_run || 'false' }}
          LABEL_SYNC_REPORT_PATH: .github/reports/labeling/label-sync-${{ github.run_id }}.md
        run: node scripts/agents/includes/label-sync.js
        continue-on-error: false

      # Guardrail: Check for unknown labels in templates/types
      - name: Guardrail — Check for unknown labels in templates/types
        run: node scripts/agents/includes/check-template-labels.js
        continue-on-error: false

      # Run unified labeling agent for issues and PRs
      - name: Run labeling agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/agents/run-labeling-agent.js

      - name: Generate report
        id: report
        run: |
          mkdir -p .github/reports/labeling
          node scripts/agents/includes/report-writer.js > .github/reports/labeling/${{ github.run_id }}.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: labeling-report-${{ github.run_id }}
          path: |
            .github/reports/labeling/${{ github.run_id }}.md
            .github/reports/labeling/label-sync-${{ github.run_id }}.md

      - name: Optionally commit report
        if: ${{ inputs.report_commit == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reports/labeling/${{ github.run_id }}.md
          git commit -m "chore(labeling): add report for run ${{ github.run_id }}"
          git push origin HEAD:develop

  # Job 1b: Detect and warn about bare labels (Priority 3 enhancement)
  detect-bare-labels:
    name: Detect Bare Labels in Current PR/Issue
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' || github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Load canonical labels
        id: load-labels
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');
            const labelsConfig = yaml.load(fs.readFileSync('.github/labels.yml', 'utf8'));
            const canonicalLabels = new Set(
              labelsConfig
                .map(label => typeof label === 'string' ? label : label?.name)
                .filter(Boolean)
            );
            core.setOutput('canonical-labels', JSON.stringify(Array.from(canonicalLabels)));

      - name: Check for bare labels
        uses: actions/github-script@v9
        env:
          CANONICAL_LABELS: ${{ steps.load-labels.outputs.canonical-labels }}
        with:
          script: |
            const canonicalLabels = new Set(JSON.parse(process.env.CANONICAL_LABELS || '[]'));
            const item = github.event_name === 'pull_request'
              ? context.payload.pull_request
              : context.payload.issue;

            if (!item) {
              core.notice('No PR or issue payload found; skipping bare label check.');
              return;
            }

            const itemNumber = item.number;
            const itemType = github.event_name === 'pull_request' ? 'PR' : 'Issue';
            const itemLabels = (item.labels || []).map(l => l.name);
            const bareLabels = itemLabels.filter(l => !canonicalLabels.has(l));

            if (bareLabels.length === 0) {
              core.notice(`✅ ${itemType} #${itemNumber} has no bare labels`);
              return;
            }

            // Log bare labels found
            core.warning(`${itemType} #${itemNumber} has bare labels: ${bareLabels.join(', ')}`);

  # Job 2: Dependabot Security Labeling (from dependabot-security-label.yml)
  label-dependabot-security:
    name: Dependabot Security Label Detection
    if: |
      github.event_name == 'pull_request'
      && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Detect security-related Dependabot updates
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const labelName = 'meta:dependabot-security';

            const title = context.payload.pull_request.title || '';
            const body = context.payload.pull_request.body || '';
            const text = `${title}\n${body}`;

            // Keep this strict to avoid matching boilerplate text present in most Dependabot PRs.
            const securityPatterns = [
              /\bto fix\b/i,
              /\bvulnerabilit(?:y|ies)\b/i,
              /\bcve-\d{4}-\d+\b/i,
              /\bghsa-[a-z0-9-]+\b/i,
              /\bsecurity\s+fix\b/i,
            ];

            const isSecurityRelated = securityPatterns.some((pattern) => pattern.test(text));

            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: 'B60205',
                  description: 'Dependabot update appears security-related and eligible for guarded automation',
                });
              } else {
                throw error;
              }
            }

            const existing = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const hasLabel = existing.data.some((label) => label.name === labelName);

            if (isSecurityRelated && !hasLabel) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [labelName] });
              core.notice(`Added '${labelName}' to PR #${issue_number}.`);
              return;
            }

            if (!isSecurityRelated && hasLabel) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: labelName });
              core.notice(`Removed '${labelName}' from PR #${issue_number}.`);
              return;
            }

            core.notice(
              `No label change needed for PR #${issue_number}; security-related=${isSecurityRelated}, hasLabel=${hasLabel}.`,
            );

  # Job 3: Issue Label Cleanup on Close (from issue-close-label-hygiene.yml)
  cleanup-labels-on-close:
    name: Remove Status Labels When Closing Issues
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Remove status:needs-triage label if present
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              core.info('No issue payload found; skipping.');
              return;
            }

            const labelsToRemove = [
              'status:needs-triage',
              'status:in-progress',
              'status:needs-review',
            ];

            const existingLabels = (issue.labels || []).map((label) => label.name);
            const labelsToDelete = labelsToRemove.filter((labelName) => existingLabels.includes(labelName));

            if (labelsToDelete.length === 0) {
              core.info(`Issue #${issue.number} has no status labels to remove; nothing to clean up.`);
              return;
            }

            for (const labelName of labelsToDelete) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: labelName,
              });

              core.info(`Removed '${labelName}' from closed issue #${issue.number}.`);
            }

            core.notice(`Cleaned up ${labelsToDelete.length} status label(s) from closed issue #${issue.number}.`);

  # Job 4: Enforce Labeling as Required Status Check (PRs only)
  labeling-check:
    name: Labeling Governance Check (Required)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
      issues: write

    steps:
      - name: Validate PR has required labels
        id: validate
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Fetch current PR state to get updated labels (not from the initial payload)
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const labels = (pr.data.labels || []).map(l => l.name);
            const requiredLabelPrefixes = ['type:', 'area:', 'priority:', 'meta:'];

            // Check if PR has at least one label from required categories
            const hasRequiredLabel = labels.some(label =>
              requiredLabelPrefixes.some(prefix => label.startsWith(prefix))
            );

            const validLabels = labels.filter(l => requiredLabelPrefixes.some(p => l.startsWith(p)));

            if (labels.length === 0) {
              core.setOutput('validation_status', 'no_labels');
              core.notice(`PR #${prNumber} has no labels. At least one label from [type:*, area:*, priority:*, meta:*] is required.`);
            } else if (!hasRequiredLabel) {
              core.setOutput('validation_status', 'invalid_labels_only');
              core.notice(`PR #${prNumber} has ${labels.length} label(s) but none from required categories. Found: ${labels.join(', ')}`);
            } else {
              core.setOutput('validation_status', 'valid');
              core.notice(`PR #${prNumber} has valid label(s): ${validLabels.join(', ')}`);
            }

      - name: Prepare final status
        id: check
        run: |
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "title=✅ Labeling Governance Passed" >> "$GITHUB_OUTPUT"

      - name: Create status check
        uses: actions/github-script@v9
        with:
          script: |
            const status = '${{ steps.check.outputs.status }}';
            const validationStatus = '${{ steps.validate.outputs.validation_status }}';

            let conclusion = status;
            let summary = 'This PR has been labelled according to governance rules.';
            let detailedText = '';

            if (validationStatus === 'no_labels') {
              conclusion = 'failure';
              summary = 'This PR has no labels. At least one label is required.';
              detailedText = '## PR Labels Required\n\nThis PR must have at least one label before it can be merged.\n\n**Required Label Categories:**\n- `type:*` (feature, bug, chore, etc.)\n- `area:*` (ci, docs, security, etc.)\n- `priority:*` (critical, important, normal)\n- `meta:*` (needs-changelog, no-changelog, etc.)\n\n## How to Fix\n\n1. Add at least one label from the required categories above\n2. Labels are typically auto-applied based on:\n   - Branch prefix (e.g., `feat/`, `fix/`, `chore/`)\n   - File changes (e.g., documentation files, CI files)\n   - PR title and description content\n3. If auto-labeling didn\'t work, [manually add a label](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/labels)\n4. The labeling check will run again automatically';
            } else if (validationStatus === 'invalid_labels_only') {
              conclusion = 'failure';
              summary = 'This PR has labels but none from the required categories.';
              detailedText = '## Invalid Labels Only\n\nThis PR has labels, but none of them are from the required categories.\n\n**Required Label Categories:**\n- `type:*` (feature, bug, chore, etc.)\n- `area:*` (ci, docs, security, etc.)\n- `priority:*` (critical, important, normal)\n- `meta:*` (needs-changelog, no-changelog, etc.)\n\n## How to Fix\n\n1. Add at least one label from the required categories\n2. [Add labels manually](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/labels) or\n3. Update your PR to trigger auto-labeling (edit title, body, or branch name)\n4. The labeling check will run again automatically';
            }

            const checkRunInput = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Labeling Governance Check',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: conclusion === 'success'
                  ? '✅ Labeling Governance Passed'
                  : '❌ Labeling Governance Failed',
                summary: summary,
                text: detailedText,
              }
            };

            const checkRuns = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });

            const existingCheckRun = checkRuns.data.check_runs.find(
              (check) => check.name === 'Labeling Governance Check'
            );

            if (existingCheckRun) {
              await github.rest.checks.update({
                ...checkRunInput,
                check_run_id: existingCheckRun.id,
              });
            } else {
              await github.rest.checks.create(checkRunInput);
            }

            if (status === 'failure') {
              // Post a comment with failure details
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const marker = '<!-- labeling-governance-check -->';
              const existingComment = comments.find(
                (c) => c.body.includes(marker) && c.user.type === 'Bot'
              );

              const message = [
                marker,
                '## ❌ Labeling Governance Check Failed',
                '',
                'This PR could not be automatically labeled. Review the workflow logs and PR template for issues.',
                '',
                '**Common Issues:**',
                '- Invalid or malformed linked issue references',
                '- Missing required changelog entries',
                '- PR template format errors',
                '',
                '[View labeling-governance logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})',
              ].join('\n');

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: message,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: message,
                });
              }
            }

            core.setOutput('status', conclusion);

      - name: Enforce labeling requirement
        if: steps.check.outputs.status == 'failure' || steps.validate.outputs.validation_status != 'valid'
        run: |
          VALIDATION_STATUS="${{ steps.validate.outputs.validation_status }}"
          if [[ "${{ needs.standard-labeling.result }}" != "success" ]]; then
            echo "::error::Labeling governance workflow failed. Review logs for details."
            exit 1
          elif [[ "$VALIDATION_STATUS" == "no_labels" ]]; then
            echo "::error::PR must have at least one label. Labels are required from: type:*, area:*, priority:*, meta:*"
            exit 1
          elif [[ "$VALIDATION_STATUS" == "invalid_labels_only" ]]; then
            echo "::error::PR has labels but none from required categories. Add at least one label from: type:*, area:*, priority:*, meta:*"
            exit 1
          else
            echo "::error::Labeling governance check failed. This is a required status check for PR merge."
            exit 1
          fi
