name: release
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Comma-separated package scope (optional)'
        required: false
        default: ''
jobs:
  lint:
    uses: ./.github/workflows/lint.yml  # reuse if using reusable workflows; else inline
  release:
    needs: [lint]  # hard gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install
        run: npm ci
      # - name: Run Release Agent (dry-run supported)
      #   run: |
      #     node .github/agents/release.agent.js --scope "${{ github.event.inputs.scope }}" --dry-run=false
      # TODO: G-1: Implement release agent at .github/agents/release.agent.js and enable this step.
      - name: Post metrics
        if: always()
        run: echo "metric=release_cycle conclusion=${{ job.status }}"
