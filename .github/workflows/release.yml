name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target release version (semver, e.g. 1.2.3). Leave blank to derive from scope."
        required: false
        default: ""
        type: string
      notes_from:
        description: "Git ref/tag/sha to start release notes range from (optional)."
        required: false
        default: ""
        type: string
      scope:
        description: "Version bump scope if version is not provided (major|minor|patch)."
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Run safety mode without creating commits/tags/releases."
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        required: false
        default: ""
        type: string
      notes_from:
        required: false
        default: ""
        type: string
      scope:
        required: false
        default: "patch"
        type: string
      dry_run:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  trigger-telemetry:
    runs-on: ubuntu-latest
    outputs:
      unauthorized_attempts: ${{ steps.telemetry.outputs.unauthorized_attempts }}
    steps:
      - id: telemetry
        name: Record trigger telemetry
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/workflows/release/trigger-telemetry.cjs
      - name: Upload telemetry artefact
        uses: actions/upload-artifact@v4
        with:
          name: trigger-telemetry
          path: trigger-telemetry.json

  lint:
    needs: [trigger-telemetry]
    if: needs.trigger-telemetry.outputs.unauthorized_attempts == '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  release:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install
        run: npm ci
      - name: Configure git user
        run: |
          git config user.name "lightspeed-bot"
          git config user.email "ops@lightspeedwp.agency"
      - name: Validate changelog (schema + unreleased content)
        run: |
          node scripts/validation/validate-changelog.cjs CHANGELOG.md
          node scripts/agents/includes/changelogUtils.cjs --unreleased CHANGELOG.md
      - name: Run Release Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope || github.event.inputs.scope || 'patch' }}
          INPUT_VERSION: ${{ inputs.version || github.event.inputs.version || '' }}
          INPUT_NOTES_FROM: ${{ inputs.notes_from || github.event.inputs.notes_from || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/workflows/release/run-release-agent.cjs | tee release-agent.log
      - name: Build dry-run release notes preview
        if: inputs.dry_run == true
        env:
          INPUT_NOTES_FROM: ${{ inputs.notes_from || github.event.inputs.notes_from || '' }}
        run: node scripts/workflows/release/build-notes-preview.cjs
      - name: Upload dry-run artefacts
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-artefacts
          path: |
            release-agent.log
            release-notes-preview.md
      - name: Post metrics
        if: always()
        run: echo "metric=release_cycle conclusion=${{ job.status }}"
