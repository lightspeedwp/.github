name: Awesome GitHub Site

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/awesome-github-site.yml"
  push:
    branches:
      - develop
    paths:
      - "website/**"
      - ".github/workflows/awesome-github-site.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
