---
name: Branding Agent

on:
  pull_request:
    branches: [develop]
    paths:
      - "**/*.md"
      - ".github/automation/**"
      - ".github/agents/**"
  push:
    branches: [develop]
    paths:
      - "**/*.md"
      - ".github/automation/**"
      - ".github/agents/**"
  schedule:
    - cron: "0 3 * * 1" # weekly metrics roll-up (Mon 03:00 UTC)

concurrency:
  group: "branding-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  front-matter-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Front Matter
        run: |
          npm i -g ajv-cli
          FILES=$(git diff --name-only ${{ github.sha }} ${{ github.base_ref || 'HEAD~1' }} | grep -E '\.md$' || true)
          for f in $FILES; do
            node -e "const fs=require('fs');const s=fs.readFileSync('$f','utf8');const m=s.match(/^---\\n([\\s\\S]*?)\\n---/); if(!m){process.exit(0)}"
            yq -o=json '."'"$f"'"' >/dev/null 2>&1 || true
          done

  lint-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: avto-dev/markdown-lint@v1
        with:
          config: 'markdownlint.config.js'
          args: '**/*.md'

      - name: Check Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose './**/*.md' --exclude-mail

  apply-branding:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [front-matter-validate, lint-and-links]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Branding Agent
        run: |
          node .github/agents/branding.agent.js

      - name: Commit changes (content-only)
        run: |
          git config user.name "lightspeed-bot"
          git config user.email "ops@lightspeedwp.agency"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(branding): apply header/badges/refs/banner/footer [skip ci]"
            git push
          fi

  metrics-update:
    needs: [apply-branding]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Metrics Snapshot
        run: |
          mkdir -p .github/metrics
          node -e "const fs=require('fs');let m={ts:new Date().toISOString(),coverage:0,changes:0,errors:0,optouts:0};fs.writeFileSync('.github/metrics/branding.json',JSON.stringify(m,null,2))"
          echo "| $(date -Iseconds) | coverage:0 | changes:0 | errors:0 | optouts:0 |" >> .github/metrics/branding-log.md

      - name: Commit metrics
        run: |
          git config user.name "lightspeed-bot"
          git config user.email "ops@lightspeedwp.agency"
          git add .github/metrics/branding.json .github/metrics/branding-log.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(branding): update metrics snapshot [skip ci]"
            git push
          fi
