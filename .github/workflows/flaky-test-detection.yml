name: Flaky Test Detection

on:
  schedule:
    - cron: '0 */12 * * 1-5' # Every 12 hours, Monday-Friday
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  flaky-detection-unit:
    name: Unit Tests - Flaky Detection (Run ${{ matrix.run_number }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run_number: [1, 2, 3, 4, 5]
    env:
      MERGIFY_JOB_NAME: check
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm install --no-save jest-junit

      - name: Run unit tests
        run: npx jest --config .jest.config.cjs --reporters=jest-junit --outputFile=junit-unit-${{ matrix.run_number }}.xml || true

      - name: Upload test results to Mergify
        if: success() || failure()
        uses: mergifyio/gha-mergify-ci@v14
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          flaky_test_detection: true
          report_path: 'junit-unit-${{ matrix.run_number }}.xml'
