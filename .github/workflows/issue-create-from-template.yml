name: Create Issue From Template

on:
  workflow_dispatch:
    inputs:
      template_key:
        description: "Canonical issue template to use"
        required: true
        type: choice
        options:
          - task
          - bug
          - feature
          - design
          - epic
          - story
          - improvement
          - code-refactor
          - build-ci
          - automation
          - testing-coverage
          - performance
          - a11y
          - security
          - compatibility
          - integration-issue
          - release
          - maintenance
          - documentation
          - research
          - audit
          - code-review
          - ai-ops
          - content-modelling
      canonical_type:
        description: "Optional canonical type label to apply if it matches the template"
        required: false
        default: ""
        type: string
      title:
        description: "Issue title"
        required: true
        type: string
      body:
        description: "Optional additional context to append after the template"
        required: false
        default: ""
        type: string
      labels:
        description: "Optional extra labels, comma-separated"
        required: false
        default: ""
        type: string
      assignee:
        description: "Optional assignee"
        required: false
        default: ""
        type: string
      milestone:
        description: "Optional milestone title"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    name: Create issue with canonical template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function normalizeType(value) {
              return (value || '').trim().replace(/^type:/i, '');
            }

            const inputs = context.payload.inputs || {};
            const templateKey = (inputs.template_key || '').trim();
            const requestedType = normalizeType(inputs.canonical_type);
            const title = (inputs.title || '').trim();
            const extraBody = (inputs.body || '').trim();
            const extraLabels = (inputs.labels || '')
              .split(',')
              .map((label) => label.trim())
              .filter(Boolean);
            const assignee = (inputs.assignee || '').trim();
            const milestoneTitle = (inputs.milestone || '').trim();

            const templates = {
              task: {
                file: '.github/ISSUE_TEMPLATE/01-task.md',
                defaultType: 'type:task',
                allowedTypes: ['type:task', 'type:chore'],
              },
              bug: {
                file: '.github/ISSUE_TEMPLATE/02-bug.md',
                defaultType: 'type:bug',
                allowedTypes: ['type:bug'],
              },
              feature: {
                file: '.github/ISSUE_TEMPLATE/03-feature.md',
                defaultType: 'type:feature',
                allowedTypes: ['type:feature', 'type:enhancement'],
              },
              design: {
                file: '.github/ISSUE_TEMPLATE/04-design.md',
                defaultType: 'type:design',
                allowedTypes: ['type:design', 'type:ui', 'type:a11y'],
              },
              epic: {
                file: '.github/ISSUE_TEMPLATE/05-epic.md',
                defaultType: 'type:epic',
                allowedTypes: ['type:epic'],
              },
              story: {
                file: '.github/ISSUE_TEMPLATE/06-story.md',
                defaultType: 'type:story',
                allowedTypes: ['type:story'],
              },
              improvement: {
                file: '.github/ISSUE_TEMPLATE/07-improvement.md',
                defaultType: 'type:improve',
                allowedTypes: ['type:improve', 'type:enhancement'],
              },
              'code-refactor': {
                file: '.github/ISSUE_TEMPLATE/09-code-refactor.md',
                defaultType: 'type:refactor',
                allowedTypes: ['type:refactor'],
              },
              'build-ci': {
                file: '.github/ISSUE_TEMPLATE/10-build-ci.md',
                defaultType: 'type:build',
                allowedTypes: ['type:build', 'type:ci'],
              },
              automation: {
                file: '.github/ISSUE_TEMPLATE/11-automation.md',
                defaultType: 'type:automation',
                allowedTypes: ['type:automation'],
              },
              'testing-coverage': {
                file: '.github/ISSUE_TEMPLATE/12-testing-coverage.md',
                defaultType: 'type:test',
                allowedTypes: ['type:test', 'type:qa'],
              },
              performance: {
                file: '.github/ISSUE_TEMPLATE/13-performance.md',
                defaultType: 'type:performance',
                allowedTypes: ['type:performance'],
              },
              a11y: {
                file: '.github/ISSUE_TEMPLATE/14-a11y.md',
                defaultType: 'type:a11y',
                allowedTypes: ['type:a11y'],
              },
              security: {
                file: '.github/ISSUE_TEMPLATE/15-security.md',
                defaultType: 'type:security',
                allowedTypes: ['type:security'],
              },
              compatibility: {
                file: '.github/ISSUE_TEMPLATE/16-compatibility.md',
                defaultType: 'type:compatibility',
                allowedTypes: ['type:compatibility'],
              },
              'integration-issue': {
                file: '.github/ISSUE_TEMPLATE/17-integration-issue.md',
                defaultType: 'type:integration',
                allowedTypes: ['type:integration'],
              },
              release: {
                file: '.github/ISSUE_TEMPLATE/18-release.md',
                defaultType: 'type:release',
                allowedTypes: ['type:release'],
              },
              maintenance: {
                file: '.github/ISSUE_TEMPLATE/19-maintenance.md',
                defaultType: 'type:maintenance',
                allowedTypes: ['type:maintenance', 'type:dependency', 'type:chore'],
              },
              documentation: {
                file: '.github/ISSUE_TEMPLATE/20-documentation.md',
                defaultType: 'type:documentation',
                allowedTypes: ['type:documentation'],
              },
              research: {
                file: '.github/ISSUE_TEMPLATE/21-research.md',
                defaultType: 'type:research',
                allowedTypes: ['type:research', 'type:investigation'],
              },
              audit: {
                file: '.github/ISSUE_TEMPLATE/22-audit.md',
                defaultType: 'type:audit',
                allowedTypes: ['type:audit'],
              },
              'code-review': {
                file: '.github/ISSUE_TEMPLATE/23-code-review.md',
                defaultType: 'type:review',
                allowedTypes: ['type:review'],
              },
              'ai-ops': {
                file: '.github/ISSUE_TEMPLATE/24-ai-ops.md',
                defaultType: 'type:ai-ops',
                allowedTypes: ['type:ai-ops'],
              },
              'content-modelling': {
                file: '.github/ISSUE_TEMPLATE/25-content-modelling.md',
                defaultType: 'type:content-modelling',
                allowedTypes: ['type:content-modelling'],
              },
            };

            if (!templateKey) {
              throw new Error('template_key is required.');
            }

            const template = templates[templateKey];
            if (!template) {
              throw new Error(`Unknown template key: ${templateKey}`);
            }

            if (!title) {
              throw new Error('title is required.');
            }

            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const templatePath = path.join(workspace, template.file);
            if (!fs.existsSync(templatePath)) {
              throw new Error(`Template file not found: ${template.file}`);
            }

            const templateBody = fs.readFileSync(templatePath, 'utf8').trimEnd();
            if (!/definition of ready/i.test(templateBody) || !/definition of done/i.test(templateBody)) {
              throw new Error(`Template ${template.file} must include both DoR and DoD sections.`);
            }

            const selectedType = requestedType ? `type:${requestedType}` : template.defaultType;
            if (!template.allowedTypes.includes(selectedType)) {
              throw new Error(
                `Template ${templateKey} cannot be used with ${selectedType}. Allowed types: ${template.allowedTypes.join(', ')}.`,
              );
            }

            for (const label of extraLabels) {
              if (/^type:/i.test(label) && label !== selectedType) {
                throw new Error(
                  `Extra labels may not override the canonical type. Requested ${label}, expected ${selectedType}.`,
                );
              }

              if (/^status:/i.test(label) && label !== 'status:needs-triage') {
                throw new Error(
                  `Extra labels may not override the canonical status. Requested ${label}, expected status:needs-triage.`,
                );
              }

              if (/^priority:/i.test(label) && label !== 'priority:normal') {
                throw new Error(
                  `Extra labels may not override the canonical priority. Requested ${label}, expected priority:normal.`,
                );
              }
            }

            const issueBody = [
              '<!-- created-by: issue-create-from-template -->',
              `<!-- template-key: ${templateKey} -->`,
              `<!-- canonical-type: ${selectedType} -->`,
              templateBody,
              extraBody ? `## Automation Notes\n\n${extraBody}` : null,
            ]
              .filter(Boolean)
              .join('\n\n');

            const labels = new Set([
              'status:needs-triage',
              'priority:normal',
              selectedType,
              ...extraLabels,
            ]);

            let milestone;
            if (milestoneTitle) {
              const milestones = await github.paginate(github.rest.issues.listMilestones, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              });

              const match = milestones.find((item) => item.title === milestoneTitle);
              if (!match) {
                throw new Error(`Milestone not found: ${milestoneTitle}`);
              }

              milestone = match.number;
            }

            const assignees = assignee ? [assignee] : undefined;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: issueBody,
              labels: Array.from(labels),
              milestone,
              assignees,
            });

            await core.summary
              .addHeading('Issue created from template')
              .addRaw(`- Issue: #${issue.data.number}\n`)
              .addRaw(`- Template: ${templateKey}\n`)
              .addRaw(`- Canonical type: ${selectedType}\n`)
              .addRaw(`- URL: ${issue.data.html_url}\n`)
              .write();

            core.info(`Created issue #${issue.data.number} from template ${templateKey}.`);
