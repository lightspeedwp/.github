name: Validate • Workflows & Guardrails

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/**/*.yml'
      - '.github/workflows/**/*.yaml'
      - 'scripts/validation/validate-workflows.js'
      - 'scripts/validation/__tests__/validate-workflows.test.js'
      - 'package.json'
  push:
    branches: [develop]
    paths:
      - '.github/workflows/**/*.yml'
      - '.github/workflows/**/*.yaml'
      - 'scripts/validation/validate-workflows.js'
      - 'scripts/validation/__tests__/validate-workflows.test.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-workflows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflows:
    name: Validate Workflow Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate all workflows
        id: validate
        run: npm run validate:workflows
        continue-on-error: true

      - name: Generate validation report
        if: always()
        run: |
          echo "## ✅ Workflow Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Guardrails Checked:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 Security (permissions, secrets, pinned versions)" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Performance (concurrency, caching, fetch-depth)" >> $GITHUB_STEP_SUMMARY
          echo "- ✨ Quality (naming, error handling, versions)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Consistency (OS versions, triggers)" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with validation results (success)
        if: github.event_name == 'pull_request' && steps.validate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ✅ Workflow Validation Passed\n\nAll workflows comply with our guardrails:\n\n**Guardrails Validated:**\n- 🔒 Security (permissions, secrets, pinned versions)\n- ⚡ Performance (concurrency, caching, fetch-depth)\n- ✨ Quality (naming, error handling, versions)\n- 🔄 Consistency (OS versions, triggers)\n\n**Script:** `scripts/validation/validate-workflows.js`\n**Tests:** `scripts/validation/__tests__/validate-workflows.test.js`'
            })

      - name: Comment on PR with validation results (warnings)
        if: github.event_name == 'pull_request' && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ⚠️ Workflow Validation Warnings\n\nSome workflows have warnings. Review the errors above and address them:\n\n**To fix:**\n1. Review validation errors in workflow logs\n2. Update workflows to comply with guardrails\n3. Re-run validation\n\n**Guardrails Reference:**\n- 🔒 Security: permissions, secrets handling, pinned actions\n- ⚡ Performance: concurrency, caching, checkout depth\n- ✨ Quality: naming, error handling, Node versions\n- 🔄 Consistency: OS, triggers, best practices\n\n**Script:** `scripts/validation/validate-workflows.js`'
            })

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

  test-validation:
    name: Test Validation Logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run validation tests
        run: npm run test:js -- scripts/validation/__tests__/validate-workflows.test.js --coverage
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-coverage
          path: coverage/

  syntax-check:
    name: Syntax Check - All Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install YAML validator
        run: npm install --no-save js-yaml

      - name: Validate YAML syntax
        run: |
          node -e "
          const fs = require('fs');
          const yaml = require('js-yaml');
          const path = require('path');

          const workflowDir = '.github/workflows';
          let errors = 0;

          fs.readdirSync(workflowDir)
            .filter(f => f.endsWith('.yml') || f.endsWith('.yaml'))
            .forEach(file => {
              try {
                const content = fs.readFileSync(path.join(workflowDir, file), 'utf8');
                yaml.load(content);
                console.log('✅', file);
              } catch(e) {
                console.error('❌', file, ':', e.message);
                errors++;
              }
            });

          if(errors > 0) {
            console.error('YAML syntax errors found!');
            process.exit(1);
          }
          console.log('All workflows have valid YAML syntax!');
          "

  actionlint:
    name: Lint Workflows with actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s latest
          ./actionlint -format '{{json}}' .github/workflows/*.yml || true
        continue-on-error: true

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-workflows, test-validation, syntax-check, actionlint]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🔍 Workflow Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Guardrails | ${{ needs.validate-workflows.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation Tests | ${{ needs.test-validation.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Syntax | ${{ needs.syntax-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| actionlint | ${{ needs.actionlint.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Guardrails Enforced:**" >> $GITHUB_STEP_SUMMARY
          echo "- Security: permissions, secrets, pinned versions" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: concurrency, caching, checkout depth" >> $GITHUB_STEP_SUMMARY
          echo "- Quality: naming, error handling, Node versions" >> $GITHUB_STEP_SUMMARY
          echo "- Consistency: OS, triggers, best practices" >> $GITHUB_STEP_SUMMARY

      - name: Check if validation passed
        if: |
          needs.validate-workflows.result == 'failure' ||
          needs.syntax-check.result == 'failure'
        run: |
          echo "❌ Workflow validation failed"
          exit 1
