name: Validate Specifications

on:
  pull_request:
    paths:
      - '.github/specs/**'
      - '.github/workflows/validate-specifications.yml'
      - '.specify/scripts/bash/audit-specs.sh'
  push:
    branches:
      - develop
    paths:
      - '.github/specs/**'
      - '.specify/scripts/bash/audit-specs.sh'

permissions:
  contents: read

jobs:
  validate:
    name: Specification Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run specification audit
        id: audit
        run: |
          set -o pipefail
          bash .specify/scripts/bash/audit-specs.sh 2>&1 | tee audit-output.txt

      - name: Validate catalog exists
        id: catalog
        run: |
          if [ -f ".github/specs/CATALOG.md" ]; then
            echo "status=found" >> "$GITHUB_OUTPUT"
            echo "✓ CATALOG.md exists"
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "✗ CATALOG.md not found"
            exit 1
          fi

      - name: Validate canonical schema in CATALOG.md
        id: schema
        run: |
          # Check that CATALOG.md contains the canonical schema definition
          if grep -q "Catalog Schema (Canonical)" .github/specs/CATALOG.md; then
            echo "schema_documented=true" >> "$GITHUB_OUTPUT"
            echo "✓ Canonical schema section found"
          else
            echo "schema_documented=false" >> "$GITHUB_OUTPUT"
            echo "⚠ Canonical schema section not documented"
          fi

          # Verify canonical columns exist in active specifications table
          # Look for the Active Specifications section and verify the header row matches exactly
          if grep -A 2 "## Active Specifications" .github/specs/CATALOG.md | grep -q "^| # | Slug | Title | Status | Created | Link |$"; then
            echo "schema_valid=true" >> "$GITHUB_OUTPUT"
            echo "✓ Table follows canonical schema (# | Slug | Title | Status | Created | Link)"
          else
            echo "schema_valid=false" >> "$GITHUB_OUTPUT"
            echo "✗ Table does not follow canonical schema"
            exit 1
          fi

      - name: Validate MAINTENANCE.md references canonical schema
        id: maintenance
        run: |
          if grep -q "Canonical Schema" .github/specs/MAINTENANCE.md; then
            echo "maintenance_ok=true" >> "$GITHUB_OUTPUT"
            echo "✓ MAINTENANCE.md documents canonical schema"
          else
            echo "maintenance_ok=false" >> "$GITHUB_OUTPUT"
            echo "⚠ MAINTENANCE.md should document canonical schema"
          fi

      - name: Install Bats test framework
        uses: bats-core/bats-action@4.0.0

      - name: Run audit script test suite
        id: tests
        run: |
          bats tests/bash/audit-specs.bats
          echo "tests_ok=true" >> "$GITHUB_OUTPUT"
          echo "✓ Audit script tests passed"

      - name: Generate compliance report
        if: always()
        id: report
        run: |
          cat > /tmp/compliance-report.md << 'EOF'
          ## 📋 Specification Compliance Report

          ### Directory Structure
          - Catalog file: ${{ steps.catalog.outputs.status }}
          - Schema compliance: ${{ steps.schema.outputs.schema_valid }}

          ### Schema Compliance
          - Canonical schema documented: ${{ steps.schema.outputs.schema_documented }}
          - Schema validation: ${{ steps.schema.outputs.schema_valid }}
          - MAINTENANCE.md compliant: ${{ steps.maintenance.outputs.maintenance_ok }}

          ### Metrics
          | Metric | Status |
          |--------|--------|
          | Catalog exists | ${{ steps.catalog.outputs.status == 'found' && '✅' || '❌' }} |
          | Schema documented | ${{ steps.schema.outputs.schema_documented == 'true' && '✅' || '⚠️' }} |
          | Schema valid | ${{ steps.schema.outputs.schema_valid == 'true' && '✅' || '❌' }} |
          | MAINTENANCE.md updated | ${{ steps.maintenance.outputs.maintenance_ok == 'true' && '✅' || '⚠️' }} |

          ### Principle X Compliance
          This workflow enforces **Principle X: Automated Validation & Metrics-Driven Governance** by:
          - ✅ Running automated validation on every PR touching specification files
          - ✅ Generating compliance metrics and reporting them
          - ✅ Failing the check if critical validation rules are violated
          - ✅ Tracking specification structure, numbering, and schema compliance

          ---
          _Generated by specification validation workflow_
          EOF
          cat /tmp/compliance-report.md >> "$GITHUB_STEP_SUMMARY"
