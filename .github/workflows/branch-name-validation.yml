name: Branch Name Validation

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      branch_name: ${{ steps.extract-branch.outputs.branch_name }}
      valid: ${{ steps.validate.outputs.valid }}
      errors: ${{ steps.validate.outputs.errors }}
      suggested_name: ${{ steps.validate.outputs.suggested_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Validate branch name
        id: validate
        run: |
          BRANCH_NAME="${{ steps.extract-branch.outputs.branch_name }}"
          echo "🔍 Validating branch: $BRANCH_NAME"

          # Run validation CLI directly and capture exit code
          npm run validate:branch-name -- --branch "$BRANCH_NAME" --json > /tmp/validation-result.json 2>&1
          VALIDATION_EXIT_CODE=$?

          echo "Exit code: $VALIDATION_EXIT_CODE"
          echo "Result file:"
          cat /tmp/validation-result.json

          # Parse JSON result if validation succeeded
          if [ $VALIDATION_EXIT_CODE -eq 0 ]; then
            VALID="true"
            ERRORS=""
            SUGGESTED=$(jq -r '.suggested_name // ""' /tmp/validation-result.json 2>/dev/null || echo "")
          else
            VALID="false"
            ERRORS=$(jq -r '.errors | join(", ") // "validation_failed"' /tmp/validation-result.json 2>/dev/null || echo "validation_failed")
            SUGGESTED=$(jq -r '.suggested_name // ""' /tmp/validation-result.json 2>/dev/null || echo "")
          fi

          echo "valid=$VALID" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "suggested_name=$SUGGESTED" >> $GITHUB_OUTPUT

          echo "Final values: valid=$VALID, errors=$ERRORS, suggested=$SUGGESTED"

      - name: Collect validation metrics
        if: always()
        run: |
          BRANCH_NAME="${{ steps.extract-branch.outputs.branch_name }}"
          VALID="${{ steps.validate.outputs.valid }}"
          ERRORS="${{ steps.validate.outputs.errors }}"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          # Create metrics JSON
          METRICS="{
            \"timestamp\": \"$TIMESTAMP\",
            \"branch_name\": \"$BRANCH_NAME\",
            \"valid\": $VALID,
            \"errors\": \"$ERRORS\",
            \"actor\": \"$GITHUB_ACTOR\",
            \"event\": \"$GITHUB_EVENT_NAME\",
            \"ref\": \"$GITHUB_REF\",
            \"sha\": \"$GITHUB_SHA\"
          }"

          # Create metrics directory
          mkdir -p validation-metrics

          # Write metric to file with timestamp
          FILENAME="validation-metrics/$(date +'%Y%m%d-%H%M%S')-$GITHUB_RUN_ID.json"
          echo "$METRICS" > "$FILENAME"

          echo "Metrics collected: $FILENAME"
          cat "$FILENAME"

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-validation-metrics
          path: validation-metrics/
          retention-days: 30

      - name: Set job status based on validation
        if: always()
        run: |
          VALID="${{ steps.validate.outputs.valid }}"

          if [ "$VALID" = "true" ]; then
            echo "✅ Branch name validation passed"
            exit 0
          else
            echo "❌ Branch name validation failed"
            exit 1
          fi

  report-validation-failure:
    name: Report validation failure
    needs: validate-branch-name
    if: failure() && needs.validate-branch-name.outputs.valid == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR with validation error
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const errors = process.env.ERRORS;
            const suggested = process.env.SUGGESTED;

            const message = [
              `❌ **Invalid branch name: \`${branchName}\`**`,
              '',
              `**Error:** ${errors}`,
              suggested ? `**Suggestion:** Did you mean \`${suggested}\`?` : '',
              '',
              '**Pattern:** `{type}/{scope}-{title}`',
              '',
              '**Allowed types (24):** feat, fix, hotfix, release, refactor, chore, task, docs, test, perf, ci, build, deps, security, design, a11y, ux, i18n, ops, proto, ds, audit, codex, revert, research',
              '',
              '**Forbidden prefixes:** claude/, copilot/, openai/',
              '',
              'For more information, see [Branch Naming Strategy](./docs/BRANCHING_STRATEGY.md).'
            ].filter(line => line !== '').join('\n');

            // Only comment if this is a PR
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }
        env:
          BRANCH_NAME: ${{ needs.validate-branch-name.outputs.branch_name }}
          ERRORS: ${{ needs.validate-branch-name.outputs.errors }}
          SUGGESTED: ${{ needs.validate-branch-name.outputs.suggested_name }}
