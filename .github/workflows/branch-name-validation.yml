name: Branch Name Validation

on:
  push:
    branches:
      - "**"
      # The metrics aggregator pushes this fixed bot branch after every run
      # of this workflow; validating it re-triggers the aggregator, which
      # looped ~450 times a day (see #3474).
      - "!chore/branch-validation-metrics"

# Read-only: the job calls no GitHub API (artifact upload uses the runner's
# own token), so no write scopes are granted.
permissions:
  contents: read

# One validation per branch at a time; a newer push supersedes the old run.
concurrency:
  group: branch-name-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The validator only needs its own two files and uses no git history or
      # npm packages, so a sparse, shallow checkout without an install suffices.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/validation
            lib

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Extract branch name
        id: extract-branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      # Branch names can contain shell metacharacters ($, parentheses), so
      # every value derived from them is passed through env, never inlined.
      - name: Validate branch name
        id: validate
        timeout-minutes: 2
        env:
          BRANCH_NAME: ${{ steps.extract-branch.outputs.branch_name }}
        run: |
          echo "🔍 Validating: $BRANCH_NAME"

          # Capture stdout only: Node warnings on stderr made the combined
          # output unparseable, so `errors` was never set and the metrics
          # error breakdown was always zero.
          set +e
          OUTPUT=$(timeout 30s node scripts/validation/validate-branch-name.js --branch "$BRANCH_NAME" --json 2>validator-stderr.log)
          EXIT_CODE=$?
          set -e

          echo "--- Validation Output ---"
          echo "$OUTPUT"
          if [ -s validator-stderr.log ]; then echo "--- stderr ---"; cat validator-stderr.log; fi
          echo "--- Exit Code: $EXIT_CODE ---"

          # Use jq to extract valid field if jq is available and output looks like JSON
          if command -v jq &> /dev/null && echo "$OUTPUT" | jq empty &> /dev/null 2>&1; then
            echo "Using jq to parse JSON"
            VALID=$(echo "$OUTPUT" | jq -r '.valid')
            ERRORS=$(echo "$OUTPUT" | jq -r '.errors | join(", ")')
            SUGGESTED=$(echo "$OUTPUT" | jq -r '.suggested_name // empty')

            echo "valid=$VALID" >> $GITHUB_OUTPUT
            [ -n "$ERRORS" ] && echo "errors=$ERRORS" >> $GITHUB_OUTPUT
            [ -n "$SUGGESTED" ] && echo "suggested_name=$SUGGESTED" >> $GITHUB_OUTPUT
          else
            # Fallback: simple string matching
            echo "Using fallback parsing"
            if echo "$OUTPUT" | grep -q '"valid": true'; then
              echo "valid=true" >> $GITHUB_OUTPUT
            else
              echo "valid=false" >> $GITHUB_OUTPUT
            fi
          fi

          # Exit with the validation script's exit code
          exit $EXIT_CODE

      - name: Collect validation metrics
        if: always()
        env:
          BRANCH_NAME: ${{ steps.extract-branch.outputs.branch_name }}
          VALID: ${{ steps.validate.outputs.valid }}
          ERRORS: ${{ steps.validate.outputs.errors }}
        run: |
          mkdir -p validation-metrics
          FILENAME="validation-metrics/$(date +'%Y%m%d-%H%M%S')-$GITHUB_RUN_ID.json"

          # jq builds the JSON so quotes or backslashes in branch names or
          # error text cannot corrupt the metrics file.
          jq -n \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg branch_name "$BRANCH_NAME" \
            --argjson valid "$([ "$VALID" = "true" ] && echo true || echo false)" \
            --arg errors "$ERRORS" \
            --arg actor "$GITHUB_ACTOR" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            '{timestamp: $timestamp, branch_name: $branch_name, valid: $valid, errors: $errors, actor: $actor, event: $event, ref: $ref, sha: $sha}' \
            > "$FILENAME"

          echo "Metrics collected: $FILENAME"
          cat "$FILENAME"

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-validation-metrics
          path: validation-metrics/
          retention-days: 30

      - name: Set job status based on validation
        if: always()
        env:
          VALID: ${{ steps.validate.outputs.valid }}
        run: |
          if [ "$VALID" = "true" ]; then
            echo "✅ Branch name validation passed"
            exit 0
          else
            echo "❌ Branch name validation failed (VALID='$VALID')"
            exit 1
          fi
