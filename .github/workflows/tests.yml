name: Tests

# Runs the Jest suite on every PR and fails only on failures the PR
# introduces: develop still carries known failures (#3472), so the head and
# base are tested in parallel and compared. Once #3472 clears the baseline,
# this can gate on zero failures instead (#3479).

on:
  # No paths filter: this backs a status check, and a filtered-out run
  # never reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # ci-scope.sh reads the earlier result of the same check.
  checks: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      mode: ${{ steps.scope.outputs.mode }}
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - name: Checkout changed files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CHECK_NAME: No new test failures
          GH_TOKEN: ${{ github.token }}
        run: |
          # The rules live in scripts/workflows/ci-scope.sh, shared with the
          # lint checks. A change to prose alone runs only the tests that
          # depend on prose (mode=prose); the list is passed to both targets
          # so head and base run the same tests.
          bash scripts/workflows/ci-scope.sh jest > "$RUNNER_TEMP/tests-scope"
          cat "$RUNNER_TEMP/tests-scope"
          if grep -qx 'run=false' "$RUNNER_TEMP/tests-scope"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qx 'mode=prose' "$RUNNER_TEMP/tests-scope"; then
            echo "tests=$(node scripts/workflows/jest-prose-tests.cjs --list)" >> "$GITHUB_OUTPUT"
          fi

  jest:
    name: Jest (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [head, base]
        exclude:
          # No base to compare against outside a pull request.
          - target: ${{ github.event_name != 'pull_request' && 'base' || 'none' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          # head: the PR merge commit (default); base: the PR base commit.
          ref: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Run Jest
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          SCOPE_TESTS: ${{ needs.scope.outputs.tests }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          # Failing tests are expected on develop; the compare job decides.
          # A missing or invalid report fails closed there.
          jest_status=0
          jest_args=()
          if [ "$SCOPE_MODE" = "prose" ] && [ -n "$SCOPE_TESTS" ]; then
            # A prose-only change: run the tests that depend on prose.
            read -r -a jest_args <<< "$SCOPE_TESTS"
            jest_args+=(--passWithNoTests)
          elif [ "$MATRIX_TARGET" = "head" ] && [ -f scripts/workflows/jest-read-tracer.cjs ]; then
            # A full run records what the suite reads, so the list of
            # prose-dependent tests can be checked below.
            export JEST_READ_TRACE_FILE="$RUNNER_TEMP/jest-reads.tsv"
            export JEST_READ_TRACE_ROOT="$PWD"
            export NODE_OPTIONS="--require=$PWD/scripts/workflows/jest-read-tracer.cjs"
          fi
          npx jest --config .jest.config.cjs --ci --coverage=false \
            --json --outputFile=jest-report.json "${jest_args[@]}" || jest_status=$?
          unset NODE_OPTIONS
          jq -r '"suites=\(.numTotalTestSuites) failed_suites=\(.numFailedTestSuites) tests=\(.numTotalTests) failed=\(.numFailedTests)"' \
            jest-report.json 2>/dev/null || echo "::warning::No Jest report was written"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && { [ "$jest_status" -ne 0 ] || [ ! -s jest-report.json ]; }; then
            exit 1
          fi

      - name: Run the node:test suites
        # CommonJS suites that Jest cannot run (see test:cjs-node in package.json). They are not
        # part of the head and base comparison, so only head runs them, and they pass as a set.
        # A prose-only change runs only the Jest tests that read prose.
        if: matrix.target == 'head' && needs.scope.outputs.mode != 'prose'
        run: npm run test:cjs-node

      - name: Check the suite left the working tree clean
        run: |
          # Tests must not write into the repository (#3482). Warning only
          # until that is fixed.
          dirty=$(git status --porcelain -- . ':!jest-report.json')
          if [ -n "$dirty" ]; then
            echo "::warning::Jest modified the working tree (#3482):"
            printf '%s\n' "$dirty"
          fi

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-report-${{ matrix.target }}
          path: jest-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Check the list of tests that depend on prose
        if: matrix.target == 'head' && needs.scope.outputs.mode != 'prose'
        run: |
          # A test that starts reading Markdown must be added to the list,
          # or a later prose-only change would not run it.
          if [ -s "$RUNNER_TEMP/jest-reads.tsv" ]; then
            node scripts/workflows/jest-prose-tests.cjs --check "$RUNNER_TEMP/jest-reads.tsv"
          else
            echo "::error::No read trace was written, so the list cannot be checked."
            exit 1
          fi

  compare:
    name: No new test failures
    needs: [scope, jest]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record base for later test scope decisions
        if: needs.scope.result == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: printf '::notice file=scripts/workflows/ci-scope.sh,line=1,title=CI scope base::%s\n' "$BASE_SHA"

      - name: Fail when a Jest job failed
        if: needs.jest.result == 'failure'
        run: |
          echo "::error::A Jest job failed. See its log; the list of prose-dependent tests may be out of date."
          exit 1

      - name: Report documentation-only skip
        if: needs.scope.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only pull request; Jest comparison skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout comparison script
        if: needs.scope.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/validation

      - name: Download reports
        if: needs.scope.outputs.docs_only != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jest-report-*
          path: reports

      - name: Compare head with base
        if: needs.scope.outputs.docs_only != 'true'
        run: |
          set -o pipefail
          for target in head base; do
            if ! jq -e '.testResults | type == "array"' "reports/jest-report-$target/jest-report.json" >/dev/null 2>&1; then
              echo "::error::Missing or invalid Jest report for $target; failing closed."
              exit 1
            fi
          done
          # Both jobs check out to the same workspace path, so one root
          # makes their test paths comparable. The default shell is
          # bash -e: suspend errexit so a non-zero result still reaches the
          # summary below.
          set +e
          node scripts/validation/compare-jest-failures.cjs \
            --head reports/jest-report-head/jest-report.json --head-root "$GITHUB_WORKSPACE" \
            --base reports/jest-report-base/jest-report.json --base-root "$GITHUB_WORKSPACE" \
            | tee comparison.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Test comparison (head vs base)"
            echo
            echo '```'
            cat comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
