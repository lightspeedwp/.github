name: Issue Close Label Hygiene

if: false
on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  remove-needs-triage:
    name: Remove status:needs-triage from closed issues
    runs-on: ubuntu-latest
    steps:
      - name: Remove status:needs-triage label if present
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              core.info('No issue payload found; skipping.');
              return;
            }

            const hasNeedsTriage = (issue.labels || []).some(
              (label) => label.name === 'status:needs-triage',
            );

            if (!hasNeedsTriage) {
              core.info(`Issue #${issue.number} has no status:needs-triage label; nothing to remove.`);
              return;
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              name: 'status:needs-triage',
            });

            core.info(`Removed status:needs-triage from closed issue #${issue.number}.`);
