name: Workflow Lint

# Static checks for GitHub Actions workflow files: actionlint covers workflow
# schema, expression types, action inputs and script-injection checks, and
# pipes inline `run:` scripts through shellcheck when available.
# See https://github.com/rhysd/actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Read-only job: nothing pushes, so do not persist credentials.
          persist-credentials: false

      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz from the release
          # assets (actionlint_1.7.12_checksums.txt). Update both together.
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Run actionlint on active workflows
        env:
          # shellcheck is preinstalled on ubuntu runners; error-level only
          # so pre-existing style findings elsewhere do not gate this check.
          SHELLCHECK_OPTS: --severity=error
        run: |
          # Explicit file list, not repo-wide. Archived workflows are
          # frozen history and stay unlinted. changelog-unified.yml and
          # pr-template-routing.yml pass branch-derived data via env, not
          # inline expansion, and are linted.
          ./actionlint -shellcheck="$(command -v shellcheck || true)" \
            .github/workflows/branch-name-validation.yml \
            .github/workflows/branch-validation-metrics-aggregator.yml \
            .github/workflows/changelog-unified.yml \
            .github/workflows/documentation.yml \
            .github/workflows/pr-template-routing.yml \
            .github/workflows/validate-specifications.yml \
            .github/workflows/workflow-lint.yml
