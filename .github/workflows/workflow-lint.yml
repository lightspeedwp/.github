name: Workflow Lint

# Static checks for GitHub Actions workflow files: actionlint covers workflow
# schema, expression types, action inputs and script-injection checks, and
# pipes inline `run:` scripts through shellcheck when available.
# See https://github.com/rhysd/actionlint

on:
  # No paths filter on pull_request: this workflow backs the required
  # "actionlint" status check, and a filtered-out run never reports,
  # leaving the check at "Expected" forever. The job itself is seconds.
  pull_request:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      # The same files scripts/workflows/ci-scope.sh treats as relevant to actionlint:
      # a changed local action can break the workflows that call it.
      - '**/action.yml'
      - '**/action.yaml'
      - 'scripts/validation/run-actionlint.cjs'
      - 'scripts/workflows/ci-scope.sh'

permissions:
  contents: read
  # ci-scope.sh reads the earlier result of the same check.
  checks: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: nothing pushes, so do not persist credentials.
          persist-credentials: false
          # ci-scope.sh compares commits, so it needs history.
          fetch-depth: 0
          # Workflow files and local actions, plus the shared actionlint
          # script: the step below runs `npm run lint:actionlint`, which lives
          # in scripts/validation. Cone mode always includes root files, so
          # package.json resolves even though it is not listed here.
          #
          # Local actions must live under .github/actions. actionlint skips the
          # input checks for a local action whose metadata file is missing, and says
          # nothing, so an action outside this checkout would pass unchecked. A test
          # in scripts/validation/__tests__/workflow-lint-active-files.test.js fails
          # if a workflow uses a local action from anywhere else.
          sparse-checkout: |
            .github
            scripts/validation
            scripts/workflows

      - name: Decide whether this check has anything to do
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CHECK_NAME: actionlint
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/workflows/ci-scope.sh actionlint

      - name: Download actionlint
        if: steps.scope.outputs.run == 'true'
        env:
          ACTIONLINT_VERSION: '1.7.12'
          # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz from the release
          # assets (actionlint_1.7.12_checksums.txt). Update both together.
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Run actionlint on active workflows
        if: steps.scope.outputs.run == 'true'
        # Delegates to npm run lint:actionlint, which runs
        # scripts/validation/run-actionlint.cjs. That script holds the
        # suppression list and reads the file list from .github/workflows, so
        # the required CI gate and the local command cannot drift apart and a
        # new workflow is checked from the day it lands. It uses the
        # ./actionlint downloaded above on Linux x64 when none is on PATH.
        run: npm run lint:actionlint
