name: 'Issue Types Sync'

on:
    schedule:
        - cron: '0 2 * * 2' # Run every Tuesday at 2 AM UTC
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Run in dry-run mode (no changes applied)'
                type: boolean
                default: false
            strict_prune:
                description: 'Strictly prune non-standard issue types'
                type: boolean
                default: false
            only:
                description: 'Specific repo to sync (leave blank for all)'
                required: false
                default: ''

permissions:
    contents: read
    issues: write

jobs:
    sync-issue-types:
        runs-on: ubuntu-latest
        name: Sync Issue Types
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Set up GitHub CLI
              run: |
                  gh --version
              env:
                  GH_TOKEN: ${{ secrets.ORGANIZATION_PAT }}
            - name: Run Issue Types Sync Script
              run: |
                  chmod +x ./scripts/maintenance/manage-issue-types.sh
                  ./scripts/maintenance/manage-issue-types.sh
              env:
                  GITHUB_TOKEN: ${{ secrets.ORGANIZATION_PAT }}
                  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
                  STRICT_PRUNE: ${{ github.event.inputs.strict_prune || 'false' }}
                  ONLY: ${{ github.event.inputs.only || '' }}
            - name: Create summary
              run: |
                  echo '## Issue Types Sync Results' >> $GITHUB_STEP_SUMMARY
                  echo '' >> $GITHUB_STEP_SUMMARY
                  echo 'Synced issue types according to organization-wide conventions.' >> $GITHUB_STEP_SUMMARY
                  echo 'See job logs for details.' >> $GITHUB_STEP_SUMMARY
