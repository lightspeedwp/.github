name: Release on Tag

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        name: Create Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Build plugin
              run: npm run build

            - name: Create plugin ZIP
              run: npm run plugin-zip

            - name: Extract tag name
              id: tag
              run: echo "tag-name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  name: Release ${{ steps.tag.outputs.tag-name }}
                  draft: false
                  prerelease: false
                  files: |
                      copyright-date-block.zip
                  body: |
                      ## Changes in ${{ steps.tag.outputs.tag-name }}

                      See the [changelog](CHANGELOG.md) for details.

                      ## Installation

                      1. Download the `copyright-date-block.zip` file from the assets below
                      2. Go to your WordPress admin → Plugins → Add New → Upload Plugin
                      3. Choose the downloaded ZIP file and click "Install Now"
                      4. Activate the plugin

                      ## Usage

                      Add the Copyright Date Block to any post or page using the block editor. The block will automatically display the current year and can be configured to show a date range.
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
