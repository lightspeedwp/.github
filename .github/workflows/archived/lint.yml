name: Lint Code

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_call:

permissions:
    contents: read

jobs:
    shellcheck:
        name: ShellCheck
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Install ShellCheck
              run: |
                  sudo apt-get update
                  sudo apt-get install -y shellcheck

            - name: Run ShellCheck on scripts
              run: |
                  echo "Running ShellCheck on shell scripts..."
                  find scripts/ -name "*.sh" -type f | while read -r script; do
                    echo "Checking: $script"
                    shellcheck "$script" || exit 1
                  done

                  # Also check any shell scripts in root
                  find . -maxdepth 1 -name "*.sh" -type f | while read -r script; do
                    echo "Checking: $script"
                    shellcheck "$script" || exit 1
                  done

            - name: Run ShellCheck on test scripts
              run: |
                  echo "Running ShellCheck on test scripts..."
                  find tests/ -name "*.sh" -type f | while read -r script; do
                    echo "Checking: $script"
                    shellcheck "$script" || exit 1
                  done

    markdown:
        name: Markdown Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Install markdownlint-cli
              run: npm install -g markdownlint-cli

            - name: Run markdownlint
              run: |
                  # Create markdownlint config if it doesn't exist
                  if [ ! -f ".markdownlint.json" ]; then
                    cat > .markdownlint.json << 'EOF'
                  {
                    "default": true,
                    "MD013": false,
                    "MD033": false,
                    "MD041": false
                  }
                  EOF
                  fi

                  markdownlint README.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md || true
                  echo "Markdown linting completed"

    validate-syntax:
        name: Validate Script Syntax
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Validate shell script syntax
              run: |
                  echo "Validating shell script syntax..."
                  for script in scripts/*.sh; do
                    if [ -f "$script" ]; then
                      echo "Validating syntax: $script"
                      bash -n "$script"
                    fi
                  done

                  for script in tests/*.sh; do
                    if [ -f "$script" ]; then
                      echo "Validating syntax: $script"
                      bash -n "$script"
                    fi
                  done
