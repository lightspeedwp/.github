name: 'Issue Types Project Sync'

on:
    workflow_dispatch:
    schedule:
        - cron: '0 5 * * 1' # Every Monday at 5 AM UTC

permissions:
    contents: read
    issues: write

jobs:
    sync-issue-types:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Run Issue Types Sync Script
              run: |
                  chmod +x ./scripts/maintenance/manage-issue-types.sh
                  ./scripts/maintenance/manage-issue-types.sh
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DRY_RUN: false
                  STRICT_PRUNE: false
            - name: Create summary
              run: |
                  echo '## Issue Types Project Sync Results' >> $GITHUB_STEP_SUMMARY
                  echo 'Synced issue types to project according to org-wide conventions.' >> $GITHUB_STEP_SUMMARY
