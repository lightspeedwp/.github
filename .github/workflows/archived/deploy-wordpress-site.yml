name: Deploy WordPress Site

on:
    workflow_call:
        inputs:
            environment:
                description: 'Target environment (staging, production)'
                required: true
                type: string
            site-url:
                description: 'WordPress site URL'
                required: true
                type: string
            php-version:
                description: 'PHP version to use'
                required: false
                type: string
                default: '8.1'
            wp-version:
                description: 'WordPress version'
                required: false
                type: string
                default: 'latest'
        secrets:
            DEPLOY_SSH_KEY:
                description: 'SSH private key for deployment server'
                required: true
            WP_DATABASE_URL:
                description: 'WordPress database connection URL'
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ inputs.php-version }}
                  extensions: mbstring, xml, ctype, json, tokenizer, openssl, pdo, mysql

            - name: Install Composer dependencies
              run: composer install --no-dev --optimize-autoloader

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install and build assets
              run: |
                  npm ci
                  npm run build:production

            - name: Configure SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -H ${{ inputs.site-url }} >> ~/.ssh/known_hosts

            - name: Deploy to server
              run: |
                  echo "Deploying to ${{ inputs.environment }}"
                  echo "Site URL: ${{ inputs.site-url }}"
                  # Add your deployment commands here
                  # rsync -avz --delete ./ user@server:/path/to/site/

            - name: Run post-deployment checks
              run: |
                  echo "Running health checks..."
                  # Add health check commands here

            - name: Notify deployment status
              if: always()
              run: |
                  if [ "${{ job.status }}" = "success" ]; then
                    echo "✅ Deployment to ${{ inputs.environment }} completed successfully"
                  else
                    echo "❌ Deployment to ${{ inputs.environment }} failed"
                  fi
