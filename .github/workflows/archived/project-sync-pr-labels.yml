name: 'PR Labels Project Sync'

on:
    workflow_dispatch:
    schedule:
        - cron: '0 3 * * 1' # Every Monday at 3 AM UTC

permissions:
    contents: read
    pull-requests: write

jobs:
    sync-pr-labels:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Run Label Standardization Agent
              run: node .github/agents/label-standardization-agent.js
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DRY_RUN: false
                  VERBOSE: true
            - name: Create summary
              run: |
                  echo '## PR Labels Project Sync Results' >> $GITHUB_STEP_SUMMARY
                  echo 'Synced PR labels to project according to org-wide conventions.' >> $GITHUB_STEP_SUMMARY
