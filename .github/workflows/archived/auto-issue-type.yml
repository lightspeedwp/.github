name: 'Auto Issue Type'

on:
    issues:
        types: [opened, reopened]
    workflow_call:

permissions:
    contents: read
    issues: write
    repository-projects: write

jobs:
    assign-issue-type:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm install @octokit/graphql

            - name: Assign Issue Type
              uses: actions/github-script@v7
              with:
                  script: |
                      const { graphql } = require('@octokit/graphql');
                      const graphqlWithAuth = graphql.defaults({
                          headers: {
                              authorization: `token ${{ secrets.GITHUB_TOKEN }}`,
                          },
                      });

                      const issueNumber = context.payload.issue.number;
                      const issueTitle = context.payload.issue.title;
                      const issueBody = context.payload.issue.body || '';
                      const issueLabels = context.payload.issue.labels.map(label => label.name);

                      console.log(`Processing issue #${issueNumber}: ${issueTitle}`);
                      console.log(`Labels: ${issueLabels.join(', ')}`);

                      // Determine issue type based on template metadata, labels, title, and content
                      let issueType = '';

                      // First check for template metadata type field (highest priority)
                      if (issueBody) {
                          // Look for type: 'value' pattern in issue body (from templates)
                          const typeMatch = issueBody.match(/type:\s*['"]([^'"]+)['"]/);
                          if (typeMatch && typeMatch[1]) {
                              const templateType = typeMatch[1].toLowerCase();
                              console.log(`Found template type: ${templateType}`);

                              // Map template type to standardized type per org-wide-issue-types-v1-9.md
                              switch (templateType) {
                                  case 'bug': issueType = 'Bug'; break;
                                  case 'feature': issueType = 'Feature'; break;
                                  case 'enhancement': issueType = 'Feature'; break;
                                  case 'documentation': issueType = 'Documentation'; break;
                                  case 'refactor': issueType = 'Refactor'; break;
                                  case 'task': issueType = 'Task'; break;
                                  case 'ux': issueType = 'Design'; break;
                                  case 'question': issueType = 'Task'; break;
                                  case 'performance': issueType = 'Improvement'; break;
                                  case 'integration': issueType = 'Story'; break;
                              }
                          }
                      }

                      // If no type from metadata, check labels next
                      if (!issueType) {
                          if (issueLabels.includes('bug')) {
                              issueType = 'Bug';
                          } else if (issueLabels.includes('enhancement')) {
                              // Check title/body for more specific type
                              if (issueTitle.toLowerCase().includes('epic') || 
                                  issueBody.toLowerCase().includes('epic')) {
                                  issueType = 'Epic';
                              } else if (issueTitle.toLowerCase().includes('feature') ||
                                        issueBody.toLowerCase().includes('feature')) {
                                  issueType = 'Feature';
                              } else {
                                  issueType = 'Story';
                              }
                          } else if (issueLabels.includes('documentation')) {
                              issueType = 'Documentation';
                          } else if (issueLabels.includes('refactor')) {
                              issueType = 'Refactor';
                          } else if (issueBody.toLowerCase().includes('design') || 
                                    issueTitle.toLowerCase().includes('design')) {
                              issueType = 'Design';
                          } else if (issueTitle.startsWith('[TEST]') || 
                                    issueBody.toLowerCase().includes('test')) {
                              issueType = 'Task';
                          } else {
                              // Default type
                              issueType = 'Task';
                          }
                      }

                      console.log(`Determined issue type: ${issueType}`);

                      // Find organization/repository information
                      const orgName = context.payload.repository.owner.login;
                      const repoName = context.payload.repository.name;

                      // Step 1: Get all projects for the repository
                      try {
                          // Get the organization's projects
                          const projectsQuery = `
                              query($orgName: String!, $repoName: String!) {
                                  organization(login: $orgName) {
                                      projectsV2(first: 10) {
                                          nodes {
                                              id
                                              number
                                              title
                                              fields(first: 20) {
                                                  nodes {
                                                      ... on ProjectV2SingleSelectField {
                                                          id
                                                          name
                                                          options {
                                                              id
                                                              name
                                                          }
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          `;

                          const projectsResult = await graphqlWithAuth(projectsQuery, {
                              orgName,
                              repoName
                          });

                          console.log("Retrieved projects:", JSON.stringify(projectsResult.organization.projectsV2.nodes.length));

                          // Find projects with Issue Type field
                          const projects = projectsResult.organization.projectsV2.nodes.filter(project => {
                              return project.fields.nodes.some(field => field.name === 'Issue Type');
                          });

                          if (projects.length === 0) {
                              console.log("No projects with Issue Type field found");
                              return;
                          }

                          console.log(`Found ${projects.length} projects with Issue Type field`);

                          // For each project
                          for (const project of projects) {
                              console.log(`Processing project: ${project.title} (#${project.number})`);

                              // Get the Issue Type field
                              const issueTypeField = project.fields.nodes.find(field => field.name === 'Issue Type');
                              if (!issueTypeField) continue;

                              // Find the option that matches our determined issue type
                              const option = issueTypeField.options.find(opt => opt.name === issueType);
                              if (!option) {
                                  console.log(`Issue type "${issueType}" not found in project #${project.number}`);
                                  continue;
                              }

                              // Step 2: Check if issue is already in project
                              const itemsQuery = `
                                  query($projectId: ID!, $issueId: ID!) {
                                      node(id: $projectId) {
                                          ... on ProjectV2 {
                                              items(first: 1, filters: {idPaths: [$issueId]}) {
                                                  nodes {
                                                      id
                                                  }
                                              }
                                          }
                                      }
                                  }
                              `;

                              // Get issue ID
                              const issueResult = await graphqlWithAuth(`
                                  query($orgName: String!, $repoName: String!, $issueNumber: Int!) {
                                      repository(owner: $orgName, name: $repoName) {
                                          issue(number: $issueNumber) {
                                              id
                                          }
                                      }
                                  }
                              `, {
                                  orgName,
                                  repoName,
                                  issueNumber
                              });

                              const issueId = issueResult.repository.issue.id;

                              // Check if issue is in project
                              const itemsResult = await graphqlWithAuth(itemsQuery, {
                                  projectId: project.id,
                                  issueId
                              });

                              const items = itemsResult.node.items.nodes;

                              if (items.length === 0) {
                                  // Step 3: Add issue to project if not already there
                                  console.log(`Adding issue #${issueNumber} to project #${project.number}`);

                                  const addResult = await graphqlWithAuth(`
                                      mutation($projectId: ID!, $contentId: ID!) {
                                          addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                                              item {
                                                  id
                                              }
                                          }
                                      }
                                  `, {
                                      projectId: project.id,
                                      contentId: issueId
                                  });

                                  const itemId = addResult.addProjectV2ItemById.item.id;

                                  // Step 4: Set the Issue Type field
                                  console.log(`Setting issue type to "${issueType}" for issue #${issueNumber} in project #${project.number}`);

                                  await graphqlWithAuth(`
                                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                                          updateProjectV2ItemFieldValue(input: {
                                              projectId: $projectId,
                                              itemId: $itemId,
                                              fieldId: $fieldId,
                                              value: { 
                                                  singleSelectOptionId: $optionId
                                              }
                                          }) {
                                              projectV2Item {
                                                  id
                                              }
                                          }
                                      }
                                  `, {
                                      projectId: project.id,
                                      itemId,
                                      fieldId: issueTypeField.id,
                                      optionId: option.id
                                  });

                                  console.log(`Successfully set issue type for issue #${issueNumber} in project #${project.number}`);
                              } else {
                                  // Update the existing item
                                  const itemId = items[0].id;

                                  console.log(`Issue #${issueNumber} already exists in project #${project.number}, updating issue type`);

                                  await graphqlWithAuth(`
                                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                                          updateProjectV2ItemFieldValue(input: {
                                              projectId: $projectId,
                                              itemId: $itemId,
                                              fieldId: $fieldId,
                                              value: { 
                                                  singleSelectOptionId: $optionId
                                              }
                                          }) {
                                              projectV2Item {
                                                  id
                                              }
                                          }
                                      }
                                  `, {
                                      projectId: project.id,
                                      itemId,
                                      fieldId: issueTypeField.id,
                                      optionId: option.id
                                  });

                                  console.log(`Successfully updated issue type for issue #${issueNumber} in project #${project.number}`);
                              }
                          }
                      } catch (error) {
                          console.error("Error processing issue:", error);
                      }
