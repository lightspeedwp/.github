name: Awesome GitHub Site

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: "Who requested the manual run"
        required: true
        type: string
      reason:
        description: "Why the manual run is being triggered"
        required: true
        type: string
      run_ci:
        description: "Whether to run the build job"
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/awesome-github-site.yml"
  push:
    branches:
      - develop
    paths:
      - "website/**"
      - ".github/workflows/awesome-github-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: awesome-github-site-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Log manual dispatch context
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "requested_by=${{ inputs.requested_by }}"
          echo "reason=${{ inputs.reason }}"
          echo "run_ci=${{ inputs.run_ci }}"
          echo "run_ci type check: inputs.run_ci == 'true' evaluates to ${{ inputs.run_ci == 'true' }}"

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.run_ci
        run: npm ci --legacy-peer-deps

      - name: Build site
        if: github.event_name != 'workflow_dispatch' || inputs.run_ci
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && inputs.run_ci)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
