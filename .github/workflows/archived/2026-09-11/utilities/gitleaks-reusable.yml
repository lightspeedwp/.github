name: gitleaks (reusable)

# Secret scanning with the open-source gitleaks CLI (MIT). The binary is used
# directly, so no paid gitleaks organisation licence is required.
#
# The pinned release and its checksum are updated together by
# .github/workflows/gitleaks-update.yml. Never resolve "latest" at run time.

on:
  workflow_call:
    inputs:
      full-history:
        description: Scan the full git history instead of the working tree.
        type: boolean
        default: false
      runner:
        description: >-
          JSON runner selection for the scan job. Either a JSON string such as
          '"ubuntu-latest"' or a JSON array such as
          '["self-hosted","linux","x64","dependency-ci"]'. Defaults to the
          GitHub-hosted runner so existing callers are unaffected.
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.full-history && '0' || '1' }}
          persist-credentials: false
          submodules: false

      - name: Install gitleaks from a checksum-verified download
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          echo "GITLEAKS_TMP=${tmp}" >> "$GITHUB_ENV"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --output "${tmp}/${tarball}" "${url}"
          echo "${GITLEAKS_SHA256}  ${tmp}/${tarball}" | sha256sum --check --status
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" gitleaks
          chmod 0755 "${tmp}/gitleaks"
          "${tmp}/gitleaks" version

      - name: Scan
        env:
          FULL_HISTORY: ${{ inputs.full-history }}
        run: |
          set -euo pipefail
          config=()
          if [ -f .gitleaks.toml ]; then
            config=(--config .gitleaks.toml)
          fi
          if [ "${FULL_HISTORY}" = "true" ]; then
            "${GITLEAKS_TMP}/gitleaks" git . "${config[@]}" --redact --verbose
          else
            "${GITLEAKS_TMP}/gitleaks" dir . "${config[@]}" --redact --verbose
          fi

      - name: Remove temporary files
        if: always()
        run: rm -rf "${GITLEAKS_TMP:-/nonexistent}"
