# Example reusable workflow (org-level) to sync labels across repos.
# Uses a maintained action; run from a meta repo, not per project repo.
name: org-label-sync

on:
    workflow_dispatch:
    schedule:
        - cron: '0 2 * * 0'

permissions:
    contents: read
    issues: write
    pull-requests: write
    administration: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Sync labels (micnncim/action-label-syncer)
              uses: micnncim/action-label-syncer@v1
              with:
                  manifest: .github/labels.yml
              env:
                  GITHUB_TOKEN: ${{ secrets.ORGANIZATION_PAT }}
