name: Spectral Lint

on:
  push:
    paths:
      - '**/openapi.yaml'
      - '.spectral.yaml'
      - '.github/workflows/spectral-lint.yml'
  pull_request:
    paths:
      - '**/openapi.yaml'
      - '.spectral.yaml'
      - '.github/workflows/spectral-lint.yml'

jobs:
  spectral-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Spectral lint
        run: npx spectral lint openapi.yaml
