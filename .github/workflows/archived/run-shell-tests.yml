name: Run Shell Script Tests

on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up Bats
              uses: bats-core/bats-action@master
            - name: Run Bats tests
              run: |
                  bats __tests__/*.bats
                  bats tests/*.bats
