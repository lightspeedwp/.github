name: Block Build & E2E

on:
  pull_request:
    paths:
      - 'package.json'
      - 'src/**'
      - 'block.json'
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run agent (build & e2e if configured)
        run: node .github/agents/wp-block-build-agent.js
