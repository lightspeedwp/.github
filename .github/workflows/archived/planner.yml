name: planner
on:
    pull_request:
        types: [opened, edited, synchronize]
jobs:
    planner:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Planner
              run: node agents/planner.agent.js
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
