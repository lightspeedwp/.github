name: Update Project Fields YAML
on:
  push:
    paths:
      - 'scripts/projects/fixtures/**'   # whenever a CSV fixture is changed
jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq yq
      - name: Generate project-fields.yml
        run: scripts/projects/build-project-fields-yml.sh
      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update project-fields.yml from fixtures"
          file_pattern: ".github/automation/project-fields.yml"
