name: Label Audit Report

on:
  schedule:
    - cron: "0 4 1 * *" # Monthly 1st at 4 AM UTC
  workflow_dispatch:
    inputs:
      format:
        description: "Report format"
        required: false
        default: "markdown"
        type: choice
        options:
          - markdown
          - json
          - csv
      verbose:
        description: "Enable verbose logging"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  audit-labels:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p .github/reports/audits

      - name: Generate meta label audit (scheduled)
        if: github.event_name == 'schedule'
        run: |
          node scripts/automation/review-meta-labels.js \
            --verbose \
            --format markdown \
            -o .github/reports/audits/meta-labels-audit-$(date +%Y-%m-%d).md

      - name: Generate status label audit (scheduled)
        if: github.event_name == 'schedule'
        run: |
          node scripts/automation/review-status-labels.js \
            --verbose \
            --format markdown \
            -o .github/reports/audits/status-labels-audit-$(date +%Y-%m-%d).md

      - name: Generate meta label audit (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          FORMAT: ${{ github.event.inputs.format }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          VERBOSE_FLAG=""
          [ "$VERBOSE" = "true" ] && VERBOSE_FLAG="--verbose"
          node scripts/automation/review-meta-labels.js \
            $VERBOSE_FLAG \
            --format $FORMAT \
            -o .github/reports/audits/meta-labels-audit-manual.${FORMAT}

      - name: Generate status label audit (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          FORMAT: ${{ github.event.inputs.format }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          VERBOSE_FLAG=""
          [ "$VERBOSE" = "true" ] && VERBOSE_FLAG="--verbose"
          node scripts/automation/review-status-labels.js \
            $VERBOSE_FLAG \
            --format $FORMAT \
            -o .github/reports/audits/status-labels-audit-manual.${FORMAT}

      - name: Upload audit report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: label-audit-reports-${{ github.run_number }}
          path: .github/reports/audits/
          retention-days: 30
          if-no-files-found: warn

      - name: Report audit completion
        if: success()
        run: |
          echo "✅ Label audit completed successfully"
          echo "Reports generated in .github/reports/audits/"

      - name: Report audit failure
        if: failure()
        run: |
          echo "❌ Label audit failed"
          exit 1
