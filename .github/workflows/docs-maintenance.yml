name: Documentation Maintenance

on:
  push:
    branches: [develop]
    paths:
      - "**/*.md"
      - ".github/workflows/**"
      - ".github/agents/**"
      - ".github/instructions/**"
      - "docs/**"
      - "scripts/**"
  schedule:
    - cron: "0 9 * * MON"
  workflow_dispatch:
    inputs:
      action:
        description: "Maintenance action to run"
        required: true
        type: choice
        options:
          - audit
          - update-readme
          - update-mermaid
          - update-staleness
      output_format:
        description: "Audit output format (for audit action)"
        type: choice
        options:
          - markdown
          - json
          - csv
        default: markdown

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: docs-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-regen-readme:
    name: Auto-Regenerate README
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Resolve impacted README files
        id: readmes
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ -z "$CHANGED" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TMP=$(mktemp)
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            dir=$(dirname "$file")
            if [ -f "$dir/README.md" ]; then
              echo "$dir/README.md" >> "$TMP"
            fi
            if [ "$dir" != "." ] && [ -f "README.md" ]; then
              echo "README.md" >> "$TMP"
            fi
          done <<EOF
          $CHANGED
          EOF

          FILES=$(sort -u "$TMP" | tr '\n' ',' | sed 's/,$//')
          rm -f "$TMP"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run README regeneration
        if: steps.readmes.outputs.files != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          README_FILES: ${{ steps.readmes.outputs.files }}
        run: |
          node scripts/agents/meta.agent.js --files "$README_FILES"

  manual-update:
    name: Manual Documentation Updates
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.action == 'update-readme' ||
        github.event.inputs.action == 'update-mermaid' ||
        github.event.inputs.action == 'update-staleness'
      )
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Create audit directory
        run: mkdir -p .github/reports/mermaid-audit

      - name: Run Mermaid diagram fixes
        if: |
          github.event.inputs.action == 'update-readme' ||
          github.event.inputs.action == 'update-mermaid'
        run: node scripts/fix-mermaid-diagrams.js
        continue-on-error: true

      - name: Validate Mermaid colour contrast
        if: |
          github.event.inputs.action == 'update-readme' ||
          github.event.inputs.action == 'update-mermaid'
        run: npm run validate:mermaid-contrast
        continue-on-error: true

      - name: Run staleness updates
        if: |
          github.event.inputs.action == 'update-readme' ||
          github.event.inputs.action == 'update-staleness'
        run: node scripts/fix-staleness-dates.js
        continue-on-error: true

      - name: Generate update report
        if: success()
        run: |
          cat > .github/reports/mermaid-audit/update-report.md <<'EOF'
          # Documentation Update Report

          **Date**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Action**: ${{ github.event.inputs.action }}

          ## Changes Summary

          - Mermaid diagrams: Updated accessibility and colour contrast
          - Staleness updates: Refreshed last_updated dates

          ## Next Steps

          1. Review the changes in this run's artifacts
          2. Create a pull request with the updates
          3. Have maintainers review and merge

          EOF
          cat .github/reports/mermaid-audit/update-report.md

      - name: Check for changes
        id: changes
        run: |
          test "$(git status --porcelain | wc -l)" -gt 0 && echo "has_changes=true" >> "$GITHUB_OUTPUT" || echo "has_changes=false" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "docs: update READMEs with accessibility and staleness fixes

          - Update Mermaid diagrams with accessibility attributes
          - Refresh last_updated dates for stale files
          - Action: ${{ github.event.inputs.action }}
          - Generated by: docs-maintenance.yml workflow"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-update-report
          path: .github/reports/mermaid-audit/update-report.md

  audit-docs:
    name: Audit Documentation
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.action == 'audit')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run documentation audit
        id: audit
        env:
          AUDIT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'all' }}
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format || 'markdown' }}
        run: |
          npm run audit:readme -- \
            --scope=$AUDIT_SCOPE \
            --format=$OUTPUT_FORMAT \
            --output=.github/reports/mermaid-audit/ || true

      - name: Generate summary
        if: always()
        run: >-
          node -e "const fs=require('fs');const sum=process.env.GITHUB_STEP_SUMMARY;const p='.github/reports/mermaid-audit/summary.md';let out='## 📋 Documentation Audit Report\n\n';if(fs.existsSync(p)){out+=fs.readFileSync(p,'utf8');}fs.appendFileSync(sum,out);"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-audit-report-${{ github.run_number }}
          path: .github/reports/mermaid-audit/
          retention-days: 30

      - name: Create issue for critical findings
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Documentation Audit: Critical Findings',
              body: 'Documentation audit found critical issues. See audit report artifacts.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['type:bug', 'area:documentation', 'priority:critical']
            })
