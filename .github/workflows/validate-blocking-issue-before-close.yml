name: Validate Blocking Issue Before Close

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  validate-blocking-before-close:
    if: github.event.issue.state_reason != 'not_planned'
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue still blocks other open issues
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- validate-blocking-issue -->';
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check for force-close override
            const hasForceClose = (issue.labels || []).some(
              (label) => label.name === 'meta:force-close',
            );

            if (hasForceClose) {
              core.info(
                `Issue #${issue.number} has meta:force-close label; allowing close.`,
              );
              return;
            }

            // Extract blocks references from issue body (safely: only numbers)
            const blocksRefs = [];
            const blocksPattern = /^-\s+Blocks:\s+(.+)$/m;
            const blocksMatch = body.match(blocksPattern);

            if (!blocksMatch) {
              core.info(
                `Issue #${issue.number} does not block any other issues.`,
              );
              return;
            }

            // Parse blocks issue numbers using regex (safe: only extracts numbers)
            const blocksText = blocksMatch[1];
            const refMatches = blocksText.matchAll(/#(\d+)/g);

            for (const match of refMatches) {
              const issueNum = Number(match[1]);
              if (Number.isInteger(issueNum) && issueNum > 0) {
                blocksRefs.push(issueNum);
              }
            }

            if (blocksRefs.length === 0) {
              core.info(
                `Issue #${issue.number} has no valid blocks references.`,
              );
              return;
            }

            core.info(
              `Issue #${issue.number} blocks: ${blocksRefs.join(', ')}`,
            );

            // Check if any blocked issues are still open
            const openBlockedIssues = [];

            for (const blockedNum of blocksRefs) {
              try {
                const { data: blockedIssue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: blockedNum,
                });

                if (blockedIssue.state === 'open') {
                  openBlockedIssues.push(blockedNum);
                }
              } catch (error) {
                core.warning(
                  `Could not check status of blocked issue #${blockedNum}: ${error.message}`,
                );
              }
            }

            if (openBlockedIssues.length === 0) {
              core.info(
                `Issue #${issue.number} is not blocking any open issues; allowing close.`,
              );
              return;
            }

            // Issue still blocks open issues; post guidance and label
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker),
            );

            const message = [
              marker,
              '⚠️ This issue was closed but still blocks other open issues.',
              '',
              `**Issues still blocked by this issue:** ${openBlockedIssues
                .map((n) => `#${n}`)
                .join(', ')}`,
              '',
              'A blocking issue should not be closed until all the issues it blocks are resolved or closed.',
              '',
              '**To close this issue:**',
              '1. Resolve or close the issues listed above (they will no longer be blocked)',
              '2. Close this issue again',
              '',
              '**To force close this issue despite blocking others:**',
              '- Add the `meta:force-close` label',
              '- The system will then allow closure',
              '',
              'For more information on blocking relationships, see the metadata governance documentation.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message,
              });
            }

            core.setFailed(
              `Issue #${issue.number} re-opened: Still blocks open issues (${openBlockedIssues.join(
                ', ',
              )}). Add 'meta:force-close' label to override.`,
            );
