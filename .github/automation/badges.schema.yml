  documentation:
    label: "Documentation"
    description: "Documentation and reporting"
    workflows:
      - awesome-github-site
      - changelog-management
      - documentation
      - docs-maintenance
      - reporting
    badge_color: "lightblue"

  maintenance:
    label: "Maintenance"
