# ============================================================================
# MAPPING RULES
# ============================================================================
# Rules that define when and how badges are applied to documents
# Supports conditional logic based on frontmatter fields

mapping:
  # Rule 1: Apply workflow badges to all documentation files
  - when:
      has_front_matter: true
    add:
      # Only apply critical workflow badges to keep docs clean
      - "workflow.checks"
      - "workflow.docs-validation"
      - "workflow.gitleaks"
      - "workflow.main-branch-guard"
      - "workflow.release"

  # Rule 2: Apply license badge to files with license in frontmatter
  - when:
      front_matter:
        license:
          - "MIT"
          - "GPL-3.0"
          - "Apache-2.0"
          - "CC-BY-4.0"
    add:
      - "meta.license"

  # Rule 3: Apply all workflow badges to automation/workflow documentation (tag matching)
  - when:
      front_matter:
        tags:
          match: "any" # Match if any tag matches the list
          values:
            - "workflow"
            - "automation"
            - "ci"
            - "badges"
    add:
      # Include all critical workflows for CI/automation docs
      - "workflow.checks"
      - "workflow.docs-validation"
      - "workflow.gitleaks"
      - "workflow.labeling-governance"
      - "workflow.main-branch-guard"
      - "workflow.metadata-governance"
      - "workflow.release"
      - "workflow.template-enforcement"
      - "workflow.validate-pr-template"
      - "workflow.badges-documentation-update"
      - "workflow.badges-health-check"
      - "workflow.badges-readme-status"
      - "workflow.badges-workflow-audit"

# ============================================================================
# CONFIGURATION
# ============================================================================
# Global badge generation settings

config:
  # Repository identifier for badge generation
  repository: "lightspeedwp/.github"

  # Default branch for workflow badges
  default_branch: "develop"

  # Badge format (stacked, inline, table)
  format: "stacked"

  # Enable/disable badge generation
  enabled: true

  # Marker comments for badge insertion points
  markers:
    start: "<!-- BADGES-START -->"
    end: "<!-- BADGES-END -->"

  # Files to skip badge generation (glob patterns)
  skip_files:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/.next/**"
    - "**/dist/**"
    - "**/build/**"

  # Document types that should receive badges
  document_types:
    - "documentation"
    - "specification"
    - "guide"
    - "workflow"
    - "automation"

  # Validation settings
  validation:
    # Check for broken badge links
    validate_links: true

    # Frequency of validation (days)
    validation_frequency: 7

    # Create issues for broken links
    report_broken_links: true

    # Maximum timeout for badge link checks (seconds)
    link_timeout: 10

  # Coverage tracking
  coverage:
    # Track badge coverage percentage
    track_coverage: true

    # Target coverage percentage
    target_coverage: 75

    # Report coverage metrics
    report_metrics: true

# ============================================================================
# WORKFLOW GROUPING
