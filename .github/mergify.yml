# Mergify configuration.
# Schema: https://docs.mergify.com/mergify-configuration-schema.json
#
# Scope: Dependabot updates on develop only. The develop ruleset still
# requires the three required checks and one code-owner approval, so
# Mergify never merges anything a human has not approved.
#
# Removed (#3476): the queue, auto-approve, imgbot and meta-agent rules.
# They gated on a check named "All Checks Passed" that no workflow has
# produced since the workflow consolidation, and the imgbot and
# lightspeed-bot authors have opened no PRs recently. The only mechanism
# that actually merged Dependabot PRs is auto_merge below, so it is kept.

pull_request_rules:
  # develop requires branches to be up to date before merging, so rebase
  # Dependabot PRs whenever develop moves ahead.
  - name: Keep Dependabot updates on develop current
    conditions:
      - author~=^(dependabot\[bot\]|app/dependabot)$
      - base=develop
      - -draft
      - -conflict
      - "#commits-behind > 0"
    actions:
      update: {}

  # Human-authored PRs fall behind whenever develop moves, and the develop
  # ruleset blocks them until they are current — the queue showed a long tail
  # of BEHIND PRs. This merges the base branch in so CI re-runs against the
  # current tree.
  #
  # Opt-in via label, following Mergify's own guidance
  # (https://docs.mergify.com/actions/update/): updating every non-draft PR
  # on every develop push would re-trigger CI across the whole open queue,
  # which is why they recommend gating on a label. Apply
  # `keep-up-to-date` to a PR once it is ready for review and it stops
  # going stale.
  #
  # `update` takes no parameters here, so Mergify uses `update_method: merge`
  # (the documented default for pull_request_rules). `merge` is also the
  # fork-safe choice: `update_method: rebase` with `update_bot_account` is
  # deprecated for repositories that receive fork PRs, and this repository
  # is public. Mergify never rebases conflicting branches, so a PR that
  # needs manual conflict resolution still reports DIRTY.
  - name: Keep labelled pull requests current
    conditions:
      - base=develop
      - -draft
      - -conflict
      - label=keep-up-to-date
      - "#commits-behind > 0"
    actions:
      update: {}

merge_protections_settings:
  reporting_method: check-runs
  # Merge once GitHub branch protection is satisfied (required checks plus a
  # code-owner approval), for Dependabot only. `true` here would mean every
  # author on every branch, which previously auto-merged human PRs against
  # an unprotected release branch
  # (https://docs.mergify.com/merge-protections/auto-merge/).
  auto_merge_conditions:
    - author~=^(dependabot\[bot\]|app/dependabot)$
