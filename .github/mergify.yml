# Mergify configuration.
# Schema: https://docs.mergify.com/mergify-configuration-schema.json
#
# Scope: auto-merge Dependabot updates once the develop ruleset is satisfied.
# The ruleset still requires the required checks and one code-owner approval,
# so Mergify never merges anything a human has not approved.
#
# Removed (#3476): the queue, auto-approve, imgbot and meta-agent rules.
# They gated on a check named "All Checks Passed" that no workflow has
# produced since the workflow consolidation, and the imgbot and
# lightspeed-bot authors have opened no PRs recently. The only mechanism
# that actually merged Dependabot PRs is auto_merge below, so it is kept.
#
# Removed (#3574): the `update` rule "Keep same-repository pull requests on
# develop current". Merging develop into open branches is now done by
# `.github/workflows/keep-pr-current.yml`, for the reasons below.
#
# Keeping this repository's branches current is unchanged in intent and is not
# dropped with the rule:
#
#   * `develop-branch-ruleset` sets `strict_required_status_checks_policy`, so a
#     branch behind develop is still blocked from merging. That requirement is
#     untouched and is what makes the update worth doing at all.
#   * `.github/workflows/keep-pr-current.yml` performs the merge, through
#     GitHub's `PUT /pulls/{n}/update-branch` API, on the same exclusions the
#     rule used: non-draft, same-repository, non-archived, base develop, any
#     staleness.
#
# Why the rule had to go rather than be adjusted. The `update` action's schema
# accepts only `bot_account` (`additionalProperties: false` in
# `$defs.UpdateActionModel`, https://docs.mergify.com/mergify-configuration-schema.json),
# so there is no option for how a failure is reported. Mergify reports the
# rule's check run with conclusion `failure` whenever it cannot perform the
# update — including when it declines for its own reasons, not only when the
# merge conflicts. Observed on the 394 pull requests opened between 2026-09-03
# and 2026-09-29:
#
#   * #3524 and #3532 — "merge conflict between base and head". Both were
#     conflicting in `FEEDBACK_RESPONSE.md` only, one commit behind develop.
#   * #3580 and #3662 — "head ref does not exist", recorded 5 and 6 seconds
#     after those pull requests merged and their branches were auto-deleted
#     (`delete_branch_on_merge` is enabled on this repository). A failure on a
#     merged pull request, actionable by nobody.
#
# `-conflict` did not prevent the first pair. Mergify's own preconditions
# already include "has no conflict"
# (https://docs.mergify.com/workflow/actions/update), so `-conflict` and the
# precondition read the same signal and share the same gap: for a short window
# after develop moves, the pull request's mergeability is not yet computed, the
# condition does not hold, and the update is attempted. On #3524 the rule was
# correctly skipped at 04:33 UTC when Mergify already knew the pull request
# conflicted, then fired at 05:35 UTC — 44 seconds after #3689 landed on
# develop — and failed. No additional condition can close that window, because
# the only available signal is the one that is briefly unavailable.
#
# The merge queue was considered and rejected: Mergify documents
# `strict_required_status_checks_policy` as incompatible with its queue
# (https://docs.mergify.com/merge-queue/github-rulesets — "Preferred: disable
# the Require branches to be up to date before merging setting"), and the only
# queue designs that avoid the clash rely on batch or in-place pull requests.
# Adopting one would mean weakening a ruleset setting, which is the opposite of
# what this change is for.
#
# `merge=union` on CHANGELOG.md (#3581) remains in place and remains the right
# fix for the changelog specifically: it stops two pull requests each adding an
# `[Unreleased]` entry from colliding, which is the highest-churn conflict in
# this repository. It is not a fix for the reporting problem above, because
# `FEEDBACK_RESPONSE.md` is rewritten whole by each pull request that carries
# AI feedback and union-merging two such documents would produce a meaningless
# hybrid rather than a resolved file.

merge_protections_settings:
  reporting_method: check-runs
  # Merge once GitHub branch protection is satisfied (required checks plus a
  # code-owner approval), for Dependabot only. `true` here would mean every
  # author on every branch, which previously auto-merged human PRs against
  # an unprotected release branch
  # (https://docs.mergify.com/merge-protections/auto-merge/).
  #
  # This is inert unless a `merge_protections` rule below matches the PR, or
  # the merge queue is enabled: with no matching rule there are no
  # success_conditions to evaluate, and Mergify reports "does not match any
  # conditions of the merge protections". Left as-is deliberately — the gate
  # that matters is the develop ruleset (code-owner review), not Mergify's.
  auto_merge_conditions:
    - author~=^(dependabot\[bot\]|app/dependabot)$
