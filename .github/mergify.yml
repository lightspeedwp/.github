pull_request_rules:
  # Keep Dependabot PRs up-to-date by rebasing if develop has moved ahead
  - name: Keep Dependabot dependency updates on develop current
    conditions:
      - author~=^(dependabot\[bot\]|app/dependabot)$
      - base=develop
      - label=area:dependencies
      - -draft
      - -conflict
      - "#commits-behind > 0"
    actions:
      update: {}

  # Auto-approve and merge Dependabot dependency updates when CI passes
  - name: Auto-approve and merge Dependabot dependency updates on develop
    conditions:
      - author~=^(dependabot\[bot\]|app/dependabot)$
      - base=develop
      - label=area:dependencies
      - check-success=All Checks Passed
      - -draft
      - -conflict
    actions:
      review:
        type: APPROVE
      merge:
        method: squash

  # Keep imgbot image optimizations up-to-date by rebasing if develop has moved ahead
  - name: Keep imgbot image optimizations current on develop
    conditions:
      # ImgBot has used both identities here, so keep both to avoid breaking auto-merge
      - author~=^(imgbot\[bot\]|app/imgbot)$
      - base=develop
      - -draft
      - -conflict
      - "#commits-behind > 0"
    actions:
      update: {}

  # Auto-merge imgbot image optimizations when CI passes
  - name: Auto-merge imgbot image optimizations on develop
    conditions:
      # ImgBot has used both identities here, so keep both to avoid breaking auto-merge
      - author~=^(imgbot\[bot\]|app/imgbot)$
      - base=develop
      - check-success=All Checks Passed
      - -draft
      - -conflict
    actions:
      merge:
        method: squash

merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions: true
