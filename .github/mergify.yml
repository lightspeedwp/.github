pull_request_rules:
  - name: Keep Dependabot dependency updates on develop current
    conditions:
      - author~=^(dependabot\[bot\]|app/dependabot)$
      - base=develop
      - label=area:dependencies
      - -draft
      - -conflict
      - "#commits-behind > 0"
    actions:
      update:
  - name: Auto-merge Dependabot dependency updates on develop
    conditions:
      - author~=^(dependabot\[bot\]|app/dependabot)$
      - base=develop
      - label=area:dependencies
      - -label=meta:dependabot-security
      - check-success=All Checks Passed
      - -draft
      - -conflict
    actions:
      queue:
        name: dependabot
  - name: Auto-merge Dependabot security updates on develop
    conditions:
      - author~=^(dependabot\[bot\]|app/dependabot)$
      - base=develop
      - label=area:dependencies
      - label=meta:dependabot-security
      - check-success=All Checks Passed
      - -draft
      - -conflict
    actions:
      queue:
        name: dependabot
  - name: Keep imgbot image optimizations current on develop
    conditions:
      # ImgBot has used both identities here, so keep both to avoid breaking auto-merge.
      - author~=^(imgbot\[bot\]|app/imgbot)$
      - base=develop
      - -draft
      - -conflict
      - "#commits-behind > 0"
    actions:
      update:
  - name: Auto-merge imgbot image optimizations on develop
    conditions:
      # ImgBot has used both identities here, so keep both to avoid breaking auto-merge.
      - author~=^(imgbot\[bot\]|app/imgbot)$
      - base=develop
      - check-success=All Checks Passed
      - -draft
      - -conflict
    actions:
      merge:
        method: squash
queue_rules:
  - name: dependabot
    queue_conditions:
      - author~=^(dependabot\[bot\]|app/dependabot)$
      - base=develop
      - label=area:dependencies
      - -draft
      - -conflict
    merge_conditions:
      - check-success=All Checks Passed
    merge_method: squash
    batch_size: 1
  - name: Merge queue
    batch_size: 1
merge_queue:
  max_parallel_checks: 3
merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions: true
