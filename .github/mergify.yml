pull_request_rules:
  - name: Auto-merge Dependabot security updates on develop
    conditions:
      - author=dependabot[bot]
      - base=develop
      - label=dependencies
      - label=meta:dependabot-security
      - check-success=CI / check
      - check-success=lint / lint
      - check-success=reviewer / coderabbit-gate
      - -draft
      - -conflict
    actions:
      merge:
        method: squash
