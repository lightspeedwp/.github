pull_request_rules:
  - name: Auto-merge Dependabot dependency updates on develop
    conditions:
      - author=dependabot[bot]
      - base=develop
      - label=area:dependencies
      - check-success=check
      - check-success=lint
      - check-success=validate
      - -draft
    actions:
      merge:
        method: squash

  - name: Auto-merge Dependabot security updates on develop
    conditions:
      - author=dependabot[bot]
      - base=develop
      - label=area:dependencies
      - label=meta:dependabot-security
      - check-success=check
      - check-success=lint
      - check-success=validate
      - -draft
    actions:
      merge:
        method: squash
