# GitHub Project routing configuration
# Maps issue types, labels, and workflows to target projects
version: "1.0"

# Default behavior: all .github issues go to this project
default_project:
  name: "Core Delivery Board"
  url: "https://github.com/orgs/lightspeedwp/projects/33"
  description: "LightSpeed .github repository issues and PRs"

# Routes: fine-grained routing rules (currently all to default, reserved for future expansion)
routes:
  # Core delivery: bugs, features, performance improvements, refactoring
  - name: "Core Delivery Board"
    description: "Features, bugs, refactoring, performance work"
    project_url: "https://github.com/orgs/lightspeedwp/projects/33"
    filter:
      # Match if ANY condition is true (OR logic)
      type: [bug, feature, performance, code-refactor]
    enabled: true

  # Security and accessibility: kept visible on core board but could split if needed
  - name: "Core Delivery Board"
    description: "Security and accessibility work"
    project_url: "https://github.com/orgs/lightspeedwp/projects/33"
    filter:
      label: [security, a11y, compliance]
    enabled: true

  # Chores and maintenance: all go to core board
  - name: "Core Delivery Board"
    description: "Maintenance, dependencies, housekeeping"
    project_url: "https://github.com/orgs/lightspeedwp/projects/33"
    filter:
      type: [chore, task]
    enabled: true

  # Documentation
  - name: "Core Delivery Board"
    description: "Documentation and knowledge base updates"
    project_url: "https://github.com/orgs/lightspeedwp/projects/33"
    filter:
      type: [documentation]
    enabled: true

# Milestone allocation rules
# Determines which version milestone new issues should be assigned to
milestone_strategy:
  type: "version-based" # Options: version-based, epic-based (only version-based supported)

  # Current active milestones (in release order)
  active_milestones:
    - v1.0
    - v1.1
    - v1.2
    - v1.3
    - v1.4
    - v1.5
    - v1.6

  # Default allocation rules for new issues
  allocation:
    # Issues with these labels get assigned to the next planned version
    high_priority_labels: [security, critical-bug, compliance, a11y]
    next_milestone: v1.0

    # Issues with these labels go to the backlog/future
    backlog_labels: [research, spike, proof-of-concept, enhancement]
    backlog_milestone: null # null = no milestone (unplanned)

    # Default: untagged/uncategorised issues go to this milestone
    # Can be null to leave unassigned
    default_milestone: v1.0

  # Capacity warnings
  capacity:
    # Warn when a milestone has more than this many open issues
    warn_threshold: 50
    error_threshold: 100

    # Exclude certain issue types from capacity warnings
    exclude_types: [chore, task, documentation]

# Epic-to-label mapping (for future use)
# Maps epic identifiers to labels so we can query "all work in epic X"
epics:
  project-allocation: "epic:project-allocation"
  agent-standards: "epic:agent-standards"
  security-hardening: "epic:security-hardening"
  accessibility: "epic:accessibility"
