version: 2
description: Canonical LightSpeedWP organization issue/project field model for governance and WordPress delivery.
docs_reference: docs/ISSUE_FIELDS.md

organization:
  owner: lightspeedwp
  repository: .github
  notes:
    - Issue fields are organization-level metadata.
    - Issue fields are in public preview and may change.

defaults:
  issue:
    assignee: ashleyshaw
    status_label_open: status:ready
    status_label_closed: status:done
    priority_label: priority:normal
    type_label: type:task
  pull_request:
    status_label_open: status:needs-review
    status_label_merged: status:done
    priority_label: priority:normal
    type_label: type:chore

project_field_mappings:
  Status:
    status:needs-triage: Triage
    status:needs-planning: Triage
    status:needs-more-info: Triage
    status:ready: Ready
    status:in-progress: In progress
    status:needs-review: In review
    status:needs-qa: In QA
    status:blocked: Blocked
    status:on-hold: On hold
    status:done: Done
  Priority:
    priority:critical: Critical
    priority:important: Important
    priority:normal: Normal
    priority:minor: Minor
  Type:
    # Critical Types (No Collapsing)
    type:bug: Bug
    type:feature: Feature
    type:documentation: Documentation
    type:task: Task
    type:release: Release

    # Feature Delivery Group
    type:improve: Feature

    # Design & UX Group
    type:design: Design
    type:a11y: Design

    # Quality & Maintenance Group
    type:chore: Chore
    type:refactor: Chore
    type:maintenance: Chore

    # Automation & Infrastructure Group
    type:automation: Automation
    type:test: Automation
    type:ai-ops: Automation
    type:build: Automation

    # Integration & Dependencies Group
    type:integration: Integration
    type:compatibility: Integration

    # Analysis & Exploration Group
    type:research: Research

    # Mapped to Task (security tracked via labels)
    type:security: Task
    type:performance: Task
    type:audit: Task
    type:epic: Task
    type:question: Task
    type:ux-feedback: Task
    type:help: Task
    type:support: Task
    type:content-modelling: Task
    type:story: Task
    type:review: Task
    type:ui: Feature
    type:enhancement: Feature
    type:ci: Automation
    type:qa: Automation
    type:dependency: Integration
    type:investigation: Research

organization_issue_fields:
  universal_issue_fields:
    applies_to_issue_types:
      - Unassigned
      - Task
      - Bug
      - Feature
      - Refactor
      - Build
      - Accessibility
      - Compatibility
      - Security
      - Release
      - Maintenance
      - Performance
      - Testing
      - Epic
      - Automation
      - Review
      - Design
      - Story
      - Improvement
      - Documentation
      - Integration
      - Research
      - Chore
      - Audit
      - AI Ops
      - Content Modelling
  field_usage:
    Priority:
      type: single_select
      # Canonical Priority vocabulary. MUST stay in lockstep with
      # project_field_mappings.Priority values, the priority:* labels in
      # .github/labels.yml, and the derive-project-fields.cjs default ("Normal").
      # Enforced by scripts/agents/includes/__tests__/field-parity.test.js.
      values:
        - Critical
        - Important
        - Normal
        - Minor
      required: false
      applies_to_all_issue_types: true
      notes:
        - Current importance level assigned to this issue.
    Start date:
      type: date
      required: false
      applies_to_all_issue_types: true
      organization_only: true
      notes:
        - Date when work on issue will begin.
    Target date:
      type: date
      required: false
      applies_to_all_issue_types: true
      organization_only: true
      notes:
        - Expected completion date for this issue.
    Effort:
      type: single_select
      values:
        - XS
        - S
        - M
        - L
        - XL
        - XXL
        - XXXL
      required: false
      applies_to_all_issue_types: true
      organization_only: true
      notes:
        - Relative sizing estimate for implementation effort.
  enabled_issue_types:
    - Bug
    - Feature
    - Task
    - Release
    - Design
    - Chore
    - Automation
    - Integration
    - Research
    - Documentation
  pinned_per_issue_type:
    - Priority
    - Effort
    - Start date
    - Target date
    - Domain
    - Delivery Track
    - Team
    - Risk
    - Customer Impact
    - Technical Impact
  policy:
    max_pinned_fields_per_issue_type: 10
    max_issue_fields_per_org: 25
    single_select_max_options: 50
    project_total_field_limit: 50
  custom_fields:
    - key: Domain
      type: single_select
      description: Primary business/technical domain for routing.
      options:
        - Dotgithub Governance
        - WordPress Block Theme
        - WordPress Block Plugin
        - WooCommerce
        - Platform/CI
      default: Dotgithub Governance
    - key: Delivery Track
      type: single_select
      description: Workstream lane used for roadmap and reporting views.
      options:
        - Governance
        - Product
        - Infrastructure
        - Release
        - Support
      default: Governance
    - key: Team
      type: single_select
      description: Owning team for delivery and review.
      options:
        - Core
        - AI Ops
        - Theme
        - Plugin
        - QA
      default: AI Ops
    - key: Effort
      type: single_select
      description: Relative sizing estimate for implementation effort.
      options:
        - XS
        - S
        - M
        - L
        - XL
        - XXL
        - XXXL
      default: M
    - key: Start date
      type: date
      description: Planned start date.
    - key: Target date
      type: date
      description: Planned completion date.
    - key: Risk
      type: single_select
      description: Delivery risk level.
      options:
        - Low
        - Medium
        - High
      default: Medium
    - key: Customer Impact
      type: single_select
      description: End-user/commercial impact.
      options:
        - Low
        - Medium
        - High
      default: Medium
    - key: Technical Impact
      type: single_select
      description: Engineering/system impact.
      options:
        - Low
        - Medium
        - High
      default: Medium
    - key: Spec Link
      type: text
      description: Link to PRD/spec/adoption doc.

project_fields:
  hidden_fields_to_enable:
    issues:
      - Parent issue
      - Sub-issue progress
      - Linked pull requests
      - Reviewers
      - Type
  iteration_field:
    key: Sprint
    type: iteration
    duration_weeks: 2
    auto_create_new_iterations: true
    allow_breaks_between_iterations: true
  operational_guidance:
    - Keep issue and project fields aligned; labels remain automation fallback.
    - Renaming custom fields is allowed; update this YAML + docs + validators in same PR.
    - Deleting custom fields requires migration of existing data and view updates first.

profiles:
  dotgithub:
    focus: Governance, workflow automation, labels, docs, standards, release hygiene.
    preferred_area_labels:
      - area:documentation
      - area:automation
      - area:labels
      - area:tests
      - area:release
      - area:core
  wordpress_block_theme:
    focus: Gutenberg theme architecture, design tokens, templates, performance, accessibility.
    preferred_area_labels:
      - area:theme
      - area:design-system
      - area:performance
      - area:a11y
      - area:compatibility
    preferred_component_labels:
      - comp:theme-json
      - comp:block-templates
      - comp:template-parts
      - comp:style-variations
      - comp:typography
      - comp:spacing
      - comp:color-palette
  wordpress_block_plugin:
    focus: Block/plugin behaviour, supports, editor UX, integrations, quality and compatibility.
    preferred_area_labels:
      - area:plugins
      - area:integration
      - area:testing
      - area:performance
      - area:a11y
      - area:compatibility
    preferred_component_labels:
      - comp:block-editor
      - comp:block-json
      - comp:block-supports
      - comp:block-bindings
      - comp:block-variations
      - comp:post-settings
      - comp:settings
