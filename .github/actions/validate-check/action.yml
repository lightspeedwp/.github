name: 'Validate Check'
description: 'Report validation results as PR status checks and comments'
author: 'LightSpeedWP'

inputs:
  check_name:
    description: "Name of the check to report (e.g., 'validation-unified')"
    required: true

  status:
    description: "Validation result: 'success', 'failure', 'neutral'"
    required: true

  title:
    description: 'Short title for the check result'
    required: true

  summary:
    description: 'Detailed summary of validation result (Markdown)'
    required: true

  details:
    description: 'Additional validation details or error messages (JSON array, optional)'
    required: false
    default: '[]'

  post_comment:
    description: "If 'true', post PR comment with validation results"
    required: false
    default: false

  github_token:
    description: 'GitHub API token with write permissions to PR checks'
    required: true

outputs:
  check_id:
    description: 'GitHub check run ID (for later updates)'
    value: ${{ steps.report.outputs.check_id }}

  comment_id:
    description: 'PR comment ID (if post_comment=true)'
    value: ${{ steps.report.outputs.comment_id }}

  status:
    description: "Status of check reporting: 'success', 'failure'"
    value: ${{ steps.report.outputs.status }}

  message:
    description: 'Confirmation message'
    value: ${{ steps.report.outputs.message }}

runs:
  using: 'composite'
  steps:
    - name: 'Validate check inputs'
      id: validate
      shell: bash
      env:
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_CHECK_NAME: ${{ inputs.check_name }}
      run: |
        # Validate status value
        if [[ "$INPUT_STATUS" != "success" && "$INPUT_STATUS" != "failure" && "$INPUT_STATUS" != "neutral" ]]; then
          echo "ERROR: Invalid status. Must be 'success', 'failure', or 'neutral'"
          exit 1
        fi

        # Validate check_name
        if [[ -z "$INPUT_CHECK_NAME" ]]; then
          echo "ERROR: check_name cannot be empty"
          exit 1
        fi

        echo "✓ Input validation passed"

    - name: 'Report validation check'
      id: report
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        CHECK_NAME: ${{ inputs.check_name }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        SUMMARY: ${{ inputs.summary }}
        DETAILS: ${{ inputs.details }}
        POST_COMMENT: ${{ inputs.post_comment }}
        HEAD_SHA: ${{ github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set +e

        # Initialize outputs
        CHECK_ID=""
        COMMENT_ID=""
        REPORT_STATUS="success"
        MESSAGE="Check '$CHECK_NAME' reported as $STATUS"

        echo "📋 Reporting validation check"
        echo "  Check Name: $CHECK_NAME"
        echo "  Status: $STATUS"
        echo "  Title: $TITLE"

        # Create a real check run via the GitHub API (fails closed on API error)
        CHECK_PAYLOAD=$(jq -n \
          --arg name "$CHECK_NAME" \
          --arg head_sha "$HEAD_SHA" \
          --arg conclusion "$STATUS" \
          --arg title "$TITLE" \
          --arg summary "$SUMMARY" \
          '{name: $name, head_sha: $head_sha, status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}')
        API_RESPONSE=$(curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
          -d "$CHECK_PAYLOAD")
        API_CHECK_ID=$(echo "$API_RESPONSE" | jq -r '.id // empty')
        if [[ -z "$API_CHECK_ID" ]]; then
          API_ERROR=$(echo "$API_RESPONSE" | jq -r '.message // "Unknown error"')
          echo "❌ Error creating check run: $API_ERROR"
          REPORT_STATUS="failure"
          MESSAGE="Failed to report check '$CHECK_NAME': $API_ERROR"
        else
          CHECK_ID="$API_CHECK_ID"
          echo "✓ Check run created: $CHECK_ID"
        fi

        echo ""
        echo "## Validation Result"
        echo ""
        echo "**Status:** $STATUS"
        echo ""
        echo "**Title:** $TITLE"
        echo ""
        echo "### Summary"
        echo "$SUMMARY"
        echo ""

        # Parse and display details if present
        if [[ "$DETAILS" != "[]" ]]; then
          echo "### Details"
          echo "$DETAILS" | jq '.' 2>/dev/null || echo "$DETAILS"
          echo ""
        fi

        # Post PR comment if requested (skipped outside pull_request events)
        if [[ "$POST_COMMENT" == "true" ]]; then
          if [[ -z "$PR_NUMBER" ]]; then
            echo "⚠️ POST_COMMENT requested but no pull request number in event context; skipping comment"
          else
            COMMENT_PAYLOAD=$(jq -n --arg body "## $TITLE ($STATUS)"$'\n\n'"$SUMMARY" '{body: $body}')
            COMMENT_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -d "$COMMENT_PAYLOAD")
            COMMENT_ID=$(echo "$COMMENT_RESPONSE" | jq -r '.id // empty')
            if [[ -z "$COMMENT_ID" ]]; then
              COMMENT_ERROR=$(echo "$COMMENT_RESPONSE" | jq -r '.message // "Unknown error"')
              echo "❌ Error posting PR comment: $COMMENT_ERROR"
              REPORT_STATUS="failure"
              MESSAGE="Check '$CHECK_NAME' reported, but comment failed: $COMMENT_ERROR"
            else
              echo "💬 PR comment posted: $COMMENT_ID"
            fi
          fi
        fi

        # Map status to conclusion
        if [[ "$STATUS" == "success" ]]; then
          echo "✅ Validation passed"
        elif [[ "$STATUS" == "failure" ]]; then
          echo "❌ Validation failed"
        else
          echo "⚠️  Validation neutral"
        fi

        # Set outputs
        echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
        echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
        echo "status=$REPORT_STATUS" >> "$GITHUB_OUTPUT"
        echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

branding:
  icon: 'check-circle'
  color: 'green'
