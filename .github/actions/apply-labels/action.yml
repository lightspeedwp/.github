name: 'Apply Labels'
description: 'Apply labels to PR/issue based on metadata, PR template frontmatter, or custom rules'
author: 'LightSpeedWP'

inputs:
  target_type:
    description: "Target entity type: 'pull_request' or 'issue'"
    required: true
    type: string

  target_id:
    description: 'GitHub API ID of PR or issue'
    required: true
    type: string

  source:
    description: "Where labels come from: 'frontmatter', 'type', 'custom'"
    required: true
    type: string

  labels:
    description: 'Comma-separated label names (must exist in .github/labels.yml with prefix)'
    required: true
    type: string

  remove_labels:
    description: 'Comma-separated labels to remove (optional)'
    required: false
    type: string
    default: ''

  dry_run:
    description: "If 'true', log labels but don't apply (for validation)"
    required: false
    type: boolean
    default: false

  github_token:
    description: 'GitHub API token with write permissions to PR/issue'
    required: true
    type: string

  github_repository:
    description: 'GitHub repository in owner/repo format'
    required: true
    type: string

outputs:
  labels_applied:
    description: 'JSON array of labels successfully applied'
    value: ${{ steps.apply.outputs.labels_applied }}

  labels_removed:
    description: 'JSON array of labels removed'
    value: ${{ steps.apply.outputs.labels_removed }}

  total_labels:
    description: 'Total number of labels on target after operation'
    value: ${{ steps.apply.outputs.total_labels }}

  status:
    description: "Status of operation: 'success', 'partial_success', 'failure'"
    value: ${{ steps.apply.outputs.status }}

  error_message:
    description: "Error details if status is 'failure' or 'partial_success'"
    value: ${{ steps.apply.outputs.error_message }}

runs:
  using: 'composite'
  steps:
    - name: 'Validate inputs'
      id: validate
      shell: bash
      run: |
        # Validate target_type
        if [[ "${{ inputs.target_type }}" != "pull_request" && "${{ inputs.target_type }}" != "issue" ]]; then
          echo "ERROR: Invalid target_type. Must be 'pull_request' or 'issue'"
          exit 1
        fi

        # Validate source
        if [[ "${{ inputs.source }}" != "frontmatter" && "${{ inputs.source }}" != "type" && "${{ inputs.source }}" != "custom" ]]; then
          echo "ERROR: Invalid source. Must be 'frontmatter', 'type', or 'custom'"
          exit 1
        fi

        echo "✓ Input validation passed"

    - name: 'Apply labels to target'
      id: apply
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ inputs.github_repository }}
        TARGET_TYPE: ${{ inputs.target_type }}
        TARGET_ID: ${{ inputs.target_id }}
        LABELS_TO_ADD: ${{ inputs.labels }}
        LABELS_TO_REMOVE: ${{ inputs.remove_labels }}
        DRY_RUN: ${{ inputs.dry_run }}
        SOURCE: ${{ inputs.source }}
      run: |
        set +e

        # Initialize output variables
        LABELS_APPLIED="[]"
        LABELS_REMOVED="[]"
        TOTAL_LABELS=0
        STATUS="success"
        ERROR_MSG=""

        echo "🏷️  Applying labels to $TARGET_TYPE ($TARGET_ID)"
        echo "Source: $SOURCE | Dry-run: $DRY_RUN"

        # Parse labels to add
        IFS=',' read -ra LABELS_ARRAY <<< "$LABELS_TO_ADD"

        if [[ ${#LABELS_ARRAY[@]} -eq 0 ]]; then
          echo "⚠️  No labels specified for application"
          STATUS="partial_success"
        fi

        # Build JSON array for GitHub API
        LABELS_JSON='['
        APPLIED_COUNT=0
        for i in "${!LABELS_ARRAY[@]}"; do
          label=$(echo "${LABELS_ARRAY[$i]}" | xargs)  # Trim whitespace
          if [[ -n "$label" ]]; then
            if [[ $APPLIED_COUNT -gt 0 ]]; then
              LABELS_JSON+=","
            fi
            LABELS_JSON+="\"$label\""
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
            echo "  → Label: $label"
          fi
        done
        LABELS_JSON+=']'

        # Apply labels via GitHub API if not in dry-run mode
        if [[ "$DRY_RUN" != "true" ]] && [[ $APPLIED_COUNT -gt 0 ]]; then
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TARGET_ID/labels" \
            -d "$LABELS_JSON")

          # Check for API errors
          if echo "$RESPONSE" | grep -q "message"; then
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.message // "Unknown error"')
            STATUS="failure"
            echo "❌ Error applying labels: $ERROR_MSG"
          else
            echo "✓ Applied $APPLIED_COUNT labels"
            LABELS_APPLIED="$LABELS_JSON"
          fi
        elif [[ "$DRY_RUN" == "true" ]]; then
          echo "DRY-RUN: Would have applied $APPLIED_COUNT labels"
          LABELS_APPLIED="$LABELS_JSON"
        fi

        # Handle label removal if specified
        if [[ -n "$LABELS_TO_REMOVE" ]]; then
          IFS=',' read -ra REMOVE_ARRAY <<< "$LABELS_TO_REMOVE"
          for label in "${REMOVE_ARRAY[@]}"; do
            label=$(echo "$label" | xargs)  # Trim whitespace
            if [[ -n "$label" ]]; then
              if [[ "$DRY_RUN" != "true" ]]; then
                curl -s -X DELETE \
                  -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TARGET_ID/labels/$label" > /dev/null
              fi
              echo "  ↻ Removed: $label"
            fi
          done
          LABELS_REMOVED="$LABELS_TO_REMOVE"
        fi

        # Set outputs as JSON (using jq for proper JSON formatting)
        echo "labels_applied=$LABELS_APPLIED" >> "$GITHUB_OUTPUT"
        echo "labels_removed=$LABELS_REMOVED" >> "$GITHUB_OUTPUT"
        echo "total_labels=$APPLIED_COUNT" >> "$GITHUB_OUTPUT"
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "error_message=$ERROR_MSG" >> "$GITHUB_OUTPUT"

branding:
  icon: 'tag'
  color: 'blue'
