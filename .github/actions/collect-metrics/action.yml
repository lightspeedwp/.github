name: 'Collect Workflow Metrics'
description: 'Collect GitHub Actions minutes and other workflow metrics'

inputs:
  workflow-name:
    description: 'Name of the workflow being measured'
    required: true
  job-name:
    description: 'Name of the job being measured'
    required: true
  metrics-file:
    description: 'Path to metrics output file (default: metrics.json)'
    required: false
    default: 'metrics.json'
  github-token:
    description: 'GitHub token for API access'
    required: false
    default: ${{ github.token }}

outputs:
  metrics-file:
    description: 'Path to generated metrics file'
    value: ${{ steps.collect.outputs.metrics-file }}
  workflow-minutes:
    description: 'Estimated GitHub Actions minutes for this job'
    value: ${{ steps.collect.outputs.workflow-minutes }}
  job-duration:
    description: 'Job duration in seconds'
    value: ${{ steps.collect.outputs.job-duration }}

runs:
  using: 'composite'
  steps:
    - name: Collect metrics
      id: collect
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        WORKFLOW_NAME="${{ inputs.workflow-name }}"
        JOB_NAME="${{ inputs.job-name }}"
        METRICS_FILE="${{ inputs.metrics-file }}"
        REPO="${{ github.repository }}"
        RUN_ID="${{ github.run_id }}"

        echo "Collecting metrics for: $WORKFLOW_NAME / $JOB_NAME"

        # Get job timing information
        JOB_START_TIME=$(date -u +%s)

        # Attempt to fetch workflow run information via GitHub API
        # Note: This requires proper authentication and workflow visibility
        RUN_INFO=$(gh api repos/$REPO/actions/runs/$RUN_ID --jq '.jobs_url // empty' 2>/dev/null || echo "")

        if [[ -z "$RUN_INFO" ]]; then
          echo "Note: Could not fetch real-time metrics from GitHub API (may require additional permissions)"
        fi

        # Estimate minutes based on common workflow types
        # Production implementation would use actual GitHub API billing data
        ESTIMATED_MINUTES=1  # Conservative estimate

        # Try to detect job type and adjust estimate
        if [[ "$JOB_NAME" =~ "test" ]]; then
          ESTIMATED_MINUTES=5
        elif [[ "$JOB_NAME" =~ "lint" ]] || [[ "$JOB_NAME" =~ "validate" ]]; then
          ESTIMATED_MINUTES=2
        elif [[ "$JOB_NAME" =~ "build" ]]; then
          ESTIMATED_MINUTES=3
        elif [[ "$JOB_NAME" =~ "deploy" ]]; then
          ESTIMATED_MINUTES=10
        fi

        JOB_END_TIME=$(date -u +%s)
        JOB_DURATION=$((JOB_END_TIME - JOB_START_TIME))

        # Create metrics JSON
        METRICS_JSON=$(jq -n \
          --arg workflow "$WORKFLOW_NAME" \
          --arg job "$JOB_NAME" \
          --arg run_id "$RUN_ID" \
          --arg repo "$REPO" \
          --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg start_time "$JOB_START_TIME" \
          --arg end_time "$JOB_END_TIME" \
          --argjson duration "$JOB_DURATION" \
          --argjson estimated_minutes "$ESTIMATED_MINUTES" \
          '{
            workflow: $workflow,
            job: $job,
            run_id: $run_id,
            repository: $repo,
            timestamp: $timestamp,
            timing: {
              start_time: ($start_time | tonumber),
              end_time: ($end_time | tonumber),
              duration_seconds: $duration
            },
            metrics: {
              estimated_github_actions_minutes: $estimated_minutes,
              job_duration_seconds: $duration
            },
            notes: "Production metrics require GitHub API billing integration"
          }')

        # Write metrics to file
        echo "$METRICS_JSON" | jq '.' > "$METRICS_FILE"

        echo "✓ Metrics collected and written to: $METRICS_FILE"
        echo ""
        echo "Metrics summary:"
        echo "$METRICS_JSON" | jq '{workflow, job, estimated_minutes: .metrics.estimated_github_actions_minutes, duration_seconds: .timing.duration_seconds}'

        # Output metrics for downstream jobs
        echo "metrics-file=$METRICS_FILE" >> $GITHUB_OUTPUT
        echo "workflow-minutes=$ESTIMATED_MINUTES" >> $GITHUB_OUTPUT
        echo "job-duration=$JOB_DURATION" >> $GITHUB_OUTPUT

    - name: Archive metrics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: workflow-metrics
        path: ${{ steps.collect.outputs.metrics-file }}
        retention-days: 90
        if-no-files-found: warn
