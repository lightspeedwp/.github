name: 'Workflow Test Harness'
description: 'Test harness for triggering and validating unified workflows'

on:
  workflow_dispatch:
    inputs:
      workflow_to_test:
        description: 'Which unified workflow to test'
        required: true
        type: choice
        options:
          - labeling-unified
          - validation-unified
          - testing-unified
          - linting-unified
          - quality-gates
      trigger_event:
        description: 'Type of trigger event'
        required: true
        type: choice
        options:
          - pull_request
          - push
          - manual
  pull_request:
    paths:
      - '.github/workflows/labeling-unified.yml'
      - '.github/workflows/validation-unified.yml'
      - '.github/workflows/testing-unified.yml'
      - '.github/workflows/linting-unified.yml'
      - '.github/workflows/quality-gates.yml'
      - '.github/tests/workflow-harness.yml'

jobs:
  harness-setup:
    name: 'Workflow Test Harness Setup'
    runs-on: ubuntu-latest
    outputs:
      test_id: ${{ steps.setup.outputs.test_id }}
      test_timestamp: ${{ steps.setup.outputs.test_timestamp }}
    steps:
      - name: 'Setup test environment'
        id: setup
        run: |
          TEST_ID="test-$(date +%s)"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "test_id=$TEST_ID" >> "$GITHUB_OUTPUT"
          echo "test_timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

          echo "🧪 Workflow Test Harness Initialized"
          echo "  Test ID: $TEST_ID"
          echo "  Timestamp: $TIMESTAMP"
          echo "  Workflow to test: ${{ github.event.inputs.workflow_to_test || 'all' }}"

  test-labeling:
    name: 'Test: labeling-unified.yml'
    needs: harness-setup
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.workflow_to_test || 'all', 'labeling')
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Verify labeling-unified.yml exists'
        run: |
          if [[ -f .github/workflows/labeling-unified.yml ]]; then
            echo "✅ labeling-unified.yml found"
          else
            echo "❌ labeling-unified.yml NOT found"
            exit 1
          fi

      - name: 'Validate YAML syntax'
        run: |
          # Check YAML syntax
          if command -v yq &> /dev/null; then
            yq eval '.' .github/workflows/labeling-unified.yml > /dev/null
            echo "✅ YAML syntax valid"
          else
            echo "⚠️  yq not available, skipping YAML validation"
          fi

      - name: 'Test composite action references'
        run: |
          echo "📦 Validating composite action references"

          if grep -q "uses:.*apply-labels" .github/workflows/labeling-unified.yml; then
            echo "✅ apply-labels action referenced"
          else
            echo "⚠️  apply-labels action not found"
          fi

          if grep -q "uses:.*collect-metrics" .github/workflows/labeling-unified.yml; then
            echo "✅ collect-metrics action referenced"
          else
            echo "⚠️  collect-metrics action not found"
          fi

  test-validation:
    name: 'Test: validation-unified.yml'
    needs: harness-setup
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.workflow_to_test || 'all', 'validation')
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Verify validation-unified.yml exists'
        run: |
          if [[ -f .github/workflows/validation-unified.yml ]]; then
            echo "✅ validation-unified.yml found"
          else
            echo "❌ validation-unified.yml NOT found (will be created in Phase 4)"
          fi

  test-testing:
    name: 'Test: testing-unified.yml'
    needs: harness-setup
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.workflow_to_test || 'all', 'testing')
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Verify testing-unified.yml exists'
        run: |
          if [[ -f .github/workflows/testing-unified.yml ]]; then
            echo "✅ testing-unified.yml found"
          else
            echo "❌ testing-unified.yml NOT found (will be created in Phase 4)"
          fi

  test-linting:
    name: 'Test: linting-unified.yml'
    needs: harness-setup
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.workflow_to_test || 'all', 'linting')
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Verify linting-unified.yml exists'
        run: |
          if [[ -f .github/workflows/linting-unified.yml ]]; then
            echo "✅ linting-unified.yml found"
          else
            echo "❌ linting-unified.yml NOT found (will be created in Phase 5)"
          fi

  test-quality-gates:
    name: 'Test: quality-gates.yml'
    needs: harness-setup
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.workflow_to_test || 'all', 'quality-gates')
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Verify quality-gates.yml exists'
        run: |
          if [[ -f .github/workflows/quality-gates.yml ]]; then
            echo "✅ quality-gates.yml found"
          else
            echo "❌ quality-gates.yml NOT found (will be created in Phase 6)"
          fi

  harness-summary:
    name: 'Workflow Test Harness Summary'
    needs:
      [
        harness-setup,
        test-labeling,
        test-validation,
        test-testing,
        test-linting,
        test-quality-gates,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 'Report test summary'
        run: |
          echo "📋 Workflow Test Harness Summary"
          echo "  Test ID: ${{ needs.harness-setup.outputs.test_id }}"
          echo "  Timestamp: ${{ needs.harness-setup.outputs.test_timestamp }}"
          echo "  Status: All tests completed"
