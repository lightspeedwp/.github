name: Error Isolation Test • Workflow Failure Isolation
# T011/T072: Validate single workflow type failure does not cascade

on:
  workflow_dispatch:
    inputs:
      test_scenario:
        description: 'Failure scenario to test'
        required: true
        type: choice
        options:
          - all_scenarios
          - labeling_fails
          - validation_fails
          - testing_fails
          - linting_fails
          - quality_gates_fails
        default: 'all_scenarios'

concurrency:
  group: error-isolation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Scenario 1: Labeling Workflow Fails
  # ============================================================================

  labeling-isolation-test:
    name: 'Scenario: labeling-unified.yml Fails'
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.test_scenario == 'all_scenarios' ||
      github.event.inputs.test_scenario == 'labeling_fails'
    steps:
      - name: Simulate labeling-unified.yml failure
        shell: bash
        run: |
          echo "❌ Simulating labeling-unified.yml failure..."
          echo "This test validates error isolation for labeling workflow"
          exit 1

  validation-during-labeling-failure:
    name: 'Isolation: validation-unified.yml continues'
    runs-on: ubuntu-latest
    if: |
      (github.event.inputs.test_scenario == 'all_scenarios' ||
       github.event.inputs.test_scenario == 'labeling_fails') &&
      always()
    steps:
      - name: Validate validation-unified.yml is independent
        shell: bash
        run: |
          echo "✅ validation-unified.yml executing independently"
          echo "Labeling failure did not block this workflow"

  testing-during-labeling-failure:
    name: 'Isolation: testing-unified.yml continues'
    runs-on: ubuntu-latest
    if: |
      (github.event.inputs.test_scenario == 'all_scenarios' ||
       github.event.inputs.test_scenario == 'labeling_fails') &&
      always()
    steps:
      - name: Validate testing-unified.yml is independent
        shell: bash
        run: |
          echo "✅ testing-unified.yml executing independently"
          echo "Labeling failure did not block this workflow"

  linting-during-labeling-failure:
    name: 'Isolation: linting-unified.yml continues'
    runs-on: ubuntu-latest
    if: |
      (github.event.inputs.test_scenario == 'all_scenarios' ||
       github.event.inputs.test_scenario == 'labeling_fails') &&
      always()
    steps:
      - name: Validate linting-unified.yml is independent
        shell: bash
        run: |
          echo "✅ linting-unified.yml executing independently"
          echo "Labeling failure did not block this workflow"

  quality-gates-during-labeling-failure:
    name: 'Isolation: quality-gates.yml continues'
    runs-on: ubuntu-latest
    if: |
      (github.event.inputs.test_scenario == 'all_scenarios' ||
       github.event.inputs.test_scenario == 'labeling_fails') &&
