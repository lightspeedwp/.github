# Branch Type to Default Labels Mapping
#
# Single source of truth for automatic label application based on branch type.
# This configuration is used by GitHub Actions workflows to apply labels to PRs
# created from branches matching each type.
#
# Format: Each type has:
#   - default_labels: Router-owned type/priority labels only (must exist in
#     .github/labels.yml)
#   - area_keywords: Scope hints for review; file-based area labels are owned
#     by .github/labeler.yml
#
# Area Detection: Scope keywords remain available as routing hints, but the
# router does not apply area labels. This keeps one owner for area labels and
# prevents branch-name guesses from fighting file-based labelling.
#
# Validation: All labels verified against canonical .github/labels.yml
# Last verified: 2026-09-14

branch_labels:
