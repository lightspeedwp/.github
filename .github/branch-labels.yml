# Area Label Keywords Reference
#
# These keywords are matched against branch scope to auto-detect area labels.
# Multiple keywords can match the same scope, applying all matching area labels.
#
# Example: branch scope "api-auth-security" matches:
#   - "api" → area:api
#   - "auth" → area:security
#   - "security" → area:security
# Result: area:api + area:security applied (deduplicated)
#
# Area Labels in Canonical Set (.github/labels.yml):
area_keywords_reference:
  api:
    label: area:integration
    keywords:
      - api
      - endpoint
      - rest
      - graphql
      - route

  auth:
    label: area:security
    keywords:
      - auth
      - security
      - credentials
      - oauth
      - jwt
      - password

  database:
    label: area:infrastructure
    keywords:
      - db
      - database
      - schema
      - migration
      - query

  docs:
    label: area:documentation
    keywords:
      - doc
      - docs
      - documentation
      - guide
      - readme

  frontend:
    label: area:scripts
    keywords:
      - ui
      - component
      - react
      - html
      - css
      - frontend

  backend:
    label: area:core
    keywords:
      - server
      - service
      - middleware
      - handler
      - backend

  testing:
    label: area:testing
    keywords:
      - test
      - spec
      - mock
      - fixture
      - e2e

  ci:
    label: area:ci
    keywords:
      - ci
      - workflow
      - github-actions
      - lint
      - build

  performance:
    label: area:performance
    keywords:
      - perf
      - performance
      - optimization
      - caching
      - speed

  security:
    label: area:security
    keywords:
      - security
      - vulnerability
      - xss
      - sql-injection
      - csrf
