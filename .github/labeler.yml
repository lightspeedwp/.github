# Configuration for actions/labeler.
#
# Each label maps to a LIST of match objects. File matchers use the v5+ shape
# `changed-files: [ { any-glob-to-any-file: [...] } ]`; the v4 mapping form is
# rejected by actions/labeler v7.
# The default status:needs-review (PRs) and priority:normal (everything) are
# owned by the labeling agent (scripts/agents/includes/status-enforcer.js), so
# they are NOT declared here. With sync-labels: true the labeler removes any
# label it declares when the branch no longer matches, and the agent then
# re-adds it: on a branch such as aiops/, task/, audit/ or dependabot/ that
# was a remove and re-add on every pull request event.
type:feature:
  - head-branch:
      - ^feat/.*
      - ^perf/.*
type:bug:
  - head-branch:
      - ^fix/.*
type:docs:
  - head-branch:
      - ^docs?/.*
type:chore:
  - head-branch:
      - ^chore/.*
type:task:
  - head-branch:
      - ^task/.*
type:ci:
  - head-branch:
      - ^ci/.*
      - ^build/.*
type:refactor:
  - head-branch:
      - ^refactor/.*
type:test:
  - head-branch:
      - ^test/.*
type:design:
  - head-branch:
      - ^design/.*
type:a11y:
  - head-branch:
      - ^a11y/.*
# PR type:* labels are owned by the router (.github/branch-labels.yml):
# labeler manages area:*/lang:* from files and keeps branch rules that
# agree with the router (#3545, #3731).
type:audit:
  - head-branch:
      - ^audit/.*
type:security:
  - head-branch:
      - ^security/.*
type:aiops:
  - head-branch:
      - ^aiops/.*
      - ^automation/.*
type:epic:
  - head-branch:
      - ^epic/.*
type:release:
  - head-branch:
      - ^release/.*
      - ^hotfix/.*
priority:critical:
  - head-branch:
      - ^hotfix/.*
      - ^security/.*
priority:important:
  - head-branch:
      - ^a11y/.*
area:block-editor:
  - changed-files:
      - any-glob-to-any-file:
          - src/blocks/**
          - src/block-editor/**
          - '**/block.json'
area:theme:
  - changed-files:
      - any-glob-to-any-file:
          - '**/theme.json'
          - '**/templates/**'
          - '**/patterns/**'
          - '**/parts/**'
          - theme/**/*
area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**
          - ci/**/*
          # The branch validation metrics PR carries area:ci from its workflow
          # (branch-validation-metrics-aggregator.yml); matching its files here
          # stops the labeler removing it again on every update.
          - .github/reports/branch-validation/**
          - metrics-artifacts/**
area:documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - docs/**
          - README.md
          - '**/README.md'
area:testing:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*
          - '**/*.test.*'
          - '**/*.spec.*'
          - '**/__tests__/**'
area:playwright:
  - changed-files:
      - any-glob-to-any-file:
          - playwright.config.ts
          - '**/playwright/**'
area:jest:
  - changed-files:
      - any-glob-to-any-file:
          - jest.config.*
          - tests/**/*.test.{ts,js}
          - src/**/*.test.{ts,js}
area:phpunit:
  - changed-files:
      - any-glob-to-any-file:
          - phpunit.xml*
          - tests/**/*.php
          - tests/**/*Test.php
area:pagespeed:
  - changed-files:
      - any-glob-to-any-file:
          - pagespeed/**
          - '**/*pagespeed*'
          - '**/*performance*.php'
          - '**/*metrics*.php'
area:scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**/*
          - '**/*.sh'
          - '**/*.bash'
area:assets:
  - changed-files:
      - any-glob-to-any-file:
          - assets/**/*
          - images/**/*
          - '**/*.png'
          - '**/*.jpg'
          - '**/*.svg'
area:woocommerce:
  - changed-files:
      - any-glob-to-any-file:
          - woocommerce/**/*
          - '**/woocommerce*.css'
          - '**/woocommerce*.php'
          - '**/woocommerce*.js'
lang:php:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.php'
          - composer.json
          - composer.lock
          - phpunit.xml
lang:js:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.{js,jsx,ts,tsx}'
          - package.json
          - package-lock.json
          - tsconfig.json
lang:css:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.{css,scss,sass,less}'
