# Configuration for actions/labeler.
#
# Each label maps to a LIST of match objects. This is the v5+ schema; the v4
# mapping form (label -> single object) is rejected by actions/labeler v7 with
# "found unexpected type for label ... (should be array of config options)".
status:needs-review:
  - head-branch:
      - ^feat/.*
      - ^fix/.*
      - ^docs?/.*
      - ^(chore|task|build|refactor|test|perf|ci|release|hotfix|design|a11y|qa|content|seo|config|migrate|uat|proto|ds|api|schema|telemetry|audit|security|automation|aiops|epic)/.*
type:feature:
  - head-branch:
      - ^feat/.*
type:bug:
  - head-branch:
      - ^fix/.*
type:documentation:
  - head-branch:
      - ^docs?/.*
type:chore:
  - head-branch:
      - ^chore/.*
type:task:
  - head-branch:
      - ^task/.*
type:build:
  - head-branch:
      - ^build/.*
type:ci:
  - head-branch:
      - ^ci/.*
type:refactor:
  - head-branch:
      - ^refactor/.*
type:test:
  - head-branch:
      - ^test/.*
type:performance:
  - head-branch:
      - ^perf/.*
type:design:
  - head-branch:
      - ^design/.*
type:a11y:
  - head-branch:
      - ^a11y/.*
type:audit:
  - head-branch:
      - ^audit/.*
type:security:
  - head-branch:
      - ^security/.*
type:automation:
  - head-branch:
      - ^automation/.*
type:ai-ops:
  - head-branch:
      - ^aiops/.*
type:epic:
  - head-branch:
      - ^epic/.*
type:release:
  - head-branch:
      - ^release/.*
      - ^hotfix/.*
priority:critical:
  - head-branch:
      - ^hotfix/.*
      - ^security/.*
priority:important:
  - head-branch:
      - ^a11y/.*
priority:normal:
  - head-branch:
      - ^feat/.*
      - ^fix/.*
      - ^docs?/.*
      - ^chore/.*
      - ^refactor/.*
      - ^test/.*
      - ^perf/.*
      - ^design/.*
      - ^audit/.*
      - ^ci/.*
      - ^build/.*
area:block-editor:
  - changed-files:
      any-glob-to-any-file:
        - src/blocks/**
        - src/block-editor/**
        - "**/block.json"
area:theme:
  - changed-files:
      any-glob-to-any-file:
        - "**/theme.json"
        - "**/templates/**"
        - "**/patterns/**"
        - "**/parts/**"
        - theme/**/*
area:ci:
  - changed-files:
      any-glob-to-any-file:
        - .github/workflows/**
        - .github/actions/**
        - ci/**/*
area:documentation:
  - changed-files:
      any-glob-to-any-file:
        - "**/*.md"
        - docs/**
        - README.md
        - "**/README.md"
area:testing:
  - changed-files:
      any-glob-to-any-file:
        - tests/**/*
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/__tests__/**"
area:playwright:
  - changed-files:
      any-glob-to-any-file:
        - playwright.config.ts
        - "**/playwright/**"
area:jest:
  - changed-files:
      any-glob-to-any-file:
        - jest.config.*
        - tests/**/*.test.{ts,js}
        - src/**/*.test.{ts,js}
area:phpunit:
  - changed-files:
      any-glob-to-any-file:
        - phpunit.xml*
        - tests/**/*.php
        - tests/**/*Test.php
area:pagespeed:
  - changed-files:
      any-glob-to-any-file:
        - pagespeed/**
        - "**/*pagespeed*"
        - "**/*performance*.php"
        - "**/*metrics*.php"
area:scripts:
  - changed-files:
      any-glob-to-any-file:
        - scripts/**/*
        - "**/*.sh"
        - "**/*.bash"
area:assets:
  - changed-files:
      any-glob-to-any-file:
        - assets/**/*
        - images/**/*
        - "**/*.png"
        - "**/*.jpg"
        - "**/*.svg"
area:woocommerce:
  - changed-files:
      any-glob-to-any-file:
        - woocommerce/**/*
        - "**/woocommerce*.css"
        - "**/woocommerce*.php"
        - "**/woocommerce*.js"
lang:php:
  - changed-files:
      any-glob-to-any-file:
        - "**/*.php"
        - composer.json
        - composer.lock
        - phpunit.xml
lang:js:
  - changed-files:
      any-glob-to-any-file:
        - "**/*.{js,jsx,ts,tsx}"
        - package.json
        - package-lock.json
        - tsconfig.json
lang:css:
  - changed-files:
      any-glob-to-any-file:
        - "**/*.{css,scss,sass,less}"
