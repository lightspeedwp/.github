# Label governance policy for canonical seeding and orphan-label cleanup.
# Destructive cleanup is gated and must remain disabled until issue #95
# decisions are approved and reflected in this file.

version: 1
last_updated: '2026-09-24'

destructive_cleanup:
  enabled: false
  gated_by_issue: 95
  approved_orphan_labels: []
  # Only labels in labels.yml; others were removed in spec 008 (T055).
  never_delete_labels:
    - type:bug
    - type:feature
    - type:task
    - type:release
    - type:design
    - type:chore
    - type:refactor
    - type:automation
    - type:test
    - type:build
    - type:ci
    - type:dependency
    - type:research
    - type:security
    - type:performance
    - type:audit
    - type:epic
    - type:content-modelling
    - type:review
    - type:a11y
    - type:improve
    - area:ci
    - area:dependencies
    - area:security
    - area:a11y
    - area:documentation
    - area:tests
    - area:scripts
    - area:assets
    - area:woocommerce
    - area:block-editor
    - area:theme
    - area:testing
    - area:performance
    - area:playwright
    - area:jest
    - area:phpunit
    - area:pagespeed
    - lang:php
    - lang:js
    - lang:css
    - lang:md
    - lang:json
