version: 1
apply_to: ["h1","h2"]
skip:
  # formal docs where emojis are not used
  - "CHANGELOG.md"
  - "CODE_OF_CONDUCT.md"
map:
  # keyword -> emoji (first match wins)
  design: "🎨"
  workflow: "🛠"
  release: "🚀"
  governance: "🏛"
fallbacks:
  generic: "✨"     # used only if no keyword matched and page not in skip
notes: "Conservative: 0–1 emoji per heading; never on h3+."
