schema: 1  # version of the schema format
types:
  product_dev:
    project_name: "Product Development"
    fields:
      - key: "Area"
        slug: "area"
        type: "single_select"
        description: "Work area"
        options: ["Footer", "Checkout", "Search"]
      - key: "Release Stage"
        slug: "release_stage"
        type: "single_select"
        description: "Stage of the release"
        options: ["Alpha", "Beta", "RC", "Stable"]
      # (Common fields like Status/Priority/Type could be included here as well)
  client_services:
    project_name: "Client Services"
    fields:
      - key: "Area"
        slug: "area"
        type: "single_select"
        description: "Work area"
        options: ["Footer", "Checkout", "Search"]
      - key: "Client"
        slug: "client"
        type: "text"
        description: "Client identifier"
