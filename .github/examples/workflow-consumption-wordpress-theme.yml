# Example: CI for a WordPress block theme
#
# Place this in: .github/workflows/ci.yml (in your theme repo, e.g. one
# generated from lightspeedwp/block-theme-scaffold).
#
# - Every action is pinned to a full commit SHA with its version as a
#   comment; let Dependabot (github-actions ecosystem) keep the pins current.
# - Organisation reusable workflows are called by path and pinned to a
#   lightspeedwp/.github commit SHA: replace REPLACE_WITH_COMMIT_SHA below.
#   Available: ai-feedback-validation.yml (below) and
#   orchestrate-phase-progression.yml, which needs issues and
#   pull_request_target triggers, so it belongs in its own workflow file
#   (see the usage block at the top of that file).

name: Theme CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-feedback:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lightspeedwp/.github/.github/workflows/ai-feedback-validation.yml@REPLACE_WITH_COMMIT_SHA
    with:
      enforce: false

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
