name: lightspeed-wordpress-governance-checks
version: v0.1.0
description: Run governance checks for WordPress repositories covering standards, labeling, and release hygiene.
owners:
  - LightSpeedWP Team
platforms:
  claude:
    supported: true
    mode: first-class
    config: agents/claude.yaml
  copilot:
    supported: true
    mode: first-class
    config: agents/copilot.yaml
  gemini:
    supported: true
    mode: experimental
    config: agents/gemini.yaml
  codex:
    supported: true
    mode: legacy-compatible
    config: agents/codex.yaml
