# Qodo PR-Agent — LightSpeed organisation-standard configuration
#
# Qodo PR-Agent (https://github.com/The-PR-Agent/pr-agent, formerly qodo-ai/pr-agent;
# docs at https://docs.pr-agent.ai/)
# complements CodeRabbit: CodeRabbit remains the primary automatic reviewer.
# Qodo PR-Agent posts PR summaries and improvement suggestions, and answers
# maintainer commands. It never edits the PR body, applies labels or commits.
#
# - Documentation: docs/QODO_PR_AGENT.md
# - Specification: .github/specs/019-qodo-pr-agent-integration/
# - Contract (asserted by tests/js/qodo-pr-agent-config.test.js):
#   .github/specs/019-qodo-pr-agent-integration/contracts/pr-agent-config.md
#
# Qodo PR-Agent reads this file from the DEFAULT branch, so changes take effect only
# after merge. Only this repository is enabled in the pilot. A repository that adopts
# the shared standard later gets this file from the constant URL the receiver sets
# through `PR_AGENT_EXTRA_CONFIG_URL`, which is the CLI's own name for the setting the
# action runner read as `CONFIG.EXTRA_CONFIG_URL`; it may then override individual
# keys in its own `.pr_agent.toml`, except the keys marked `# locked:` below.
#
# Trigger policy (which tools run automatically, who may run commands) lives in
# the workflow, not here. Never put credentials in this file.

[config]
# Verified 2026-10-01 against Anthropic's models overview and model-deprecations
# pages, and against the model map this image freezes.
#
# THE PRIMARY. Claude Sonnet 5.5 (`claude-sonnet-5-5`) is the current Sonnet and
# costs the same as Sonnet 5. But litellm 1.101.0 - pinned by pr-agent v0.46.0, and
# frozen at build time by LITELLM_LOCAL_MODEL_COST_MAP=True in the image - has no
# entry for it. Its bundled map's newest Sonnet is `claude-sonnet-5`, and the newest
# small model is `claude-haiku-4-5`. Moving to 5.5 therefore needs a pr-agent release
# that bumps litellm, then a new image digest and a fresh provenance check. That is
# T001's upgrade procedure, not a config edit here.
#
# `claude-sonnet-5` is a valid, current id, and it is NOT an alias for 5.5: from the
# 4.6 generation onward every dateless id is its own pinned snapshot. Anthropic lists
# it as Active, retired not sooner than 2027-06-30. Its own model page marks the
# generation Legacy, meaning no further updates, and recommends 5.5 - so this is a dated
# choice with a known upgrade, not a preference and not a deprecation.
model = "anthropic/claude-sonnet-5"
# The exact API ID for Claude Haiku 4.5, present in the same bundled map, and the
# newest small model the pinned image can serve. Anthropic lists it Active and NOT
# deprecated, so it carries no replacement and is not scheduled for retirement; the
# 2026-10-15 date on the deprecations page is the *tentative* retirement date, a floor
# on support rather than a deadline, and it sits alongside every Active model's
# commitment. No action is required on this line today; re-check that page if the
# fallback ever has to change.
fallback_models = ["anthropic/claude-haiku-4-5-20251001"]
# A single cap on the tokens any model may use, whatever that model's own context
# window is; upstream's default is 32000 (pr_agent/settings/configuration.toml).
# That file registers no per-model limits, so the 1,000,000-token context window
# litellm publishes for anthropic/claude-sonnet-5 comes from litellm's model map,
# not from here. 64000 trades most of that context for a bounded prompt and cost.
# Raise it only with the spend limit in mind. 64000 is deliberately the *fallback's*
# ceiling, not Sonnet's: the bundled map gives claude-sonnet-5 a 128000 max output and
# claude-haiku-4-5-20251001 a 64000 one, and a run that falls back mid-flight must not
# then ask for more than the fallback supports. Both ids resolve in the bundled map, so
# `custom_model_max_tokens` — for models litellm does not know — is not needed here.
max_model_tokens = 64000
large_patch_policy = "clip"
# locked: all output in UK English (FR-007). Upstream static headings stay US English.
response_language = "en-GB"
# locked: Qodo PR-Agent must never apply or remove labels (FR-008).
enable_custom_labels = false

[ignore]
glob = [
  "node_modules/**",
  ".github/workflows/archived/**",
  ".github/reports/**",
  "**/*.lock",
  "package-lock.json",
]

[pr_description]
# locked: post the summary as a comment, never overwrite the routed PR template (FR-012).
publish_description_as_comment = true
publish_description_as_comment_persistent = true
# locked: no labels from describe (FR-008).
publish_labels = false
# locked: titles follow the PR template convention.
generate_ai_title = false
extra_instructions = """
Write in UK English. Follow the organisation standards in AGENTS.md; do not restate them.
Stay technology-agnostic and concise: summarise what changed and why, for a reviewer.
Never reproduce credentials, tokens or keys found in the diff; refer to them by file and line only.
Never suggest editing .github/labels.yml, .github/issue-types.yml or the issue and PR templates: they are locked.
"""

[pr_reviewer]
# locked: the defaults add unprefixed labels ("possible security issue", "Review effort x/5") (FR-008).
enable_review_labels_security = false
enable_review_labels_effort = false
persistent_comment = true
extra_instructions = """
Write in UK English. Follow the organisation standards in AGENTS.md; do not restate them.
Stay technology-agnostic. Report only concrete, actionable findings with file and line references.
This is an on-demand second opinion: CodeRabbit is the primary reviewer, so do not issue an approval verdict.
Never reproduce credentials, tokens or keys found in the diff; refer to them by file and line only.
Never suggest editing .github/labels.yml, .github/issue-types.yml or the issue and PR templates: they are locked.
"""

[pr_code_suggestions]
# locked: suggestions are never committed by Qodo PR-Agent (FR-009).
commitable_code_suggestions = false
persistent_comment = true
extra_instructions = """
Write in UK English. Follow the organisation standards in AGENTS.md; do not restate them.
Stay technology-agnostic. Prefer fewer, higher-value suggestions over style nits.
Never reproduce credentials, tokens or keys found in the diff; refer to them by file and line only.
Never suggest editing .github/labels.yml, .github/issue-types.yml or the issue and PR templates: they are locked.
"""

[pr_questions]
extra_instructions = """
Write in UK English. Follow the organisation standards in AGENTS.md; do not restate them.
Stay technology-agnostic and answer only from the PR's changes and context.
Never reproduce credentials, tokens or keys found in the diff; refer to them by file and line only.
"""

[pr_update_changelog]
# locked: proposals are posted as a comment, never pushed (FR-009).
push_changelog_changes = false
extra_instructions = """
Write in UK English. Follow the organisation standards in AGENTS.md; do not restate them.
Propose one entry of at most 250 characters, user-facing, with no implementation detail.
Link the PR and use a Keep a Changelog category: Added, Changed, Fixed or Removed.
Never reproduce credentials, tokens or keys found in the diff; refer to them by file and line only.
"""

[pr_add_docs]
extra_instructions = """
Write in UK English. Follow the organisation standards in AGENTS.md; do not restate them.
Stay technology-agnostic and match the documentation style already used in each file.
Never reproduce credentials, tokens or keys found in the diff; refer to them by file and line only.
"""
