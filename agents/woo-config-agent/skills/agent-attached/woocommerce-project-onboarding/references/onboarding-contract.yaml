state_backend: memory
memory_state_file: user-defaults.yaml

trigger_when:
  task_requires:
    - "unnamed-project WooCommerce audit, planning, remediation, or handoff work where the agent would otherwise have to guess which store or client is in scope"
  missing_state:
    - "default_project_context"

required_state:
  - key: "default_project_context"
    ask: "Which store, client, or project should I treat as your default when you do not name one?"
    store_as: "default_project_context"

optional_state:
  - key: "default_environment"
    ask: "Which environment should I assume by default: development, staging, or live?"
    default: "staging"
    store_as: "default_environment"
  - key: "formal_output_destination"
    ask: "When you want a formal deliverable, should I default to a Google Doc or keep it in chat unless you say otherwise?"
    default: "Google Doc"
    store_as: "formal_output_destination"
  - key: "default_follow_up_tracker"
    ask: "If follow-up tasks need tracking, should I default to Linear, Bugherd, or no tracker unless you ask?"
    default: "no tracker"
    store_as: "default_follow_up_tracker"

completion_requires:
  - "default_project_context"

skip_when:
  - "the current request already names the relevant store, client, site, or project clearly enough to continue"
  - "the current request is a one-off generic WooCommerce question that does not need durable project continuity"
  - "a stored default project context already exists in Memory and no current request detail overrides it"
