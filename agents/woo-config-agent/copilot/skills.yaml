version: "2.0"
name: woo-config-skills
description: >-
  GitHub Copilot skill set for WooCommerce store configuration, aligned to the
  seven-phase methodology in ../shared/core-prompt.md.
maintainer: Ash Shaw
owners:
  - lightspeedwp/maintainers

skills:
  - id: store-setup
    name: Store Setup & Analysis
    description: >-
      Analyse a WooCommerce System Status Report and produce an ordered
      setup-optimisation plan (impact, effort, rollback per item).
    commands:
      - /woo analyze
      - /woo setup-plan
    inputs:
      - name: system_status
        required: true
        description: System Status Report text or JSON.
      - name: business_model
        required: false
        description: b2c | b2b | subscription | digital | mixed.
    outputs:
      - setup-optimisation-plan.md
    github:
      creates_issues: true
      issue_labels: ["type:chore", "area:woocommerce"]

  - id: product-management
    name: Product Management
    description: >-
      Recommend product types, global attributes, category structure, and
      inventory policy for the catalogue.
    commands:
      - /woo products
      - /woo attributes
    inputs:
      - name: catalogue_summary
        required: true
        description: Product count, variation usage, existing categories.
    outputs:
      - catalogue-model.md

  - id: payment-integration
    name: Payment Integration
    description: >-
      Produce a gateway matrix, webhook checklist, and PCI DSS scope statement.
    commands:
      - /woo payments
      - /woo webhooks
    inputs:
      - name: regions
        required: true
        description: ISO country codes to accept payments from.
      - name: flow
        required: false
        description: hosted_fields | redirect | onsite_tokenised.
    outputs:
      - payment-configuration.md
    security:
      never_output_secrets: true
      pci_scope_required: true

  - id: performance-tuning
    name: Performance Tuning
    description: >-
      Turn a measured baseline into an ordered performance plan with target
      Core Web Vitals and cache-exclusion rules.
    commands:
      - /woo perf
      - /woo cache-rules
    inputs:
      - name: baseline
        required: true
        description: LCP, CLS, INP, and cache signals.
    outputs:
      - performance-plan.md

  - id: inventory-control
    name: Inventory Control
    description: Define stock policy, low-stock thresholds, and backorder behaviour.
    commands:
      - /woo inventory
    inputs:
      - name: manage_stock
        required: true
    outputs:
      - operations-runbook.md

  - id: customer-support
    name: Customer & Privacy
    description: >-
      Configure accounts, roles, GDPR export/erase, and transactional email
      branding.
    commands:
      - /woo customers
      - /woo gdpr
    inputs:
      - name: guest_checkout
        required: true
    outputs:
      - customer-plan.md

  - id: analytics-reporting
    name: Analytics & Reporting
    description: Define KPIs and the tracking source for each, with consent notes.
    commands:
      - /woo analytics
    inputs:
      - name: kpis
        required: true
        description: conversion_rate, average_order_value, cart_abandonment, etc.
    outputs:
      - analytics-plan.md

integration:
  projects:
    enabled: true
    phase_columns:
      - Analysis
      - Optimisation
      - Products
      - Payments
      - Performance
      - Operations
      - Customer & Privacy
      - Analytics
  actions:
    suggested_workflows:
      - name: system-status-drift
        description: Schedule a System Status export and diff it to catch config drift.
