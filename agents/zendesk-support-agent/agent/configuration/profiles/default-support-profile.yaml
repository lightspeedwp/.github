name: Zendesk Support Default Profile
default_output_style: concise_markdown
default_operating_mode: zendesk_first
default_evidence_standard: confirmed_facts_plus_labeled_inference
default_write_behavior: draft_before_write_when_ambiguous
required_output_sections:
  - title
  - confirmed_facts
  - next_step
customer_reply_rules:
  - use_confirmed_facts_only
  - keep_tone_clear_and_empathetic
  - avoid_unapproved_promises
internal_handoff_rules:
  - include_problem_statement
  - include_customer_impact
  - include_exact_ask
backlog_report_rules:
  - include_scope_and_timeframe
  - include_issue_themes
  - include_recommended_next_actions
documentation_review_rules:
  - include_recommendation
  - include_readiness_level
  - include_overlap_check
bug_package_rules:
  - include_problem_summary
  - include_reproduction_clues
  - include_next_action
memory_rules:
  - save_only_durable_preferences
  - keep_memory_schema_valid
  - remove_stale_todos
  - avoid_case_specific_evidence
approved_memory_files:
  - memory/user-preferences.md
  - memory/report-defaults.yaml
  - memory/drafting-preferences.md
  - memory/todos.md
memory_example_files:
  - examples/memory/user-preferences.example.md
  - examples/memory/report-defaults.example.yaml
  - examples/memory/drafting-preferences.example.md
  - examples/memory/todos.example.md
template_files:
  - templates/agent-triage-summary-template.md
  - templates/agent-investigation-template.md
  - templates/agent-customer-reply-template.md
  - templates/agent-handoff-template.md
  - templates/agent-escalation-template.md
  - templates/agent-backlog-report-template.md
  - templates/agent-documentation-review-template.md
  - templates/agent-bug-package-template.md
example_files:
  - examples/templates/agent-triage-summary.example.md
  - examples/templates/agent-investigation.example.md
  - examples/templates/agent-customer-reply.example.md
  - examples/templates/agent-handoff.example.md
  - examples/templates/agent-escalation.example.md
  - examples/templates/agent-backlog-report.example.md
  - examples/templates/agent-documentation-review.example.md
  - examples/templates/agent-bug-package.example.md
template_example_pairs:
  - template: templates/agent-triage-summary-template.md
    example: examples/templates/agent-triage-summary.example.md
    deliverable: triage_summary
  - template: templates/agent-investigation-template.md
    example: examples/templates/agent-investigation.example.md
    deliverable: investigation
  - template: templates/agent-customer-reply-template.md
    example: examples/templates/agent-customer-reply.example.md
    deliverable: customer_reply
  - template: templates/agent-handoff-template.md
    example: examples/templates/agent-handoff.example.md
    deliverable: support_handoff
  - template: templates/agent-escalation-template.md
    example: examples/templates/agent-escalation.example.md
    deliverable: escalation_brief
  - template: templates/agent-backlog-report-template.md
    example: examples/templates/agent-backlog-report.example.md
    deliverable: backlog_report
  - template: templates/agent-documentation-review-template.md
    example: examples/templates/agent-documentation-review.example.md
    deliverable: documentation_review
  - template: templates/agent-bug-package-template.md
    example: examples/templates/agent-bug-package.example.md
    deliverable: bug_package
template_usage_rules:
  - use_paired_template_for_repeated_deliverables
  - keep_required_sections_aligned_with_output_contracts
  - treat_missing_referenced_templates_as_contract_drift
example_usage_rules:
  - use_examples_as_structure_references_not_copy_sources
  - keep_examples_paired_with_current_templates
  - keep_examples_generalized_and_customer_safe
fixture_files:
  - fixtures/ticket-intake-fixture.md
  - fixtures/backlog-audit-fixture.md
fixture_schema_pairs:
  - fixture: fixtures/ticket-intake-fixture.md
    schema: schemas/ticket-intake-fixture.schema.json
    primary_deliverables:
      - triage_summary
      - investigation
      - customer_reply
      - support_handoff
      - escalation_brief
      - documentation_review
      - bug_package
  - fixture: fixtures/backlog-audit-fixture.md
    schema: schemas/backlog-audit-fixture.schema.json
    primary_deliverables:
      - backlog_report
fixture_usage_rules:
  - keep_fixture_inputs_generalized_and_non_customer_specific
  - use_fixtures_for_validation_and_example_alignment_only
  - do_not_copy_fixture_content_into_memory
profile_usage_rules:
  - keep_profiles_schema_valid_and_aligned_with_current_reference_files
  - treat_profile_defaults_as_reusable_output_constraints_not_case_evidence
  - update_profile_contracts_when_template_example_pairs_change
report_default_keys:
  - timeframe_days
  - include_sections
  - next_actions_count
  - comparison_mode
  - include_example_tickets
profile_schema: schemas/default-support-profile.schema.json
phase_3_alignment_files:
  - references/agent-memory-policy.md
  - references/output-standards.md
  - references/qa-standards.md
  - schemas/default-support-profile.schema.json
  - schemas/backlog-audit-fixture.schema.json
  - schemas/ticket-intake-fixture.schema.json
  - tests/schema-validation-tests.md
batch_2_alignment_rules:
  - keep_template_and_example_pairs_in_sync
  - keep_fixture_files_generalized_and_non_customer_specific
  - keep_profiles_schema_valid_and_reference_current_contract_files
  - add_missing_template_and_example_assets_when_references_exist
  - update_output_contract_files_when_new_template_pairs_are_added
