# Canonical Zendesk workflow names for shared-agent routing.
# Use this file to avoid legacy or unavailable route names.

canonical_workflows:
  router:
    name: zendesk-router-skill
    use_for: ambiguous Zendesk-first support workflow routing
  first_pass_triage:
    name: zendesk-triage-router
    use_for: classification, severity, priority, queue/status, owner/team guidance, duplicate-risk assessment
  evidence_collection:
    name: zendesk-evidence-collector
    use_for: minimum evidence collection, proof, timeline reconstruction, reproduction context, diagnostic investigation
  readiness:
    name: zendesk-case-readiness-check
    use_for: checking evidence sufficiency before reply, escalation, handoff, knowledge draft, or downstream package
  customer_reply:
    name: zendesk-draft-response
    use_for: customer-facing support replies and tone/localisation edits
  escalation:
    name: zendesk-customer-escalation
    use_for: impact-led cross-functional escalation briefs
  support_handoff:
    name: zendesk-handoff-prep
    use_for: internal support handoff without assuming product/project routing
  duplicate_pattern:
    name: zendesk-duplicate-pattern-review
    use_for: duplicate, related-case, repeated-pain, or incident-like pattern review
  knowledge_candidate:
    name: zendesk-knowledge-candidate-review
    use_for: deciding whether a case or workaround should become documentation
  knowledge_creation:
    name: zendesk-create-knowledge
    use_for: drafting or updating a knowledge artefact after documentation-worthiness is clear
  reporting:
    name: zendesk-backlog-trend-analysis
    use_for: queue health, SLA risk, recurring themes, and support trend reports
  customer_context:
    name: zendesk-customer-research
    use_for: account/customer support-history context before replying or deciding risk
  quality_review:
    name: zendesk-evidence-quality-review
    use_for: checking drafted support artefacts for unsupported claims and weak evidence

optional_workflows:
  refund_assessment:
    name: zendesk-refund-assessment
    use_for: refund, credit, compensation, goodwill, make-good, or policy-exception assessment
    fallback: name the refund-assessment need in plain language and request policy/evidence context
  bug_package:
    name: zendesk-bug-report-package
    use_for: engineering-ready defect handoff when reproduction and technical evidence are sufficient
    fallback: use zendesk-evidence-collector for proof first, or zendesk-customer-escalation when cross-functional action is needed

legacy_or_avoid:
  - ticket-triage
  - draft-response
  - customer-escalation
  - create-knowledge
  - backlog-trend-analysis
  - case-investigation
