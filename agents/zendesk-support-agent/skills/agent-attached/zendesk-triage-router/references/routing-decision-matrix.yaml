# Deterministic routing matrix for Zendesk-first support requests.
# Prefer one primary workflow and at most one supporting workflow.

rules:
  - id: embedded-first-pass-triage
    object: one ticket or support case
    intent_signals:
      - classify this ticket
      - assign severity
      - assign priority
      - recommend owner or team
      - suggest queue or status
      - duplicate risk first pass
    primary_workflow: zendesk-triage-router
    supporting_workflow: none
    notes: Handle inside the router. Do not route to a separate triage workflow.

  - id: evidence-or-rca
    object: one ticket or one case/thread
    intent_signals:
      - find root cause
      - gather proof
      - reconstruct timeline
      - confirm what happened
      - check reproduction evidence
      - known issue check
    primary_workflow: zendesk-evidence-collector
    supporting_workflow: zendesk-case-readiness-check when evidence sufficiency is disputed
    avoid_until_ready:
      - zendesk-draft-response
      - zendesk-customer-escalation

  - id: customer-reply
    object: one ticket or one case/thread
    intent_signals:
      - write the customer reply
      - draft a response
      - customer update
      - apology
      - workaround wording
      - closure note
    primary_workflow: zendesk-draft-response
    supporting_workflow: zendesk-case-readiness-check when confirmed facts are thin
    avoid_until_ready:
      - zendesk-create-knowledge
      - linear issue drafting

  - id: escalation
    object: one ticket or one support case
    intent_signals:
      - escalate
      - needs engineering
      - needs security
      - leadership risk
      - blocked customer
      - decision needed
      - urgent specialist intervention
    primary_workflow: zendesk-customer-escalation
    supporting_workflow: zendesk-evidence-collector when impact or proof is missing
    avoid_until_ready:
      - zendesk-draft-response if no approved customer update is requested

  - id: support-handoff
    object: one ticket, case, or operational support summary
    intent_signals:
      - handoff
      - pass to support manager
      - prepare internal summary
      - specialist review summary
      - downstream support handoff
    primary_workflow: zendesk-handoff-prep
    supporting_workflow: zendesk-case-readiness-check when the next owner or ask is unclear
    avoid_until_ready:
      - linear issue drafting unless explicitly requested
      - github issue drafting unless explicitly requested

  - id: duplicate-pattern
    object: two or more tickets, related cases, repeated customer complaints, or possible incident pattern
    intent_signals:
      - are these duplicates
      - related tickets
      - repeated issue
      - same underlying cause
      - broader incident pattern
    primary_workflow: zendesk-duplicate-pattern-review
    supporting_workflow: zendesk-evidence-collector when ticket evidence is incomplete
    avoid_until_ready:
      - zendesk-backlog-trend-analysis when the immediate question is sameness, not volume

  - id: backlog-or-trend
    object: queue, export, date range, multiple tickets, weekly support view, or repeated issue group
    intent_signals:
      - backlog report
      - support trend
      - queue health
      - weekly summary
      - SLA risk
      - ageing risk
      - volume pattern
    primary_workflow: zendesk-backlog-trend-analysis
    supporting_workflow: none
    avoid_until_ready:
      - zendesk-duplicate-pattern-review when the immediate question is operational reporting, not sameness

  - id: knowledge-candidate
    object: resolved case, repeated answer, workaround, known issue, or help-centre gap
    intent_signals:
      - should this become documentation
      - article candidate
      - public or internal knowledge
      - documentation-worthiness
      - help-centre gap
    primary_workflow: zendesk-knowledge-candidate-review
    supporting_workflow: zendesk-evidence-collector when stability or resolution evidence is missing
    avoid_until_ready:
      - zendesk-create-knowledge

  - id: knowledge-draft
    object: approved article candidate, stable workaround, resolved case, or reusable support answer
    intent_signals:
      - create the article
      - draft the faq
      - write the knowledge base article
      - update help centre content
      - internal knowledge note
    primary_workflow: zendesk-create-knowledge
    supporting_workflow: zendesk-knowledge-candidate-review when suitability has not been decided
    avoid_until_ready: []

  - id: customer-account-context
    object: customer, organisation, account history, or pre-reply support-health brief
    intent_signals:
      - customer context
      - account research
      - support health
      - recent support activity
      - open risks for this customer
      - prior commitments
    primary_workflow: zendesk-customer-research
    supporting_workflow: none
    avoid_until_ready:
      - zendesk-draft-response when the user only asked for context
