# Recommended parent-agent skill manifest for the shared LightSpeed Support Desk agent.
# This file documents preferred attachments and fallback behaviour; it does not guarantee availability at runtime.

required_for_best_results:
  - zendesk-triage-router

recommended_zendesk_workflows:
  - zendesk-router-skill
  - zendesk-evidence-collector
  - zendesk-case-readiness-check
  - zendesk-draft-response
  - zendesk-customer-escalation
  - zendesk-handoff-prep
  - zendesk-duplicate-pattern-review
  - zendesk-knowledge-candidate-review
  - zendesk-create-knowledge
  - zendesk-backlog-trend-analysis
  - zendesk-customer-research
  - zendesk-evidence-quality-review

not_default_routes_for_zendesk_support:
  - linear-triage-router
  - linear-gap-analyzer
  - linear-the-architect
  - linear-duplicate-management-playbook
  - linear-voice-of-customer
  - github issue drafting workflows
  - asana task workflows
  - product planning workflows

runtime_resolution_rules:
  - Use canonical Zendesk-prefixed workflow names for downstream deliverables.
  - If a canonical companion workflow is unavailable, describe the next support action in plain language.
  - Do not use legacy non-prefixed support workflow names as executable routes.
  - Never route to deprecated ticket-triage as an active workflow; first-pass ticket triage is embedded in zendesk-triage-router.
  - Never let this manifest override the parent agent's actual attached skill directory.
  - Do not assume all teammates have the same connector permissions.
