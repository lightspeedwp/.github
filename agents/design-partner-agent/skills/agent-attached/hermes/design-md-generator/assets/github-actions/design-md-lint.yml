name: DESIGN.md Lint

on:
  pull_request:
    paths:
      - 'DESIGN.md'
      - 'theme.json'
      - 'styles/**'
      - '**/*.css'
      - '**/*.scss'
      - '.github/workflows/design-md-lint.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'DESIGN.md'
      - 'theme.json'
      - 'styles/**'
      - '**/*.css'
      - '**/*.scss'

jobs:
  design-md-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DESIGN.md CLI
        run: npm install --no-save @google/design.md

      - name: Add CI validation script
        run: |
          mkdir -p scripts
          cat > scripts/ci-design-md-check.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          repo_root="${1:-$(pwd)}"
          design_file="${DESIGN_MD_FILE:-$repo_root/DESIGN.md}"
          report_file="${DESIGN_MD_REPORT:-$repo_root/design-md-validation-report.md}"
          json_file="${DESIGN_MD_JSON_REPORT:-$repo_root/designmd-lint.json}"
          comment_file="${DESIGN_MD_PR_COMMENT:-$repo_root/design-md-pr-comment.md}"
          if [ ! -f "$design_file" ]; then
            echo "DESIGN.md not found at $design_file" >&2
            exit 1
          fi
          npx @google/design.md lint "$design_file" --format json > "$json_file"
          node - "$json_file" "$comment_file" <<'EON'
          const fs = require('fs');
          const jsonPath = process.argv[2];
          const commentPath = process.argv[3];
          const report = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          const findings = Array.isArray(report.findings) ? report.findings : [];
          const summary = report.summary || {};
          const lines = [
            '<!-- design-md-lint-comment -->',
            '## DESIGN.md Lint Summary',
            '',
            `- Errors: ${summary.errors || 0}`,
            `- Warnings: ${summary.warnings || 0}`,
            `- Infos: ${summary.infos || 0}`,
            '',
            '### Top findings',
            '',
            ...(findings.slice(0, 10).map((finding) => {
              const severity = String(finding.severity || 'info').toUpperCase();
              const path = finding.path ? ` \`${finding.path}\`` : '';
              return `- **${severity}**${path}: ${finding.message}`;
            })),
          ];
          if (findings.length === 0) {
            lines.push('- No findings reported by the CLI.');
          }
          lines.push('', 'Full report file: `design-md-validation-report.md`');
          fs.writeFileSync(commentPath, lines.join('\n'));
          EON
          {
            echo '# DESIGN.md Validation Report'
            echo
            echo '```json'
            cat "$json_file"
            echo '```'
          } > "$report_file"
          node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log(report.summary); if((report.summary.errors||0)>0){process.exit(1)}" "$json_file"
          EOF
          chmod +x scripts/ci-design-md-check.sh

      - name: Run CI validation
        id: run_ci_validation
        run: scripts/ci-design-md-check.sh
        continue-on-error: true

      - name: Upload PR comment body
        if: always() && hashFiles('design-md-pr-comment.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: design-md-pr-comment
          path: design-md-pr-comment.md

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('design-md-pr-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'design-md-pr-comment.md';
            if (!fs.existsSync(path)) {
              core.info('No PR comment file found.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- design-md-lint-comment -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail job on lint errors
        if: steps.run_ci_validation.outcome == 'failure'
        run: exit 1

      - name: Upload validation report
        if: always() && hashFiles('design-md-validation-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: design-md-validation-report
          path: design-md-validation-report.md
