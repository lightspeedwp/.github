$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - title
  - status
  - type
  - version
properties:
  title:
    type: string
    minLength: 3
    maxLength: 120
  description:
    type: string
    maxLength: 300
  status:
    type: string
    enum:
      - draft
      - review
      - approved
      - deprecated
  type:
    type: string
    enum:
      - template
      - guide
      - checklist
      - reference
      - prompt
      - spec
      - issue
      - qa-plan
  audience:
    type: array
    items:
      type: string
      enum:
        - internal
        - client
        - developer
        - editor
        - ai-agent
  version:
    type: string
    pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
  owner:
    type: string
  last_reviewed:
    type: string
    format: date
  tags:
    type: array
    items:
      type: string
minProperties: 4
maxProperties: 12
additionalProperties: false
overrides:
  "**/*.html":
    properties:
      type:
        enum:
          - template
          - reference
          - spec
  "**/*.php":
    properties:
      type:
        enum:
          - template
          - reference
          - spec
          - qa-plan
  "**/*.yaml":
    properties:
      type:
        enum:
          - reference
          - spec
          - prompt
  "**/*.yml":
    properties:
      type:
        enum:
          - reference
          - spec
          - prompt
