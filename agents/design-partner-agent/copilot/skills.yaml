version: '1.0.0'
agent:
  id: design-partner-copilot
  name: Design Partner Agent
  description: AI design consultant for GitHub Copilot

skills:
  - id: design-system-analysis
    name: Design System Analysis
    description: Analyze design system structure, token organization, and component consistency
    enabled: true
    commands:
      - analyze design system
      - review design tokens
      - check component consistency
    triggers:
      - github_issue_label:design-review
      - github_discussion:design
      - pull_request:design
    output:
      - markdown_report
      - github_issue
      - status_summary
    parameters:
      figma_file_url:
        type: string
        required: true
        description: Direct URL to Figma design system file
      check_types:
        type: array
        required: false
        default:
          - component-inventory
          - token-organization
          - naming-consistency
        description: Types of checks to perform
      export_format:
        type: string
        required: false
        default: json
        enum:
          - json
          - yaml
          - csv
        description: Format for exported analysis data
    integrations:
      - github_projects
      - github_issues
      - github_discussions
      - figma_api
    error_handling:
      retry_policy: exponential_backoff
      max_retries: 3
      timeout_seconds: 300

  - id: accessibility-audit
    name: Accessibility Audit
    description: WCAG 2.2 AA compliance assessment for design files
    enabled: true
    commands:
      - audit accessibility
      - check wcag compliance
      - accessibility review
      - wcag aa check
    triggers:
      - github_issue_label:a11y-compliance
      - pull_request:design
      - github_discussion:accessibility
    output:
      - compliance_report
      - github_issues
      - checklist
    parameters:
      design_file_url:
        type: string
        required: true
        description: Figma design file URL
      wcag_level:
        type: string
        required: false
        default: AA
        enum:
          - A
          - AA
          - AAA
        description: WCAG compliance level
      check_scope:
        type: array
        required: false
        default:
          - color-contrast
          - semantic-structure
          - interactive-states
          - keyboard-navigation
          - focus-management
        description: Accessibility checks to perform
      create_issues:
        type: boolean
        required: false
        default: true
        description: Automatically create GitHub issues for violations
      issue_labels:
        type: array
        required: false
        default:
          - a11y-compliance
          - accessibility
        description: Labels to apply to created issues
    integrations:
      - github_issues
      - github_projects
      - pull_request_checks
      - figma_api
    error_handling:
      retry_policy: exponential_backoff
      max_retries: 3
      timeout_seconds: 300

  - id: component-documentation
    name: Component Documentation
    description: Generate component specifications, usage guides, and code examples
    enabled: true
    commands:
      - document component
      - generate component spec
      - create usage guide
      - component documentation
    triggers:
      - github_issue_label:component-documentation
      - pull_request:component
      - github_discussion:components
    output:
      - markdown_documentation
      - github_wiki_page
      - usage_guide
    parameters:
      component_name:
        type: string
        required: true
        description: Component name to document
      figma_file_url:
        type: string
        required: false
        description: Figma file containing component
      documentation_sections:
        type: array
        required: false
        default:
          - overview
          - variants-and-states
          - props-and-api
          - usage-guidelines
          - accessibility-notes
          - code-examples
        description: Sections to include in documentation
      code_examples:
        type: array
        required: false
        default:
          - react
          - vue
          - web-components
        description: Include code examples for frameworks
      publish_to:
        type: string
        required: false
        enum:
          - github_wiki
          - github_pages
          - discussion
          - issue
        description: Publish location for documentation
    integrations:
      - github_wiki
      - github_pages
      - pull_requests
      - github_discussions
      - figma_api
    error_handling:
      retry_policy: exponential_backoff
      max_retries: 3
      timeout_seconds: 300

  - id: token-management
    name: Design Token Management
    description: Extract, validate, and manage design tokens with code export
    enabled: true
    commands:
      - extract design tokens
      - validate tokens
      - export tokens
      - token management
      - design tokens
    triggers:
      - github_issue_label:design-tokens
      - pull_request:tokens
      - workflow_dispatch:token_sync
    output:
      - token_exports
      - validation_report
      - code_artifacts
    parameters:
      figma_file_url:
        type: string
        required: true
        description: Figma file URL
      token_categories:
        type: array
        required: false
        default:
          - colors
          - typography
          - spacing
          - shadows
          - borders
        description: Token categories to extract
      export_formats:
        type: array
        required: false
        default:
          - json
          - css
          - javascript
        enum:
          - json
          - css
          - scss
          - javascript
          - tailwind
          - design_tokens
        description: Export formats
      validation_enabled:
        type: boolean
        required: false
        default: true
        description: Validate tokens against naming conventions
      create_pr:
        type: boolean
        required: false
        default: true
        description: Create pull request with token updates
    integrations:
      - github_artifacts
      - pull_requests
      - github_projects
      - figma_api
    error_handling:
      retry_policy: exponential_backoff
      max_retries: 3
      timeout_seconds: 300

  - id: figma-sync
    name: Figma Sync
    description: Synchronize design metadata between Figma and GitHub
    enabled: true
    commands:
      - sync figma design
      - reflect design changes
      - update design metadata
      - figma sync
    triggers:
      - schedule:
          cron: '0 */6 * * *'
      - workflow_dispatch
      - pull_request:design
    output:
      - sync_report
      - github_issue
      - project_update
    parameters:
      figma_file_url:
        type: string
        required: true
        description: Figma file URL
      sync_direction:
        type: string
        required: false
        default: bidirectional
        enum:
          - figma_to_github
          - github_to_figma
          - bidirectional
        description: Synchronization direction
      sync_metadata:
        type: array
        required: false
        default:
          - component_status
          - design_decisions
          - documentation_links
        description: Metadata to synchronize
      update_projects:
        type: boolean
        required: false
        default: true
        description: Update GitHub Projects board
      create_issues:
        type: boolean
        required: false
        default: false
        description: Create issues for design changes
    integrations:
      - github_projects
      - github_issues
      - pull_requests
      - figma_api
    error_handling:
      retry_policy: exponential_backoff
      max_retries: 3
      timeout_seconds: 300

  - id: design-review
    name: Design Review
    description: Conduct structured design reviews with quality feedback and recommendations
    enabled: true
    commands:
      - review design
      - design feedback
      - design quality check
      - design review
    triggers:
      - github_issue_label:design-review
      - pull_request:design
      - github_discussion:design-feedback
    output:
      - review_feedback
      - quality_report
      - github_issue_comments
    parameters:
      design_file_url:
        type: string
        required: true
        description: Figma design file URL
      review_scope:
        type: array
        required: false
        default:
          - visual-consistency
          - interaction-patterns
          - accessibility
          - responsive-design
        description: Areas to review
      feedback_style:
        type: string
        required: false
        default: constructive
        enum:
          - constructive
          - checklist
          - detailed
        description: Feedback style
      add_to_pr:
        type: boolean
        required: false
        default: true
        description: Add review as PR comment
      quality_score:
        type: boolean
        required: false
        default: true
        description: Include quality score
    integrations:
      - pull_request_reviews
      - github_discussions
      - github_issues
      - figma_api
    error_handling:
      retry_policy: exponential_backoff
      max_retries: 3
      timeout_seconds: 300

defaults:
  timeout: 300
  retry_policy: exponential_backoff
  max_retries: 3

logging:
  enabled: true
  level: info
  destinations:
    - github_actions
    - console

monitoring:
  enabled: true
  metrics:
    - skill_usage
    - execution_time
    - error_rate
    - user_satisfaction

security:
  require_approval: false
  audit_logging: true
  rate_limiting:
    requests_per_minute: 60
    burst: 10

notifications:
  enabled: true
  channels:
    - github_issues
    - github_discussions
  events:
    - skill_completed
    - skill_failed
    - compliance_issue_found
