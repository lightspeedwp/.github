schema_version: 1.0.0
file: projectbrief.md
purpose: Durable working summary of an active project.
content_type: markdown_with_yaml_frontmatter
required_frontmatter:
  - version
  - title
  - project_key
  - project_type
  - status
  - last_updated
optional_frontmatter:
  - client
  - owner
frontmatter_field_definitions:
  version: { type: string, required: true }
  title: { type: string, required: true }
  project_key: { type: string, required: true }
  project_type:
    type: string
    required: true
    accepted_values:
      - business website
      - online store
      - tour operator website
      - design system
      - plugin
      - theme
      - hybrid
  status:
    type: string
    required: true
    accepted_values:
      - discovery
      - planning
      - approved
      - implementation
      - qa
      - launch
      - paused
      - complete
  last_updated: { type: date, required: true }
  client: { type: string, required: false }
  owner: { type: string, required: false }
body_requirements:
  required_headings:
    - Confirmed facts
    - Assumptions
    - Scope
    - Risks
    - Open questions
validation_rules:
  - confirmed facts must be evidence-backed
  - assumptions must not be mixed into confirmed facts
  - keep the summary concise enough to reuse in later runs
update_rules:
  - update when the working project summary materially changes
example: |
  ---
  version: 1.0.0
  title: "Safari Lodge redesign project brief"
  project_key: safari-lodge-redesign
  project_type: business website
  status: planning
  last_updated: 2026-05-15
  client: Safari Lodge
  ---
  # Project Brief

  ## Confirmed facts
  - Existing site will be rebuilt on WordPress.

  ## Assumptions
  - Booking integration will remain external.

  ## Scope
  - Marketing pages, accommodation templates, blog, and enquiry forms.

  ## Risks
  - Booking platform choice is still unconfirmed.

  ## Open questions
  - Is WooCommerce required for voucher sales?
