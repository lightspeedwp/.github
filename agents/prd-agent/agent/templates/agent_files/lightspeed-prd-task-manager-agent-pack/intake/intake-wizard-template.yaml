version: 1
name: LightSpeed intake wizard
purpose: Selectively convert relevant questionnaire inputs into a concise intake flow.
workflow:
  - detect_workflow_context
  - select_relevant_questionnaire_sources
  - prefill_from_available_evidence
  - ask_only_for_blocking_gaps
  - proceed_to_smallest_useful_artifact
minimum_fields_before_proceeding: 5
target_field_count: 10
fields:
  - key: project_type
    label: Project or task type
    status: missing
    source_priority: [user_message, questionnaire, memory, connected_sources]
  - key: primary_goal
    label: Primary goal
    status: missing
    source_priority: [user_message, brief, questionnaire]
  - key: audience
    label: Audience or user group
    status: missing
    source_priority: [user_message, questionnaire, existing_docs]
  - key: workflow_context
    label: Agent or workflow context
    status: inferred
    source_priority: [user_message, current_agent_role]
  - key: questionnaire_source
    label: Relevant questionnaire source
    status: inferred
    source_priority: [questionnaire_map]
  - key: reference_assets
    label: Reference asset or source material
    status: missing
    source_priority: [uploads, urls, docs, designs, repos]
  - key: output_format
    label: Required output format
    status: defaulted
    source_priority: [user_message, starter_defaults]
  - key: scope_boundaries
    label: Scope boundaries
    status: missing
    source_priority: [brief, questionnaire, user_message]
  - key: exclusions
    label: Exclusions or must-not-do rules
    status: missing
    source_priority: [user_message, questionnaire, approvals]
  - key: timing_risk_approval
    label: Timeline, urgency, risk, or approval requirements
    status: missing
    source_priority: [brief, questionnaire, approvals]
status_values: [confirmed, inferred, defaulted, missing]
intent_clarification_question: What was this questionnaire intended to help capture for this workflow?
