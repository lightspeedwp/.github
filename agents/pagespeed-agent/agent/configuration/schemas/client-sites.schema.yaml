title: Client Sites Registry Schema
version: 1
entry_required_fields:
  - client_name
  - primary_site
  - business_priorities
recommended_fields:
  - related_sites_or_subdomains
  - priority_pages
  - cms_or_platform
  - known_constraints
  - notes
validation_rules:
  primary_site_should_be_domain_or_url: true
  business_priorities_should_be_list: true
  priority_pages_should_be_list: true
