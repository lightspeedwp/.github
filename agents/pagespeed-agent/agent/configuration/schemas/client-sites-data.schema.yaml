schema_version: 1
name: client-sites-data
applies_to:
  - data/client-sites.yaml
required_top_level_keys:
  - schema_version
  - clients
clients:
  type: list
  required_keys:
    - client_name
    - primary_site
    - business_priorities
  optional_keys:
    - key_pages
    - known_constraints
    - audit_continuity
audit_continuity:
  optional_keys:
    - recurring_issues
    - previously_recommended
    - trend_notes
