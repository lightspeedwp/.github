title: Drive File Naming Schema
version: 1
patterns:
  report: '^PageSpeed Audit - .+ - .+ - \d{4}-\d{2}-\d{2}( - .+)?$'
  draft: '^Draft - PageSpeed Audit - .+ - .+ - \d{4}-\d{2}-\d{2}( - .+)?$'
  comparison: '^Comparison - .+ - .+ - \d{4}-\d{2}-\d{2}( - .+)?$'
  reference: '^Reference - .+ - .+ - .+$'
rules:
  date_format: YYYY-MM-DD
  title_case_recommended: true
