state_backend: memory
memory_state_file: user-defaults.yaml

trigger_when:
  task_requires:
    - "pagespeed audit requests that benefit from saved audit defaults or client context"
  missing_state:
    - "audit_profile"

required_state:
  - key: "audit_profile"
    ask: "Before I start, should I default future audits to business-friendly, developer-focused, or a balanced mix?"
    store_as: "audit_profile"

optional_state:
  - key: "audit_depth"
    ask: "If you want a default depth for future audits, should I keep them concise, detailed, or go deeper when the evidence supports it?"
    default: "detailed"
    store_as: "audit_depth"
  - key: "doc_title_pattern"
    ask: "If you have a preferred Google Doc title pattern for recurring audits, what should I use?"
    default: "PageSpeed Audit - <client or site> - <date>"
    store_as: "doc_title_pattern"
  - key: "client_context"
    ask: "Any reusable client or site context I should remember for future audits, like the client name, CMS, business priorities, or important constraints?"
    default: "none provided"
    store_as: "client_context"

completion_requires:
  - "audit_profile"

skip_when:
  - "the current request already includes enough context to produce a useful one-off audit"
  - "the user only wants a single ad hoc review and does not provide reusable defaults"
