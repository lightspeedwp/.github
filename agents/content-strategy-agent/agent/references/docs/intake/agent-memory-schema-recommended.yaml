version: 1
name: agent_memory_schema_recommended
purpose: recommended durable Memory schema for the Website Content Strategist agent across intake, routing, strategy, content collection, claim review, governance, drafting, and launch-readiness workflows
memory_files:
  primary_runtime_defaults_file: website-content-intake.yaml
  supporting_files:
    - approved-source-register.md
    - project-memory-summary.md
    - voice-and-tone-defaults.md
    - conversion-goals.yaml
    - claim-review-boundaries.md
allowed_statuses:
  - confirmed
  - inferred
  - defaulted
  - missing
save_policies:
  - current_run_only
  - confirm_before_save
  - save_if_user_confirms
  - save_links_only
  - do_not_save_without_review
buckets:
  current_run_context:
    description: temporary working values for the active request only
  project_memory_candidates:
    description: potentially reusable values that still need confirmation or review
  confirmed_project_memory:
    description: durable confirmed values safe to reuse across future related work
  unsafe_or_unverified_memory:
    description: risky, claim-sensitive, unsupported, or otherwise unapproved values that must not become durable defaults
schema:
  project:
    project_name:
      value:
      status: missing
      save_policy: confirm_before_save
      bucket: project_memory_candidates
    scenario_type:
      value:
      status: confirmed
      save_policy: save_if_user_confirms
      bucket: confirmed_project_memory
      allowed_values:
        - tour-operator-website
        - woocommerce-store
        - standard-wordpress-website
        - one-off-page-recommendation
        - website-refresh-or-restructure
        - launch-qa-or-go-live-readiness
        - policy-or-trust-page
        - faq-or-chatbot-source-prep
        - ai-governance-or-chatbot-planning
        - lead-gen-service-or-solution-page
        - case-study-or-proof-page
        - resource-or-landing-page
    project_type_notes:
      value:
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
    current_scope:
      value:
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
      allowed_values:
        - full-website-planning
        - priority-pages-first
        - single-page
        - section-only
        - launch-review
    current_stage:
      value:
      status: inferred
      save_policy: current_run_only
      bucket: current_run_context
      allowed_values:
        - onboarding
        - intake
        - content-collection
        - strategy
        - drafting
        - claim-review
        - governance-review
        - qa-readiness
  conversion:
    primary_conversion_model:
      value:
      status: missing
      save_policy: confirm_before_save
      bucket: project_memory_candidates
      allowed_values:
        - enquiry-led
        - direct-booking
        - hybrid
        - trust-first
    primary_cta:
      value:
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
    secondary_cta:
      value:
      status: defaulted
      save_policy: current_run_only
      bucket: current_run_context
  audience:
    primary_audience:
      value:
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
    secondary_audience:
      value:
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
    user_intent_notes:
      value:
      status: inferred
      save_policy: current_run_only
      bucket: current_run_context
  brand_and_voice:
    voice_and_tone_defaults:
      value:
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
    messaging_priorities:
      value: []
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
  sources:
    approved_source_pack:
      value: []
      status: missing
      save_policy: save_links_only
      bucket: confirmed_project_memory
    reference_only_sources:
      value: []
      status: inferred
      save_policy: current_run_only
      bucket: current_run_context
    source_of_truth_order:
      value: []
      status: missing
      save_policy: confirm_before_save
      bucket: project_memory_candidates
  workflow_controls:
    exclusions:
      value: []
      status: confirmed
      save_policy: save_if_user_confirms
      bucket: confirmed_project_memory
    claim_sensitive_areas:
      value: []
      status: inferred
      save_policy: do_not_save_without_review
      bucket: unsafe_or_unverified_memory
    approval_owner:
      value:
      status: missing
      save_policy: confirm_before_save
      bucket: project_memory_candidates
    approval_requirements:
      value: []
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
    launch_constraints:
      value: []
      status: inferred
      save_policy: confirm_before_save
      bucket: project_memory_candidates
  outputs:
    preferred_working_format:
      value: paste-ready-markdown
      status: defaulted
      save_policy: save_if_user_confirms
      bucket: project_memory_candidates
    downstream_handoff_preference:
      value:
      status: inferred
      save_policy: current_run_only
      bucket: current_run_context
workflow_mapping:
  intake_and_onboarding:
    usually_save:
      - project.scenario_type
      - project.project_name
      - project.current_scope
  content_collection_planning:
    usually_save:
      - sources.approved_source_pack
      - sources.source_of_truth_order
  voice_and_tone_strategy:
    usually_save:
      - brand_and_voice.voice_and_tone_defaults
      - brand_and_voice.messaging_priorities
  conversion_goal_strategy:
    usually_save:
      - conversion.primary_conversion_model
      - conversion.primary_cta
      - audience.primary_audience
  faq_stats_and_claim_review:
    usually_save_carefully:
      - workflow_controls.claim_sensitive_areas
  governance_and_chatbot_planning:
    usually_save:
      - workflow_controls.exclusions
      - workflow_controls.approval_requirements
      - workflow_controls.approval_owner
  launch_readiness:
    usually_save:
      - workflow_controls.launch_constraints
never_save_directly:
  - questionnaire defaults
  - inferred tourism claims
  - unreviewed safety wording
  - temporary routing assumptions
  - one-off draft copy
  - unresolved blockers
  - unapproved testimonials
  - unapproved awards
  - unapproved review scores
  - unapproved pricing claims
minimum_useful_memory_setup:
  files:
    - website-content-intake.yaml
    - approved-source-register.md
    - project-memory-summary.md
  purpose:
    - stable routing context
    - source authority
    - reusable confirmed project facts
