version: 1
purpose: route messy lightspeed team requests to the most specific related skill without forcing unnecessary onboarding.

routing_rules:
  - prefer_specific_execution_skill_when_output_is_clear
  - prefer_router_or_orchestrator_when_inputs_are_messy_or_cross_domain
  - use_onboarding_only_for_missing_project_defaults_or_blocking_context
  - use_internal_sources_for_lightspeed_work_before_guessing
  - keep_client_facing_claims_source_bound_and_approval_aware

routes:
  - match:
      intents:
        - unclear_project_request
        - mixed_project_inputs
        - which_workflow_next
        - intake_pack
    primary_skill: lightspeed-project-intake-router
    use_when: messy or incomplete project details need a structured intake pack and workflow route before deeper planning.
    prompt_starter: "Use the LightSpeed project intake router to normalise this material into an intake pack, identify blockers, and recommend the next specialist workflow."

  - match:
      intents:
        - evidence_review
        - source_inventory
        - discovery_notes
        - prd_ready_research
    primary_skill: lightspeed-project-researcher
    related_skills:
      - project-evidence-harvester
      - discovery-source-intake
      - design-context-synthesis
    use_when: source evidence must be gathered, separated, and summarised before PRD, technical brief, or task planning.
    prompt_starter: "Use the LightSpeed project researcher to produce an evidence review, source inventory, assumptions, blockers, and PRD-ready notes from this material."

  - match:
      intents:
        - prd
        - product_requirements
        - product_brief
        - goals_non_goals
        - user_stories
    primary_skill: lightspeed-prd-generator
    related_skills:
      - lightspeed-prd-task-manager
      - lightspeed-prd-task-reviewer
    use_when: the user needs a PRD or product brief before technical planning, task breakdown, or GitHub issues.
    prompt_starter: "Use the LightSpeed PRD generator to create a PRD with goals, non-goals, users, requirements, acceptance criteria, risks, assumptions, and open questions."

  - match:
      intents:
        - figma_to_wordpress_brief
        - design_system_to_block_theme
        - wordpress_technical_brief
        - design_implementation_notes
    primary_skill: lightspeed-figma-wordpress-technical-brief
    related_skills:
      - figma
      - design-md-generator
      - wp-figma-artifact-builder
      - wordpress-block-theme-handoff
      - lightspeed-figma-wordpress-parity-auditor
    use_when: Figma design-system evidence must become WordPress architecture, theme.json, template, pattern, and implementation guidance.
    prompt_starter: "Use the LightSpeed Figma-to-WordPress technical brief skill to convert the design and repo evidence into a developer-ready WordPress brief."

  - match:
      intents:
        - task_breakdown
        - epics
        - implementation_tasks
        - delivery_waves
        - dependency_map
    primary_skill: lightspeed-task-breakdown-planner
    related_skills:
      - lightspeed-github-issue-drafter
      - lightspeed-requirements-traceability-mapper
      - breakdown-plan
    use_when: approved or near-approved requirements need to become implementation tasks, epics, estimates, dependencies, and QA checks.
    prompt_starter: "Use the LightSpeed task breakdown planner to create epics, task waves, dependencies, acceptance criteria, QA checks, and implementation sequencing."

  - match:
      intents:
        - github_issue_drafts
        - issue_bodies
        - labels_milestones
        - developer_issue_notes
    primary_skill: lightspeed-github-issue-drafter
    related_skills:
      - linear-the-architect
      - lightspeed-task-breakdown-planner
    use_when: the user needs GitHub-ready markdown issue drafts without automatically creating issues.
    prompt_starter: "Use the LightSpeed GitHub issue drafter to turn this plan or finding into GitHub-ready issue drafts with labels, dependencies, acceptance criteria, and QA notes."

  - match:
      intents:
        - implementation_plan
        - developer_handoff
        - branch_strategy
        - build_sequence
    primary_skill: lightspeed-implementation-plan-generator
    related_skills:
      - wp-figma-artifact-builder
      - lightspeed-acceptance-test-planner
    use_when: approved tasks or briefs need practical sequencing, branch strategy, testing approach, and handoff controls before coding.
    prompt_starter: "Use the LightSpeed implementation plan generator to create the build sequence, dependencies, branch strategy, testing approach, and handoff notes."

  - match:
      intents:
        - planning_review
        - gap_review
        - issue_quality_review
        - go_no_go_planning_review
    primary_skill: lightspeed-prd-task-reviewer
    related_skills:
      - linear-gap-analyzer
      - evidence-quality-review
    use_when: a PRD, brief, task plan, issue set, or QA plan needs quality review before implementation.
    prompt_starter: "Use the LightSpeed PRD task reviewer to check this planning pack for gaps, risks, acceptance coverage, launch alignment, and readiness."

  - match:
      intents:
        - launch_route
        - launch_workstreams
        - launch_next_steps
    primary_skill: lightspeed-launch-task-router
    related_skills:
      - lightspeed-launch-qa-planner
      - lightspeed-launch-readiness-auditor
      - lightspeed-ga4-conversion-tracking-planner
      - lightspeed-redirect-map-planner
      - technical-seo-audit
    use_when: launch-preparation work needs routing across QA, SEO, redirects, analytics, schema, content, policies, or approval gates.
    prompt_starter: "Use the LightSpeed launch task router to sequence launch workstreams, identify blockers, and route each item to the right specialist workflow."

  - match:
      intents:
        - launch_qa_plan
        - acceptance_test_plan
        - validation_matrix
        - qa_script
    primary_skill: lightspeed-launch-qa-planner
    related_skills:
      - lightspeed-acceptance-test-planner
      - lightspeed-launch-readiness-auditor
      - lightspeed-qa-findings-router
    use_when: the user needs pre-launch QA scope, page/template checks, accessibility, responsive checks, conversion tracking checks, and go/no-go criteria.
    prompt_starter: "Use the LightSpeed launch QA planner to create a launch QA plan, validation matrix, page checks, accessibility and responsive scope, and go/no-go gates."

  - match:
      intents:
        - final_launch_audit
        - launch_checklist
        - go_no_go_summary
        - prelaunch_readiness
    primary_skill: lightspeed-launch-readiness-auditor
    related_skills:
      - technical-seo-audit
      - website-performance-assessor
      - lightspeed-schema-and-ai-discoverability-planner
    use_when: the user needs final pre-launch QA, page-by-page checks, forms, accessibility, analytics, redirects, SEO, or launch go/no-go notes.
    prompt_starter: "Use the LightSpeed launch readiness auditor to produce a final pre-launch QA checklist, findings table, and go/no-go summary."

  - match:
      intents:
        - qa_findings
        - bug_triage
        - parity_issue
        - retest_steps
    primary_skill: lightspeed-qa-findings-router
    related_skills:
      - lightspeed-figma-wordpress-parity-auditor
      - linear-triage-router
      - wordpress-block-asset-validator
    use_when: raw QA notes, screenshots, stakeholder feedback, launch blockers, or test failures need severity, owner routing, issue drafts, and retest steps.
    prompt_starter: "Use the LightSpeed QA findings router to classify severity, separate evidence, route owners, draft issues, and define retest steps."

  - match:
      intents:
        - approval_gate
        - sign_off
        - decision_log
        - scope_approval
    primary_skill: lightspeed-approval-gate-manager
    related_skills:
      - lightspeed-change-request-router
      - lightspeed-requirements-traceability-mapper
    use_when: movement to the next delivery stage depends on approval, sign-off, decision logging, or go/no-go criteria.
    prompt_starter: "Use the LightSpeed approval gate manager to prepare the approval checklist, decision log, sign-off criteria, and next-stage readiness notes."

  - match:
      intents:
        - change_request
        - scope_delta
        - client_feedback_impact
        - timeline_budget_impact
    primary_skill: lightspeed-change-request-router
    related_skills:
      - lightspeed-approval-gate-manager
      - lightspeed-project-status-reporter
    use_when: feedback or blockers may alter scope, cost, timeline, approvals, or existing implementation plans.
    prompt_starter: "Use the LightSpeed change request router to classify the change, assess impact, identify approvals, and draft updated task or decision notes."

  - match:
      intents:
        - traceability_matrix
        - requirement_to_task_mapping
        - qa_coverage
        - missing_requirement_detection
    primary_skill: lightspeed-requirements-traceability-mapper
    related_skills:
      - lightspeed-acceptance-test-planner
      - lightspeed-prd-task-reviewer
    use_when: requirements, tasks, issues, QA checks, and launch gates need coverage mapping.
    prompt_starter: "Use the LightSpeed requirements traceability mapper to map requirements to tasks, acceptance criteria, QA checks, and launch gates."

  - match:
      intents:
        - status_report
        - weekly_update
        - milestone_update
        - blocker_summary
    primary_skill: lightspeed-project-status-reporter
    related_skills:
      - linear-project-pulse
      - lightspeed-change-request-router
    use_when: stakeholders need a practical progress summary, blockers, risks, decisions, and next actions.
    prompt_starter: "Use the LightSpeed project status reporter to create a stakeholder-ready progress summary with blockers, risks, decisions, and next actions."

  - match:
      intents:
        - release_notes
        - launch_handoff
        - support_transition
        - closure_report
    primary_skill: lightspeed-release-handoff-generator
    related_skills:
      - lightspeed-prd-task-pack-exporter
      - lightspeed-project-memory-manager
    use_when: launch, release, support transition, or delivery closure needs a clean handoff package.
    prompt_starter: "Use the LightSpeed release handoff generator to create release notes, support transition notes, monitoring plan, and delivery closure summary."

  - match:
      intents:
        - downloadable_project_pack
        - archive_pack
        - google_doc_ready_index
        - export_folder_structure
    primary_skill: lightspeed-prd-task-pack-exporter
    related_skills:
      - lightspeed-project-memory-manager
      - lightspeed-release-handoff-generator
    use_when: PRDs, task plans, briefs, issue drafts, QA plans, and notes need to be packaged into a clean handoff archive.
    prompt_starter: "Use the LightSpeed PRD task pack exporter to organise these materials into a clean markdown folder structure, review checklist, and handoff pack."

  - match:
      intents:
        - project_memory
        - memory_bank
        - decision_register
        - progress_log
    primary_skill: lightspeed-project-memory-manager
    related_skills:
      - lightspeed-prd-task-pack-exporter
      - linear-decision-logger
    use_when: durable project context, decisions, assumptions, progress, and handoff-ready memory files need to be created or updated.
    prompt_starter: "Use the LightSpeed project memory manager to create or update the project memory bank, decision log, assumptions, active context, and progress notes."

  - match:
      intents:
        - ai_readiness
        - ai_governance
        - chatbot_scope
        - source_of_truth_for_ai
        - ai_project_sequence
    primary_skill: lightspeed-ai-readiness-router
    related_skills:
      - lightspeed-ai-readiness-orchestrator
      - lightspeed-ai-readiness-estimator
      - ai-readiness-assessor
      - ai-governance-documentor
      - ai-chatbot-planner
      - content-collection-planner
      - lightspeed-faq-and-chatbot-source-curator
      - lightspeed-schema-and-ai-discoverability-planner
      - lightspeed-policy-page-generator
      - lightspeed-claim-register-auditor
    use_when: AI-readiness, governance, chatbot, source-quality, schema, policy, claims, estimate, or launch readiness work needs sequencing.
    prompt_starter: "Use the LightSpeed AI-readiness router to classify this AI/chatbot/governance request, identify readiness gates, and route to the correct specialist deliverable."

  - match:
      intents:
        - chatbot_plan
        - chatbot_rules
        - approved_sources_for_chatbot
        - fallback_and_escalation
    primary_skill: ai-chatbot-planner
    related_skills:
      - chatbot-planning-orchestrator
      - chatbot-estimate-calibrator
      - chatbot-discovery-question-prioritiser
      - lightspeed-faq-and-chatbot-source-curator
    use_when: a bounded website chatbot needs purpose, approved sources, exclusions, behaviour rules, fallback wording, escalation, privacy notes, and tests.
    prompt_starter: "Use the AI chatbot planner to define chatbot purpose, sources, exclusions, behaviour, escalation, privacy notes, launch gates, test scripts, and first draft system prompt."

  - match:
      intents:
        - website_content
        - content_collection
        - faq_register
        - schema_and_ai_discoverability
        - claims_review
        - policy_or_trust_page
    primary_skill: content-collection-planner
    related_skills:
      - lightspeed-website-content-generator
      - lightspeed-faq-and-chatbot-source-curator
      - lightspeed-schema-and-ai-discoverability-planner
      - lightspeed-claim-register-auditor
      - lightspeed-policy-page-generator
      - content-audit-strategist
    use_when: website, governance, or chatbot content needs collection, source mapping, FAQ curation, schema planning, claim safety, or policy drafting.
    prompt_starter: "Use the content collection planner to create a source-aware content checklist, gap report, client request notes, and next content workflow route."

  - match:
      intents:
        - technical_seo
        - redirects
        - performance
        - hosting_review
        - security_review
        - email_list_review
    primary_skill: technical-seo-audit
    related_skills:
      - lightspeed-redirect-map-planner
      - website-performance-assessor
      - website-hosting-reviewer
      - website-security-discovery-reviewer
      - email-list-reviewer
    use_when: discovery or launch work needs SEO, redirects, performance, hosting, security, or email-list risk assessment.
    prompt_starter: "Use the most specific discovery/audit skill to assess the supplied evidence, separate observed issues from assumptions, and produce a prioritised fix list."

  - match:
      intents:
        - figma_design_review
        - design_handoff
        - wordpress_block_theme_handoff
        - design_execution_packet
        - brand_guidelines
    primary_skill: design-execution-packet
    related_skills:
      - design-context-synthesis
      - design-qa-readiness
      - handoff-router
      - wordpress-block-theme-handoff
      - lightspeed-brand-guidelines
      - figma
      - figma-implement-design
      - figma-generate-design
      - design-md-generator
      - wp-figma-artifact-builder
    use_when: scattered design, Figma, WordPress, repo, QA, or content inputs need a normalised execution packet or handoff route.
    prompt_starter: "Use the design execution packet skill to consolidate the design and implementation inputs, separate approved from unconfirmed material, and route the next workflow."

  - match:
      intents:
        - wordpress_block_theme_asset
        - pattern
        - template
        - template_part
        - block_style
        - section_style
        - custom_template
        - asset_validation
    primary_skill: wordpress-block-theme-router
    related_skills:
      - wordpress-pattern-generator
      - wordpress-template-generator
      - wordpress-template-part-generator
      - wordpress-custom-template-generator
      - wordpress-block-style-generator
      - wordpress-section-style-generator
      - wordpress-block-asset-validator
      - wordpress-asset-parameter-generator
      - pattern-extractor
      - theme-color-token-enforcer
    use_when: the user asks for WordPress block theme assets but the exact generator, metadata, validation, or token workflow needs routing.
    prompt_starter: "Use the WordPress block theme router to identify the correct asset workflow, required parameters, validation rules, and next specialist skill."

  - match:
      intents:
        - theme_json
        - figma_tokens_to_wordpress
        - color_palette
        - typography_tokens
        - spacing_tokens
        - style_variations
        - shadow_tokens
    primary_skill: themejson-extractor-orchestrator
    related_skills:
      - figma-themejson-palette
      - figma-themejson-typography
      - figma-themejson-spacing
      - figma-themejson-style-variations
      - figma-themejson-shadow
      - themejson-completion
      - sync-figma-token
    use_when: Figma variables or codebase tokens need to become WordPress theme.json settings, presets, or style variations.
    prompt_starter: "Use the theme.json extractor orchestrator to route token extraction across palette, typography, spacing, shadows, and style variations."

  - match:
      intents:
        - linear_triage
        - linear_issue_rewrite
        - linear_gap_analysis
        - linear_sub_issues
        - linear_project_status
        - voice_of_customer
    primary_skill: linear-triage-router
    related_skills:
      - linear-the-architect
      - linear-gap-analyzer
      - linear-sub-issue-splitter
      - linear-project-pulse
      - linear-voice-of-customer
      - linear-momentum-auditor
      - linear-decision-logger
    use_when: Linear work needs routing, rewriting, gap analysis, sub-issue splitting, project pulse, or customer-signal synthesis.
    prompt_starter: "Use the Linear triage router to classify this work, recommend owner/priority/labels/status, and route deeper work to the right Linear skill."

  - match:
      intents:
        - support_ticket
        - customer_research
        - escalation
        - case_investigation
        - customer_reply
        - knowledge_base_article
        - support_trends
    primary_skill: ticket-triage
    related_skills:
      - customer-research
      - customer-escalation
      - case-investigation
      - draft-response
      - create-knowledge
      - backlog-trend-analysis
      - evidence-quality-review
    use_when: support, customer, Zendesk, Gmail, or backlog evidence needs triage, investigation, escalation, response drafting, KB creation, or trend analysis.
    prompt_starter: "Use the support triage route to classify the case, identify evidence needs, and send deeper work to the correct customer/support skill."

  - match:
      intents:
        - create_or_update_skill
        - improve_skill
        - package_skill
        - skill_routing_rules
    primary_skill: skill-creator
    related_skills:
      - figma-wordpress-skill-creator
      - agent-creator
      - linear-app-skill-creator
    use_when: the user asks to create, update, validate, improve, package, or troubleshoot a ChatGPT skill or reusable agent workflow.
    prompt_starter: "Use the skill creator workflow to update the skill instructions, resources, validation, and packaged skill.zip deliverable."
