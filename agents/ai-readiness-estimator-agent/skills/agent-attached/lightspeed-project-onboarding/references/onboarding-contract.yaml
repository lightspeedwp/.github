state_backend: memory
memory_state_file: lightspeed-project-defaults.yaml

trigger_when:
  task_requires:
    - messy_lightspeed_project_intake
    - missing_or_ambiguous_project_anchor
    - reusable_project_defaults
    - specialist_skill_routing
    - multi_source_evidence_normalisation
    - approval_or_source_status_clarification
    - handoff_to_related_lightspeed_workflow
  user_phrases:
    - "route this"
    - "what skill should handle this"
    - "what should happen next"
    - "start a project"
    - "create an intake"
    - "onboard this"
    - "set project defaults"
    - "use this as the default"
    - "make this usable by the team"
    - "clean up the inputs"
    - "turn this into a project packet"
  missing_state:
    - project_anchor

required_state:
  - key: project_anchor
    ask: "Which client project should I treat as the default context? You can give me the client and project name, website, repo, Figma file, or source document."
    store_as: project_anchor
    blocks_when:
      - no_current_project_reference
      - multiple_possible_projects
      - durable_memory_save_requested_without_project

optional_state:
  - key: project_type
    ask: "What kind of project or workflow is this, if it is not already clear from the material you shared?"
    default: "best-fit from current context"
    store_as: project_type
  - key: primary_goal
    ask: "What is the main outcome you want from this workflow?"
    default: "best-fit from current context"
    store_as: primary_goal
  - key: audience
    ask: "Who is this mainly for: internal LightSpeed use, a client-facing deliverable, or another audience?"
    default: "internal LightSpeed use"
    store_as: audience
  - key: approved_sources
    ask: "Which sources should I treat as approved for this project by default?"
    default: "current message and explicitly approved attached material first; connected-source results remain candidate sources until confirmed"
    store_as: approved_sources
  - key: exclusions
    ask: "Are there any exclusions, topics to avoid, or must-not-do rules I should treat as standing guidance for this project?"
    default: "none confirmed yet"
    store_as: exclusions
  - key: approval_requirements
    ask: "Does this workflow need any standing reviewer, approval, or sign-off rules before public-facing use?"
    default: "review only when claims, regulated topics, client-facing content, launch gates, or operationally sensitive decisions make it necessary"
    store_as: approval_requirements
  - key: default_output_format
    ask: "If you do not specify a format, what should I default to: intake pack, estimate, readiness memo, brief, issue drafts, checklist, or best-fit document?"
    default: "best-fit document"
    store_as: default_output_format
  - key: default_assessment_focus
    ask: "When you do not specify a focus, should I default to overall readiness, estimate confidence, blocker review, launch readiness, or implementation readiness?"
    default: "overall readiness"
    store_as: default_assessment_focus
  - key: preferred_source_priority
    ask: "If several sources are available, which should I prioritise first by default: Drive, Figma, GitHub, Asana, Linear, Gmail, Slack, recordings, web, or automatic best-fit selection?"
    default: "automatic best-fit selection"
    store_as: preferred_source_priority
  - key: team_reuse_notes
    ask: "Is there anything the wider LightSpeed team should reuse as a standing preference for this project?"
    default: "none confirmed yet"
    store_as: team_reuse_notes

completion_requires:
  - project_anchor_when_blocking

skip_when:
  - current_request_identifies_project_clearly_enough
  - current_request_identifies_required_deliverable_clearly_enough
  - one_off_general_question_or_rewrite
  - specialist_skill_can_execute_without_missing_defaults
  - user_provides_domain_repo_figma_url_google_doc_client_name_or_named_project
  - enough_context_available_from_current_message_files_connected_sources_or_memory

ask_policy:
  max_questions_before_routing: 1
  prefer_safe_defaults_for_optional_fields: true
  ask_project_anchor_first: true
  ask_output_format_first_when_project_anchor_is_clear: true
  never_request_full_questionnaire_when_single_field_will_do: true
  continue_original_task_after_completion: true

persistence_policy:
  save_confirmed_values_only: true
  do_not_save:
    - inferred_values
    - questionnaire_defaults
    - extracted_guesses
    - unreviewed_risk_flags
    - raw_transcripts
    - unsupported_claims
    - approval_assumptions
    - temporary_run_context
