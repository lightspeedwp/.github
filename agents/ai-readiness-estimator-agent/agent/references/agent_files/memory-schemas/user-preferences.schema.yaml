schema_version: 1.0.0
file: user-preferences.yaml
purpose: Store durable per-user working preferences that improve future estimate runs without changing the agent’s core role.
root_type: mapping
required_top_level_fields:
  - schema_version
  - file_type
  - preferences
field_types:
  schema_version: string
  file_type: string
  preferences: mapping
required_preference_fields:
  - default_output_audience
  - default_output_format
  - preferred_evidence_order
  - updated_at
optional_preference_fields:
  - default_tone
  - prefer_project_onboarding_for_new_clients
  - default_next_step_style
  - notes
preference_field_types:
  default_output_audience: string
  default_output_format: string
  preferred_evidence_order: sequence
  default_tone: string
  prefer_project_onboarding_for_new_clients: boolean
  default_next_step_style: string
  notes: string
  updated_at: string
accepted_values:
  default_output_audience:
    - internal
    - client-ready
  default_output_format:
    - estimate
    - audit
    - email
    - brief
    - handoff-pack
  default_next_step_style:
    - concise
    - action-list
    - narrative
validation_rules:
  - preferred_evidence_order should list source classes from most preferred to least preferred.
  - Store only durable preferences that apply across multiple projects.
update_rules:
  - Do not save preferences inferred from a single run unless the user clearly treats them as a standing preference.
  - Replace outdated preferences instead of keeping conflicting duplicates.
example:
  schema_version: 1.0.0
  file_type: user-preferences
  preferences:
    default_output_audience: internal
    default_output_format: estimate
    preferred_evidence_order:
      - attached files
      - connected internal sources
      - approved memory
      - official docs
      - public web
    default_tone: practical
    prefer_project_onboarding_for_new_clients: true
    default_next_step_style: concise
    notes: Prefer proposal-ready markdown when the user asks for a formal deliverable.
    updated_at: 2026-05-15
