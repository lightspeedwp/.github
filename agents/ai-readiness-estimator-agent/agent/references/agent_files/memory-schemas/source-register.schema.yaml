schema_version: 1.0.0
file: project-source-register.yaml
purpose: Track reusable sources, their confidence level, and whether they are safe to treat as evidence.
root_type: mapping
required_top_level_fields:
  - schema_version
  - file_type
  - sources
field_types:
  schema_version: string
  file_type: string
  sources: sequence
entry_rules:
  root_sequence: sources
  min_entries: 0
  max_entries: 1000
  unique_key: source_id
  required_fields:
    - source_id
    - project_key
    - source_type
    - title
    - location
    - confidence
    - last_checked
  optional_fields:
    - approved_for_grounding
    - notes
  field_types:
    source_id: string
    project_key: string
    source_type: string
    title: string
    location: string
    confidence: string
    approved_for_grounding: boolean
    notes: string
    last_checked: string
  accepted_values:
    source_type:
      - attached_file
      - google_drive
      - gmail
      - github
      - figma
      - web
      - memory
      - user_message
      - internal_rule_file
    confidence:
      - approved
      - working
      - needs_review
      - stale
      - conflicting
  validation_rules:
    - approved_for_grounding should be true only when the source is safe to reuse as evidence.
    - If confidence is stale or conflicting, the note should explain why.
update_rules:
  - Refresh the confidence label when newer evidence changes trust in the source.
  - Remove duplicate source entries instead of storing the same source twice.
example:
  schema_version: 1.0.0
  file_type: project-source-register
  sources:
    - source_id: acme-drive-discovery-01
      project_key: acme-co-website
      source_type: google_drive
      title: Acme discovery brief
      location: Google Drive / Acme / Discovery / brief.docx
      confidence: approved
      approved_for_grounding: true
      notes: Client-approved discovery brief dated 2026-05-10.
      last_checked: 2026-05-15
