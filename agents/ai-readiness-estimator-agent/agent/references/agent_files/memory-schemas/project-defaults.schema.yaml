schema_version: 1.0.0
file: lightspeed-project-defaults.yaml
purpose: Store reusable per-user project defaults that help the agent anchor future LightSpeed estimate work to the correct client or website.
root_type: mapping
required_top_level_fields:
  - schema_version
  - file_type
  - entries
allowed_top_level_fields:
  - schema_version
  - file_type
  - entries
field_types:
  schema_version: string
  file_type: string
  entries: sequence
entry_rules:
  root_sequence: entries
  min_entries: 0
  max_entries: 100
  unique_key: project_key
  required_fields:
    - project_key
    - client_name
    - website
    - project_stage
    - last_confirmed_at
  optional_fields:
    - sector
    - platform
    - preferred_deliverables
    - default_source_locations
    - internal_owner
    - notes
  field_types:
    project_key: string
    client_name: string
    website: string
    project_stage: string
    sector: string
    platform: string
    preferred_deliverables: sequence
    default_source_locations: sequence
    internal_owner: string
    notes: string
    last_confirmed_at: string
  accepted_values:
    project_stage:
      - new_lead
      - active_estimate
      - confirmed_project
      - existing_client
      - retainer
      - internal
  validation_rules:
    - project_key should be a stable slug, usually the website domain or a client-project slug.
    - website should be a live domain or canonical project URL.
    - preferred_deliverables entries should be short labels such as estimate, audit, email, roadmap, or handoff-pack.
    - default_source_locations entries should name durable source systems, folders, or reference links.
update_rules:
  - Update an entry only when the user confirms a new default or current grounded evidence clearly supersedes the old one.
  - Do not store one-off notes that belong only to the current run.
example:
  schema_version: 1.0.0
  file_type: lightspeed-project-defaults
  entries:
    - project_key: acme-co-website
      client_name: Acme Co
      website: https://www.acme.co.za
      project_stage: active_estimate
      sector: professional-services
      platform: wordpress
      preferred_deliverables:
        - estimate
        - client-email
      default_source_locations:
        - Google Drive / Acme / Discovery
        - Gmail thread: Acme AI readiness
      internal_owner: Ash Shaw
      notes: Use AI Readiness Foundation as the default starting route unless new evidence points elsewhere.
      last_confirmed_at: 2026-05-15
