schema_name: project-decisions
version: 1
purpose: Confirmed or provisional decisions that materially affect future estimates, briefs, or handoffs.
use_when:
  - A package path, add-on choice, exclusion, or commercial direction has been chosen.
  - The agent should remember a decision for future project work.
do_not_use_when:
  - The item is still an open question with no real decision yet.
  - The note is only a transient working thought.
keying:
  primary_key: decision_id
  project_key_field: project_key
fields:
  - name: project_key
    required: true
    type: string
  - name: decision_id
    required: true
    type: string
  - name: category
    required: true
    type: string
    description: For example base_package, addon, exclusion, routing, commercial.
  - name: value
    required: true
    type: string
  - name: decision_status
    required: true
    type: enum
    allowed_values:
      - confirmed
      - provisional
  - name: rationale
    required: false
    type: string
  - name: source
    required: false
    type: string
  - name: updated_at
    required: true
    type: date
example_container:
  decisions: []
quality_rules:
  - Clearly mark whether each decision is confirmed or provisional.
  - Do not present guesses as confirmed decisions.
  - Prefer one entry per meaningful decision so updates remain easy.
