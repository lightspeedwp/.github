version: 1
memory_files:
  lightspeed-project-context.md:
    description: Stable project state for related website-content work.
    required_sections:
      - Project
      - Current stage
      - Approved sources
      - Authority order
      - Key constraints
      - Current decisions
      - Last updated
    fields:
      project_name:
        type: string
        required: true
        min_length: 2
      client:
        type: string
        required: false
      website_or_workstream:
        type: string
        required: true
      primary_audience:
        type: string
        required: false
      core_goal:
        type: string
        required: true
      current_stage:
        type: enum
        required: true
        allowed_values:
          - intake
          - source review
          - planning
          - drafting
          - governance review
          - faq curation
          - policy drafting
          - launch qa
          - live refinement
      current_focus:
        type: string
        required: true
      last_confirmed_progress:
        type: string
        required: false
      best_next_step:
        type: string
        required: true
      approved_sources:
        type: list[string]
        required: true
        min_items: 1
      secondary_sources:
        type: list[string]
        required: false
      source_gaps:
        type: list[string]
        required: false
      authority_order:
        type: ordered_list[string]
        required: true
        min_items: 1
      key_constraints:
        type: list[string]
        required: false
      current_decisions:
        type: list[string]
        required: false
      last_updated_date:
        type: date
        required: true
        format: YYYY-MM-DD
      last_updated_reason:
        type: string
        required: true

  lightspeed-preferences.md:
    description: Project-level defaults that should shape future outputs.
    required_sections:
      - Output structure defaults
      - Metadata defaults
      - Review framing defaults
      - Drafting conventions
      - Last updated
    fields:
      preferred_default_structure:
        type: string
        required: true
      preferred_heading_style:
        type: string
        required: false
      preferred_summary_style:
        type: string
        required: false
      preferred_ending_style:
        type: string
        required: false
      metadata_fields_to_include:
        type: list[string]
        required: false
      versioning_preference:
        type: string
        required: false
      divider_line_preference:
        type: boolean_or_string
        required: false
      traceability_notes:
        type: string
        required: false
      preferred_review_depth:
        type: enum
        required: false
        allowed_values:
          - light
          - medium
          - deep
      blocker_presentation:
        type: string
        required: false
      gap_presentation:
        type: string
        required: false
      next_step_presentation:
        type: string
        required: false
      tone_defaults:
        type: string
        required: false
      cta_style_defaults:
        type: string
        required: false
      proof_or_evidence_standard:
        type: string
        required: false
      internal_linking_preference:
        type: string
        required: false
      section_length_preference:
        type: string
        required: false
      last_updated_date:
        type: date
        required: true
        format: YYYY-MM-DD
      last_updated_reason:
        type: string
        required: true

  user-preferences.md:
    description: Reusable standing user preferences.
    required_sections:
      - Spelling and style
      - Review preferences
      - Formatting preferences
      - Writing preferences
      - Last updated
    fields:
      preferred_english_style:
        type: enum
        required: false
        allowed_values:
          - UK English
          - US English
      preferred_punctuation_or_style_notes:
        type: string
        required: false
      preferred_terms:
        type: list[string]
        required: false
      avoided_terms:
        type: list[string]
        required: false
      preferred_review_depth:
        type: enum
        required: false
        allowed_values:
          - light
          - medium
          - deep
      preferred_level_of_detail:
        type: string
        required: false
      blocker_presentation:
        type: string
        required: false
      assumption_presentation:
        type: string
        required: false
      preferred_section_order:
        type: list[string]
        required: false
      preferred_heading_style:
        type: string
        required: false
      preferred_bullets_vs_paragraphs:
        type: string
        required: false
      preferred_metadata_style:
        type: string
        required: false
      preferred_divider_line_usage:
        type: string
        required: false
      preferred_tone:
        type: string
        required: false
      preferred_phrasing_to_avoid:
        type: list[string]
        required: false
      preferred_clarity_level:
        type: string
        required: false
      preferred_cta_wording_style:
        type: string
        required: false
      last_updated_date:
        type: date
        required: true
        format: YYYY-MM-DD
      last_updated_reason:
        type: string
        required: true

  todos.md:
    description: Canonical running task list for related work.
    required_sections:
      - In progress
      - Waiting on input
      - Next actions
      - Recently completed
      - Notes
      - Last updated
    fields:
      in_progress:
        type: checklist[string]
        required: false
      waiting_on_input:
        type: checklist_with_note
        required: false
      next_actions:
        type: checklist[string]
        required: false
      recently_completed:
        type: checklist[string]
        required: false
      notes:
        type: list[string]
        required: false
      last_updated_date:
        type: date
        required: true
        format: YYYY-MM-DD
      last_updated_reason:
        type: string
        required: true
    rules:
      - Do not keep the same task in both In progress and Recently completed.
      - Move externally blocked tasks to Waiting on input.
      - Remove stale or contradictory entries instead of appending duplicates.

  lightspeed-open-items.md:
    description: Unresolved blockers, approvals, risks, and decisions.
    required_sections:
      - Missing inputs
      - Approvals needed
      - Evidence gaps
      - Risks
      - Pending decisions
      - Last updated
    fields:
      missing_inputs:
        type: list[string]
        required: false
      approvals_needed:
        type: list[object]
        required: false
        object_fields:
          item:
            type: string
            required: true
          owner:
            type: string
            required: false
          status:
            type: enum
            required: false
            allowed_values:
              - pending
              - in progress
              - approved
              - rejected
              - unknown
      evidence_gaps:
        type: list[string]
        required: false
      risks:
        type: list[object]
        required: false
        object_fields:
          risk:
            type: string
            required: true
          impact:
            type: string
            required: false
          mitigation:
            type: string
            required: false
      pending_decisions:
        type: list[object]
        required: false
        object_fields:
          decision:
            type: string
            required: true
          options:
            type: list[string]
            required: false
          recommended_direction:
            type: string
            required: false
      last_updated_date:
        type: date
        required: true
        format: YYYY-MM-DD
      last_updated_reason:
        type: string
        required: true

global_rules:
  - Save only confirmed or explicitly marked tentative information.
  - Prefer updating existing values over creating conflicting duplicates.
  - Keep values concise, reusable, and relevant to future related work.
  - If a value is unknown, omit it or mark it clearly as unknown instead of guessing.
  - Do not store sensitive details unless they are genuinely needed for future related work.