  scenario: "tour-operator"
  stage: "intake-and-strategy"
  source_authority:
    - "discovery brief"
    - "itinerary docs"
    - "stakeholder notes"
  next_workflow: "conversion-goal-strategy"
  blocker: "no confirmed enquiry model or approved trust proof"

voice_and_tone:
  brand_personality_summary: "Premium, expert, reassuring, trust-led"
  core_tone_pillars:
    - "expert"
    - "reassuring"
    - "clear"
  preferred_wording:
    - "tailor-made"
    - "expert-led"
    - "planned with care"
  avoided_wording:
    - "bucket-list cliches"
    - "guaranteed sightings"
    - "luxury hype"
  trust_and_proof_sensitivity_notes:
    - "Travel, safety, wildlife, and testimonial claims are highly sensitive"
  tone_by_context:
    - context: "destination pages"
      tone_guidance: "inspiring but grounded in approved facts"
      what_to_avoid: "romanticised claims without proof"

conversion_goals:
  primary_audience_segments:
    - "high-intent safari planners"
    - "travellers comparing operator fit"
  audience_intent_notes:
    - "build trust before enquiry"
    - "understand destination and trip fit"
  primary_conversion_goal: "itinerary enquiry"
  secondary_conversion_goal: "destination exploration"
  core_user_flow_priorities:
    - "homepage to destination page"
    - "destination page to tour page"
    - "tour page to enquiry"
  cta_model: "itinerary-enquiry-or-trip-planning-consultation"
  routing_model: "homepage to destination/tour pages to enquiry"
  page_role_definitions:
    - page_family: "destination pages"
      role_in_flow: "help visitors choose where to go"
      primary_cta: "explore trips"
    - page_family: "tour pages"
      role_in_flow: "move from interest to enquiry"
      primary_cta: "enquire now"
  funnel_stage_defaults:
    - "consideration"
    - "decision"
  friction_or_trust_notes:
    - "trust, safety, fit, and planning confidence are major blockers"

preferences:
  template_family: "homepage-destination-tour-trust-pages"
  output_type: "strategy-pack-then-page-drafts"
  proof_sensitivity: "very-high"

user:
  english_style: "UK"
  review_depth: "medium-to-deep"
  blocker_style: "direct"

todos:
  active_deliverable: "audience-flow-and-enquiry-path-strategy"
