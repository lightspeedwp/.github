version: 1
memory_domain: conversion_goals
fields:
  primary_audience_segments:
    type: list[string]
    required: false
  audience_intent_notes:
    type: list[string]
    required: false
  primary_conversion_goal:
    type: string
    required: false
  secondary_conversion_goal:
    type: string
    required: false
  core_user_flow_priorities:
    type: list[string]
    required: false
  cta_model:
    type: string
    required: false
  routing_model:
    type: string
    required: false
  page_role_definitions:
    type: list[object]
    required: false
    object_fields:
      page_family:
        type: string
        required: true
      role_in_flow:
        type: string
        required: true
      primary_cta:
        type: string
        required: false
  funnel_stage_defaults:
    type: list[string]
    required: false
  friction_or_trust_notes:
    type: list[string]
    required: false
rules:
  - Save only reusable strategic defaults that affect later drafting or review.
  - Keep user-flow entries practical and page-action oriented.
  - Do not store speculative metrics targets as durable defaults unless approved.
