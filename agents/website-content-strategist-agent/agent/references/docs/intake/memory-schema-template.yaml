version: 1
name: intake_memory_schema_template
purpose: current-state template for promoting intake-derived values into safe reusable project memory
principles:
  - Keep questionnaire files as reference inputs, not durable memory by default.
  - Save only reusable values that improve future related work.
  - Never save inferred or questionnaire-defaulted values as durable memory without confirmation.
  - Separate current-run working context from reusable confirmed memory.
  - Treat risk-bearing, claim-bearing, approval-sensitive, or unverified values as review-controlled.
allowed_statuses:
  - confirmed
  - inferred
  - defaulted
  - missing
save_policies:
  - current_run_only
  - confirm_before_save
  - save_if_user_confirms
  - save_links_only
  - do_not_save_without_review
memory_buckets:
  current_run_context:
    description: working values used during the active request even if they are still inferred, partial, or provisional
    rules:
      - May include inferred, defaulted, or missing placeholders.
      - Can be used to drive intake, routing, and next-step decisions in the current run.
      - Should not be treated as durable reusable truth.
  project_memory_candidates:
    description: values that appear reusable across future related requests but still need explicit confirmation, stronger evidence, or approval before durable storage
    rules:
      - Keep candidate values separate from confirmed memory.
      - Prefer candidate status when a value came from questionnaires, rough notes, uploaded files, or early intake.
      - Promote only after confirmation or approved-source review.
  confirmed_project_memory:
    description: durable reusable project values that are confirmed and safe to reuse across future related requests
    rules:
      - Save only confirmed values with a clear future-use benefit.
      - Keep entries compact and operational.
      - Update when the confirmed project default changes.
  unsafe_or_unverified_memory:
    description: values that should not be promoted into reusable memory until reviewed, validated, or approved
    rules:
      - Includes unsupported claims, risky defaults, unresolved approvals, and regulated or sensitive assumptions.
      - Do not save these values as reusable project memory.
      - Keep only if a short-lived working register is needed for review during the current run.
default_schema:
  project_id:
    status: missing
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: useful stable identifier once confirmed
  project_type:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: often reusable for routing, but questionnaire classification alone is not enough
  task_type:
    status: inferred
    save_policy: current_run_only
    bucket: current_run_context
    rationale: task-level intent often changes per run
  workflow_context:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: useful when the same project repeatedly returns to a known stage
  project_stage:
    status: inferred
    save_policy: current_run_only
    bucket: current_run_context
    rationale: stage is helpful operationally but often changes frequently
  primary_goal:
    status: confirmed
    save_policy: save_if_user_confirms
    bucket: confirmed_project_memory
    rationale: durable when it reflects the standing goal for the project or page family
  secondary_goal:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: helpful when stable, but often provisional early on
  audience:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: high reuse value, but only after confirmation
  user_intent:
    status: inferred
    save_policy: current_run_only
    bucket: current_run_context
    rationale: often depends on the current page, asset, or workflow
  conversion_goal:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: reusable when stable across a page or funnel family
  questionnaire_sources:
    status: inferred
    save_policy: current_run_only
    bucket: current_run_context
    rationale: source selection is part of intake reasoning, not durable project memory
  source_assets:
    status: confirmed
    save_policy: save_links_only
    bucket: confirmed_project_memory
    rationale: reusable references should be stored as links or stable references, not bulky copied content
  approved_sources:
    status: missing
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: durable and important once approved explicitly
  brand:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: reusable if stable and confirmed
  offer:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: often central to future drafting, but not safe to save unconfirmed
  services_or_products:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: reusable when part of the standing project scope
  voice_and_tone:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: valuable durable default only after explicit approval or clear confirmation
  design_direction:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: reusable when stable enough to guide later outputs
  technical_requirements:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: reusable when these constraints are stable across future work
  integrations:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: integration assumptions need confirmation before reuse
  required_output_format:
    status: defaulted
    save_policy: current_run_only
    bucket: current_run_context
    rationale: format preferences may vary by task unless clearly established as a standing default
  scope_boundaries:
    status: inferred
    save_policy: save_if_user_confirms
    bucket: confirmed_project_memory
    rationale: valuable durable boundary once confirmed
  exclusions:
    status: confirmed
    save_policy: save_if_user_confirms
    bucket: confirmed_project_memory
    rationale: must-not-do rules are durable when explicitly confirmed
  privacy_or_legal_requirements:
    status: inferred
    save_policy: do_not_save_without_review
    bucket: unsafe_or_unverified_memory
    rationale: sensitive requirements should be reviewed before durable reuse
  claims:
    status: inferred
    save_policy: do_notSave_without_review
    bucket: unsafe_or_unverified_memory
    rationale: claims belong in a claim register, not general reusable memory
  risk_flags:
    status: inferred
    save_policy: do_not_save_without_review
    bucket: unsafe_or_unverified_memory
    rationale: keep review-controlled until validated or resolved
  approval_owners:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: reusable once reliably known
  approval_requirements:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: durable when tied to a stable workflow or publishing process
  claim_register_required:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: reusable when the project repeatedly triggers claim review
  smart_defaults:
    status: defaulted
    save_policy: current_run_only
    bucket: current_run_context
    rationale: defaults help the current intake run but should not become durable memory automatically
  launch_requirements:
    status: inferred
    save_policy: confirm_before_save
    bucket: project_memory_candidates
    rationale: reusable for ongoing launch-readiness work when confirmed
  handoff_destination:
    status: inferred
    save_policy: current_run_only
    bucket: current_run_context
    rationale: downstream owner often changes by task
promotion_rules:
  promote_to_confirmed_project_memory_when:
    - the value is explicitly confirmed by the user
    - the value is verified against an approved source
    - the value is specific enough to improve future related work
    - the value is stable rather than one-off task noise
  keep_in_project_memory_candidates_when:
    - the value seems reusable but is still provisional
    - the value came from questionnaires or intake inference
    - the value depends on approval, evidence, or owner confirmation
  keep_in_current_run_context_when:
    - the value is only needed to complete the current workflow
    - the value is a working assumption, temporary default, or routing decision
    - the value changes often between related tasks
  keep_out_of_durable_memory_when:
    - the value is a claim, risk, or regulated-content assumption
    - the value is unsupported or high-risk
    - the value is only a questionnaire default
    - the value is sensitive and still awaiting review
review_notes:
  - Use this schema together with docs/intake/memory-promotion-checklist.md.
  - Pair approved source links with source-approval-register.md when source authority matters.
  - Pair claims and evidence-sensitive values with claim-register-template.md instead of storing them as ordinary project memory.
  - Pair exclusions and scope boundaries with exclusions-register.md when those boundaries need a more explicit working record.
example_compact_memory_entry:
  project_id: LS-CLIENT-001
  project_type: brochure website
  primary_goal: generate qualified consultation enquiries
  audience: operations leaders at growing service businesses
  approved_sources:
    - approved strategy brief
    - approved sitemap
  exclusions:
    - do not imply guaranteed ranking outcomes
    - do not invent client statistics
  note: save only after confirmation or approved-source review
