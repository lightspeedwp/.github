version: 1
name: url_evidence_token_schema
purpose: normalize URLs, files, docs, designs, repos, screenshots, and other source materials into structured evidence tokens for intake, review, claims, and memory decisions
principles:
  - Extract only the evidence needed to improve the current workflow.
  - Prefer approved or user-provided sources over inferred web context.
  - Mark extracted values as inferred unless explicitly confirmed by the user or verified from an approved source.
  - Keep evidence extraction separate from durable memory promotion.
  - Route claim-bearing, regulated, comparative, or risky evidence into review paths before reuse.
allowed_statuses:
  - confirmed
  - inferred
  - defaulted
  - missing
  - unsupported
source_types:
  - url
  - document
  - spreadsheet
  - slide_deck
  - design_file
  - repository
  - screenshot
  - questionnaire
  - brief
  - policy
  - note
  - other
verification_levels:
  - user_confirmed
  - approved_source
  - source_present_unverified
  - questionnaire_inferred
  - defaulted
  - unsupported
review_routes:
  - current_run_only
  - memory_candidate_review
  - source_approval_review
  - claim_register_review
  - governance_review
  - privacy_or_legal_review
  - launch_readiness_review
evidence_token_schema:
  - key: source_label
    required: true
    description: human-readable label for the source
  - key: source_type
    required: true
    description: one of the defined source_types
  - key: source_locator
    required: true
    description: URL, file name, repo path, document name, or other stable locator
  - key: content_scope
    required: false
    description: page, section, component, project, repository, or document scope covered by the source
  - key: extracted_token
    required: true
    description: normalized token name such as audience, offer, claim, exclusion, or technical requirement
  - key: extracted_value
    required: true
    description: the extracted value in compact working form
  - key: status
    required: true
    description: confirmation state of the extracted value
  - key: verification_level
    required: true
    description: how trustworthy the extracted value currently is
  - key: questionnaire_source
    required: false
    description: questionnaire file name when the token came from questionnaire material
  - key: approved_source
    required: false
    description: whether the underlying source is approved for operational reuse
  - key: claim_sensitive
    required: false
    description: whether the token could become a public-facing claim or evidence-backed statement
  - key: risk_level
    required: false
    description: low, medium, or high when the token affects risk, compliance, privacy, or public trust
  - key: review_route
    required: true
    description: where the token should go next if more review is needed
  - key: save_policy
    required: true
    description: current_run_only, confirm_before_save, save_if_user_confirms, save_links_only, or do_not_save_without_review
  - key: notes
    required: false
    description: short working note explaining uncertainty, dependency, or why review is required
default_token_types:
  - brand
  - audience
  - offer
  - services_or_products
  - content_types
  - design_direction
  - technical_requirements
  - integrations
  - source_assets
  - approved_sources
  - exclusions
  - legal_or_privacy_requirements
  - claims
  - approval_owners
  - launch_or_handoff_requirements
  - risks
  - missing_blockers
  - primary_goal
  - conversion_goal
  - workflow_context
source_handling_rules:
  url:
    extract:
      - brand
      - offer
      - services_or_products
      - content_types
      - claims
      - exclusions
      - approval_owners
    notes:
      - Treat public URLs as source_present_unverified unless the user confirms they are approved sources.
      - Do not treat public website copy as automatically approved for reuse.
  document:
    extract:
      - audience
      - primary_goal
      - offer
      - approved_sources
      - exclusions
      - claims
      - launch_or_handoff_requirements
    notes:
      - Prefer explicit brief sections and approved statements over implied meaning.
  spreadsheet:
    extract:
      - services_or_products
      - technical_requirements
      - integrations
      - claims
      - launch_or_handoff_requirements
    notes:
      - Route quantified fields into claim review when they could become public proof.
  slide_deck:
    extract:
      - brand
      - audience
      - primary_goal
      - messaging_priorities
      - claims
    notes:
      - Treat strategy decks as useful directional evidence, but still verify claim-bearing details.
  design_file:
    extract:
      - design_direction
      - content_types
      - source_assets
      - technical_requirements
    notes:
      - Design files guide layout and hierarchy, not final claim approval or legal wording.
  repository:
    extract:
      - technical_requirements
      - integrations
      - source_assets
      - exclusions
    notes:
      - Repo content may clarify implementation, structure, and existing content, but not necessarily approval status.
  screenshot:
    extract:
      - design_direction
      - source_assets
      - content_types
      - claims
    notes:
      - Screenshots are reference evidence, not durable proof on their own.
  questionnaire:
    extract:
      - audience
      - primary_goal
      - workflow_context
      - source_assets
      - exclusions
      - claims
      - risks
      - approval_owners
      - launch_or_handoff_requirements
    notes:
      - Mark questionnaire-derived tokens as questionnaire_inferred unless explicitly confirmed elsewhere.
  brief:
    extract:
      - project_type
      - primary_goal
      - audience
      - approved_sources
      - exclusions
      - approval_owners
    notes:
      - Approved briefs are strong candidates for memory promotion after confirmation.
  policy:
    extract:
      - legal_or_privacy_requirements
      - exclusions
      - approval_owners
      - risks
    notes:
      - Route legal or privacy interpretations to review when uncertainty remains.
review_rules:
  send_to_claim_register_review_when:
    - the token contains a statistic, quantified proof point, award, guarantee, testimonial, comparison, ranking, pricing claim, ROI statement, performance statement, or outcome claim
    - the token could become public-facing factual copy
    - the token came from a questionnaire default but implies compliance, quality, suitability, or safety
  send_to_source_approval_review_when:
    - the source is present but not confirmed as approved
    - the value may be reused later and source authority matters
  send_to_governance_review_when:
    - the token affects disclosures, chatbot behavior, escalation, or AI-use framing
    - the token affects policy, accountability, or documented controls
  send_to_privacy_or_legal_review_when:
    - the token includes privacy handling, retention, legal interpretation, compliance language, or regulated restrictions
  keep_current_run_only_when:
    - the token is only useful for the current intake decision
    - the token is a temporary routing assumption or smart default
memory_interaction_rules:
  - Evidence tokens are staging structures, not durable memory by default.
  - Promote only confirmed reusable values into project memory candidates or confirmed project memory.
  - Save source references as links or stable locators rather than copying bulky evidence into memory.
  - Do not save unsupported claims, risky defaults, or unapproved source interpretations into durable memory.
example_tokens:
  - source_label: Website briefing questionnaire
    source_type: questionnaire
    source_locator: questionnaires/website-briefing-questionnaire.md
    content_scope: project
    extracted_token: redacted
    extracted_value: operations leaders at growing service businesses
    status: inferred
    verification_level: questionnaire_inferred
    questionnaire_source: website-briefing-questionnaire.md
    approved_source: false
    claim_sensitive: false
    risk_level: low
    review_route: memory_candidate_review
    save_policy: confirm_before_save
    notes: useful audience draft pending confirmation
  - source_label: Approved strategy brief
    source_type: document
    source_locator: strategy-brief-v3.docx
    content_scope: website
    extracted_token: redacted
    extracted_value: generate qualified consultation enquiries
    status: confirmed
    verification_level: approved_source
    approved_source: true
    claim_sensitive: false
    risk_level: low
    review_route: memory_candidate_review
    save_policy: save_if_user_confirms
    notes: reusable if this remains the standing site goal
  - source_label: Homepage screenshot
    source_type: screenshot
    source_locator: homepage-proof-block.png
    content_scope: homepage
    extracted_token: claims
    extracted_value: trusted by 500+ clients
    status: inferred
    verification_level: source_present_unverified
    approved_source: false
    claim_sensitive: true
    risk_level: medium
    review_route: claim_register_review
    save_policy: do_not_save_without_review
    notes: visible proof claim needs source validation before reuse
related_files:
  - docs/intake/questionnaire-source-map.md
  - docs/intake/questionnaire-field-library.yaml
  - docs/intake/memory-schema-template.yaml
  - docs/intake/source-approval-register.md
  - docs/intake/claim-register-template.md
  - docs/intake/ri[REDACTED_OPENAI_KEY].md
