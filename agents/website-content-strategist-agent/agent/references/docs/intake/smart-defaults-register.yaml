version: 1
name: smart_defaults_register
purpose: current-state register for temporary intake defaults that help the workflow move forward without being treated as confirmed truth or durable memory
principles:
  - Smart defaults are temporary working assumptions, not confirmed project facts.
  - Use defaults only when they help the current workflow proceed safely.
  - Prefer user-provided and approved-source values over defaults.
  - Defaults must stay visibly labelled as defaulted until confirmed.
  - Do not save defaults into durable Memory unless they are later confirmed.
allowed_statuses:
  - confirmed
  - inferred
  - defaulted
  - missing
default_classes:
  - routing_default
  - workflow_default
  - formatting_default
  - tone_default
  - intake_default
  - risk_default
  - approval_default
  - handoff_default
save_policies:
  - current_run_only
  - confirm_before_save
  - save_if_user_confirms
  - do_not_save_without_review
register_schema:
  - key: default_label
    required: true
    description: short human-readable name for the smart default
  - key: default_class
    required: true
    description: one of the defined default_classes
  - key: applies_to
    required: true
    description: field, workflow, page type, intake stage, or output step affected by the default
  - key: default_value
    required: true
    description: the temporary value being used
  - key: status
    required: true
    description: usually defaulted, but may later become inferred or confirmed
  - key: source_basis
    required: true
    description: why this default is being used, such as questionnaire pattern, workflow norm, approved template, or safe fallback
  - key: safe_use_scope
    required: true
    description: where the default may be used safely during the current run
  - key: not_safe_for
    required: true
    description: where the default must not be treated as confirmed truth
  - key: confirmation_needed
    required: true
    description: yes or no
  - key: save_policy
    required: true
    description: how the value should be treated for Memory purposes
  - key: review_trigger
    required: false
    description: what event or condition should force confirmation or review
  - key: notes
    required: false
    description: short explanation of why this default is reasonable and where caution is needed
core_rules:
  - Use smart defaults to reduce unnecessary intake friction, not to skip material decisions.
  - A smart default should help the next step proceed while keeping uncertainty visible.
  - If a default materially changes scope, compliance, approval, claims, or destination, confirm it before relying on it.
  - Questionnaire-derived defaults remain defaulted unless confirmed by the user or an approved source.
  - Defaults may guide routing, draft structure, and question prioritization, but they do not establish durable project truth.
  - Defaults must not silently override confirmed values, approved sources, or explicit exclusions.
safe_default_patterns:
  routing:
    description: defaults that help choose the next workflow or intake path
    examples:
      - If the request is page-focused but strategy context is thin, default to page-intake-first rather than full drafting.
      - If the workflow clearly concerns evidence-backed proof, default to claim review before public drafting.
  output_format:
    description: defaults that help shape the next artifact
    examples:
      - Default to a review summary when the user asks what should happen next.
      - Default to a structured intake table when a request is intake-heavy but underdefined.
  tone:
    description: defaults that reduce style ambiguity without claiming final brand truth
    examples:
      - Default to clear, restrained, professional wording when brand tone is not yet confirmed.
      - Avoid playful, premium, or hype-heavy tone defaults unless the source basis supports them.
  scope:
    description: defaults that prevent overreach
    examples:
      - Default to the smallest useful scope when the request could mean page, section, or full-site work.
      - Default to reference-only use of ambiguous sources until approval is clear.
  claims_and_risk:
    description: defaults that keep risky content safe
    examples:
      - Default unverified proof language to not approved for public use.
      - Default claim-sensitive answers into claim review when trust-sensitive wording appears.
  memory:
    description: defaults that keep reusable memory safe
    examples:
      - Default questionnaire-derived values to current-run only.
      - Default unconfirmed audience, tone, and conversion assumptions to memory candidates only after confirmation.
recommended_defaults:
  - default_label: project scope fallback
    default_class: routing_default
    applies_to: workflow scope
    default_value: choose the smallest useful scope that still answers the request
    status: defaulted
    source_basis: safe fallback for ambiguous scope
    safe_use_scope: current-run routing and intake sequencing
    not_safe_for: confirmed project scope or durable memory
    confirmation_needed: yes
    save_policy: current_run_only
    review_trigger: when wider scope changes deliverables materially
    notes: prevents accidental expansion from section to page or page to full-site work
  - default_label: questionnaire values stay provisional
    default_class: intake_default
    applies_to: questionnaire-derived fields
    default_value: mark as defaulted or inferred until confirmed
    status: defaulted
    source_basis: intake framework rule
    safe_use_scope: intake wizard prefills and follow-up question prioritization
    not_safe_for: confirmed truth, public claims, or durable memory
    confirmation_needed: yes
    save_policy: current_run_only
    review_trigger: when a questionnaire-derived value would shape final public wording or memory
    notes: protects against treating questionnaires as approved project truth
  - default_label: approved-source preference
    default_class: risk_default
    applies_to: source selection
    default_value: prefer approved or explicitly user-provided sources over public or ambiguous references
    status: defaulted
    source_basis: source safety rule
    safe_use_scope: evidence extraction and drafting preparation
    not_safe_for: ignoring stronger approved authority or assuming public sources are approved
    confirmation_needed: no
    save_policy: do_not_save_without_review
    review_trigger: when only unapproved sources are available for a claim-bearing output
    notes: keeps evidence handling conservative by default
  - default_label: neutral professional tone
    default_class: tone_default
    applies_to: early drafting and intake responses
    default_value: clear, restrained, professional wording
    status: defaulted
    source_basis: safe communication fallback
    safe_use_scope: provisional drafting before tone is confirmed
    not_safe_for: final reusable voice-and-tone defaults
    confirmation_needed: yes
    save_policy: current_run_only
    review_trigger: when brand personality or tone becomes material to quality
    notes: avoids overcommitting to a brand voice too early
  - default_label: review-first for risky claims
    default_class: risk_default
    applies_to: claim-sensitive content
    default_value: send risky, comparative, quantified, or regulated claims to review before final use
    status: defaulted
    source_basis: claim safety rule
    safe_use_scope: claim routing and draft caution handling
    not_safe_for: bypassing claim review for public output
    confirmation_needed: no
    save_policy: do_not_save_without_review
    review_trigger: when claim approval becomes explicit
    notes: a protective default for trust-sensitive wording
  - default_label: output as review when next step is unclear
    default_class: workflow_default
    applies_to: underdefined planning or readiness requests
    default_value: produce a structured review-style output with clear next step
    status: defaulted
    source_basis: workflow packaging norm
    safe_use_scope: planning, assessment, and readiness conversations
    not_safe_for: pretending review output is final approved delivery
    confirmation_needed: no
    save_policy: current_run_only
    review_trigger: when the user requests a concrete downstream deliverable instead
    notes: helps the workflow stay useful without overcommitting
confirmation_rules:
  confirm_now_when:
    - the default would materially change project scope
    - the default affects claims, regulated content, or approval expectations
    - the default affects a publishing or launch decision
    - the default would be saved into reusable Memory
    - the default changes the intended audience, offer, destination, or exclusion set
  safe_to_leave_defaulted_for_now_when:
    - the default only helps routing or intake sequencing
    - the default only shapes the current-run output structure
    - the default avoids overreach without claiming truth
    - the default remains clearly labelled and easy to correct
memory_rules:
  - Keep smart defaults in current_run_context unless later confirmed.
  - Do not promote smart defaults directly into confirmed_project_memory.
  - If a default appears reusable, move it first into project_memory_candidates only after confirmation.
  - Risk-bearing or claim-bearing defaults should not be stored in Memory without review.
review_triggers:
  - claim_sensitive_default
  - scope_expansion_default
  - unapproved_source_default
  - regulated_content_default
  - launch_or_publish_default
  - memory_promotion_default
example_entries:
  - default_label: FAQ output shape fallback
    default_class: formatting_default
    applies_to: FAQ planning output
    default_value: use exactly five FAQ planning slots
    status: defaulted
    source_basis: workflow standard
    safe_use_scope: current-run FAQ planning and output structure
    not_safe_for: assuming all five answers are approved for publication
    confirmation_needed: no
    save_policy: current_run_only
    review_trigger: when claim-sensitive FAQ answers appear
    notes: structure is safe by default, content approval is separate
  - default_label: brochure-site conversion path fallback
    default_class: routing_default
    applies_to: page CTA planning
    default_value: consultation-style CTA as the lower-risk working default
    status: defaulted
    source_basis: common brochure-site conversion pattern
    safe_use_scope: provisional CTA planning when no stronger conversion model is confirmed
    not_safe_for: durable conversion strategy or published final CTA without confirmation
    confirmation_needed: yes
    save_policy: current_run_only
    review_trigger: when the actual conversion goal differs materially
    notes: useful for early structure, but must not replace confirmed funnel strategy
related_files:
  - docs/intake/questionnaire-field-library.yaml
  - docs/intake/memory-schema-template.yaml
  - docs/intake/memory-promotion-checklist.md
  - docs/intake/url-evidence-token-schema.yaml
  - docs/intake/source-approval-register.md
  - docs/intake/exclusions-register.md
  - docs/intake/ri[REDACTED_OPENAI_KEY].md
