version: 1
template_family: structural-content
required_template_groups:
  - menu
  - header
  - footer
  - sidebar
  - modal or popup
  - cta section
rules:
  - Structural templates must define purpose, content fields, and CTA or link requirements when relevant.
  - Navigation templates must define labels, destinations, and grouping logic.
  - Modal and CTA templates must define trigger or context plus the desired outcome.
