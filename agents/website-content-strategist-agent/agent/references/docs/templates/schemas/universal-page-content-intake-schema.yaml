version: 1
template: universal-page-content-intake-template
required_sections:
  - Identification
  - Purpose and goal
  - Template and structure
  - CTA and routing
  - Source and authority
  - Sensitivity and review
  - Specialist routing
fields:
  content_type:
    type: enum
    allowed_values: [website page, section, newsletter, form specification, responder email, policy page, chatbot intake page]
    required: true
  page_type:
    type: string
    required: false
  project_or_workflow_name:
    type: string
    required: false
  primary_audience:
    type: string
    required: true
  business_goal:
    type: string
    required: true
  user_intent:
    type: string
    required: true
  funnel_stage:
    type: enum
    allowed_values: [awareness, consideration, decision, post-purchase, onboarding, support]
    required: false
  preferred_template_family:
    type: string
    required: false
  required_sections:
    type: list[string]
    required: false
  primary_cta_label:
    type: string
    required: false
  primary_cta_destination:
    type: string
    required: false
  approved_source_inputs:
    type: list[string]
    required: false
  authority_order:
    type: ordered_list[string]
    required: false
  claim_sensitivity:
    type: enum
    allowed_values: [low, medium, high, approval-sensitive, legal-sensitive]
    required: false
  legal_or_policy_sensitivity:
    type: string
    required: false
  required_approvals:
    type: list[string]
    required: false
