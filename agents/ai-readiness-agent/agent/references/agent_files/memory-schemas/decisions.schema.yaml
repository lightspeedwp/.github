schema_version: 1.0.0
file: project-decisions.yaml
purpose: Record confirmed project decisions that the agent should reuse across future runs.
root_type: mapping
required_top_level_fields:
  - schema_version
  - file_type
  - decisions
field_types:
  schema_version: string
  file_type: string
  decisions: sequence
entry_rules:
  root_sequence: decisions
  min_entries: 0
  max_entries: 500
  unique_key: decision_id
  required_fields:
    - decision_id
    - project_key
    - decision
    - status
    - evidence_source
    - recorded_at
  optional_fields:
    - decided_by
    - impact_area
    - supersedes
    - notes
  field_types:
    decision_id: string
    project_key: string
    decision: string
    status: string
    evidence_source: string
    decided_by: string
    impact_area: string
    supersedes: string
    notes: string
    recorded_at: string
  accepted_values:
    status:
      - proposed
      - confirmed
      - provisional
      - withdrawn
    impact_area:
      - package
      - addon
      - pricing
      - scope
      - governance
      - source-policy
      - deliverable
      - workflow
  validation_rules:
    - Record only decisions that materially affect future work.
    - If status is provisional, the note should explain what still needs confirmation.
update_rules:
  - Add a new entry when a material decision changes instead of silently overwriting decision history.
  - Mark an older decision as withdrawn or superseded when replaced.
example:
  schema_version: 1.0.0
  file_type: project-decisions
  decisions:
    - decision_id: acme-foundation-route-001
      project_key: acme-co-website
      decision: AI Readiness Foundation is the recommended base package.
      status: provisional
      evidence_source: packages/ai-readiness-foundation/package-spec.md and current website review
      decided_by: Ash Shaw
      impact_area: package
      notes: Final fixed-fee confidence still depends on analytics and content-owner confirmation.
      recorded_at: 2026-05-15
