user_preferences:
  output_language: en-GB
  default_tone: practical_internal_lightspeed | client_ready | other
  prefers_tables_for_summaries: true | false
  prefers_clear_sections_for:
    - verified_findings
    - assumptions
    - open_questions
    - risks
    - next_steps
  default_client_ready_style: polished_and_concise | other
  avoid:
    - string
  updated_at: YYYY-MM-DD
