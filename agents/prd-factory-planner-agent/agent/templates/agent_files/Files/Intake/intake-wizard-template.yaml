version: 1
name: intake_wizard_template
purpose: Concise questionnaire-aware intake scaffold
fields:
  - key: project_type
    label: Project or task type
    status: missing
    source: user_or_questionnaire
    blocking: true
  - key: primary_goal
    label: Primary goal
    status: missing
    source: user_or_evidence
    blocking: true
  - key: audience
    label: Audience or user group
    status: missing
    source: questionnaire_or_evidence
    blocking: false
  - key: workflow_context
    label: Agent or workflow context
    status: inferred
    source: system_routing
    blocking: true
  - key: questionnaire_source
    label: Relevant questionnaire source
    status: inferred
    source: questionnaire_map
    blocking: false
  - key: source_material
    label: Reference asset or source material
    status: missing
    source: files_urls_docs_designs_repos
    blocking: false
  - key: output_format
    label: Required output format
    status: defaulted
    source: agent_default
    blocking: false
  - key: scope_boundaries
    label: Scope boundaries
    status: missing
    source: user_or_brief
    blocking: true
  - key: exclusions
    label: Exclusions or must-not-do rules
    status: missing
    source: user_or_questionnaire
    blocking: false
  - key: timeline_risk_approval
    label: Timeline, urgency, risk, or approval requirements
    status: missing
    source: user_or_evidence
    blocking: false
minimum_fields_before_proceeding: 5
allowed_statuses: [confirmed, inferred, defaulted, missing]
rule: Ask only for missing blocking information after prefilling what can be inferred safely.
