version: 1
name: intake-wizard-template
purpose: Concise wizard-driven intake scaffold for planning-heavy workflows
usage:
  - Select only the questionnaire files and sections relevant to the active task
  - Prefill fields from the user request, attached files, URLs, screenshots, repos, designs, and grounded defaults
  - Ask only for missing blocking information
required_minimum_fields: 5
target_field_count: 10
field_statuses:
  - confirmed
  - inferred
  - defaulted
  - missing
fields:
  - key: project_type
    label: Project or task type
    required: true
    examples: [website, ecommerce, content, design-system, plugin, theme, hybrid, tour-operator]
  - key: primary_goal
    label: Primary goal
    required: true
  - key: audience
    label: Audience or user group
    required: false
  - key: workflow_context
    label: Workflow context
    required: true
  - key: questionnaire_source
    label: Relevant questionnaire source
    required: false
  - key: reference_assets
    label: Reference assets or source material
    required: false
  - key: output_format
    label: Required output format
    required: false
  - key: scope_boundaries
    label: Scope boundaries
    required: false
  - key: exclusions
    label: Exclusions or must-not-do rules
    required: false
  - key: timing_risk_approval
    label: Timeline, urgency, risk, or approval requirements
    required: false
progression_rules:
  - Proceed once blocking fields are clear
  - Prefer the smallest useful artefact first
  - If intent is unclear, ask: What was this questionnaire intended to help capture for this workflow?
