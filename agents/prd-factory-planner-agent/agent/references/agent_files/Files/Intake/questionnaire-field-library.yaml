version: 1
field_groups:
  project_basics:
    - project_type
    - primary_goal
    - audience
    - workflow_context
  source_context:
    - questionnaire_source
    - source_assets
    - approved_sources
  scope_controls:
    - scope_boundaries
    - exclusions
    - constraints
  delivery:
    - output_format
    - timeline
    - approval_owner
    - handoff_requirements
  risk_and_claims:
    - privacy_requirements
    - legal_requirements
    - claims
    - risk_flags
    - missing_blockers
field_definitions:
  project_type:
    description: Classify the work type as early as possible.
  primary_goal:
    description: The main outcome the user wants.
  audience:
    description: Target users, readers, customers, or internal stakeholders.
  workflow_context:
    description: The active planning or delivery workflow.
  questionnaire_source:
    description: Which questionnaire or checklist informed the intake.
  source_assets:
    description: Files, URLs, repos, designs, screenshots, or docs used as evidence.
  approved_sources:
    description: Sources explicitly safe to rely on.
  scope_boundaries:
    description: Included work and meaningful limits.
  exclusions:
    description: Out-of-scope items or must-not-do rules.
  constraints:
    description: Technical, platform, legal, timing, or operational constraints.
  output_format:
    description: The deliverable expected next.
  timeline:
    description: Dates, urgency, dependencies, or launch pressure.
  approval_owner:
    description: Who must review or sign off.
  handoff_requirements:
    description: What downstream team needs.
  privacy_requirements:
    description: Personal data, consent, cookies, governance, or compliance needs.
  legal_requirements:
    description: Claims, regulated content, terms, or legal review needs.
  claims:
    description: Factual or performance assertions that need evidence review.
  risk_flags:
    description: Potential delivery, evidence, approval, or compliance risks.
  missing_blockers:
    description: Questions or evidence gaps that block reliable output.
