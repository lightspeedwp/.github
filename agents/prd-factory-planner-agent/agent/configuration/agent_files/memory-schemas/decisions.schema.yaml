schema_version: 1.0.0
file: decisions/decision-log.md
purpose: Confirmed planning or implementation decisions and their rationale.
content_type: markdown_with_yaml_frontmatter
required_frontmatter:
  - version
  - title
  - project_key
  - last_updated
entry_model:
  type: sequence_of_maps
  required_fields:
    - id
    - date
    - decision
    - rationale
    - source
    - status
  optional_fields:
    - impact
    - approved_by
field_definitions:
  id: {type: string, required: true}
  date: {type: date, required: true}
  decision: {type: string, required: true}
  rationale: {type: string, required: true}
  source: {type: string, required: true}
  status:
    type: string
    required: true
    accepted_values:
      - proposed
      - confirmed
      - superseded
  impact: {type: string, required: false}
  approved_by: {type: string, required: false}
validation_rules:
  - only confirmed or clearly proposed decisions belong here
  - each decision must identify a source or approval basis
  - superseded decisions should remain but be marked accordingly
update_rules:
  - append when a meaningful decision is made or status changes
example: |
  ---
  version: 1.0.0
  title: "Safari Lodge redesign decision log"
  project_key: safari-lodge-redesign
  last_updated: 2026-05-15
  ---
  - id: DEC-001
    date: 2026-05-15
    decision: Use a block theme rather than a classic theme.
    rationale: Aligns with the approved design-system and editor requirements.
    source: Technical review call notes
    status: confirmed
    impact: Affects template and pattern strategy.
