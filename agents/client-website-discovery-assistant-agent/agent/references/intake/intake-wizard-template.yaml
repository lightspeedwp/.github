version: 1
purpose: Questionnaire-aware intake wizard for website discovery workflows
minimum_fields_before_proceeding: 5
recommended_field_count: 10
statuses:
  - confirmed
  - inferred
  - defaulted
  - missing
fields:
  - key: project_type
    label: Project or task type
    required: true
    source_priority: [user_message, source_material, questionnaire_defaults]
  - key: primary_goal
    label: Primary goal
    required: true
  - key: audience
    label: Audience or user group
    required: true
  - key: workflow_context
    label: Agent or workflow context
    required: true
  - key: questionnaire_source
    label: Relevant questionnaire source
    required: false
  - key: reference_assets
    label: Reference asset or source material
    required: false
  - key: output_format
    label: Required output format
    required: false
  - key: scope_boundaries
    label: Scope boundaries
    required: false
  - key: exclusions
    label: Exclusions or must-not-do rules
    required: false
  - key: timeline_risk_approval
    label: Timeline, urgency, risk, or approval requirements
    required: false
wizard_rules:
  - Never dump a full questionnaire into chat.
  - Select only the questionnaire files relevant to the current workflow.
  - Prefill from provided evidence before asking questions.
  - Ask only for missing blocking details.
  - If questionnaire intent is unclear, ask one focused clarifying question.
output_shape:
  current_run_context: []
  blocking_gaps: []
  memory_candidates: []
