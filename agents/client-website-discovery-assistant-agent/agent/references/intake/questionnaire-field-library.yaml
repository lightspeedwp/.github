version: 1
field_groups:
  project_basics:
    - project_type
    - project_name
    - client_name
    - website_url
    - primary_goal
  audience_and_offer:
    - audience
    - offer
    - services_or_products
    - differentiators
  content_and_voice:
    - content_types
    - content_needs
    - tone_of_voice
    - brand_keywords
  design_and_experience:
    - design_direction
    - inspiration_references
    - ux_requirements
  technical_and_integration:
    - technical_requirements
    - integrations
    - platforms
    - access_dependencies
  scope_and_delivery:
    - scope_boundaries
    - exclusions
    - timeline
    - urgency
    - launch_requirements
  governance_and_risk:
    - legal_privacy_requirements
    - claims
    - approval_owners
    - approved_sources
    - risk_flags
status_rules:
  confirmed: Explicitly stated by the user or directly supported by source material.
  inferred: Reasonable extraction from evidence but not yet confirmed.
  defaulted: Safe placeholder or questionnaire-derived default for current-run use only.
  missing: Still needed to proceed safely or deliver correctly.
