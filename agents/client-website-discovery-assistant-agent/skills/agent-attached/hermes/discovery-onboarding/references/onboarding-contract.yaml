state_backend: memory
memory_state_file: discovery-user-defaults.yaml

trigger_when:
  task_requires:
    - "starting a lightspeed website discovery task"
    - "creating a website discovery pack, session brief, client summary, or follow-up list"
    - "collecting reusable project defaults for future website discovery work"
    - "filling discovery templates from saved defaults"
    - "unblocking a related discovery skill that needs standing client, website, goal, output, approval, or project defaults"
  request_signals:
    - "discovery"
    - "discovery pack"
    - "website discovery"
    - "client discovery"
    - "new client website project"
    - "website audit intake"
    - "source of truth"
    - "project defaults"
    - "save these defaults"
    - "use this for future discovery work"
  missing_state:
    - "client_name"
    - "website_url"
    - "primary_goal"

required_state:
  - key: "client_name"
    ask: "What client is this discovery work for?"
    store_as: "client_name"
  - key: "website_url"
    ask: "What website, staging URL, domain, or primary web presence should I use as the discovery target?"
    store_as: "website_url"
  - key: "primary_goal"
    ask: "What is the main goal of this website project or discovery session?"
    store_as: "primary_goal"

optional_state:
  - key: "project_name"
    ask: "Do you want a project name saved separately from the client name?"
    default: "Use the client name as the project name when none is provided."
    store_as: "project_name"
  - key: "business_summary"
    ask: "What short business summary should I reuse for this client or project?"
    default: "Summarize the business from the current request when needed."
    store_as: "business_summary"
  - key: "target_audience"
    ask: "Who is the main target audience for this site?"
    default: "Infer the target audience from the current request when possible."
    store_as: "target_audience"
  - key: "key_pages"
    ask: "What key pages, templates, sections, or publication/site areas should I treat as the default scope?"
    default: "Capture key pages from each request when not provided as a reusable default."
    store_as: "key_pages"
  - key: "required_features"
    ask: "What features or functionality should I assume are required by default?"
    default: "Capture required features from each request when not provided as a reusable default."
    store_as: "required_features"
  - key: "content_needs"
    ask: "Are there any default content needs, collection gaps, migration expectations, or source-of-truth rules I should remember?"
    default: "Capture content needs from each request when they matter."
    store_as: "content_needs"
  - key: "integrations"
    ask: "What integrations or connected systems should I assume by default?"
    default: "Capture integrations from each request when not provided as a reusable default."
    store_as: "integrations"
  - key: "timeline"
    ask: "Is there a default timeline or urgency I should remember for this project?"
    default: "No standing timeline saved."
    store_as: "timeline"
  - key: "budget_range"
    ask: "Is there a budget range I should reuse by default?"
    default: "No standing budget range saved."
    store_as: "budget_range"
  - key: "stakeholders"
    ask: "Who are the usual stakeholders, reviewers, or client approvers for this project?"
    default: "Capture stakeholders from each request when needed."
    store_as: "stakeholders"
  - key: "decision_process"
    ask: "How are decisions, approvals, or sign-offs usually made for this project?"
    default: "Capture the decision process from each request when needed."
    store_as: "decision_process"
  - key: "discovery_lead"
    ask: "Who usually leads the discovery work for this project?"
    default: "Use the current requester when a discovery lead is not specified."
    store_as: "discovery_lead"
  - key: "default_output_mode"
    ask: "Should I default to internal discovery packs or client-facing summaries for this project?"
    default: "internal"
    store_as: "default_output_mode"
  - key: "preferred_template"
    ask: "Which template should I use by default: discovery-session-brief, internal-discovery-pack, client-discovery-summary, or discovery-followups?"
    default: "internal-discovery-pack"
    store_as: "preferred_template"
  - key: "pack_preferences"
    ask: "Do you want me to follow any standing template, checklist, or review preference by default?"
    default: "Use the standard LightSpeed discovery templates and field definitions."
    store_as: "pack_preferences"

completion_requires:
  - "client_name"
  - "website_url"
  - "primary_goal"

save_when:
  - "The value is durable across future discovery runs for the same client, project, or user."
  - "The value maps directly to a required_state or optional_state key."
  - "The user explicitly presents the value as a default, standing assumption, or future preference."

never_save:
  - "one-off meeting notes"
  - "transcript excerpts"
  - "temporary source evidence"
  - "draft findings or recommendations"
  - "support tickets, bugs, QA findings, or stakeholder comments"
  - "commercial sensitivity, margin commentary, or internal risk notes unless explicitly requested as a durable default"

skip_when:
  - "The current request already contains enough project context to produce the requested discovery output."
  - "The task is a one-off cleanup, rewrite, or formatting pass that does not need reusable defaults."
  - "The request is primarily run-specific evidence intake from pasted notes, links, documents, emails, issues, transcripts, or feedback."
  - "The request is reviewing an existing discovery pack, section, or client-facing summary."
  - "The request belongs to a specialist discovery, audit, launch, PRD, QA, or implementation workflow."

route_when:
  discovery_source_intake:
    use_when:
      - "current project evidence must be gathered, cleaned, classified, or normalized"
      - "the request mentions notes, emails, transcripts, attached files, docs, Asana, GitHub, support feedback, or links as evidence"
    onboarding_role: "save only durable defaults, then hand off run-specific evidence handling"
  discovery_pack_review:
    use_when:
      - "an existing discovery pack, section, client summary, or follow-up document needs QA"
      - "the user asks whether a draft is complete, safe to share, or template-compliant"
    onboarding_role: "run only if standing defaults are needed for review context"
  specialist_discovery_reviewers:
    use_when:
      - "the request is mainly about hosting, performance, content, email list quality, security, technical SEO, analytics, redirects, claims, policy, or launch readiness"
    onboarding_role: "collect missing basics only if the specialist workflow cannot proceed without them"
  broader_lightspeed_delivery:
    use_when:
      - "the request has moved from discovery into PRD, task breakdown, GitHub issue drafting, launch QA, implementation planning, or release handoff"
    onboarding_role: "do not run unless reusable website discovery defaults are still needed"

input_handling:
  multiple_clients_or_sites: "ask which client or site should be active before saving defaults; do not merge unrelated projects"
  partial_values: "save supplied durable values immediately and ask only for the missing required value that blocks progress"
  absent_url: "use a staging URL, live URL, domain, or primary web presence; if none exists and work can proceed, mark website_url as unresolved rather than blocking"
  no_output_preference: "default_output_mode=internal and preferred_template=internal-discovery-pack"
