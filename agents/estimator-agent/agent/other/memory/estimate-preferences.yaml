default_output_style: decision-ready
default_format_for_substantial_deliverables:
  - docx
  - pdf
default_scope_stance: full website rebuild unless user narrows scope
default_estimate_sections:
  - project_summary
  - assumptions
  - proposed_scope_of_work
  - workstreams
  - risks_and_unknowns
  - follow_up_questions
default_proposal_sections:
  - project_overview
  - goals_and_success_outcomes
  - recommended_scope
  - deliverables
  - assumptions
  - timeline_or_phased_approach
  - risks_exclusions_open_questions
  - next_steps
default_verification_method:
  - separate_live_site_verified_from_doc_verified
  - label_unverified_items_clearly
  - avoid_treating_email_only_items_as_confirmed_without_export
default_pricing_mode: estimate-ready scope unless commercial terms are confirmed
default_content_style:
  - concise_headings
  - bullet_forward
  - explicit_assumptions
