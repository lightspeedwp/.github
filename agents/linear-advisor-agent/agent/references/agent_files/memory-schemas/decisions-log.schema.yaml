schema:
  type: object
  additionalProperties: false
  required:
    - decisions
  properties:
    decisions:
      type: array
      minItems: 0
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - decision
          - scope
          - rationale
          - decided_at
          - status
        properties:
          id:
            type: string
            pattern: '^[a-z0-9-]{3,80}$'
          decision:
            type: string
            maxLength: 240
          scope:
            type: string
            enum:
              - global
              - workflow-type
              - skill-routing
              - memory-policy
              - tool-usage
          rationale:
            type: string
            maxLength: 400
          decided_at:
            type: string
            pattern: '^\\d{4}-\\d{2}-\\d{2}$'
          status:
            type: string
            enum:
              - active
              - superseded
              - deprecated
validation:
  update_rules:
    - Append new decisions instead of overwriting history when traceability matters.
    - Mark older entries superseded when replaced.
example:
  decisions:
    - id: route-specialist-before-creator
      decision: Route to the narrowest specialist skill before the creator skill.
      scope: skill-routing
      rationale: Reduces overlap and keeps outputs more precise.
      decided_at: '2026-05-15'
      status: active
