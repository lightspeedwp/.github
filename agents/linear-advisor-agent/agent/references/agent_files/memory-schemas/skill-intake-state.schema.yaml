schema:
  type: object
  additionalProperties: false
  required:
    - default_workflow_type
    - packaging_preference
    - last_confirmed_at
  properties:
    default_workflow_type:
      type: string
      enum:
        - direct-answer
        - reusable-template
        - full-skill
        - audit-pass
        - builder-instructions
        - app-guidance
        - custom
    packaging_preference:
      type: string
      enum:
        - minimal
        - standard
        - production-ready
    last_confirmed_at:
      type: string
      pattern: '^\\d{4}-\\d{2}-\\d{2}$'
    notes:
      type: string
      maxLength: 280
validation:
  min_required_fields: 3
  max_top_level_keys: 4
  update_rules:
    - Update only when the user confirms a lasting reusable default.
    - Remove superseded defaults instead of keeping competing values.
example:
  default_workflow_type: full-skill
  packaging_preference: production-ready
  last_confirmed_at: '2026-05-15'
  notes: Default to reusable packaging when the request is clearly recurring.
