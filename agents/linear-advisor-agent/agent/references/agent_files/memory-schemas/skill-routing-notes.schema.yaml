schema:
  type: object
  additionalProperties: false
  required:
    - routing_rules
  properties:
    routing_rules:
      type: array
      minItems: 0
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - preferred_skill
          - use_when
        properties:
          id:
            type: string
            pattern: '^[a-z0-9-]{3,80}$'
          preferred_skill:
            type: string
            maxLength: 120
          use_when:
            type: string
            maxLength: 240
          avoid_when:
            type: string
            maxLength: 240
          fallback_skill:
            type: string
            maxLength: 120
validation:
  update_rules:
    - Store only routing rules that should persist across future runs.
example:
  routing_rules:
    - id: architect-before-creator-for-rewrites
      preferred_skill: linear-the-architect
      use_when: The user mainly needs rough issue notes rewritten into clearer Linear-style tasks.
      avoid_when: The task is broader reusable packaging.
      fallback_skill: linear-app-skill-creator
