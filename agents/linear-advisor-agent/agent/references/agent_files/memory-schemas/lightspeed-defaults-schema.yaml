schema_name: lightspeed_defaults
schema_version: 1
purpose: >-
  Reference schema for durable LightSpeed Memory defaults used by the agent
  to keep future Memory updates consistent, compact, and auditable.

files:
  workspace-personalization.yaml:
    purpose: Durable LightSpeed workspace defaults that improve future assessments.
    required:
      team_context:
        primary_team: string
        allow_sub_teams: boolean
      active_scope_rules:
        include_projects_when: string
        include_initiatives_when: string
        include_milestones_when: string
      active_statuses:
        type: list[string]
      linked_system_priority:
        type: list[string]
      owner_guidance:
        default_unassigned_direction: string
        fallback_rule: string
      operating_model:
        company_type: string
        planning_hub: string
        dominant_work_lanes: list[string]
      evidence_rules:
        linear_first: boolean
        supporting_context: list[string]
        separate_verified_defaults_assumptions: boolean
      task_shaping_defaults:
        prefer_parent_child_when: string
        preserve_existing_structure: boolean
        issue_templates_available: boolean
        pull_request_templates_available: boolean
        saved_replies_available: boolean
      canonical_sources:
        labels_file: string
        issue_types_file: string
        supporting_docs: list[string]
    optional:
      named_active_products: list[string]
      named_active_client_projects: list[string]
      notes: list[string]

  canonical-taxonomy-cache.yaml:
    purpose: Fast cache of durable taxonomy guidance derived from canonical references.
    required:
      source_files:
        labels_file: string
        issue_types_file: string
        supporting_docs: list[string]
      labels:
        families: list[string]
        conventions_summary: list[string]
      issue_types:
        canonical_types: list[string]
        usage_notes: list[string]
      refresh_rule: string
    optional:
      deprecated_or_legacy_notes: list[string]

  active-context-index.yaml:
    purpose: Compact index of currently relevant open context for faster future runs.
    required:
      inclusion_rule: string
      open_projects: list[string]
      open_initiatives: list[string]
      open_milestones: list[string]
      recurring_parent_child_patterns: list[string]
    optional:
      active_sub_teams: list[string]
      routing_notes: list[string]

  memory-defaults-metadata.yaml:
    purpose: Audit metadata for durable Memory-default changes.
    required:
      last_reviewed_at: datetime
      last_updated_at: datetime
      last_linear_review_at: datetime|null
      latest_change_reason: string
      latest_change_source:
        type: one_of[linear_review, canonical_files, user_instruction, mixed]
    optional:
      changed_files: list[string]
      source_notes: list[string]

normalization_rules:
  - Keep Memory compact and reusable; do not store full workspace dumps.
  - Prefer YAML for durable defaults and indexes.
  - Use LightSpeed as the primary team context unless live Linear evidence shows a durable change.
  - Treat open, active, non-archived work as eligible live routing context.
  - Use the active status set unless live Linear evidence shows a durable change.
  - Treat canonical label and issue-type references as the taxonomy source of truth unless superseded by durable live evidence.
  - Update memory-defaults-metadata.yaml whenever a durable default changes.
  - Update last_linear_review_at only when a fresh Linear review informed the change.
  - Record canonical file sources when durable defaults are updated from attached references instead of live Linear evidence.

seed_defaults:
  workspace_personalization:
    team_context:
      primary_team: LightSpeed
      allow_sub_teams: true
    active_scope_rules:
      include_projects_when: open active not archived
      include_initiatives_when: open active not archived
      include_milestones_when: open active not archived
    active_statuses:
      - Backlog
      - Planned
      - In Progress
      - Completed
      - Cancelled
    linked_system_priority:
      - Linear
      - Figma
      - Bugherd
      - Asana
      - Google Drive
      - Slack
      - Gmail
      - GitHub
    owner_guidance:
      default_unassigned_direction: Ash first
      fallback_rule: Reassign with a short logical rationale when needed
    operating_model:
      company_type: WordPress design and development agency
      planning_hub: Linear
      dominant_work_lanes:
        - Client delivery and design implementation
        - Internal AI-ops, product, skill, plugin, governance, and documentation
    canonical_sources:
      labels_file: canonical/labels.yml
      issue_types_file: canonical/issue-types.yml
      supporting_docs:
        - canonical/LABELING.md
        - canonical/ISSUE_TYPES.md
        - canonical/ISSUE_LABELS.md
        - canonical/LABEL_STRATEGY.md
        - canonical/ISSUE_CREATION_GUIDE.md
        - canonical/PR_LABELS.md
        - canonical/PR_CREATION_PROCESS.md
