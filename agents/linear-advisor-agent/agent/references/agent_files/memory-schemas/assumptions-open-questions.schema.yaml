schema:
  type: object
  additionalProperties: false
  required:
    - entries
  properties:
    entries:
      type: array
      minItems: 0
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - type
          - statement
          - status
          - recorded_at
        properties:
          id:
            type: string
            pattern: '^[a-z0-9-]{3,80}$'
          type:
            type: string
            enum:
              - assumption
              - open-question
          statement:
            type: string
            maxLength: 300
          status:
            type: string
            enum:
              - active
              - resolved
              - dropped
          recorded_at:
            type: string
            pattern: '^\\d{4}-\\d{2}-\\d{2}$'
          resolution_note:
            type: string
            maxLength: 300
validation:
  update_rules:
    - Keep only durable assumptions or questions that future runs may need.
    - Remove resolved transient items when they stop mattering.
example:
  entries:
    - id: writes-should-stay-exceptional
      type: assumption
      statement: Attached write-capable apps should be treated as exceptional paths unless explicitly requested.
      status: active
      recorded_at: '2026-05-15'
