state_backend: memory
memory_state_file: wordpress-user-defaults.yaml

trigger_when:
  task_requires:
    - "site-specific WordPress audit or review"
    - "connected WordPress inspection or implementation"
    - "recurring site reporting or launch-readiness work"
  missing_state:
    - "site_identifier"

required_state:
  - key: "site_identifier"
    ask: "Which WordPress site should I use for this work? Share the site name or URL."
    store_as: "site_identifier"

optional_state:
  - key: "site_environment"
    ask: "Should I treat that site as staging or production by default?"
    default: "unspecified"
    store_as: "site_environment"
  - key: "preferred_work_mode"
    ask: "When both are possible, should I default to advice first or connected inspection first?"
    default: "advice_first"
    store_as: "preferred_work_mode"
  - key: "default_report_style"
    ask: "For audits and launch reviews, should I default to a concise summary or a structured report?"
    default: "structured_report"
    store_as: "default_report_style"

completion_requires:
  - "site_identifier"

skip_when:
  - "the current request is general WordPress guidance that does not depend on a specific site"
  - "the current request already includes a site name or URL"
  - "the current request is a one-off planning question that can be completed safely without durable site context"
