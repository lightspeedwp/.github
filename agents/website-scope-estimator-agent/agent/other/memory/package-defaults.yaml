project_anchor:
  client_name: KWV
  project_name: KWV website rebuild
  website_type: WooCommerce website
  primary_platform: WordPress + WooCommerce
  estimate_mode: package-led estimate

template_defaults:
  preferred_document_set:
    - proposal-summary
    - included-in-estimate-specification
    - unknowns-and-items-to-confirm
    - line-items-estimate-when-requested
  default_deliverable_order:
    - proposal-summary
    - included-in-estimate-specification
    - unknowns-and-items-to-confirm
    - line-items-estimate-when-requested
  standard_package_names:
    - WooCommerce Website
    - WordPress Foundations
  default_proposal_framing: audit plus implementation package
  ai_readiness_included_by_default: true
  standard_dependencies:
    - WooCommerce
    - WooCommerce Subscriptions if retained in scope
    - SEO migration support

package_onboarding:
  delivery_type: Audit + implementation
  requested_packages:
    - WooCommerce Website
    - WordPress Foundations
  fixed_fee_eligibility: likely yes unless custom integrations or heavy migration break the package
  add_ons:
    - AI readiness
    - SEO migration support
  scope_triggers:
    - segmented pricing
    - subscriptions
    - migration complexity

confirmed_scoping_values:
  rebuild_scope: full WordPress and WooCommerce rebuild
  commerce_scope: WooCommerce with subscription and segmented-pricing considerations
  content_architecture:
    - separate corporate and shop experiences
    - editorial content for brands and news
    - ecommerce account and checkout flows
  migration_status: migration complexity materially affects package fit and fixed-fee confidence
  integration_class: payment, shipping, subscriptions, and possible downstream business integrations require confirmation
  launch_expectations: standard rebuild with SEO migration and launch support assumed
