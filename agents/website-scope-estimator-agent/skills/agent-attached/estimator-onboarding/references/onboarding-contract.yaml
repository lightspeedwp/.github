state_backend: memory
memory_state_file: estimator-user-defaults.yaml

trigger_when:
  task_requires:
    - "the user wants recurring estimate or proposal help and the task is ambiguous enough that saved defaults would materially affect the next step"
    - "the user asks for an estimate, proposal, or quote-ready output without stating how incomplete-scope requests should be handled"
  missing_state:
    - "incomplete_scope_behavior"

required_state:
  - key: "incomplete_scope_behavior"
    ask: "When key scope or pricing values are still missing, should I usually draft a clearly provisional estimate or pause and ask for the missing values first?"
    store_as: "incomplete_scope_behavior"

optional_state:
  - key: "default_deliverable"
    ask: "When a request is ambiguous, should I usually default to an estimate, a proposal, or both?"
    default: "estimate"
    store_as: "default_deliverable"
  - key: "first_pass_detail_level"
    ask: "For the first draft, do you usually want a concise summary or a more detailed breakdown?"
    default: "concise"
    store_as: "first_pass_detail_level"

completion_requires:
  - "incomplete_scope_behavior"

skip_when:
  - "the current request already says whether to draft provisionally or to stop and ask for missing values first"
  - "the current request is clearly a one-off project intake or evidence-gathering task and no reusable default is needed to proceed correctly"
  - "the current request already provides enough context to complete the task safely without consulting saved defaults"
