# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  require_category_in_frontmatter: false # Category can be inferred from path
  require_footer_in_document: true
  allow_custom_footer_in_frontmatter: true
  max_footer_lines: 3
  footer_randomization_enabled: false # Consistent footers, not random

# ============================================================================
# EXCLUSION PATTERNS
# ============================================================================
# Files that should NOT require quirky footers

exclusion_patterns:
  vendor_paths:
    - "/(plugin-provided|platform-managed|directory-installed|agentskills-main)/"

  system_files:
    - ".git/"
    - "node_modules/"
    - "/\\..*" # Hidden files/directories
    - ".backup$"
    - ".tmp$"

  archives:
    - "/.archive/"
    - "/completed/"
    - "/deprecated/"
    - "/legacy/"

  templates:
    - "/.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE|DISCUSSION_TEMPLATE)/"
    - "/template(s)?/"
    - "/(example|sample|fixture)/"

  references:
    - "/references/"
    - "/examples/"
    - "/samples/"
    - "/fixtures/"
    - "/mock(s)?/"
